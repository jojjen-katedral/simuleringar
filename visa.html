<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulering</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%232b59c3'/><circle cx='11' cy='13' r='4' fill='white'/><circle cx='21' cy='13' r='4' fill='white'/><circle cx='16' cy='22' r='4' fill='white'/></svg>">
<style>
:root{--bar:#ffffff;--ink:#16202e;--muted:#5b6678;--line:#e1e5ee;--accent:#2b59c3;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar:#161c25;--ink:#e7ecf3;--muted:#9aa6b8;--line:#273141;--accent:#86a8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bar:#161c25;--ink:#e7ecf3;--muted:#9aa6b8;--line:#273141;--accent:#86a8ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bar);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);min-height:48px}
.bar h1{font-size:1rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.88rem;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
iframe{flex:1;width:100%;border:0;display:block;background:#fff}
.missing{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:520px){.btn .lbl{display:none}}
</style>
</head>
<body>
<div class="bar">
  <a class="btn" href="./" id="back">← <span class="lbl" id="backLbl">Alla simuleringar</span></a>
  <h1 id="title"></h1>
  <button class="btn" id="fs" type="button">⛶ <span class="lbl" id="fsLbl">Helskärm</span></button>
</div>
<iframe id="frame" title="Simulering" allow="fullscreen" allowfullscreen></iframe>

<script src="simuleringar.js"></script>
<script>
let lang = "sv";
try { if (localStorage.getItem("sim-lang") === "en") lang = "en"; } catch (e) {}
try { const t = localStorage.getItem("sim-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const id = new URLSearchParams(location.search).get("sim");
const sim = SIMULERINGAR.find(s => s.fil === id);
const frame = document.getElementById("frame");

document.documentElement.lang = lang;
document.getElementById("backLbl").textContent = lang === "en" ? "All simulations" : "Alla simuleringar";
document.getElementById("fsLbl").textContent = lang === "en" ? "Fullscreen" : "Helskärm";

if (sim) {
  const titel = (sim[lang] || sim.sv).titel;
  document.title = titel;
  document.getElementById("title").textContent = titel;
  frame.title = titel;
  frame.src = "simuleringar/" + sim.fil + ".html" + (lang === "en" ? "?lang=en" : "");
} else {
  frame.remove();
  const p = document.createElement("p");
  p.className = "missing";
  p.textContent = lang === "en" ? "The simulation could not be found." : "Simuleringen hittades inte.";
  document.body.appendChild(p);
  document.getElementById("fs").hidden = true;
}

document.getElementById("fs").addEventListener("click", () => {
  const el = document.getElementById("frame");
  if (el && el.requestFullscreen) el.requestFullscreen();
});
</script>
</body>
</html>
