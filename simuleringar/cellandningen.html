<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellandningen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='16' rx='15' ry='11' fill='%23f4d7c4' stroke='%23c47a1c' stroke-width='2'/><path d='M7 16c2-6 3 6 5 0s3 6 5 0 3 6 5 0 3 6 3 0' fill='none' stroke='%23c47a1c' stroke-width='2'/></svg>">
<style>
:root{
  --bg:#f2f5f4; --surface:#ffffff; --soft:#eaf0ee; --ink:#15242c; --muted:#56676f; --line:#d5dfdd;
  --accent:#17758a; --accent-ink:#ffffff; --accent-soft:#d8eef2;
  --cyto:#e9f2e6; --cellmem:#86b293; --ims:#f9dccd; --mem:#c47a1c; --mem2:#f0c27a; --matrix:#fff2cf;
  --carbon:#2a3238; --carbon-ink:#ffffff; --oxy:#e5484d;
  --atp:#d79b00; --nadh:#3e63dd; --fadh:#0f9d8f; --co2:#6b7780; --hplus:#c026d3; --el:#94d82d; --o2:#2b9fd9; --ferm:#8e4ec6;
  --prot:#6f7fcf; --prot2:#4b5aa8; --synth:#2f9e7a; --ok:#2b8a3e; --bad:#c92a5a;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1619; --surface:#152126; --soft:#1c2b31; --ink:#e3ecee; --muted:#93a5ac; --line:#29393f;
    --accent:#4fb6cb; --accent-ink:#06191e; --accent-soft:#183a42;
    --cyto:#14251b; --cellmem:#4f7d5d; --ims:#3a241c; --mem:#e39a3b; --mem2:#7a5420; --matrix:#2c2615;
    --carbon:#d4dde0; --carbon-ink:#0e1619; --oxy:#ff6b6f;
    --atp:#f3b922; --nadh:#7c9bff; --fadh:#34c6b6; --co2:#9aa6ae; --hplus:#e879f9; --el:#a9e34b; --o2:#5cc0f0; --ferm:#b88ae8;
    --prot:#5d6db8; --prot2:#8e9ce0; --synth:#3fbf95; --ok:#5ccf74; --bad:#ff6b9a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1619; --surface:#152126; --soft:#1c2b31; --ink:#e3ecee; --muted:#93a5ac; --line:#29393f;
  --accent:#4fb6cb; --accent-ink:#06191e; --accent-soft:#183a42;
  --cyto:#14251b; --cellmem:#4f7d5d; --ims:#3a241c; --mem:#e39a3b; --mem2:#7a5420; --matrix:#2c2615;
  --carbon:#d4dde0; --carbon-ink:#0e1619; --oxy:#ff6b6f;
  --atp:#f3b922; --nadh:#7c9bff; --fadh:#34c6b6; --co2:#9aa6ae; --hplus:#e879f9; --el:#a9e34b; --o2:#5cc0f0; --ferm:#b88ae8;
  --prot:#5d6db8; --prot2:#8e9ce0; --synth:#3fbf95; --ok:#5ccf74; --bad:#ff6b9a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
sub,sup{line-height:0}

/* ---------- huvud ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:12px 18px 10px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;width:46px;height:34px}
.brand h1{margin:0;font-size:1.4rem;line-height:1.15;letter-spacing:-.01em;font-weight:760}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{background:transparent;border:0;padding:5px 12px;font-size:.82rem;font-weight:650;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px 8px;font-weight:650;font-size:.92rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

/* ---------- layout ---------- */
main{flex:1;min-height:0;display:flex}
.view{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.view[hidden]{display:none}
.stage{position:relative;min-width:0;min-height:0;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.stage svg.scene{width:100%;height:auto;max-height:calc(100vh - 190px);display:block;margin:0 auto}
.panel{background:var(--surface);border-left:1px solid var(--line);padding:16px 18px 24px;overflow-y:auto;min-height:0}
@media (max-width:900px){
  body{height:auto;min-height:100%}
  main{display:block}
  .view{display:block}
  .stage{overflow:visible;padding:10px}
  .stage svg.scene{max-height:none}
  .panel{border-left:0;border-top:1px solid var(--line)}
}
.panel h2{font-size:1.12rem;margin:0 0 2px;letter-spacing:-.005em}
.panel h3{font-size:.95rem;margin:18px 0 6px}
.panel p{margin:6px 0;font-size:.92rem}
.where{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.where b{color:var(--ink);font-weight:650}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eq{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.88rem;overflow-x:auto;margin:8px 0;line-height:1.6}
.eq .lab{display:block;color:var(--muted);font-size:.75rem;font-weight:650;margin-bottom:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-weight:650;font-size:.9rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
ol.sub,ul.sub{margin:6px 0;padding-left:20px;font-size:.88rem}
ol.sub li,ul.sub li{margin:3px 0}

/* gissning */
.predict{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.prow+.prow{border-top:1px solid var(--line)}
.ctag{display:inline-flex;align-items:center;gap:7px;font-weight:650}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;line-height:1;cursor:pointer}
.stepper output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.choice{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fb{border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.88rem;border:1px solid var(--line)}
.fb .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.hint{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.check{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted);margin-top:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* bokföring */
table.ledger{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums;margin-top:4px}
.ledger th,.ledger td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger th{font-size:.78rem;color:var(--muted);font-weight:650}
.ledger td.pend{color:var(--muted)}
.ledger tr.cur td{background:var(--accent-soft)}
.ledger tr.sum td{font-weight:750;border-bottom:0;border-top:2px solid var(--ink)}
.oxbar{margin-top:6px}
.oxtrack{position:relative;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.oxfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--nadh),var(--co2));border-radius:5px;transition:width .8s}
.oxscale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

/* scen */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.yield{min-height:34px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;font-size:.9rem;font-weight:650}
.yield.flash{animation:yf .7s ease-out}
@keyframes yf{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.labinfo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px}
.labinfo h3{font-size:.95rem;margin:4px 0 4px}
@media (max-width:700px){.labinfo{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:5px}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cyto{fill:var(--cyto)} .cellmem{fill:none;stroke:var(--cellmem);stroke-width:5}
.ims{fill:var(--ims)} .matrix{fill:var(--matrix)}
.mem{fill:none;stroke:var(--mem);stroke-width:6;stroke-linejoin:round} .mem2{fill:none;stroke:var(--mem2);stroke-width:1.6;stroke-linejoin:round}
.lbl{fill:var(--muted);font-size:12px;font-weight:600}
.lbl.dark{fill:var(--ink)}
.mol{fill:var(--ink);font-size:12.5px;font-weight:700;text-anchor:middle;transition:opacity .4s}
.station{fill:var(--muted);font-size:11.5px;font-weight:650;font-style:italic;text-anchor:middle}
.carbon{transition:transform .9s cubic-bezier(.45,.05,.25,1)}
.noanim .carbon{transition:none}
.cC{fill:var(--carbon)} .cNum{fill:var(--carbon-ink);font-size:10.5px;font-weight:800;text-anchor:middle}
.cO{fill:var(--oxy);opacity:0;transition:opacity .4s}
.co2 .cO{opacity:1}
.cOx{fill:var(--ink);font-size:10px;font-weight:700;text-anchor:middle;opacity:0;transition:opacity .3s}
.kemi .cOx{opacity:1}
.zonehl{opacity:0;transition:opacity .4s;pointer-events:none}
.zonehl.on{opacity:1}
.hl-fill{fill:var(--accent);fill-opacity:.09}
.hl-stroke{fill:none;stroke:var(--accent);stroke-width:16;stroke-opacity:.4}
.cyc{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 5}
.etcfx{opacity:0;transition:opacity .6s}
.etcfx.on{opacity:1}

/* labb */
canvas#labCanvas{width:100%;max-width:max(460px,calc((100vh - 400px) * 1.818));margin:0 auto;aspect-ratio:800/440;display:block;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.ctlgrid{display:grid;gap:10px;margin-top:6px}
.ctl label{display:flex;justify-content:space-between;font-size:.86rem;font-weight:650}
.ctl label output{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.tog{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.tog input{margin-top:3px;accent-color:var(--bad);width:17px;height:17px;flex:none}
.tog b{display:block;font-size:.9rem}
.tog span{font-size:.8rem;color:var(--muted)}
.meters{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.84rem;margin-top:6px}
.mtrack{position:relative;height:12px;border-radius:6px;background:var(--soft)}
.mfill{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .25s linear}
.mtick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.obs{background:var(--soft);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:8px 12px;font-size:.88rem;margin-top:8px}
.obs p{margin:4px 0}
details.q{border-top:1px solid var(--line);padding:7px 0}
details.q summary{cursor:pointer;font-weight:620;font-size:.9rem}
details.q p{font-size:.86rem;color:var(--ink);margin:6px 0 2px}
.stagebar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}

/* var sker det */
.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:8px;border:1px dashed var(--line);border-radius:12px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:600;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.zones{display:grid;gap:8px;margin-top:10px}
.zonebox{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);cursor:pointer;text-align:left;width:100%}
.zonebox.target{border-color:var(--accent);background:var(--accent-soft)}
.zonebox .zt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.88rem}
.zonebox .zc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:4px}
.score{font-weight:700;margin-top:10px}
.zhit{cursor:pointer}

/* bränslen */
.fnode rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fnode text{fill:var(--ink);font-size:12.5px;font-weight:650;text-anchor:middle}
.fnode.on rect{stroke:var(--accent);stroke-width:2.5;fill:var(--accent-soft)}
.fnode.target rect{stroke:var(--atp);stroke-width:3}
.fnode.dim{opacity:.38}
.fedge{fill:none;stroke:var(--muted);stroke-width:1.8;opacity:.38}
.fedge.on{stroke:var(--accent);stroke-width:3;opacity:1}
.fedge.dash{stroke-dasharray:5 5}
.fedge.hide{opacity:0}
.fedge.faint{opacity:.18}
.fhead{fill:var(--ink);font-size:13px;font-weight:760;text-anchor:middle}
.fnote{fill:var(--muted);font-size:11px;font-style:italic;text-anchor:middle}
.fcirc{fill:none;stroke:var(--muted);stroke-width:2;opacity:.45}
.fcirc.on{stroke:var(--accent);stroke-width:3;opacity:1}
.aas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.86rem;margin-top:6px}
.bars .bt{height:12px;border-radius:6px;background:var(--soft);position:relative}
.bars .bf{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.bars .cur .bf{background:var(--atp)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;margin:8px 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:650}
@media (prefers-reduced-motion: reduce){ .carbon,.oxfill,.mfill{transition:none} .yield.flash{animation:none} }

/* ---------- följ glukosen, steg för steg ---------- */
:root{--phos:#e8890c;--coa:#8a63d2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--phos:#f5a03a;--coa:#a888ec}}
:root[data-theme="dark"]{--phos:#f5a03a;--coa:#a888ec}
#walkSvg{overflow:visible}
@media (max-width:700px){#walkSvg{overflow:hidden}}
.scenefade{animation:sf .45s ease-out}
@keyframes sf{from{opacity:0}to{opacity:1}}
.bond{stroke:var(--carbon);stroke-width:4.5;stroke-linecap:round}
.bond2{stroke:var(--muted);stroke-width:2.5}
.bondO{stroke-width:3.2}
.bondH{stroke:var(--muted);stroke-width:2.2}
.bond.bdbl{stroke-width:7.5}
.bdbl-in{stroke:var(--surface);stroke-width:2.2;stroke-linecap:round}
.oC{fill:var(--surface);stroke:var(--carbon);stroke-width:2.6}
.glyph{fill:#fff;font-size:10.5px;font-weight:800;text-anchor:middle}
.glyph.dark{fill:#15242c}
.bank{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;min-height:34px}
.bankcap{font-size:.8rem;color:var(--muted);font-weight:600}
.bchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:650;font-variant-numeric:tabular-nums}
.bchip b{min-width:20px;text-align:right}
.bchip.pulse{animation:bp .55s ease-out}
@keyframes bp{0%{transform:scale(1)}35%{transform:scale(1.14);border-color:var(--accent)}100%{transform:scale(1)}}
.phases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.phases button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:650;cursor:pointer;color:var(--muted)}
.phases button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prog{font-size:.82rem;color:var(--muted);margin:0 0 2px;font-weight:600}
.io{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;margin:10px 0;font-size:.88rem}
.io .k{color:var(--muted);font-weight:650;padding-top:2px}
.io .v{display:flex;flex-wrap:wrap;gap:5px}
.tag{border-radius:999px;padding:2px 9px;font-weight:650;font-size:.84rem;background:var(--soft);border:1px solid var(--line)}
.kemibox{background:var(--soft);border-left:4px solid var(--coa);border-radius:0 8px 8px 0;padding:7px 10px;font-size:.88rem}
.navrow{display:flex;gap:8px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
.gopts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gopts button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.86rem}
.gopts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.cOx{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
@media (min-width:901px){#walkSvg{max-height:calc(100vh - 300px)}}
.gcap{fill:var(--ink);font-size:9.5px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.pop{transform-box:fill-box;transform-origin:center;animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.ring{opacity:0;transition:opacity .6s}
.ring.on{opacity:1}
.cycR{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:3 6;opacity:.75}
.cycA{fill:var(--accent);opacity:.75}
.walkbar{position:sticky;bottom:0;z-index:15;margin-top:auto;display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:16px 16px 0 0;padding:10px 14px;box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.walkbar .btn{white-space:nowrap}
.wprog{flex:1;min-width:0;text-align:center;font-size:.84rem;font-weight:650;color:var(--muted)}
.wprog span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtrack{height:5px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.wfill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
@media (max-width:900px){
  #v-walk{padding-bottom:78px}
  .walkbar{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-left:0;border-right:0}
}
@media (max-width:420px){.walkbar{gap:8px;padding-left:10px;padding-right:10px}.walkbar .btn{padding:8px 11px;font-size:.84rem}}

  /* 21 */ { ph: "tca", zone: "matrix", enz: { sv: "malatdehydrogenas", en: "malate dehydrogenase" },

         en: "Now we follow the electrons into the inner membrane. Here are protein complexes I–IV, the mobile carriers ubiquinone (Q) and cytochrome c, and ATP synthase. Below the membrane, in the matrix, NADH + H⁺ and FADH₂ from the earlier steps are ready to hand over their electrons." },
    k: { sv: "", en: "" },
    use: { sv: [], en: [] }, make: { sv: [], en: [] }, eff: {}, g: ["none"] },
  /* 24 */ { ph: "etc", zone: "inner", enz: { sv: "komplex I (NADH-dehydrogenas)", en: "complex I (NADH dehydrogenase)" },

         en: "Now we zoom in on the inner membrane. NADH + H⁺ hands two electrons to complex I and becomes NAD⁺ again. The energy is used to pump 4 H⁺ from the matrix out into the intermembrane space. The mobile carrier ubiquinone (Q) picks up the electrons and carries them through the membrane to complex III." },

  /* 24 */ { ph: "etc", zone: "inner", enz: { sv: "komplex III", en: "complex III" },
    t: { sv: "Ubikinon och komplex III", en: "Ubiquinone and complex III" },

/* =====================================================================
   2. STÖRNINGSLABBET
   Enkel modell: G = protongradient (0–1).
   Elektronflöde Je bromsas när gradienten är brant (andningskontroll).
   ATP-syntas tömmer gradienten, läckage (DNP) tömmer den utan ATP.
   ===================================================================== */
const LAB0 = { cell: "muscle", fuel: 1, o2: 1, load: 1, cyan: false, rot: false, oligo: false, dnp: false };
let L = { ...LAB0 };
let labPaused = false;

function flux(G, P) {
  const S = P.fuel;
  const J1 = P.rot ? 0 : 0.8 * S, J2 = 0.2 * S;
  const cap4 = P.cyan ? 0 : Math.min(1, P.o2 * 1.8);
  const bp = 1 / (1 + Math.exp((G - 0.7) / 0.05));
  const sup = J1 + J2;
  const Je = Math.min(sup, cap4) * bp;
  const f1 = sup > 0 ? J1 / sup : 0;
  const pump = Je * (f1 + (1 - f1) * 0.6);
  const Jatp = P.oligo ? 0 : 1.2 * P.load * Math.max(0, G - 0.3);
  const Jleak = (0.05 + (P.dnp ? 1.5 : 0)) * G;
  return { Je, J1: Je * f1, J2: Je * (1 - f1), pump, Jatp, Jleak, f1 };
}
function steady(P) {
  let G = 0.5;
  for (let i = 0; i < 3000; i++) { const f = flux(G, P); G = clamp(G + (f.pump - f.Jatp - f.Jleak) * 0.02, 0, 1); }
  return { G, ...flux(G, P) };
}
const demandCache = {};
function demandFor(load) {
  const k = load.toFixed(2);
  if (!(k in demandCache)) demandCache[k] = steady({ ...LAB0, load }).Jatp;
  return demandCache[k];
}
function metricsFrom(s, P) {
  const d = demandFor(P.load);
  const a = d > 0 ? clamp(1 - s.Jatp / d, 0, 1) : 0;
  const F = a * P.fuel * Math.min(1.3, P.load);
  return {
    a, F,
    atp: clamp((s.Jatp + 0.08 * F) / 1.1, 0, 1),
    o2: clamp(s.Je, 0, 1),
    co2: clamp(s.Je * 0.9 + (P.cell === "yeast" ? F * 0.55 : 0), 0, 1),
    heat: clamp(0.12 + s.Jleak * 0.42 + s.Je * 0.15 + s.Jatp * 0.05, 0, 1),
    grad: clamp(s.G, 0, 1),
    ferm: clamp(F * 0.85, 0, 1)
  };
}
let S = steady(L);
let MET = metricsFrom(S, L);
let NORM = metricsFrom(steady(LAB0), LAB0);

/* ---------- partiklar ---------- */
const CW = 800, CH = 440;
const P_E1 = [[110, 262], [110, 192], [300, 192], [335, 192], [335, 138], [372, 128], [428, 128], [462, 138], [462, 242]];
const P_E2 = [[215, 248], [215, 194], [300, 192], [335, 192], [335, 138], [372, 128], [428, 128], [462, 138], [462, 242]];
let parts = [], res = [], mH = [];
const acc = { e: 0, hp: 0, hs: 0, hl: 0, atp: 0, nadh: 0, fadh: 0, o2: 0 };
let rotor = 0, simT = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
function spawn(type, path, speed, extra) { if (parts.length < 450) parts.push({ type, path, seg: 0, t: 0, speed, life: 1, x: path[0][0], y: path[0][1], ...extra }); }
function initRes() {
  res = []; for (let i = 0; i < Math.round(S.G * 90); i++) res.push({ x: rnd(20, 780), y: rnd(18, 150), vx: rnd(-20, 20), vy: rnd(-20, 20) });
  mH = []; for (let i = 0; i < 7; i++) mH.push({ x: rnd(560, 780), y: rnd(250, 420), vx: rnd(-15, 15), vy: rnd(-15, 15) });
}
initRes();

function advance(p, dt) {
  let dist = p.speed * dt;
  while (dist > 0 && p.seg < p.path.length - 1) {
    const [x0, y0] = p.path[p.seg], [x1, y1] = p.path[p.seg + 1];
    const len = Math.hypot(x1 - x0, y1 - y0) || 1;
    const rem = (1 - p.t) * len;
    if (dist < rem) { p.t += dist / len; dist = 0; }
    else { dist -= rem; p.seg++; p.t = 0; }
  }
  if (p.seg >= p.path.length - 1) { p.x = p.path[p.path.length - 1][0]; p.y = p.path[p.path.length - 1][1]; return true; }
  const [x0, y0] = p.path[p.seg], [x1, y1] = p.path[p.seg + 1];
  p.x = x0 + (x1 - x0) * p.t; p.y = y0 + (y1 - y0) * p.t;
  return false;
}

function labStep(dt) {
  simT += dt;
  const f = flux(S.G, L);
  S = { ...f, G: clamp(S.G + (f.pump - f.Jatp - f.Jleak) * dt * 1.6, 0, 1) };
  MET = metricsFrom(S, L);
  rotor += S.Jatp * dt * 6;

  acc.e += S.Je * 13 * dt;
  while (acc.e >= 1) { acc.e--; const fromI = Math.random() < S.f1; spawn("e", fromI ? P_E1 : P_E2, 230); }
  acc.hp += S.pump * 22 * dt;
  while (acc.hp >= 1) {
    acc.hp--;
    const w = [4 * S.f1, 4, 2], r = Math.random() * (w[0] + w[1] + w[2]);
    const cx = r < w[0] ? 110 : r < w[0] + w[1] ? 335 : 462;
    const x = cx + rnd(-9, 9);
    spawn("hp", [[x, 262], [x, 150], [x + rnd(-40, 40), rnd(40, 130)]], 150);
  }
  acc.hs += S.Jatp * 24 * dt;
  while (acc.hs >= 1) { acc.hs--; if (res.length) res.splice(Math.floor(Math.random() * res.length), 1); const x = rnd(640, 660); spawn("hs", [[rnd(600, 700), 110], [x, 150], [650, 230], [650 + rnd(-20, 20), 258]], 170); }
  if (L.dnp) {
    acc.hl += S.Jleak * 18 * dt;
    while (acc.hl >= 1) { acc.hl--; if (res.length) res.pop(); const x = Math.random() < 0.5 ? rnd(250, 290) : rnd(510, 595); spawn("hl", [[x, 115], [x, 150], [x, 232], [x + rnd(-15, 15), 262]], 140); }
  }
  acc.atp += S.Jatp * 4 * dt;
  while (acc.atp >= 1) { acc.atp--; spawn("atp", [[700, 302], [745, 360], [775, 425]], 75); }
  acc.nadh += S.J1 * 4.5 * dt;
  while (acc.nadh >= 1) { acc.nadh--; spawn("nadh", [[20, 335], [75, 300], [110, 282]], 110); }
  acc.fadh += S.J2 * 5 * dt;
  while (acc.fadh >= 1) { acc.fadh--; spawn("fadh", [[160, 425], [200, 320], [215, 268]], 110); }
  acc.o2 += S.Je * 2.4 * dt;
  while (acc.o2 >= 1) { acc.o2--; spawn("o2", [[575, 432], [510, 330], [474, 270]], 110); }

  const keep = [];
  for (const p of parts) {
    const end = advance(p, dt);
    if (!end) { keep.push(p); continue; }
    if (p.type === "hp") { if (res.length < Math.round(S.G * 90) + 8) res.push({ x: p.x, y: p.y, vx: rnd(-20, 20), vy: rnd(-20, 20) }); }
    else if (p.type === "nadh") keep.push({ type: "nad", path: [[110, 288], [65, 350], [25, 395]], seg: 0, t: 0, speed: 90, x: 110, y: 288 });
    else if (p.type === "fadh") keep.push({ type: "fad", path: [[215, 272], [185, 360], [160, 430]], seg: 0, t: 0, speed: 90, x: 215, y: 272 });
    else if (p.type === "o2") keep.push({ type: "h2o", path: [[476, 276], [535, 360], [600, 432]], seg: 0, t: 0, speed: 90, x: 476, y: 276 });
  }
  parts = keep;

  const target = Math.round(S.G * 90);
  while (res.length < target - 3) res.push({ x: rnd(20, 780), y: rnd(18, 150), vx: rnd(-20, 20), vy: rnd(-20, 20) });
  while (res.length > target + 10) res.pop();
  for (const d of [...res, ...mH]) {
    d.vx += rnd(-60, 60) * dt; d.vy += rnd(-60, 60) * dt;
    d.vx = clamp(d.vx, -30, 30); d.vy = clamp(d.vy, -30, 30);
    d.x += d.vx * dt; d.y += d.vy * dt;
  }
  for (const d of res) { if (d.x < 14 || d.x > 786) d.vx *= -1; if (d.y < 14 || d.y > 154) d.vy *= -1; d.x = clamp(d.x, 14, 786); d.y = clamp(d.y, 14, 154); }
  for (const d of mH) { if (d.x < 530 || d.x > 786) d.vx *= -1; if (d.y < 240 || d.y > 430) d.vy *= -1; d.x = clamp(d.x, 530, 786); d.y = clamp(d.y, 240, 430); }
}

/* ---------- ritning ---------- */
const cv = $("#labCanvas"), ctx = cv.getContext("2d");
let COL = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["surface", "soft", "ink", "muted", "line", "ims", "matrix", "mem", "mem2", "prot", "prot2", "synth", "el", "hplus", "atp", "nadh", "fadh", "o2", "bad", "co2", "accent"]) COL[k] = cs.getPropertyValue("--" + k).trim();
}
function fitCanvas() {
  const w = cv.clientWidth; if (!w) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * CH / CW * dpr);
  ctx.setTransform(cv.width / CW, 0, 0, cv.width / CW, 0, 0);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function hplus(x, y, ring) {
  ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = COL.hplus; ctx.fill();
  if (ring) { ctx.lineWidth = 2; ctx.strokeStyle = COL.co2; ctx.beginPath(); ctx.arc(x, y, 8.5, 0, 7); ctx.stroke(); }
  ctx.fillStyle = "#fff"; ctx.font = "bold 9px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("+", x, y + 0.5);
}
function pill(x, y, text, col, alpha) {
  ctx.globalAlpha = alpha; ctx.font = "bold 11px system-ui";
  const w = ctx.measureText(text).width + 12;
  rr(x - w / 2, y - 9, w, 18, 9); ctx.fillStyle = col; ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, x, y + 0.5);
  ctx.globalAlpha = 1;
}
function badge(x, y) {
  ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fillStyle = COL.bad; ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.6; ctx.beginPath();
  ctx.moveTo(x - 4.5, y - 4.5); ctx.lineTo(x + 4.5, y + 4.5); ctx.moveTo(x + 4.5, y - 4.5); ctx.lineTo(x - 4.5, y + 4.5); ctx.stroke();
}
function complexBox(x, y, w, h, label) {
  rr(x, y, w, h, 14); ctx.fillStyle = COL.prot; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = COL.prot2; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 17px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
}
function drawLab() {
  const t = T().lab.canvas;
  ctx.clearRect(0, 0, CW, CH);
  // mellanmembranutrymme
  ctx.fillStyle = COL.ims; ctx.fillRect(0, 0, CW, 168);
  ctx.globalAlpha = 0.28 * S.G; ctx.fillStyle = COL.hplus; ctx.fillRect(0, 0, CW, 168); ctx.globalAlpha = 1;
  // matrix
  ctx.fillStyle = COL.matrix; ctx.fillRect(0, 214, CW, CH - 214);
  // membran
  ctx.fillStyle = COL.mem2; ctx.fillRect(0, 168, CW, 46);
  ctx.strokeStyle = COL.mem; ctx.lineWidth = 1.2;
  for (let x = 5; x < CW; x += 10) {
    ctx.beginPath(); ctx.moveTo(x - 1.5, 177); ctx.lineTo(x - 1.5, 189); ctx.moveTo(x + 1.5, 177); ctx.lineTo(x + 1.5, 189);
    ctx.moveTo(x - 1.5, 193); ctx.lineTo(x - 1.5, 205); ctx.moveTo(x + 1.5, 193); ctx.lineTo(x + 1.5, 205); ctx.stroke();
  }
  ctx.fillStyle = COL.mem;
  for (let x = 5; x < CW; x += 10) { ctx.beginPath(); ctx.arc(x, 173, 4.4, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(x, 209, 4.4, 0, 7); ctx.fill(); }
  // etiketter
  ctx.fillStyle = COL.muted; ctx.font = "600 13px system-ui"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText(t.ims, 12, 162 - 140);
  ctx.fillText(t.matrix, 12, 430);
  ctx.textAlign = "right"; ctx.fillText(t.mem, 790, 160);
  // reservoar H+
  for (const d of res) hplus(d.x, d.y);
  for (const d of mH) hplus(d.x, d.y);
  // komplex
  complexBox(75, 140, 70, 140, "I");
  complexBox(190, 186, 50, 76, "II");
  complexBox(300, 140, 70, 112, "III");
  complexBox(430, 140, 64, 112, "IV");
  // Q och cyt c
  const qx = 225 + 55 * Math.sin(simT * 2.2) * (S.Je > 0.02 ? 1 : 0.15);
  ctx.beginPath(); ctx.arc(qx, 191, 10, 0, 7); ctx.fillStyle = COL.atp; ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 11px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Q", qx, 191.5);
  const cx = 400 + 22 * Math.sin(simT * 2.6 + 1) * (S.Je > 0.02 ? 1 : 0.15);
  ctx.beginPath(); ctx.arc(cx, 125, 11, 0, 7); ctx.fillStyle = COL.fadh; ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 10px system-ui"; ctx.fillText("c", cx, 125.5);
  // ATP-syntas
  ctx.fillStyle = COL.synth; rr(616, 160, 68, 60, 10); ctx.fill();
  ctx.save(); rr(616, 160, 68, 60, 10); ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,.35)";
  const ph = (rotor * 12) % 12;
  for (let x = 608 + ph; x < 690; x += 12) ctx.fillRect(x, 160, 5, 60);
  ctx.restore();
  ctx.fillStyle = COL.synth; ctx.fillRect(646, 218, 8, 38);
  ctx.strokeStyle = COL.synth; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(690, 190); ctx.lineTo(706, 190); ctx.lineTo(706, 262); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(650, 292, 46, 38, 0, 0, 7); ctx.fillStyle = COL.synth; ctx.fill();
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    ctx.beginPath(); ctx.arc(650 + 25 * Math.cos(a), 292 + 21 * Math.sin(a), 12, 0, 7);
    ctx.fillStyle = i % 2 ? "rgba(255,255,255,.18)" : "rgba(0,0,0,.14)"; ctx.fill();
  }
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(650, 292); ctx.lineTo(650 + 14 * Math.cos(rotor), 292 + 12 * Math.sin(rotor)); ctx.stroke();
  ctx.fillStyle = COL.ink; ctx.font = "600 12.5px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText(t.synth, 650, 348);
  // blockeringar
  if (L.rot) badge(143, 146);
  if (L.cyan) badge(492, 146);
  if (L.oligo) badge(682, 166);
  if (L.o2 < 0.02 && !L.cyan) { ctx.fillStyle = COL.bad; ctx.font = "bold 13px system-ui"; ctx.textAlign = "center"; ctx.fillText(t.noO2, 520, 300); }
  // partiklar
  for (const p of parts) {
    const fade = p.seg === p.path.length - 2 ? 1 - p.t * 0.7 : 1;
    switch (p.type) {
      case "e": ctx.beginPath(); ctx.arc(p.x, p.y, 4.2, 0, 7); ctx.fillStyle = COL.el; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = COL.ink; ctx.stroke(); break;
      case "hp": hplus(p.x, p.y); break;
      case "hs": ctx.globalAlpha = fade; hplus(p.x, p.y); ctx.globalAlpha = 1; break;
      case "hl": ctx.globalAlpha = fade; hplus(p.x, p.y, true); ctx.globalAlpha = 1; break;
      case "atp": pill(p.x, p.y, "ATP", COL.atp, fade); break;
      case "nadh": pill(p.x, p.y, "NADH+H⁺", COL.nadh, 1); break;
      case "nad": pill(p.x, p.y, "NAD⁺", COL.nadh, 0.55 * fade); break;
      case "fadh": pill(p.x, p.y, "FADH₂", COL.fadh, 1); break;
      case "fad": pill(p.x, p.y, "FAD", COL.fadh, 0.55 * fade); break;
      case "o2": pill(p.x, p.y, "O₂", COL.o2, 1); break;
      case "h2o": pill(p.x, p.y, "H₂O", COL.o2, 0.6 * fade); break;
    }
  }
}

/* ---------- panel ---------- */
function metersHtml() {
  const t = T().lab;
  const meter = (k, col) => `<span id="ml-${k}">${k === "ferm" ? (L.cell === "yeast" ? t.m.fermY : t.m.ferm) : t.m[k]}</span><div class="mtrack"><div class="mfill" id="mf-${k}" style="background:${col}"></div><div class="mtick" style="left:${(NORM[k] * 100).toFixed(1)}%"></div></div>`;
  return meter("atp", "var(--atp)") + meter("o2", "var(--o2)") + meter("co2", "var(--co2)") + meter("heat", "var(--bad)") + meter("grad", "var(--hplus)") + meter("ferm", "var(--ferm)");
}
function labPanelHtml() {
  const t = T().lab;
  const tog = (k) => `<label class="tog"><input type="checkbox" data-tog="${k}"${L[k] ? " checked" : ""}><div><b>${t.tog[k][0]}</b><span>${t.tog[k][1]}</span></div></label>`;
  const slider = (k, min, max, step, val, txt) => `<div class="ctl"><label for="sl-${k}">${txt}<output id="o-${k}">${fmtSl(k, val)}</output></label><input type="range" id="sl-${k}" data-sl="${k}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
  return `<h2>${T().tabs.lab}</h2>
  <div class="ctlgrid">
    <div class="ctl"><label>${t.cell}</label><div class="seg" id="cellSeg" style="margin-top:4px">
      <button type="button" data-cell="muscle" aria-pressed="${L.cell === "muscle"}">${t.muscle}</button>
      <button type="button" data-cell="yeast" aria-pressed="${L.cell === "yeast"}">${t.yeast}</button></div></div>
    ${slider("fuel", 0, 1, 0.05, L.fuel, t.fuel)}
    ${slider("o2", 0, 1, 0.05, L.o2, t.o2)}
    ${slider("load", 0.3, 2, 0.1, L.load, t.load)}
  </div>
  <h3>${t.inh}</h3>
  ${tog("cyan")}${tog("rot")}${tog("oligo")}${tog("dnp")}
  <div class="btnrow"><button type="button" class="btn ghost" id="labReset">${t.reset}</button></div>
  <h3>${t.qTitle}</h3>
  ${t.qs.map(q => `<details class="q"><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")}`;
}
function fmtSl(k, v) { return k === "load" ? "×" + (lang === "sv" ? String(v).replace(".", ",") : v) : Math.round(v * 100) + " %"; }
function labLegend() {
  const t = T();
  return `<span>${dot("var(--el)")}${t.legend.el}</span><span>${dot("var(--hplus)")}H⁺</span>
    <span>${dot("var(--nadh)")}NADH + H⁺</span><span>${dot("var(--fadh)")}FADH₂</span><span>${dot("var(--o2)")}O₂ / H₂O</span><span>${dot("var(--atp)")}ATP</span>
    <span>${dot("var(--prot)")}${lang === "sv" ? "Proteinkomplex" : "Protein complex"}</span>`;
}
let lastObs = "";
function updateObs() {
  const o = T().lab.obs, k = [];
  if (L.fuel < 0.05) k.push("nofuel");
  else {
    if (L.cyan) k.push("cyan");
    if (L.rot) k.push("rot");
    if (!L.cyan && L.o2 < 0.03) k.push("noO2");
    else if (!L.cyan && !L.oligo && L.o2 < 0.6 && MET.a > 0.12) k.push("lowO2");
    if (L.oligo) k.push("oligo");
    if (L.dnp) k.push("dnp");
    if (!k.length) k.push(L.load >= 1.5 ? "highLoad" : L.load <= 0.6 ? "lowLoad" : "normal");
    if (MET.a > 0.25) k.push(L.cell === "yeast" ? "fermY" : "fermM");
  }
  const html = k.map(x => `<p>${o[x]}</p>`).join("");
  if (html !== lastObs) { const el = $("#obs"); if (el) el.innerHTML = html; lastObs = html; }
}
function updateMeters() {
  for (const k of ["atp", "o2", "co2", "heat", "grad", "ferm"]) { const el = $("#mf-" + k); if (el) el.style.width = (MET[k] * 100).toFixed(1) + "%"; }
}
function renderLab() {
  $("#labPanel").innerHTML = labPanelHtml();
  const tl = T().lab;
  $("#meters").innerHTML = metersHtml();
  $("#mTitle").textContent = tl.mTitle; $("#mNote").textContent = tl.mNote; $("#obsTitle").textContent = tl.obsTitle;
  $("#labCap").textContent = T().lab.cap;
  $("#labPause").textContent = labPaused ? T().lab.play : T().lab.pause;
  $("#labLegend").innerHTML = labLegend();
  lastObs = ""; updateObs(); updateMeters();
}
$("#labPanel").addEventListener("input", (e) => {
  const k = e.target.dataset.sl; if (!k) return;
  L[k] = Number(e.target.value); $("#o-" + k).textContent = fmtSl(k, L[k]);
});
$("#labPanel").addEventListener("change", (e) => {
  const k = e.target.dataset.tog; if (!k) return;
  L[k] = e.target.checked;
});
$("#labPanel").addEventListener("click", (e) => {
  const c = e.target.closest("[data-cell]");
  if (c) { L.cell = c.dataset.cell; $$("#cellSeg button").forEach(b => b.setAttribute("aria-pressed", String(b === c))); $("#ml-ferm").textContent = L.cell === "yeast" ? T().lab.m.fermY : T().lab.m.ferm; lastObs = ""; }
  if (e.target.id === "labReset") { L = { ...LAB0 }; S = steady(L); initRes(); parts = []; renderLab(); }
});
$("#labPause").addEventListener("click", () => { labPaused = !labPaused; $("#labPause").textContent = labPaused ? T().lab.play : T().lab.pause; });

let lastTs = 0, uiAcc = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if (tab === "lab" && !labPaused) {
    labStep(dt);
    drawLab();
    uiAcc += dt;
    if (uiAcc > 0.15) { uiAcc = 0; updateMeters(); updateObs(); }
  }
  requestAnimationFrame(loop);
}
window.addEventListener("resize", () => { fitCanvas(); if (tab === "lab") drawLab(); });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { readColors(); renderAll(); });

/* =====================================================================
   3. VAR SKER DET?
   ===================================================================== */
const PLACE_ITEMS = [
  { id: "glyc", z: ["cyto"] }, { id: "link", z: ["matrix"] }, { id: "tca", z: ["matrix"] },
  { id: "etc", z: ["inner"] }, { id: "atps", z: ["inner"] }, { id: "hplus", z: ["ims"] },
  { id: "ferm", z: ["cyto"] }, { id: "o2", z: ["inner", "matrix"] },
  { id: "beta", z: ["matrix"], k: 1 }, { id: "cytc", z: ["ims"], k: 1 }, { id: "q", z: ["inner"], k: 1 }, { id: "g3p", z: ["cyto"], k: 1 }
];
const ZONES = ["cyto", "ims", "inner", "matrix"];
const ZSW = { cyto: "var(--cyto)", ims: "var(--ims)", inner: "var(--mem)", matrix: "var(--matrix)" };
const PM = { cx: 300, cy: 215, rx: 240, ry: 165, irx: 218, iry: 145 };
const P_CRISTAE = [{ x: 160, top: 1 }, { x: 240, top: 1 }, { x: 320, top: 1 }, { x: 400, top: 1 }, { x: 200, top: 0 }, { x: 280, top: 0 }, { x: 360, top: 0 }, { x: 440, top: 0 }];
const P_INNER = mitoInnerPath(PM.cx, PM.cy, PM.irx, PM.iry, P_CRISTAE, 82, 12);
const place = { placed: {}, sel: null, checked: false, order: [] };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function resetPlace() { place.placed = {}; place.sel = null; place.checked = false; place.order = shuffle(PLACE_ITEMS.map(x => x.id)); }
resetPlace();
const placeItems = () => place.order.map(id => PLACE_ITEMS.find(x => x.id === id)).filter(x => !x.k || kemi());

function placeSvg() {
  const counts = {}; ZONES.forEach(z => counts[z] = 0);
  for (const it of placeItems()) { const z = place.placed[it.id]; if (z) counts[z]++; }
  const badge = (x, y, n) => n ? `<g pointer-events="none"><circle cx="${x}" cy="${y}" r="11" fill="var(--accent)"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--accent-ink)">${n}</text></g>` : "";
  return `<svg class="scene" id="placeSvg" viewBox="0 0 600 430" role="img" aria-label="${T().place.title}">
    <rect class="cyto zhit" data-z="cyto" x="8" y="8" width="584" height="414" rx="36"/>
    <rect class="zonehl hl-fill" id="phl-cyto" x="8" y="8" width="584" height="414" rx="36"/>
    <rect class="cellmem" x="8" y="8" width="584" height="414" rx="36" pointer-events="none"/>
    <ellipse class="ims zhit" data-z="ims" cx="${PM.cx}" cy="${PM.cy}" rx="${PM.rx}" ry="${PM.ry}"/>
    <ellipse class="zonehl hl-fill" id="phl-ims" cx="${PM.cx}" cy="${PM.cy}" rx="${PM.rx}" ry="${PM.ry}"/>
    <ellipse class="mem" cx="${PM.cx}" cy="${PM.cy}" rx="${PM.rx}" ry="${PM.ry}" pointer-events="none"/>
    <ellipse class="mem2" cx="${PM.cx}" cy="${PM.cy}" rx="${PM.rx}" ry="${PM.ry}" pointer-events="none"/>
    <path class="matrix zhit" data-z="matrix" d="${P_INNER}"/>
    <path class="zonehl hl-fill" id="phl-matrix" d="${P_INNER}"/>
    <path class="zonehl hl-stroke" id="phl-inner" d="${P_INNER}"/>
    <path class="mem" d="${P_INNER}" pointer-events="none"/>
    <path class="mem2" d="${P_INNER}" pointer-events="none"/>
    <path class="zhit" data-z="inner" d="${P_INNER}" fill="none" stroke="transparent" stroke-width="16" pointer-events="stroke"/>
    ${badge(48, 46, counts.cyto)}${badge(PM.cx, PM.cy - PM.ry + 11, counts.ims)}${badge(PM.cx - PM.irx, PM.cy, counts.inner)}${badge(PM.cx, PM.cy, counts.matrix)}
  </svg>`;
}
function chip(it, inZone) {
  const t = T();
  let cls = "chip", extra = "";
  if (place.checked && inZone) {
    const ok = it.z.includes(place.placed[it.id]);
    cls += ok ? " ok" : " bad";
    if (!ok) extra = `<small>${t.place.belongs}${it.z.map(z => t.zones[z]).join(" / ")}</small>`;
  }
  return `<button type="button" class="${cls}" data-item="${it.id}" aria-pressed="${place.sel === it.id}">${t.placeItems[it.id]}${extra}</button>`;
}
function renderPlace() {
  const t = T(), items = placeItems();
  $("#placeScene").innerHTML = placeSvg();
  const pool = items.filter(it => !place.placed[it.id]);
  let h = `<h2>${t.place.title}</h2><p>${t.place.intro}</p>
    <h3>${t.place.pool}</h3><div class="pool">${pool.map(it => chip(it, false)).join("") || `<span class="muted small">✓</span>`}</div>
    <div class="zones">`;
  for (const z of ZONES) {
    const here = items.filter(it => place.placed[it.id] === z);
    h += `<div class="zonebox${place.sel ? " target" : ""}" role="button" tabindex="0" data-zone="${z}">
      <div class="zt"><i class="sw" style="background:${ZSW[z]}"></i>${t.zones[z]}</div>
      <div class="zc">${here.map(it => chip(it, true)).join("")}</div></div>`;
  }
  h += `</div>`;
  if (place.checked) {
    const right = items.filter(it => it.z.includes(place.placed[it.id])).length;
    h += `<p class="score">${t.place.score(right, items.length)}</p>`;
    if (right === items.length) h += `<div class="obs"><p>${t.place.allDone}</p></div>`;
  }
  const allPlaced = pool.length === 0;
  h += `<div class="btnrow">`;
  if (!place.checked) h += `<button type="button" class="btn" data-pact="check"${allPlaced ? "" : " disabled"}>${t.place.check}</button>`;
  else h += `<button type="button" class="btn" data-pact="again">${t.place.again}</button>`;
  h += `<button type="button" class="btn ghost" data-pact="reset">${t.place.reset}</button></div>`;
  $("#placePanel").innerHTML = h;
}
function hlPlace(z) { ZONES.forEach(k => { const el = $("#phl-" + k); if (el) el.classList.toggle("on", k === z); }); }
function putIn(z) {
  if (!place.sel || place.checked) return;
  place.placed[place.sel] = z; place.sel = null;
  renderPlace(); hlPlace(z); setTimeout(() => hlPlace(null), 700);
}
$("#placePanel").addEventListener("click", (e) => {
  const c = e.target.closest("[data-item]");
  if (c) {
    const id = c.dataset.item;
    if (place.checked) return;
    if (place.placed[id]) { delete place.placed[id]; place.sel = id; }
    else place.sel = place.sel === id ? null : id;
    renderPlace(); return;
  }
  const zb = e.target.closest("[data-zone]");
  if (zb) { putIn(zb.dataset.zone); return; }
  const a = e.target.closest("[data-pact]"); if (!a) return;
  if (a.dataset.pact === "check") place.checked = true;
  else if (a.dataset.pact === "again") {
    for (const it of placeItems()) if (!it.z.includes(place.placed[it.id])) delete place.placed[it.id];
    place.checked = false;
  } else if (a.dataset.pact === "reset") resetPlace();
  renderPlace();
});
$("#placePanel").addEventListener("keydown", (e) => {
  const zb = e.target.closest("[data-zone]");
  if (zb && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); putIn(zb.dataset.zone); }
});
$("#placePanel").addEventListener("mouseover", (e) => { const zb = e.target.closest("[data-zone]"); hlPlace(zb ? zb.dataset.zone : null); });
$("#placePanel").addEventListener("focusin", (e) => { const zb = e.target.closest("[data-zone]"); if (zb) hlPlace(zb.dataset.zone); });
$("#placePanel").addEventListener("mouseleave", () => hlPlace(null));
$("#placeScene").addEventListener("click", (e) => { const z = e.target.closest("[data-z]"); if (z) putIn(z.dataset.z); });

/* =====================================================================
   4. OLIKA BRÄNSLEN
   ===================================================================== */
const fuel = { f: "carb", aa: "ala" };
const AA_TARGET = { ala: "pyruvate", leu: "acetyl", glu: "akg", val: "succ", phe: "fum", asp: "oaa" };
const TCA_C = { x: 240, y: 470, r: 72 };
const tcaPt = (deg) => [TCA_C.x + TCA_C.r * Math.cos(deg * Math.PI / 180), TCA_C.y + TCA_C.r * Math.sin(deg * Math.PI / 180)];
const FN = {
  glucose: [95, 90], glycerol: [225, 90], fa: [345, 90], amino: [465, 90],
  glycolysis: [140, 175], pyruvate: [140, 265], beta: [345, 200], acetyl: [240, 345],
  oaa: tcaPt(230), cit: tcaPt(-50), akg: tcaPt(20), succ: tcaPt(90), fum: tcaPt(160), etc: [240, 610]
};
const FE = {
  glu_gly: "M95 103 L118 160", glyc_gly: "M222 103 L172 160", fa_beta: "M345 103 L345 185",
  gly_pyr: "M140 190 L140 250", pyr_ac: "M162 279 L220 331", beta_ac: "M333 214 L262 331",
  ac_tca: "M240 359 L240 396", tca_etc: "M240 557 L240 594",
  gly_etc: "M72 182 C 15 300, 15 560, 112 604", beta_etc: "M405 205 C 480 300, 480 560, 368 604",
  aa_ala: "M455 162 C 400 240, 260 266, 184 266", aa_leu: "M462 162 C 440 290, 340 345, 292 345",
  aa_glu: "M470 162 C 515 330, 425 495, 362 495", aa_val: "M478 162 C 548 420, 380 548, 292 543",
  aa_phe: "M486 162 C 565 650, 110 620, 150 512", aa_asp: "M450 162 C 360 300, 235 392, 208 401"
};
function fuelActive() {
  if (fuel.f === "carb") return { n: ["glucose", "glycolysis", "pyruvate", "acetyl", "tca", "etc"], e: ["glu_gly", "gly_pyr", "pyr_ac", "ac_tca", "tca_etc", "gly_etc"] };
  if (fuel.f === "fat") return { n: ["glycerol", "fa", "beta", "glycolysis", "pyruvate", "acetyl", "tca", "etc"], e: ["glyc_gly", "fa_beta", "beta_ac", "gly_pyr", "pyr_ac", "ac_tca", "tca_etc", "beta_etc"] };
  const tg = AA_TARGET[fuel.aa];
  const n = ["amino", "deam", tg], e = ["aa_" + fuel.aa];
  if (tg === "pyruvate") { n.push("acetyl", "tca", "etc"); e.push("pyr_ac", "ac_tca", "tca_etc"); }
  else if (tg === "acetyl") { n.push("tca", "etc"); e.push("ac_tca", "tca_etc"); }
  else { n.push("tca", "etc"); e.push("tca_etc"); }
  return { n, e, target: tg };
}
function fuelSvg() {
  const t = T().fuel, act = fuelActive();
  const tcaNodes = ["oaa", "cit", "akg", "succ", "fum"];
  const node = (id, small) => {
    const [x, y] = FN[id], label = t.nodes[id];
    const fs = small ? 11 : 12.5;
    const w = Math.round(label.length * fs * 0.58 + (small ? 14 : 22)), h = small ? 22 : 28;
    let cls = "fnode";
    const on = act.n.includes(id) || (tcaNodes.includes(id) && act.n.includes("tca"));
    if (act.target === id) cls += " target";
    else if (act.n.includes(id)) cls += " on";
    if (!on) cls += " dim";
    return `<g class="${cls}"><rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}"/><text x="${x}" y="${y + fs * 0.36}" style="font-size:${fs}px">${label}</text></g>`;
  };
  const edge = (id) => {
    const on = act.e.includes(id);
    const isAA = id.startsWith("aa_"), dash = id.endsWith("_etc") && id !== "tca_etc";
    let cls = "fedge" + (on ? " on" : "") + (dash ? " dash" : "");
    if (!on && (dash || (isAA && fuel.f !== "prot"))) cls += " hide";
    else if (!on && isAA) cls += " faint";
    return `<path class="${cls}" d="${FE[id]}" marker-end="url(#${on ? "ahOn" : "ahOff"})"/>`;
  };
  const head = (k, x) => `<text class="fhead" x="${x}" y="40" style="${fuel.f === k ? "fill:var(--accent)" : "opacity:.5"}">${t.cats[k]}</text>`;
  return `<svg class="scene" id="fuelSvg" viewBox="0 0 560 640" role="img" aria-label="${T().tabs.fuel}">
    <defs>
      <marker id="ahOn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
      <marker id="ahOff" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker>
    </defs>
    ${head("carb", 95)}${head("fat", 285)}${head("prot", 465)}
    <circle class="fcirc${act.n.includes("tca") ? " on" : ""}" cx="${TCA_C.x}" cy="${TCA_C.y}" r="${TCA_C.r}"/>
    <text class="fnote" x="${TCA_C.x}" y="${TCA_C.y - 3}" style="font-style:normal;font-weight:700;font-size:12px">${T().cyc[0]}</text>
    <text class="fnote" x="${TCA_C.x}" y="${TCA_C.y + 12}" style="font-style:normal;font-weight:700;font-size:12px">${T().cyc[1]}</text>
    ${Object.keys(FE).map(edge).join("")}
    <text class="fnote" x="${FN.amino[0]}" y="150" style="${fuel.f === "prot" ? "" : "opacity:.4"}">${t.deam}</text>
    <text class="fnote" x="300" y="580">${t.nadh}</text>
    ${["glucose", "glycerol", "fa", "amino", "glycolysis", "pyruvate", "beta", "acetyl", "etc"].map(id => node(id)).join("")}
    ${tcaNodes.map(id => node(id, true)).join("")}
  </svg>`;
}
function renderFuel() {
  const t = T().fuel, d = t.d[fuel.f];
  $("#fuelScene").innerHTML = fuelSvg();
  let h = `<h2>${d.title}</h2>
    <div class="seg" style="margin:8px 0" role="group" aria-label="${t.choose}">
      ${["carb", "fat", "prot"].map(k => `<button type="button" data-fuel="${k}" aria-pressed="${fuel.f === k}">${t.cats[k]}</button>`).join("")}</div>`;
  if (fuel.f === "prot") {
    h += `<p class="small muted" style="margin-bottom:0">${t.aaChoose}</p><div class="aas">${Object.keys(AA_TARGET).map(k => `<button type="button" class="chip" data-aa="${k}" aria-pressed="${fuel.aa === k}">${t.aa[k]}</button>`).join("")}</div>`;
  }
  h += `<p>${d.text}</p><dl class="facts">`;
  if (fuel.f === "prot") h += `<dt>${t.entry}</dt><dd>${t.aa[fuel.aa]} → ${t.nodes[AA_TARGET[fuel.aa]]}</dd>`;
  h += `<dt>${t.atp}</dt><dd>${d.atp}</dd><dt>${t.kj}</dt><dd>${d.kj}</dd>`;
  if (kemi()) h += `<dt>${t.rq}</dt><dd>${d.rq}</dd><dt>${t.oxc}</dt><dd>${d.oxc}</dd>`;
  h += `</dl>`;
  if (kemi() || fuel.f === "prot") h += `<div class="eq">${d.eq}</div>`;
  if (kemi() && d.kemi) h += `<p>${d.kemi}</p>`;
  const kj = { carb: 17, fat: 37, prot: 17 };
  h += `<h3>${t.cmp}</h3><div class="bars">${["carb", "fat", "prot"].map(k => `<span>${t.cats[k]}</span><div class="bt${fuel.f === k ? " cur" : ""}"><div class="bf" style="width:${(kj[k] / 40) * 100}%"></div></div><b>${kj[k]}</b>`).join("")}</div>`;
  $("#fuelPanel").innerHTML = h;
}
$("#fuelPanel").addEventListener("click", (e) => {
  const f = e.target.closest("[data-fuel]"); if (f) { fuel.f = f.dataset.fuel; renderFuel(); return; }
  const a = e.target.closest("[data-aa]"); if (a) { fuel.aa = a.dataset.aa; renderFuel(); }
});

/* =====================================================================
   GEMENSAMT: språk, nivå, flikar
   ===================================================================== */
function renderStatic() {
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.title;
  $("#tTitle").textContent = t.title; $("#tSub").textContent = t.sub;
  $("#langSeg").setAttribute("aria-label", t.langLabel);
  renderChemMenu();
  $$("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $$("#tabs button").forEach(b => { b.textContent = t.tabs[b.dataset.tab]; b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
}
function renderAll() { readColors(); renderStatic(); applyPanel(); renderWalk(); renderLab(); renderPlace(); renderFuel(); }
function switchTab(id) {
  tab = id;
  $$(".view").forEach(v => v.hidden = v.id !== "v-" + id);
  $$("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
  if (id === "lab") { fitCanvas(); drawLab(); }
  window.scrollTo(0, 0);
}
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) switchTab(b.dataset.tab); });
$("#tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ids = ["walk", "lab", "place", "fuel"]; let i = ids.indexOf(tab);
  i = (i + (e.key === "ArrowRight" ? 1 : 3)) % 4; switchTab(ids[i]); $("#tb-" + ids[i]).focus();
});
$("#langSeg").addEventListener("click", (e) => { const b = e.target.closest("[data-lang]"); if (!b) return; lang = b.dataset.lang; store("cell-lang", lang); renderAll(); });
/* Textpanelen är dold från början för att ge cellen mer plats */
let panelOpen = readStored("cell-panel") === "1";
function applyPanel() {
  $("#v-walk").classList.toggle("ptext-off", !panelOpen);
  const b = $("#panelToggle");
  const lbl = panelOpen ? (lang === "sv" ? "Dölj förklaringen" : "Hide the explanation") : (lang === "sv" ? "Visa förklaring och mer information" : "Show explanation and more information");
  b.title = lbl; b.setAttribute("aria-label", lbl); b.setAttribute("aria-pressed", String(panelOpen));
  if (E.scene && E.scene.kind === "world" && E.camName) setVB(camRect(E.camName));
}
$("#panelToggle").addEventListener("click", () => { panelOpen = !panelOpen; store("cell-panel", panelOpen ? "1" : "0"); applyPanel(); });

/* Kemisk fördjupning: rullgardin med kryssrutor */
function renderChemMenu() {
  const c = W().chem;
  $("#chemLbl").textContent = c.title;
  const cnt = $("#chemCnt"); cnt.textContent = chem.length; cnt.hidden = chem.length === 0;
  $("#chemMenu").innerHTML = CHEM_KEYS.map(k => `<label><input type="checkbox" data-chem="${k}"${has(k) ? " checked" : ""}>${c.opts[k]}</label>`).join("")
    + `<p class="ddnote">${c.note}</p><div class="ddfoot"><button type="button" class="linkbtn" data-chemall="1">${c.all}</button><button type="button" class="linkbtn" data-chemall="0">${c.none}</button></div>`;
}
function setChem(list) {
  chem = CHEM_KEYS.filter(k => list.includes(k));
  store("cell-chem", JSON.stringify(chem));
  const cnt = $("#chemCnt"); cnt.textContent = chem.length; cnt.hidden = chem.length === 0;
  $$("#chemMenu [data-chem]").forEach(x => x.checked = has(x.dataset.chem));
  if (!kemi()) for (const it of PLACE_ITEMS) if (it.k) delete place.placed[it.id];
  place.checked = false;
  renderWalk(); renderPlace(); renderFuel();
}
function openChem(open) { $("#chemMenu").hidden = !open; $("#chemBtn").setAttribute("aria-expanded", String(open)); }
$("#chemBtn").addEventListener("click", () => openChem($("#chemMenu").hidden));
$("#chemMenu").addEventListener("change", (e) => {
  const k = e.target.dataset.chem; if (!k) return;
  setChem(e.target.checked ? [...chem, k] : chem.filter(x => x !== k));
});
$("#chemMenu").addEventListener("click", (e) => { const b = e.target.closest("[data-chemall]"); if (b) setChem(b.dataset.chemall === "1" ? CHEM_KEYS : []); });
document.addEventListener("click", (e) => { if (!$("#chemMenu").hidden && !e.target.closest("#chemDD")) openChem(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#chemMenu").hidden) { openChem(false); $("#chemBtn").focus(); } });

renderAll();
{ const q = new URLSearchParams(location.search).get("tab"); switchTab(["walk", "lab", "place", "fuel"].includes(q) ? q : "walk"); }
requestAnimationFrame(loop);
})();
</script>
