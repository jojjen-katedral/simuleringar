    // =====================================================================
    //  STORLEK, INTERAKTION, LOOP
    // =====================================================================
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const box = canvas.parentElement.getBoundingClientRect();
        width = Math.floor(box.width); height = Math.floor(box.height);
        canvas.width = width * dpr; canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const cb = curveCanvas.parentElement.getBoundingClientRect();
        cW = Math.floor(cb.width); cH = Math.floor(cb.height);
        curveCanvas.width = cW * dpr; curveCanvas.height = cH * dpr;
        cctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        updateVessel();
        if (molecules.length) placeAll();
    }

    function setupInteractions() {
        const pos = (e) => {
            const r = canvas.getBoundingClientRect();
            const p = e.touches ? e.touches[0] : e;
            return { x: p.clientX - r.left, y: p.clientY - r.top };
        };
        // Med förstoringsglaset på styr pekaren glaset, och ett klick/tryck tar en stillbild
        // av det som syns i glaset. Utan glaset knuffar pekaren på molekylerna.
        let lastTouch = 0;
        const touchStart = { x: 0, y: 0, moved: false };

        canvas.addEventListener('mousedown', (e) => {
            if (lens.on) return;
            mouse.down = true; Object.assign(mouse, pos(e));
        });
        canvas.addEventListener('mousemove', (e) => { if (lens.on) setLens(pos(e)); });
        canvas.addEventListener('mouseleave', () => { if (lens.on) restoreLens(); });
        canvas.addEventListener('click', (e) => {
            if (!lens.on || performance.now() - lastTouch &lt; 800) return;
            setLens(pos(e));
            takeStill();
        });
        window.addEventListener('mousemove', (e) => { if (!lens.on &amp;&amp; mouse.down) Object.assign(mouse, pos(e)); });
        window.addEventListener('mouseup', () => { mouse.down = false; });

        canvas.addEventListener('touchstart', (e) => {
            lastTouch = performance.now();
            const p = pos(e);
            if (lens.on) { Object.assign(touchStart, p, { moved: false }); return; }
            mouse.down = true; Object.assign(mouse, p);
        }, { passive: true });
        canvas.addEventListener('touchmove', (e) => {
            lastTouch = performance.now();
            const p = pos(e);
            if (lens.on) {
                // Dra = flytta glaset (ingen bild)
                if (touchStart.moved || Math.hypot(p.x - touchStart.x, p.y - touchStart.y) > 8) {
                    touchStart.moved = true;
                    setLens(p);
                }
                return;
            }
            if (mouse.down) Object.assign(mouse, p);
        }, { passive: true });
        canvas.addEventListener('touchend', () => {
            lastTouch = performance.now();
            mouse.down = false;
            // Kort tryck utan att dra = flytta glaset dit och ta en stillbild
            if (lens.on &amp;&amp; !touchStart.moved) { setLens(touchStart); takeStill(); }
        });

        document.querySelectorAll('.btn.zoom').forEach(btn => btn.addEventListener('click', () => {
            lens.zoom = parseFloat(btn.dataset.zoom);
            document.querySelectorAll('.btn.zoom').forEach(b => b.classList.toggle('active', b === btn));
        }));

        // Kortkommandon: L = förstoringsglas, P = paus, S = stillbild, Esc = stäng bildvisning
        window.addEventListener('keydown', (e) => {
            const tag = (e.target.tagName || '').toLowerCase();
            if (e.key === 'Escape') { closeViewer(); return; }
            if (tag === 'select' || tag === 'textarea' || (tag === 'input' &amp;&amp; e.target.type !== 'range' &amp;&amp; e.target.type !== 'checkbox')) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const k = e.key.toLowerCase();
            if (k === 'l') toggleLens();
            else if (k === 'p') togglePause();
            else if (k === 's') takeStill();
        });
        document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
        document.getElementById('viewer').addEventListener('click', (e) => { if (e.target.id === 'viewer') closeViewer(); });

        document.querySelectorAll('.btn.seg:not(.zoom)').forEach(btn => btn.addEventListener('click', () => {
            heatPower = parseFloat(btn.dataset.power);
            document.querySelectorAll('.btn.seg:not(.zoom)').forEach(b => b.classList.toggle('active', b === btn));
        }));
    }

    // =====================================================================
    //  FÖRSTORINGSGLAS, PAUS OCH STILLBILDER
    // =====================================================================
    let paused = false;
    const lens = { on: false, x: 0, y: 0, zoom: 2, placed: false, drag: false };
    const stills = [];
    const MAX_STILLS = 12;
    let stillSeq = 0, viewId = null, compareId = null;

    function drawScene() {
        drawVessel();
        renderBonds();
        for (const m of molecules) drawMolecule(m);
    }

    function lensRadius() { return Math.max(60, Math.min(130, Math.min(width, height) * 0.22)); }

    const lensTrail = [];
    function setLens(p) {
        lens.x = Math.max(0, Math.min(width, p.x));
        lens.y = Math.max(0, Math.min(height, p.y));
        lens.placed = true;
        const now = performance.now();
        lensTrail.push({ x: lens.x, y: lens.y, t: now });
        while (lensTrail.length &amp;&amp; now - lensTrail[0].t > 1000) lensTrail.shift();
    }

    // När pekaren lämnar ytan (t.ex. på väg till en knapp) stannar glaset där det
    // var för en kort stund sedan, i stället för att hamna vid kanten.
    function restoreLens() {
        const now = performance.now();
        let best = null;
        for (const q of lensTrail) if (now - q.t >= 250) best = q;
        if (best) { lens.x = best.x; lens.y = best.y; }
        lensTrail.length = 0;
    }

    let lensFlash = 0;
    function drawLens() {
        const R = lensRadius();
        lens.x = Math.max(0, Math.min(width, lens.x));
        lens.y = Math.max(0, Math.min(height, lens.y));
        // Förstorad vy: hela scenen ritas om skarpt (vektorgrafik) i större skala
        ctx.save();
        ctx.beginPath();
        ctx.arc(lens.x, lens.y, R, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = '#050811';
        ctx.fillRect(lens.x - R, lens.y - R, 2 * R, 2 * R);
        ctx.translate(lens.x, lens.y);
        ctx.scale(lens.zoom, lens.zoom);
        ctx.translate(-lens.x, -lens.y);
        drawScene();
        ctx.restore();

        // Kort vit blixt i glaset när en stillbild tas
        const fl = 1 - (performance.now() - lensFlash) / 350;
        if (fl > 0) {
            ctx.save();
            ctx.beginPath(); ctx.arc(lens.x, lens.y, R, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${0.6 * fl})`; ctx.fill();
            ctx.restore();
        }

        // Ram, handtag och etikett
        ctx.save();
        const a = Math.PI / 4;
        const hx = lens.x + Math.cos(a) * (R + 3), hy = lens.y + Math.sin(a) * (R + 3);
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(a) * 36, hy + Math.sin(a) * 36); ctx.stroke();
        ctx.beginPath();
        ctx.arc(lens.x, lens.y, R, 0, Math.PI * 2);
        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(226, 232, 240, 0.95)'; ctx.stroke();
        ctx.beginPath();
        ctx.arc(lens.x, lens.y, R + 4, 0, Math.PI * 2);
        ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)'; ctx.stroke();
        const label = `${lens.zoom}×`;
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.beginPath(); ctx.roundRect(lens.x - 17, lens.y - R + 6, 34, 18, 9); ctx.fill();
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(label, lens.x, lens.y - R + 15.5);
        const hint = tr('lensHint');
        ctx.font = '600 10.5px system-ui, sans-serif';
        const hw = ctx.measureText(hint).width + 14;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath(); ctx.roundRect(lens.x - hw / 2, lens.y + R - 24, hw, 17, 8.5); ctx.fill();
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(hint, lens.x, lens.y + R - 15.5);
        ctx.restore();
    }

    function toggleLens(force) {
        lens.on = typeof force === 'boolean' ? force : !lens.on;
        if (lens.on &amp;&amp; !lens.placed) {
            lens.x = vessel.x + vessel.w / 2;
            lens.y = vessel.bottom - lensRadius() * 0.8;
        }
        mouse.down = false;
        document.getElementById('btn-lens').classList.toggle('on', lens.on);
        document.getElementById('zoomset').classList.toggle('hidden', !lens.on);
        canvas.style.cursor = lens.on ? 'crosshair' : 'pointer';
    }

    function togglePause() {
        paused = !paused;
        const b = document.getElementById('btn-pause');
        b.textContent = paused ? tr('resume') : tr('pause');
        b.classList.toggle('on', paused);
        document.getElementById('paused-tag').classList.toggle('hidden', !paused);
    }

    function takeStill() {
        let cx, cy, halfW, halfH, outW, outH, view;
        if (lens.on) {
            const h = lensRadius() / lens.zoom;
            cx = lens.x; cy = lens.y; halfW = halfH = h;
            outW = outH = 720;
            view = `${lens.zoom}× ${tr('magnification')}`;
        } else {
            const top = vessel.y - 16, bot = vessel.bottom + 26;
            cx = vessel.x + vessel.w / 2; cy = (top + bot) / 2;
            halfW = vessel.w / 2 + 22; halfH = (bot - top) / 2;
            const sc = Math.min(2, 1100 / (2 * halfH));
            outW = Math.round(2 * halfW * sc); outH = Math.round(2 * halfH * sc);
            view = tr('wholeVessel');
        }
        const capH = 34;
        const oc = document.createElement('canvas');
        oc.width = outW; oc.height = outH + capH;
        const o = oc.getContext('2d');
        o.fillStyle = '#050811';
        o.fillRect(0, 0, oc.width, oc.height);
        o.save();
        o.translate(outW / 2, outH / 2);
        o.scale(outW / (2 * halfW), outH / (2 * halfH));
        o.translate(-cx, -cy);
        const saved = ctx;
        ctx = o;
        try { drawScene(); } finally { ctx = saved; }
        o.restore();

        const st = HtoState(H);
        const T = Math.round(st.T * 10) / 10;
        const tTxt = `${T > 0 ? '+' : ''}${fmtT(T)} °C`;
        const press = cur.id === 'co2' ? (co2Pressure === '1atm' ? ', 1 atm' : ', 10 atm') : '';
        const phase = tr('ph_' + badgeKey(st.seg));
        const label = `${tr(cur.id + 'Name')} (${cur.formula}${press}) · ${tTxt} · ${phase} · ${view}`;
        o.fillStyle = '#0f172a';
        o.fillRect(0, outH, outW, capH);
        o.fillStyle = '#e2e8f0';
        o.font = '600 14px system-ui, sans-serif';
        o.textBaseline = 'middle';
        o.fillText(label, 12, outH + capH / 2, outW - 24);

        stills.push({ id: ++stillSeq, url: oc.toDataURL('image/png'), label, short: `${cur.formula} ${tTxt}`, n: stillSeq });
        if (stills.length > MAX_STILLS) stills.shift();
        renderThumbs();
        if (lens.on) {
            lensFlash = performance.now();   // blixten ritas i glaset (drawLens)
        } else {
            const f = document.getElementById('flash');
            f.style.transition = 'none'; f.style.opacity = '0.6';
            requestAnimationFrame(() => { f.style.transition = 'opacity 0.35s'; f.style.opacity = '0'; });
        }
    }

    function renderThumbs() {
        const box = document.getElementById('thumbs');
        box.innerHTML = stills.map(s =>
            `&lt;button class="thumb" onclick="openStill(${s.id})" title="${s.label}">&lt;img src="${s.url}" alt="${s.label}">&lt;span>#${s.n} ${s.short}&lt;/span>&lt;/button>`
        ).join('');
        document.getElementById('thumbs-empty').classList.toggle('hidden', stills.length > 0);
        document.getElementById('still-count').textContent = `${stills.length}/${MAX_STILLS}`;
    }

    const findStill = (id) => stills.find(s => s.id === id);

    function openStill(id) {
        viewId = id;
        if (compareId === id) compareId = null;
        document.getElementById('viewer').classList.remove('hidden');
        renderViewer();
    }

    function renderViewer() {
        const s = findStill(viewId);
        if (!s) { closeViewer(); return; }
        document.getElementById('v-img1').src = s.url;
        document.getElementById('v-cap1').textContent = `${tr('image')} #${s.n}`;
        const dl = document.getElementById('v-download');
        dl.href = s.url;
        dl.download = `${tr('fileName')}-${s.n}.png`;

        const c = compareId !== null ? findStill(compareId) : null;
        document.getElementById('v-fig2').classList.toggle('hidden', !c);
        if (c) {
            document.getElementById('v-img2').src = c.url;
            document.getElementById('v-cap2').textContent = `${tr('image')} #${c.n}`;
        }
        const sel = document.getElementById('v-compare');
        sel.innerHTML = `&lt;option value="">${tr('none')}&lt;/option>` + stills.filter(x => x.id !== viewId)
            .map(x => `&lt;option value="${x.id}"${x.id === compareId ? ' selected' : ''}>#${x.n} ${x.short}&lt;/option>`).join('');
    }

    function setCompare(v) { compareId = v ? parseInt(v, 10) : null; renderViewer(); }

    function stepStill(d) {
        const i = stills.findIndex(s => s.id === viewId);
        if (i &lt; 0) return;
        viewId = stills[(i + d + stills.length) % stills.length].id;
        if (compareId === viewId) compareId = null;
        renderViewer();
    }

    function deleteStill() {
        const i = stills.findIndex(s => s.id === viewId);
        if (i &lt; 0) return;
        stills.splice(i, 1);
        if (compareId === viewId) compareId = null;
        renderThumbs();
        if (stills.length === 0) { closeViewer(); return; }
        viewId = stills[Math.min(i, stills.length - 1)].id;
        if (compareId === viewId) compareId = null;
        renderViewer();
    }

    function closeViewer() {
        document.getElementById('viewer').classList.add('hidden');
        viewId = null;
    }

    const STEP_MS = 1000 / 60;
    let lastTime = null, acc = 0;
    function loop(now) {
        if (lastTime === null) lastTime = now;
        acc += Math.min(100, now - lastTime);
        lastTime = now;
        let steps = 0;
        if (paused) acc = 0;
        while (acc >= STEP_MS &amp;&amp; steps &lt; 4) {
            physicsStep();
            frameCount++;
            if (frameCount % 10 === 0) {
                history.push({ T: HtoState(H).T, sp: setpoint });
                if (history.length > 360) history.shift();
            }
            acc -= STEP_MS;
            steps++;
        }
        if (steps === 4) acc = 0;

        ctx.fillStyle = '#050811';
        ctx.fillRect(0, 0, width, height);
        drawScene();
        if (lens.on) drawLens();

        if (frameCount % 4 === 0) updateUI();
        if (frameCount % 10 === 0) drawCurve();
        requestAnimationFrame(loop);
    }

    window.addEventListener('DOMContentLoaded', () => {
        canvas = document.getElementById('simCanvas');
        ctx = canvas.getContext('2d');
        curveCanvas = document.getElementById('curveCanvas');
        cctx = curveCanvas.getContext('2d');

        resizeCanvas();
        new ResizeObserver(() => {
            const b = canvas.parentElement.getBoundingClientRect();
            if (Math.abs(b.width - width) > 1 || Math.abs(b.height - height) > 1) resizeCanvas();
        }).observe(canvas.parentElement);

        setupInteractions();
        lang = initialLang();
        updateSetpointUI();
        const q = new URLSearchParams(location.search).get('amne');
        if (new URLSearchParams(location.search).get('punkter') === '1') renderOptions.points = true;
        document.getElementById('show-points').checked = renderOptions.points;
        setSubstance(q &amp;&amp; SUBSTANCES[q] ? q : 'co2');
        applyLang();
        requestAnimationFrame(loop);
    });

        },
        // Sök upp ämnet som har ett visst namn i en viss del (t.ex. 'h2o' i Värm och kyl)
        fran(del, id) {
            for (const k in A) if (A[k].in[del] === id) return k;
            return null;

&lt;script>
// =====================================================================
//  BRYGGA mellan en befintlig simulering och ramen "Ämnens egenskaper"
//  Läggs in sist i delen av bygg.py, tillsammans med amnen.js och window.DEL_ID.
//  Gör ingenting när simuleringen körs som egen sida.
//
//  Ramen -> delen:  { to:'del', type:'lang', lang }
//                   { to:'del', type:'select', id, slot }   (slot = 'A' | 'B' i Blanda och lös)
//                   { to:'del', type:'active', on }          (pausa när fliken inte syns)
//  Delen -> ramen:  { from:'del', del, type:'ready', id }
//                   { from:'del', del, type:'chose', id }    (användaren valde ett ämne i delen)
// =====================================================================
(function () {
    if (window.parent === window) return;
    const DEL = window.DEL_ID;
    const AM = window.AMNEN;
    document.documentElement.classList.add('embedded');
    const css = document.createElement('style');
    // Ramen visar titel och språkval, så delens egna döljs
    css.textContent = '.embedded .topbar .title, .embedded .lang, .embedded .theory-link { display: none !important; }';
    document.head.appendChild(css);

    const post = (m) => parent.postMessage(Object.assign({ from: 'del', del: DEL }, m), '*');
    const canon = (id) => (AM &amp;&amp; id ? AM.fran(DEL, id) : null);

    // ---- 1. Gemensam ämnesdata: smält-/kokpunkter och densiteter hämtas från amnen.js ----
    if (AM) {
        for (const k in AM.lista) {
            const a = AM.lista[k], id = a.in[DEL];
            if (!id) continue;
            if (DEL === 'varm' &amp;&amp; typeof SUBSTANCES !== 'undefined' &amp;&amp; SUBSTANCES[id] &amp;&amp; id !== 'co2') {
                SUBSTANCES[id].mp = a.mp; SUBSTANCES[id].bp = a.bp;
            }
            if (DEL === 'blanda' &amp;&amp; typeof LIQ !== 'undefined' &amp;&amp; LIQ[id]) {
                LIQ[id].dens = a.dens; LIQ[id].bp = a.bp;
            }
            if (DEL === 'blanda' &amp;&amp; typeof SOLIDS !== 'undefined' &amp;&amp; SOLIDS[id]) SOLIDS[id].dens = a.dens;
        }
    }

    // ---- 2. Rapportera när användaren väljer ett ämne i delen ----
    // sant när ramen själv byter ämne (då rapporteras det inte tillbaka), och under starten,
    // så att delens startämne inte skriver över ett ämne som ramen har valt (t.ex. från en direktlänk)
    let quiet = true;
    if (DEL === 'varm') {
        const orig = window.setSubstance;
        window.setSubstance = function (k) { orig(k); if (!quiet) post({ type: 'chose', id: canon(k) }); };
    }
    if (DEL === 'blanda') {
        const origL = window.selectLiquid, origS = window.pickSolid;
        window.selectLiquid = function (id, val) { origL(id, val); if (!quiet &amp;&amp; val) post({ type: 'chose', id: canon(val) }); };
        window.pickSolid = function (k) { origS(k); if (!quiet) post({ type: 'chose', id: canon(k) }); };
    }

    // ---- 3. Meddelanden från ramen ----
    let pausedByFrame = false;
    function setActive(on) {
        if (typeof togglePause !== 'function') return;
        if (!on &amp;&amp; !paused) { togglePause(); pausedByFrame = true; }
        else if (on &amp;&amp; pausedByFrame) { if (paused) togglePause(); pausedByFrame = false; }
    }
    function select(m) {
        const a = AM &amp;&amp; AM.lista[m.id];
        if (!a || !a.in[DEL]) return;
        const id = a.in[DEL];
        quiet = true;
        try {
            if (DEL === 'varm') window.setSubstance(id);
            else if (DEL === 'blanda') {
                const internal = m.slot === 'B' ? 'A' : 'B';      // visad A = intern 'B' (den som hälls)
                if (a.in.solid) {
                    setTab('solids'); window.pickSolid(id); setTarget(internal); addSolid();
                } else {
                    setTab('liquids');
                    const s = document.getElementById('sel-' + internal);
                    if (s) s.value = id;
                    window.selectLiquid(internal, id);
                }
            }
        } finally { quiet = false; }
    }
    window.addEventListener('message', (e) => {
        const m = e.data || {};
        if (m.to !== 'del') return;
        if (m.type === 'lang' &amp;&amp; typeof applyLang === 'function') applyLang(m.lang);
        else if (m.type === 'select') select(m);
        else if (m.type === 'active') setActive(!!m.on);
    });

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            let id = null;
            if (DEL === 'varm' &amp;&amp; typeof cur !== 'undefined') id = canon(cur.id);
            if (DEL === 'blanda' &amp;&amp; typeof sel !== 'undefined') id = canon(sel.B);
            quiet = false;
            post({ type: 'ready', id });
        }, 0);
    });
})();

// Form för krockar: avlånga molekyler (kolkedjor) behandlas som "kapslar" (en sträcka med radie),
// runda som cirklar. Kapselns tvärsnittsyta motsvarar cirkelns, så vätskan tar lika stor plats.
// dip = riktningen från δ− (O) mot δ+ (H, eller C i C=O) i molekylens eget koordinatsystem.
function shapeOf(mol) {
    if (mol.shape) return mol.shape;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const a of mol.atoms) { x0 = Math.min(x0, a.x); x1 = Math.max(x1, a.x); y0 = Math.min(y0, a.y); y1 = Math.max(y1, a.y); }
    const rA = ATOM_R.C * DRAW_S;
    const hx = (x1 - x0) / 2 * DRAW_S + rA, hy = (y1 - y0) / 2 * DRAW_S + rA;
    let hl = 0, cr = mol.r;
    if (hx / hy > 1.5) {
        hl = (x1 - x0) / 2 * DRAW_S;
        cr = (-4 * hl + Math.sqrt(16 * hl * hl + 4 * Math.PI * Math.PI * mol.r * mol.r)) / (2 * Math.PI);
        cr = Math.max(cr, hy);
    }
    let dip;
    const Os = mol.atoms.filter(a => a.e === 'O');
    if (Os.length === 1) {
        const O = Os[0], Hs = mol.atoms.filter(a => a.e === 'H');
        let tx = null, ty = null;
        if (Hs.length) { tx = Hs.reduce((q, a) => q + a.x, 0) / Hs.length; ty = Hs.reduce((q, a) => q + a.y, 0) / Hs.length; }
        else if (mol.double) { const C = mol.atoms[mol.double[0]]; tx = C.x; ty = C.y; }
        if (tx !== null) dip = Math.atan2(ty - O.y, tx - O.x);
    }
    return (mol.shape = { hl, cr, dip });
}

function solTint(solid, liq) {
    if (solid === 'cuso4') return { rgb: [37, 99, 235], name: 'c_blue' };

        if (c === 'W') return { rgb: [202, 138, 4], name: 'c_yellow' };
        return { rgb: [146, 64, 14], name: 'c_brown' };
    }
    return null;
}

function layout() {

    const w = Math.round(Math.max(100, Math.min(360, H * 0.8, (W - 110) / 2.4)));

    tubes.A.rest = { x: x0, y: top };
    tubes.B.rest = { x: x0 + w + gap, y: top };
    for (const t of Object.values(tubes)) if (!t.pour) { t.P = { ...t.rest }; t.angle = 0; }
}
const toWorld = (t, x, y) => {
    const c = Math.cos(t.angle), s = Math.sin(t.angle);
    return { x: t.P.x + x * c - y * s, y: t.P.y + x * s + y * c };
};
function innerPath(c, t) {
    c.beginPath();
    c.moveTo(0, -2);
    c.lineTo(0, t.h - RC); c.quadraticCurveTo(0, t.h, RC, t.h);
    c.lineTo(t.w - RC, t.h); c.quadraticCurveTo(t.w, t.h, t.w, t.h - RC);

// Vätskans volym (area) i varje skikt, och ytans och gränsytans höjd
function levels(t, liquidOnly) {
    let vL = 0, vU = 0;
    for (const p of t.parts) {
        if (p.kind !== 'liq' &amp;&amp; (liquidOnly || p.state !== 'dissolved')) continue;
        if (t.phase.two &amp;&amp; p.phase === 'U') vU += p.area; else vL += p.area;
    }
    // Den del av kristallen som ligger under ytan tränger undan vätska, så nivån stiger
    const c = t.crystal;
    if (!liquidOnly &amp;&amp; c &amp;&amp; !t.pour) {
        const surf0 = t.h - (vL + vU) / t.w;
        let n = 0;
        for (const p of c.sites) if (p.state === 'solid') n++;
        const f = Math.max(0, Math.min(1, (c.y - surf0) / c.hgt));
        const d = n * c.siteA * f;
        if (d > 0) { if (t.phase.two &amp;&amp; c.y - c.hgt / 2 &lt; t.h - vL / t.w) vU += d; else vL += d; }
    }
    return { surf: t.h - (vL + vU) / t.w, inter: t.h - vL / t.w, vL, vU };
}

function mkLiquidPart(liq, origin, x, y, area) {
    const sh = shapeOf(LIQ[liq].mol);
    return { id: ++partId, liq, origin, kind: 'liq', x, y, vx: 0, vy: 0, angle: Math.random() * Math.PI * 2, av: 0,
             r: LIQ[liq].mol.r, hl: sh.hl, cr: sh.cr, area, phase: 'L', state: 'liquid', fresh: 0 };
}
function fillTube(t, liq) {
    t.parts = []; t.crystal = null; t.phase = { two: false }; t.mixInfo = null; t.stir = 0; t.vis = null; t.unmixed = 0;
    t.liqs = liq ? [liq] : [];
    if (!liq) return;
    const r = LIQ[liq].mol.r, d = 2 * r + 1;
    const hf = FILL * t.h;
    const pts = [];
    let row = 0;
    for (let y = t.h - r - 1; y > t.h - hf + r * 0.5; y -= d * 0.87, row++) {
        for (let x = r + 1 + (row % 2 ? d / 2 : 0); x &lt;= t.w - r - 1; x += d) pts.push([x, y]);
    }
    const area = t.w * hf / Math.max(1, pts.length);
    for (const [x, y] of pts) t.parts.push(mkLiquidPart(liq, t.id, x, y, area));
}

function resetAll() {
    stream = []; pourDone = false; resetPourFx();
    for (const id of ['A', 'B']) {
        const t = tubes[id];
        t.pour = null; t.P = { ...t.rest }; t.angle = 0;
        fillTube(t, sel[id]);

    document.getElementById('btn-what').classList.add('hidden');
    hideToast();

}

function selectLiquid(id, val) {
    sel[id] = val || null;
    if (pourDone || tubes.B.pour) { resetAll(); return; }
    fillTube(tubes[id], sel[id]);

// Fasindelning efter hällning: den tätare vätskan bildar det undre skiktet (L)
function setPhases(t) {
    const liqs = t.liqs;
    if (liqs.length &lt; 2) { t.phase = { two: false, main: liqs[0] || null }; }
    else {
        const [a, b] = liqs;
        const m = misc(a, b);
        t.mixInfo = { a, b, ...m };
        if (m.type === 'yes') t.phase = { two: false, main: a };
        else {
            const lower = LIQ[a].dens >= LIQ[b].dens ? a : b;
            const upper = lower === a ? b : a;
            t.phase = { two: true, lower, upper, frac: m.frac };
        }
    }
    for (const p of t.parts) assignPhase(t, p);
}
function assignPhase(t, p) {
    const ph = t.phase;
    if (p.state === 'solid') return;
    if (!ph.two) { p.phase = 'L'; p.phaseLiq = ph.main || p.liq || t.liqs[0]; return; }
    if (p.kind === 'liq') {
        let home = p.liq === ph.lower ? 'L' : 'U';
        if (Math.random() &lt; (ph.frac[p.liq] || 0)) home = home === 'L' ? 'U' : 'L';
        p.phase = home;
    } else {
        const S = SOLIDS[p.solid].sol;
        p.phase = (S[ph.lower] || 0) >= (S[ph.upper] || 0) ? 'L' : 'U';
    }
    p.phaseLiq = p.phase === 'L' ? ph.lower : ph.upper;
}

function startPour() {
    const A = tubes.A, B = tubes.B;
    if (B.pour) { showToast(tr('tBusy')); return; }
    if (pourDone) { showToast(tr('tPoured')); return; }
    if (!B.parts.some(p => p.kind === 'liq')) { showToast(tr('tBEmpty')); return; }
    B.pour = { stage: 'out', t: 0, hold: 0 };
    B.stir = 0;
    // Hur mycket bilden behöver zoomas ut för att B ska få plats under hela hällningen
    cam.ax = (A.rest.x + B.rest.x + B.w) / 2; cam.ay = H - 6;
    const vol0 = B.parts.reduce((q, p) => q + (p.state !== 'solid' ? p.area : 0), 0);
    const fit0 = fitTilt(B, vol0);
    let topY = 0, rightX = 0, leftX = W;
    for (let k = 0; k &lt;= 40; k++) {
        const m = k / 40, e = ease(m);
        for (const aa of [0.8 * fit0 * e, k / 40]) {
            const ang = POUR_ANGLE * aa, tg = pourTarget(ang);
            const P = { x: B.rest.x + (tg.x - B.rest.x) * (aa === k / 40 ? 1 : e), y: B.rest.y + (tg.y - B.rest.y) * (aa === k / 40 ? 1 : e) };
            for (const q of bCorners(P, ang)) { topY = Math.min(topY, q.y - 12); rightX = Math.max(rightX, q.x + 10); leftX = Math.min(leftX, q.x - 10); }
        }
    }
    const zV = topY &lt; 6 ? (cam.ay - 6) / (cam.ay - topY) : 1;
    const zH = rightX > W - 8 ? (W - 8 - cam.ax) / (rightX - cam.ax) : 1;
    const zL = leftX &lt; 8 ? (cam.ax - 8) / (cam.ax - leftX) : 1;
    cam.zPour = Math.min(1, zV, zH, zL);
    for (const l of B.liqs) if (!A.liqs.includes(l)) A.liqs.push(l);
    setPhases(A);
    keepLayerLook(A);
    A.unmixed = A.phase.two ? 0 : 1;      // blandbara vätskor: syns som strimmor tills man rör om
    pourDone = true;
    refreshUI();
}
// När bägaren delas i två skikt flyttas vätskan som redan finns ofta till det övre skiktet (t.ex. hexan
// när vatten hälls i). Då flyttas också skiktets utseende (färg, inklusive löst ämne), så att inget tonas ut och in igen.
function keepLayerLook(t) {
    const V = t.vis;
    if (!V || !V.L || !t.phase.two) return;
    let vU = 0, vL = 0;

function txtO(c, t, x, y, color, size) {
    c.font = `800 ${size}px system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.save(); c.translate(x, y); if (mirrorText) c.scale(-1, 1);
    c.lineWidth = 3.2; c.lineJoin = 'round'; c.strokeStyle = 'rgba(2, 6, 23, 0.92)'; c.strokeText(t, 0, 0);
    c.fillStyle = color; c.fillText(t, 0, 0);

function drawMol(c, mol, p) {
    c.save();
    c.translate(p.rx ?? p.x, p.ry ?? p.y);
    c.rotate(p.ra ?? p.angle);
    c.scale(DRAW_S, DRAW_S);
    c.strokeStyle = '#94a3b8'; c.lineWidth = 2 * MOL_S; c.lineCap = 'round';
    c.beginPath();
    for (const [i, j] of mol.bonds) { c.moveTo(mol.atoms[i].x, mol.atoms[i].y); c.lineTo(mol.atoms[j].x, mol.atoms[j].y); }
    c.stroke();
    if (mol.double) {
        const [i, j] = mol.double, a = mol.atoms[i], b = mol.atoms[j], o = 1.8 * MOL_S;
        c.beginPath(); c.moveTo(a.x - o, a.y); c.lineTo(b.x - o, b.y); c.moveTo(a.x + o, a.y); c.lineTo(b.x + o, b.y); c.stroke();
    }
    for (const a of mol.atoms) {
        const r = mol.water &amp;&amp; a.e === 'O' ? 6.8 * MOL_S : ATOM_R[a.e];
        ball(c, a.x, a.y, r, COL[a.e][0], COL[a.e][1]);
    }
    if (opts.charges) {
        const ang = p.ra ?? p.angle;
        c.rotate(-ang);
        const cs = Math.cos(ang), sn = Math.sin(ang);
        const fs = 13 * Math.max(1, MOL_S * 0.9);
        const rot = (a) => ({ x: a.x * cs - a.y * sn, y: a.x * sn + a.y * cs });
        if (mol.water) {
            // Vatten: δ− på syret och en gemensam δ+ på vätesidan
            const o = rot(mol.atoms[0]), h1 = rot(mol.atoms[1]), h2 = rot(mol.atoms[2]);
            const mx = (h1.x + h2.x) / 2, my = (h1.y + h2.y) / 2, d = Math.hypot(mx, my) || 1;
            txtO(c, 'δ−', o.x - mx / d * 4, o.y - my / d * 4, '#fecaca', fs);
            txtO(c, 'δ+', mx + mx / d * 9, my + my / d * 9, '#7dd3fc', fs);
        } else {
            for (const a of mol.atoms) {
                if (a.e !== 'O' &amp;&amp; a.e !== 'H') continue;
                let { x, y } = rot(a);
                if (a.e === 'H') { const d = Math.hypot(x, y) || 1; x += x / d * 7; y += y / d * 7; }
                txtO(c, a.e === 'O' ? 'δ−' : 'δ+', x, y, a.e === 'O' ? '#fecaca' : '#7dd3fc', fs);
            }
        }
        if (mol.double) {
            const a = mol.atoms[mol.double[0]];
            txtO(c, 'δ+', a.x * cs - a.y * sn, a.x * sn + a.y * cs + 2, '#7dd3fc', fs * 0.9);
        }
    }
    c.restore();
}

function drawSolidPart(c, p) {
    if (p.kind === 'sucrose' || p.kind === 'paraffin') { drawMol(c, SOLID_MOL[p.kind], p); return; }
    c.save();
    c.translate(p.rx ?? p.x, p.ry ?? p.y);
    c.scale(MOL_S, MOL_S);
    if (p.kind === 'na') { ball(c, 0, 0, 7.5, '#a78bfa', '#7c3aed'); txt(c, '+', 0, 0.5, '#1e1b4b', 11); }
    else if (p.kind === 'cl') { ball(c, 0, 0, 10.5, '#22c55e', '#15803d'); txt(c, '−', 0, 0, '#052e16', 13); }
    else if (p.kind === 'cu') { ball(c, 0, 0, 7.5, '#60a5fa', '#1d4ed8'); txt(c, '2+', 0, 0.5, '#0c1a3d', 8); }
    else if (p.kind === 'so4') {
        for (let k = 0; k &lt; 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4; ball(c, Math.cos(a) * 6.5, Math.sin(a) * 6.5, 4.2, '#ef4444', '#fca5a5'); }
        ball(c, 0, 0, 5.2, '#facc15', '#a16207');
        txt(c, '2−', 0, 0.5, '#422006', 6);
    } else if (p.kind === 'iodine') {
        c.rotate(p.ra ?? p.angle);
        c.strokeStyle = '#a855f7'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(-5.5, 0); c.lineTo(5.5, 0); c.stroke();
        ball(c, -5.5, 0, 6.6, '#7e22ce', '#a855f7'); ball(c, 5.5, 0, 6.6, '#7e22ce', '#a855f7');
    }
    c.restore();
}

function atomSites(p) {
    const mol = p.kind === 'liq' ? LIQ[p.liq].mol : SOLID_MOL[p.kind];
    const out = { O: [], H: [], C: [] };
    if (!mol) return out;
    const ang = p.ra ?? p.angle, c = Math.cos(ang), s = Math.sin(ang), px = p.rx ?? p.x, py = p.ry ?? p.y;
    mol.atoms.forEach((a, i) => {
        const pos = { x: px + DRAW_S * (a.x * c - a.y * s), y: py + DRAW_S * (a.x * s + a.y * c), i };
        if (out[a.e]) out[a.e].push(pos);
    });
    return out;
}
// Läget för en enskild atom (index i) i en molekyl, i ritkoordinater
function atomPos(p, i) {
    const mol = p.kind === 'liq' ? LIQ[p.liq].mol : SOLID_MOL[p.kind];
    const ang = p.ra ?? p.angle, c = Math.cos(ang), s = Math.sin(ang), a = mol.atoms[i];
    return { x: (p.rx ?? p.x) + DRAW_S * (a.x * c - a.y * s), y: (p.ry ?? p.y) + DRAW_S * (a.x * s + a.y * c) };
}

// Bindningslinjerna "lever" en stund: de tänds vid ett avstånd, släcks först vid ett något större,
// och tonas in och ut. Då blinkar de inte när molekylerna rör sig kring gränsen.
const HB_ON = 15, HB_OFF = 19, VDW_ON = 13, VDW_OFF = 16.5, ION_ON = 9, ION_OFF = 12;
function drawInteractions(c, t) {
    if (!t.bonds) t.bonds = new Map();
    const bonds = t.bonds;
    if (lensPass) { drawBonds(c, bonds, false); return; }
    const ps = t.parts.filter(p => p.kind === 'liq' || p.kind === 'sucrose' || p.kind === 'paraffin' || p.q);
    const live = new Set(ps);
    const sites = ps.map(atomSites);
    const HB = HB_ON * MOL_S, HBo = HB_OFF * MOL_S, VDW = VDW_ON * MOL_S, VDWo = VDW_OFF * MOL_S;
    const touch = (key, a, b, ia, ib, type) => {
        let e = bonds.get(key);
        if (!e) { e = { a, b, ia, ib, type, alpha: 0 }; bonds.set(key, e); }
        e.ia = ia; e.ib = ib; e.on = true;
    };
    for (const e of bonds.values()) e.on = false;
    for (let i = 0; i &lt; ps.length; i++) {
        const a = ps[i];
        for (let j = i + 1; j &lt; ps.length; j++) {
            const b = ps[j];
            if (a.state === 'solid' &amp;&amp; b.state === 'solid') continue;
            const lim = a.r + b.r + 10 * MOL_S;
            const dx = b.rx - a.rx, dy = b.ry - a.ry;
            if (dx * dx + dy * dy > lim * lim) continue;
            if (a.q || b.q) {
                if (a.q &amp;&amp; b.q) continue;
                const ion = a.q ? a : b, m = a.q ? b : a, o = a.q ? sites[j] : sites[i];
                const pts = ion.q > 0 ? o.O : o.H;
                const key = `i|${ion.id}|${m.id}`;
                const had = bonds.get(key);
                let best = null, bd = ion.r + (had ? ION_OFF : ION_ON) * MOL_S;
                for (const q of pts) { const d = Math.hypot(q.x - ion.rx, q.y - ion.ry); if (d &lt; bd) { bd = d; best = q; } }
                if (best) touch(key, ion, m, -1, best.i, 'ion');
                continue;
            }
            let hb = false;
            const capH = (a.hl ? a.cr : 0) + (b.hl ? b.cr : 0) - (ATOM_R.O + ATOM_R.H) * DRAW_S + 4 * MOL_S;
            const hOn = Math.max(HB, capH), hOff = Math.max(HBo, capH * HB_OFF / HB_ON);
            for (const [P1, P2, S1, S2] of [[a, b, sites[i], sites[j]], [b, a, sites[j], sites[i]]]) {
                for (const h of S1.H) for (const o of S2.O) {
                    const key = `h|${P1.id}|${h.i}|${P2.id}|${o.i}`;
                    const d = Math.hypot(h.x - o.x, h.y - o.y);
                    if (d &lt; hOn || (d &lt; hOff &amp;&amp; bonds.has(key) &amp;&amp; bonds.get(key).alpha > 0.05)) { touch(key, P1, P2, h.i, o.i, 'hb'); hb = true; }
                }
            }
            // van der Waals mellan kolkedjorna ritas även när molekylerna dessutom har en vätebindning,
            // så att båda bindningstyperna syns (t.ex. 1-pentanol: OH···O och kedja–kedja)
            if (sites[i].C.length &amp;&amp; sites[j].C.length) {
                const key = `v|${a.id}|${b.id}`;
                const had = bonds.get(key);
                // kolkedjor (kapslar) ligger lite längre isär, så gränsen anpassas efter deras tjocklek
                const capOn = (a.hl ? a.cr : 0) + (b.hl ? b.cr : 0) - 2 * ATOM_R.C * DRAW_S + 6 * MOL_S;
                const vOn = Math.max(VDW, capOn), vOff = Math.max(VDWo, capOn * VDW_OFF / VDW_ON);
                let bd = had &amp;&amp; had.alpha > 0.05 ? vOff : vOn, pa = -1, pb = -1;
                // behåll samma atompar så länge det håller, så att linjen inte hoppar mellan atomer
                if (had &amp;&amp; had.alpha > 0.05) {
                    const q1 = atomPos(a, had.ia), q2 = atomPos(b, had.ib);
                    const d = Math.hypot(q1.x - q2.x, q1.y - q2.y);
                    if (d &lt; vOff) { pa = had.ia; pb = had.ib; bd = -1; }
                }
                if (bd > 0) for (const p1 of sites[i].C) for (const p2 of sites[j].C) {
                    const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    if (d &lt; bd) { bd = d; pa = p1.i; pb = p2.i; }
                }
                if (pa >= 0) touch(key, a, b, pa, pb, 'vdw');
            }
        }
    }
    for (const [key, e] of bonds) if (!live.has(e.a) || !live.has(e.b)) bonds.delete(key);
    drawBonds(c, bonds, true);
}
// Tona in/ut och rita bindningslinjerna (i förstoringsglaset ritas de bara, utan att ändras)
function drawBonds(c, bonds, update) {
    const kIn = 1 - Math.pow(0.82, drawDtF), kOut = 1 - Math.pow(0.88, drawDtF);
    c.save();
    c.lineCap = 'round';
    for (const [key, e] of bonds) {
        if (update) {
            e.alpha += ((e.on ? 1 : 0) - e.alpha) * (e.on ? kIn : kOut);
            if (!e.on &amp;&amp; e.alpha &lt; 0.02) { bonds.delete(key); continue; }
        }
        const show = e.type === 'vdw' ? opts.vdw : opts.hb;
        if (!show) continue;
        const p1 = e.ia &lt; 0 ? { x: e.a.rx, y: e.a.ry } : atomPos(e.a, e.ia), p2 = atomPos(e.b, e.ib);
        // en bindning som dras isär för långt bryts direkt, så att inga långa linjer hänger kvar
        const capL = e.type === 'vdw' ? ((e.a.hl ? e.a.cr : 0) + (e.b.hl ? e.b.cr : 0)) / MOL_S * VDW_OFF / VDW_ON : 0;
        const capHL = e.type === 'hb' ? ((e.a.hl ? e.a.cr : 0) + (e.b.hl ? e.b.cr : 0)) / MOL_S * HB_OFF / HB_ON : 0;
        const maxL = (e.type === 'hb' ? Math.max(HB_OFF, capHL) : e.type === 'vdw' ? Math.max(VDW_OFF, capL) : e.a.r / MOL_S + ION_OFF + 4) * MOL_S * 1.15;
        if (Math.hypot(p1.x - p2.x, p1.y - p2.y) > maxL) { if (update) bonds.delete(key); continue; }
        if (e.type === 'hb') { c.setLineDash([3, 2]); c.strokeStyle = `rgba(125,211,252,${(0.95 * e.alpha).toFixed(3)})`; c.lineWidth = 2; }
        else if (e.type === 'ion') { c.setLineDash([3, 3]); c.strokeStyle = `rgba(244,114,182,${(0.9 * e.alpha).toFixed(3)})`; c.lineWidth = 1.8; }
        else { c.setLineDash([2, 2]); c.strokeStyle = `rgba(74,222,128,${(0.75 * e.alpha).toFixed(3)})`; c.lineWidth = 1.5; }
        c.beginPath(); c.moveTo(p1.x, p1.y); c.lineTo(p2.x, p2.y); c.stroke();
    }
    c.restore();
}

// =====================================================================
//  RITNING: BÄGARE
// =====================================================================
const ORIGIN_RGB = { B: [59, 130, 246], A: [249, 115, 22] };   // visad A blå, visad B orange
function liqRGBA(p) {
    if (opts.origin) { const o = ORIGIN_RGB[p.origin]; return [o[0], o[1], o[2], 0.55]; }
    if (p.liq === 'oil') return [234, 179, 8, 0.72];
    return [214, 232, 250, 0.22];
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) &amp; 255},${n &amp; 255},${a})`; }

function drawGlass(c, t) {
    c.save();
    c.strokeStyle = 'rgba(186, 230, 253, 0.65)'; c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-10, -8); c.quadraticCurveTo(-1, -5, 0, 4);
    c.lineTo(0, t.h - RC); c.quadraticCurveTo(0, t.h, RC, t.h);
    c.lineTo(t.w - RC, t.h); c.quadraticCurveTo(t.w, t.h, t.w, t.h - RC);
    c.lineTo(t.w, 2); c.lineTo(t.w + 4, -2);
    c.stroke();
    // Gradering (250 ml-bägare)
    c.strokeStyle = 'rgba(203, 213, 225, 0.35)'; c.lineWidth = 1.2;
    c.fillStyle = 'rgba(203, 213, 225, 0.5)'; c.font = '10px system-ui, sans-serif'; c.textAlign = mirrorText ? 'left' : 'right'; c.textBaseline = 'middle';
    for (let k = 1; k &lt;= 4; k++) {
        const y = t.h - k * t.h * 0.2;
        c.beginPath(); c.moveTo(t.w - 16, y); c.lineTo(t.w - 4, y); c.stroke();
        if (t.angle === 0) fillTextR(c, `${k * 50} ml`, t.w - 20, y);
    }
    c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 6;
    c.beginPath(); c.moveTo(10, 16); c.lineTo(10, t.h - 20); c.stroke();
    c.restore();
}
function drawRod(c, t) {
    if (t.stir &lt;= 0 || t.angle !== 0) return;
    const fade = Math.min(1, t.stir / 20);
    const xa = rodX(t, rodTop), xb = rodX(t, t.h - 14);
    c.save(); c.globalAlpha = fade; c.lineCap = 'round';
    c.strokeStyle = 'rgba(226, 232, 240, 0.35)'; c.lineWidth = 8 * MOL_S;
    c.beginPath(); c.moveTo(xa, rodTop); c.lineTo(xb, t.h - 14); c.stroke();
    c.strokeStyle = 'rgba(255, 255, 255, 0.55)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(xa - 2, rodTop); c.lineTo(xb - 2, t.h - 14); c.stroke();
    c.restore();
}

// Kristallen: bakgrundsrutor visar gittret, linjer visar jonbindningarna
function drawCrystalLattice(c, t) {
    const cr = t.crystal;
    if (!cr) return;
    const S = SOLIDS[cr.solid], sp = cr.sp;
    const ionic = cr.solid === 'nacl' || cr.solid === 'cuso4';
    c.save();
    for (const p of cr.sites) {
        if (p.state !== 'solid') continue;
        const wv = S.wide ? cr.halfW * 2 : sp, hv = sp;
        c.fillStyle = hexA(S.grain, 0.16); c.strokeStyle = hexA(S.grain === '#3b0764' ? '#a78bfa' : S.grain, 0.3); c.lineWidth = 1;
        c.beginPath(); c.roundRect(p.rx - wv / 2 + 0.5, p.ry - hv / 2 + 0.5, wv - 1, hv - 1, 3); c.fill(); c.stroke();
    }
    if (ionic) {
        c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 1.5;
        c.beginPath();
        for (const p of cr.sites) {
            if (p.state !== 'solid') continue;
            for (const o of cr.sites) {
                if (o.state !== 'solid') continue;
                if ((o.site.c === p.site.c + 1 &amp;&amp; o.site.r === p.site.r) || (o.site.r === p.site.r + 1 &amp;&amp; o.site.c === p.site.c)) { c.moveTo(p.rx, p.ry); c.lineTo(o.rx, o.ry); }
            }
        }
        c.stroke();
    }
    c.restore();
}
const MODEL_COL = { na: '#a78bfa', cl: '#4ade80', cu: '#60a5fa', so4: '#facc15' };
function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k));
    return `rgb(${f(n >> 16)},${f((n >> 8) &amp; 255)},${f(n &amp; 255)})`;
}
function sphere(c, x, y, r, hex) {
    const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, shade(hex, 0.55)); g.addColorStop(0.55, hex); g.addColorStop(1, shade(hex, -0.45));
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
}
// Översiktsvyn: kristallen ritas som en kulmodell
function drawCrystalMacro(c, t) {
    const cr = t.crystal;
    if (!cr) return;
    const S = SOLIDS[cr.solid], sp = cr.sp;
    const ionic = cr.solid === 'nacl' || cr.solid === 'cuso4';
    const rMax = ionic ? Math.max(...cr.sites.map(p => KIND_R[p.kind])) : 1;
    // I översikten ritas kristallen som ett litet korn (kulmodell i mindre skala)
    const k = MACRO_K;
    const ax = cr.x, ay = cr.y > t.h - 3 ? cr.y : cr.y - cr.hgt / 2;
    c.save(); c.translate(ax, ay); c.scale(k, k); c.translate(-ax, -ay);
    for (const p of cr.sites) {
        if (p.state !== 'solid') continue;
        if (S.wide) {
            const wv = cr.halfW * 2, hv = sp * 0.8;
            const g = c.createLinearGradient(0, p.y - hv / 2, 0, p.y + hv / 2);
            g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cbd5e1');
            c.fillStyle = g; c.beginPath(); c.roundRect(p.x - wv / 2, p.y - hv / 2, wv, hv, hv / 2); c.fill();
        } else if (ionic) {
            sphere(c, p.x, p.y, sp * 0.52 * KIND_R[p.kind] / rMax, MODEL_COL[p.kind]);
        } else if (p.kind === 'iodine') {
            const dx = Math.cos(p.angle) * sp * 0.2, dy = Math.sin(p.angle) * sp * 0.2;
            sphere(c, p.x - dx, p.y - dy, sp * 0.28, '#7e22ce'); sphere(c, p.x + dx, p.y + dy, sp * 0.28, '#7e22ce');
        } else {
            sphere(c, p.x, p.y, sp * 0.48, '#f5f5f4');
        }
    }
    c.restore();
}

function drawTubeParticle(c, t) {
    c.save();
    innerPath(c, t);
    if (t.angle === 0) { c.fillStyle = 'rgba(10, 16, 31, 0.8)'; c.fill(); }
    c.clip();
    drawCrystalLattice(c, t);
    for (const p of t.parts) {
        if (p.kind === 'liq') drawMol(c, LIQ[p.liq].mol, p);
        else drawSolidPart(c, p);
    }
    drawInteractions(c, t);
    c.restore();
}
function drawTubeMacro(c, t) {
    c.save();
    innerPath(c, t);
    if (t.angle === 0) { c.fillStyle = 'rgba(10, 16, 31, 0.55)'; c.fill(); }
    c.clip();
    if (t.angle === 0) drawMacroUpright(c, t);
    drawCrystalMacro(c, t);
    c.restore();
}

function tubeLabel(t) {
    const names = t.liqs.map(l => L(LIQ[l].name));
    for (const k of solidsIn(t)) names.push(L(SOLIDS[k].name));
    return names.length ? names.join(' + ') : tr('emptyShort');
}

// Mjuk rörelse på alla skärmar: partiklarna ritas mellan förra och nuvarande fysiksteget,
// plus en visuell förskjutning som klingar av när två grannar har bytt plats
let renderA = 1;
function prepRender() {
    const a = renderA;
    const set = (p) => {
        const px = p.px ?? p.x, py = p.py ?? p.y, pa = p.pa ?? p.angle;
        p.rx = px + (p.x - px) * a + (p.ox || 0);
        p.ry = py + (p.y - py) * a + (p.oy || 0);
        p.ra = pa + (p.angle - pa) * a;
    };
    for (const t of Object.values(tubes)) for (const p of t.parts) set(p);
    for (const p of stream) set(p);
}
function storePrev() {
    const st = (p) => { p.px = p.x; p.py = p.y; p.pa = p.angle; };
    for (const t of Object.values(tubes)) for (const p of t.parts) st(p);
    for (const p of stream) st(p);
}
// Världskoordinat → skärm (kamerans zoom och spegling)
function toScreen(x, y) {
    if (cam.z &lt; 0.999) { x = cam.ax + (x - cam.ax) * cam.z; y = cam.ay + (y - cam.ay) * cam.z; }
    return { x: MIRROR ? W - x : x, y };
}
let lensPass = false;
function drawWorld() {
    ctx.save();

const lens = { on: false, x: 0, y: 0, zoom: 2, placed: false };

    ctx.beginPath(); ctx.arc(lens.x, lens.y, R, 0, Math.PI * 2);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(226, 232, 240, 0.95)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(lens.x, lens.y, R + 4, 0, Math.PI * 2);

function icard(id, color, title, body) {

        [tr('rowDens'), `${num(l.dens.toFixed(2))} g/cm³`], [tr('rowBp'), l.bp ? `${l.bp} °C` : (sv ? 'sönderfaller innan den kokar' : 'decomposes before boiling')]
    ];

        `&lt;table>${rows.map(r => `&lt;tr>&lt;td>${r[0]}&lt;/td>&lt;td>${r[1]}&lt;/td>&lt;/tr>`).join('')}&lt;/table>${L(l.note)}`);

    let body = badge + `&lt;div>${mixText(a, b)}&lt;/div>`;

        body += `&lt;p style="margin:8px 0 0">${fill(tr('layerTxt'), { upper: L(LIQ[ph.upper].low), lower: L(LIQ[ph.lower].low), du: num(LIQ[ph.upper].dens.toFixed(2)), dl: num(LIQ[ph.lower].dens.toFixed(2)) })}&lt;/p>`;
        if (type === 'partly') body += `&lt;p style="margin:6px 0 0">${tr('partialNote')}&lt;/p>`;
    }
    return icard('mix', '#34d399', `${tr('mixTitle')} &lt;span class="muted" style="font-weight:400">(${L(LIQ[a].low)} + ${L(LIQ[b].low)})&lt;/span>`, body);

    for (const p of t.parts) if (p.state === 'dissolved') set.add(p.solid);

}

    const main = Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x])[0];
    if (t.phase.two &amp;&amp; main) extra += `&lt;p style="margin:6px 0 0">${fill(tr('solIn'), { liq: L(LIQ[main].low) })}&lt;/p>`;
    const tint = solTint(solid, main);

}
function solidResultCard(t, solid) {

    const dis = t.parts.filter(p => p.state === 'dissolved' &amp;&amp; p.solid === solid);
    const own = c ? new Set(c.sites) : new Set();
    const came = dis.filter(p => !own.has(p));                     // hälldes hit från den andra bägaren
    const other = dispId[t.id === 'A' ? 'B' : 'A'];

        note = `&lt;p style="margin:6px 0 0">${fill(tr('solLeftTxt'), { to: other })}&lt;/p>`;

        if (!settled) badge = `&lt;span class="badge b-partly">${tr('solWorking')}&lt;/span>`;
        else if (cc.solid === 0) badge = `&lt;span class="badge b-yes">${tr('solYes')}&lt;/span>`;
        else if (cc.dis > 0 &amp;&amp; cc.dis / cc.total &lt; 0.15) badge = `&lt;span class="badge b-no">${tr('solLittle')}&lt;/span>`;
        else if (cc.dis > 0) badge = `&lt;span class="badge b-partly">${tr('solPartly')}&lt;/span>`;
        else badge = `&lt;span class="badge b-no">${tr('solNo')}&lt;/span>`;

// =====================================================================
//  STORLEK, INTERAKTION, LOOP
// =====================================================================
function resize() {
    const dpr = window.devicePixelRatio || 1;
    const box = canvas.parentElement.getBoundingClientRect();
    const nw = Math.floor(box.width), nh = Math.floor(box.height);
    const changed = Math.abs(nw - W) > 1 || Math.abs(nh - H) > 1;
    W = nw; H = nh;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (changed &amp;&amp; !tubes.B.pour) {
        const oldW = tubes.A.w, oldH = tubes.A.h;
        layout();
        if (!started) return;
        // Behåll innehållet om bägarna får ny storlek
        const sx = tubes.A.w / oldW, sy = tubes.A.h / oldH, nh = tubes.A.h;
        if (Math.abs(sx - 1) > 0.01 || Math.abs(sy - 1) > 0.01) {
            for (const t of Object.values(tubes)) {
                for (const p of t.parts) { p.x *= sx; p.y = nh - (oldH - p.y) * sy; p.area *= sx * sy; p.px = p.x; p.py = p.y; }
                if (t.crystal) { t.crystal.x *= sx; t.crystal.y = nh - (oldH - t.crystal.y) * sy; t.crystal.vy = 0; t.crystal.siteA *= sx * sy; }
                if (t.vis) for (const k of ['L', 'U']) if (t.vis[k]) t.vis[k].v *= sx * sy;
            }
        }
    }
}
function setupInteractions() {
    const pos = (e) => { const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: p.clientX - r.left, y: p.clientY - r.top }; };
    const moveLens = (q) => { lens.x = q.x; lens.y = q.y; lens.placed = true; };
    canvas.addEventListener('mousedown', (e) => { mouse.down = true; Object.assign(mouse, pos(e)); if (lens.on) moveLens(mouse); });
    canvas.addEventListener('mousemove', (e) => { if (lens.on) moveLens(pos(e)); });
    window.addEventListener('mousemove', (e) => { if (mouse.down) Object.assign(mouse, pos(e)); });
    window.addEventListener('mouseup', () => { mouse.down = false; });
    canvas.addEventListener('touchstart', (e) => { mouse.down = true; Object.assign(mouse, pos(e)); if (lens.on) moveLens(mouse); }, { passive: true });
    canvas.addEventListener('touchmove', (e) => { Object.assign(mouse, pos(e)); if (lens.on) moveLens(mouse); }, { passive: true });
    canvas.addEventListener('touchend', () => { mouse.down = false; });
    window.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'select' || tag === 'input' &amp;&amp; e.target.type === 'text') return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key.toLowerCase() === 'p') togglePause();
        if (e.key.toLowerCase() === 'l') toggleLens();
    });
    document.querySelectorAll('#zoomset .zoom').forEach(btn => btn.addEventListener('click', () => {
        lens.zoom = parseFloat(btn.dataset.zoom);
        document.querySelectorAll('#zoomset .zoom').forEach(b => b.classList.toggle('active', b === btn));
    }));
    document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
}
const STEP_MS = 1000 / 60;
let lastTime = null, accT = 0;
function loop(now) {
    if (lastTime === null) lastTime = now;
    const dtMs = Math.min(100, now - lastTime);
    accT += dtMs; lastTime = now;
    if (paused) accT = 0;
    let steps = 0;
    while (accT >= STEP_MS &amp;&amp; steps &lt; 3) { physicsStep(); accT -= STEP_MS; steps++; }
    if (steps === 3) accT = 0;
    renderA = paused ? 1 : Math.min(1, accT / STEP_MS);
    drawDtF = Math.min(4, dtMs / STEP_MS);
    drawScene();
    if (frame % 15 === 0) drawerTick();
    requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('simCanvas');
    ctx = canvas.getContext('2d');
    lang = initialLang();
    setupInteractions();
    applyLang();
    resize();
    resetAll();
    started = true;
    new ResizeObserver(resize).observe(canvas.parentElement);
    requestAnimationFrame(loop);
});

&lt;script>
// =====================================================================
//  ÄMNENS EGENSKAPER – gemensam ämnesdata
//  En källa för alla delar: ramens ämnesbibliotek och ämneskort,
//  och (i den sammanslagna filen) smält-/kokpunkter och densiteter i delarna.
//
//  Fält:

&lt;script>
// =====================================================================
//  BRYGGA mellan en befintlig simulering och ramen "Ämnens egenskaper"
//  Läggs in sist i delen av bygg.py, tillsammans med amnen.js och window.DEL_ID.
//  Gör ingenting när simuleringen körs som egen sida.
//
//  Ramen -> delen:  { to:'del', type:'lang', lang }
//                   { to:'del', type:'select', id, slot }   (slot = 'A' | 'B' i Blanda och lös)
//                   { to:'del', type:'active', on }          (pausa när fliken inte syns)
//  Delen -> ramen:  { from:'del', del, type:'ready', id }
//                   { from:'del', del, type:'chose', id }    (användaren valde ett ämne i delen)
// =====================================================================
(function () {
    if (window.parent === window) return;
    const DEL = window.DEL_ID;
    const AM = window.AMNEN;
    document.documentElement.classList.add('embedded');
    const css = document.createElement('style');
    // Ramen visar titel och språkval, så delens egna döljs
    css.textContent = '.embedded .topbar .title, .embedded .lang, .embedded .theory-link { display: none !important; }';
    document.head.appendChild(css);

    const post = (m) => parent.postMessage(Object.assign({ from: 'del', del: DEL }, m), '*');
    const canon = (id) => (AM &amp;&amp; id ? AM.fran(DEL, id) : null);

    // ---- 1. Gemensam ämnesdata: smält-/kokpunkter och densiteter hämtas från amnen.js ----
    if (AM) {
        for (const k in AM.lista) {
            const a = AM.lista[k], id = a.in[DEL];
            if (!id) continue;
            if (DEL === 'varm' &amp;&amp; typeof SUBSTANCES !== 'undefined' &amp;&amp; SUBSTANCES[id] &amp;&amp; id !== 'co2') {
                SUBSTANCES[id].mp = a.mp; SUBSTANCES[id].bp = a.bp;
            }
            if (DEL === 'blanda' &amp;&amp; typeof LIQ !== 'undefined' &amp;&amp; LIQ[id]) {
                LIQ[id].dens = a.dens; LIQ[id].bp = a.bp;
            }
            if (DEL === 'blanda' &amp;&amp; typeof SOLIDS !== 'undefined' &amp;&amp; SOLIDS[id]) SOLIDS[id].dens = a.dens;
        }
    }

    // ---- 2. Rapportera när användaren väljer ett ämne i delen ----
    // sant när ramen själv byter ämne (då rapporteras det inte tillbaka), och under starten,
    // så att delens startämne inte skriver över ett ämne som ramen har valt (t.ex. från en direktlänk)
    let quiet = true;
    if (DEL === 'varm') {
        const orig = window.setSubstance;
        window.setSubstance = function (k) { orig(k); if (!quiet) post({ type: 'chose', id: canon(k) }); };
    }
    if (DEL === 'blanda') {
        const origL = window.selectLiquid, origS = window.pickSolid;
        window.selectLiquid = function (id, val) { origL(id, val); if (!quiet &amp;&amp; val) post({ type: 'chose', id: canon(val) }); };
        window.pickSolid = function (k) { origS(k); if (!quiet) post({ type: 'chose', id: canon(k) }); };
    }

    // ---- 3. Meddelanden från ramen ----
    let pausedByFrame = false;
    function setActive(on) {
        if (typeof togglePause !== 'function') return;
        if (!on &amp;&amp; !paused) { togglePause(); pausedByFrame = true; }
        else if (on &amp;&amp; pausedByFrame) { if (paused) togglePause(); pausedByFrame = false; }
    }
    function select(m) {
        const a = AM &amp;&amp; AM.lista[m.id];
        if (!a || !a.in[DEL]) return;
        const id = a.in[DEL];
        quiet = true;
        try {
            if (DEL === 'varm') window.setSubstance(id);
            else if (DEL === 'blanda') {
                const internal = m.slot === 'B' ? 'A' : 'B';      // visad A = intern 'B' (den som hälls)
                if (a.in.solid) {
                    setTab('solids'); window.pickSolid(id); setTarget(internal); addSolid();
                } else {
                    setTab('liquids');
                    const s = document.getElementById('sel-' + internal);
                    if (s) s.value = id;
                    window.selectLiquid(internal, id);
                }
            }
        } finally { quiet = false; }
    }
    window.addEventListener('message', (e) => {
        const m = e.data || {};
        if (m.to !== 'del') return;
        if (m.type === 'lang' &amp;&amp; typeof applyLang === 'function') applyLang(m.lang);
        else if (m.type === 'select') select(m);
        else if (m.type === 'active') setActive(!!m.on);
    });

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            let id = null;
            if (DEL === 'varm' &amp;&amp; typeof cur !== 'undefined') id = canon(cur.id);
            if (DEL === 'blanda' &amp;&amp; typeof sel !== 'undefined') id = canon(sel.B);
            quiet = false;
            post({ type: 'ready', id });
        }, 0);
    });
})();
&lt;/script>

                    note: n('Tre OH-grupper. Trögflytande. Kokar först vid 290 °C, så den ryms inte i Värm och kyl.', 'Three OH groups. Viscous. Only boils at 290 °C, so it does not fit in Heat and cool.'),
                    in: { blanda: 'glycerol' } },
        ammonia:  { name: n('Ammoniak', 'Ammonia'), low: n('ammoniak', 'ammonia'), formula: 'NH₃', M: 17.03, mp: -78, bp: -33, dens: null, bond: 'hb', family: 'annat', pol: POL.p,
                    note: n('Bildar vätebindningar (N–H···N), men svagare än vattnets.', 'Forms hydrogen bonds (N–H···N), but weaker than those in water.'),
                    in: {} },
        // ---- dipol–dipol ----
        hcl:      { name: n('Väteklorid', 'Hydrogen chloride'), low: n('väteklorid', 'hydrogen chloride'), formula: 'HCl', M: 36.46, mp: -114.2, bp: -85.1, dens: null, bond: 'dd', family: 'annat', pol: POL.p,
                    note: n('Permanent dipol. Gas vid rumstemperatur.', 'Permanent dipole. A gas at room temperature.'),
                    in: { varm: 'hcl' } },
        acetone:  { name: n('Aceton', 'Acetone'), low: n('aceton', 'acetone'), formula: 'CH₃COCH₃', M: 58.08, mp: -95, bp: 56, dens: 0.78, bond: 'dd', family: 'annat', pol: POL.p,
                    note: n('Polär C=O-grupp men ingen O–H. Bra lösningsmedel.', 'Polar C=O group but no O–H. A good solvent.'),
                    in: { varm: 'acetone', blanda: 'acetone' } },
        h2s:      { name: n('Vätesulfid', 'Hydrogen sulfide'), low: n('vätesulfid', 'hydrogen sulfide'), formula: 'H₂S', M: 34.08, mp: -86, bp: -60, dens: null, bond: 'dd', family: 'annat', pol: POL.wp,
                    note: n('Byggd som vatten men utan vätebindningar. Jämför kokpunkterna!', 'Shaped like water but without hydrogen bonds. Compare the boiling points!'),
                    in: {} },
        // ---- van der Waals ----
        co2:      { name: n('Koldioxid', 'Carbon dioxide'), low: n('koldioxid', 'carbon dioxide'), formula: 'CO₂', M: 44.01, mp: -78.5, bp: -78.5, subl: true, dens: null, bond: 'vdw', family: 'annat', pol: POL.np,
                    note: n('Linjär och opolär. Sublimerar vid 1 atm (torris).', 'Linear and non-polar. Sublimes at 1 atm (dry ice).'),
                    in: { varm: 'co2' } },
        methane:  { name: n('Metan', 'Methane'), low: n('metan', 'methane'), formula: 'CH₄', M: 16.04, mp: -182, bp: -162, dens: null, bond: 'vdw', family: 'alkan', nC: 1, pol: POL.np,
                    note: n('Den minsta alkanen. Huvuddelen av naturgas och biogas.', 'The smallest alkane. The main part of natural gas and biogas.'),
                    in: {} },
        ethane:   { name: n('Etan', 'Ethane'), low: n('etan', 'ethane'), formula: 'C₂H₆', M: 30.07, mp: -183, bp: -89, dens: null, bond: 'vdw', family: 'alkan', nC: 2, pol: POL.np,
                    note: n('Alkan med två kol.', 'Alkane with two carbons.'), in: {} },
        propane:  { name: n('Propan', 'Propane'), low: n('propan', 'propane'), formula: 'C₃H₈', M: 44.10, mp: -188, bp: -42, dens: null, bond: 'vdw', family: 'alkan', nC: 3, pol: POL.np,
                    note: n('Gasol. Alkan med tre kol.', 'Bottled gas. Alkane with three carbons.'), in: {} },
        butane:   { name: n('Butan', 'Butane'), low: n('butan', 'butane'), formula: 'C₄H₁₀', M: 58.12, mp: -138, bp: -0.5, dens: null, bond: 'vdw', family: 'alkan', nC: 4, pol: POL.np,
                    note: n('Tändargas. Alkan med fyra kol.', 'Lighter gas. Alkane with four carbons.'), in: {} },
        pentane:  { name: n('Pentan', 'Pentane'), low: n('pentan', 'pentane'), formula: 'C₅H₁₂', M: 72.15, mp: -130, bp: 36, dens: 0.63, bond: 'vdw', family: 'alkan', nC: 5, pol: POL.np,
                    note: n('Alkan med fem kol. Kokar redan vid 36 °C.', 'Alkane with five carbons. Boils at only 36 °C.'),
                    in: { varm: 'pentane', blanda: 'pentane' } },
        hexane:   { name: n('Hexan', 'Hexane'), low: n('hexan', 'hexane'), formula: 'C₆H₁₄', M: 86.18, mp: -95, bp: 69, dens: 0.66, bond: 'vdw', family: 'alkan', nC: 6, pol: POL.np,
                    note: n('Alkan med sex kol. Vanligt lösningsmedel.', 'Alkane with six carbons. A common solvent.'),
                    in: { varm: 'hexane', blanda: 'hexane' } },
        heptane:  { name: n('Heptan', 'Heptane'), low: n('heptan', 'heptane'), formula: 'C₇H₁₆', M: 100.2, mp: -91, bp: 98, dens: 0.68, bond: 'vdw', family: 'alkan', nC: 7, pol: POL.np,
                    note: n('Alkan med sju kol.', 'Alkane with seven carbons.'),
                    in: { varm: 'heptane', blanda: 'heptane' } },
        octane:   { name: n('Oktan', 'Octane'), low: n('oktan', 'octane'), formula: 'C₈H₁₈', M: 114.2, mp: -57, bp: 126, dens: 0.70, bond: 'vdw', family: 'alkan', nC: 8, pol: POL.np,
                    note: n('Alkan med åtta kol. Finns i bensin.', 'Alkane with eight carbons. Found in petrol.'),
                    in: { varm: 'octane', blanda: 'octane' } },
        oil:      { name: n('Matolja', 'Cooking oil'), low: n('matolja', 'cooking oil'), formula: n('triglycerider', 'triglycerides'), M: 880, mp: null, bp: null, dens: 0.92, bond: 'vdw', family: 'annat', pol: POL.np,
                    note: n('Stora, nästan opolära molekyler. Sönderfaller innan den kokar.', 'Large, almost non-polar molecules. Decomposes before boiling.'),
                    in: { blanda: 'oil' } },
        // ---- fasta ämnen (Blanda och lös) ----
        nacl:     { name: n('Natriumklorid', 'Sodium chloride'), low: n('natriumklorid', 'sodium chloride'), formula: 'NaCl', M: 58.44, mp: 801, bp: 1465, dens: 2.16, bond: 'jon', family: 'fast', pol: POL.ion,
                    note: n('Koksalt. Jonbindningar mellan Na⁺ och Cl⁻.', 'Table salt. Ionic bonds between Na⁺ and Cl⁻.'), in: { blanda: 'nacl', solid: true } },
        cuso4:    { name: n('Kopparsulfat', 'Copper sulfate'), low: n('kopparsulfat', 'copper sulfate'), formula: 'CuSO₄', M: 159.6, mp: null, bp: null, dens: 2.28, bond: 'jon', family: 'fast', pol: POL.ion,
                    note: n('Jonförening. Ger blå lösning i vatten.', 'Ionic compound. Gives a blue solution in water.'), in: { blanda: 'cuso4', solid: true } },
        sugar:    { name: n('Socker (sackaros)', 'Sugar (sucrose)'), low: n('socker', 'sugar'), formula: 'C₁₂H₂₂O₁₁', M: 342.3, mp: 186, bp: null, dens: 1.59, bond: 'hb', family: 'fast', pol: POL.vp,
                    note: n('Stor polär molekyl med åtta OH-grupper. Sönderfaller när den smälter.', 'Large polar molecule with eight OH groups. Decomposes as it melts.'), in: { blanda: 'sugar', solid: true } },
        iodine:   { name: n('Jod', 'Iodine'), low: n('jod', 'iodine'), formula: 'I₂', M: 253.8, mp: 114, bp: 184, dens: 4.93, bond: 'vdw', family: 'fast', pol: POL.np,
                    note: n('Opolär. Violett i opolära lösningsmedel.', 'Non-polar. Violet in non-polar solvents.'), in: { blanda: 'iodine', solid: true } },
        paraffin: { name: n('Paraffin (stearinljus)', 'Paraffin wax (candle)'), low: n('paraffin', 'paraffin'), formula: 'CₙH₂ₙ₊₂', M: 350, mp: 55, bp: null, dens: 0.90, bond: 'vdw', family: 'fast', pol: POL.np,
                    note: n('Långa alkankedjor (ca 20–30 kol). Smälter vid ca 50–60 °C.', 'Long alkane chains (about 20–30 carbons). Melts at about 50–60 °C.'), in: { blanda: 'paraffin', solid: true } }
    };
    // Alla bindningstyper som har betydelse för ämnet, den starkaste först (= fältet bond).
    // Alkoholerna har både vätebindningar (OH-gruppen) och van der Waals-bindningar (kolkedjan).
    // Vatten och ammoniak har också van der Waals-bindningar, men de är små jämfört med vätebindningarna.
    const FLERA = {
        methanol: ['hb', 'vdw'], ethanol: ['hb', 'vdw'], propanol: ['hb', 'vdw'], butanol: ['hb', 'vdw'], pentanol: ['hb', 'vdw'],
        glycerol: ['hb', 'vdw'], sugar: ['hb', 'vdw'],
        hcl: ['dd', 'vdw'], acetone: ['dd', 'vdw'], h2s: ['dd', 'vdw']
    };
    for (const k in A) A[k].bonds = FLERA[k] || [A[k].bond];

    window.AMNEN = {
        lista: A,
        // korta namn på bindningstyperna (för etiketter)
        typ: {
            hb: n('vätebindningar', 'hydrogen bonds'), dd: n('dipol–dipol', 'dipole–dipole'),
            vdw: n('van der Waals', 'van der Waals'), jon: n('jonbindningar', 'ionic bonds')
        },
        grupper: [
            { id: 'hb', name: n('Vätebindningar', 'Hydrogen bonds'), col: '#38bdf8' },
            { id: 'dd', name: n('Dipol–dipol', 'Dipole–dipole'), col: '#fbbf24' },
            { id: 'vdw', name: n('van der Waals', 'van der Waals'), col: '#34d399' },
            { id: 'jon', name: n('Jonbindningar', 'Ionic bonds'), col: '#f472b6' }
        ],
        // Ämnesbibliotekets grupper. De följer ämnesklass, inte bindningstyp, så att eleverna själva
        // får upptäcka bindningarna i animeringen.
        familjer: [
            { id: 'annat', name: n('Vatten och andra ämnen', 'Water and other substances') },
            { id: 'alkohol', name: n('Alkoholer', 'Alcohols') },
            { id: 'alkan', name: n('Alkaner', 'Alkanes') },
            { id: 'fast', name: n('Fasta ämnen', 'Solids') }
        ],
        bindning: {
            hb: n('vätebindningar (och van der Waals)', 'hydrogen bonds (and van der Waals)'),
            dd: n('dipol–dipolbindningar (och van der Waals)', 'dipole–dipole forces (and van der Waals)'),
            vdw: n('van der Waals-bindningar', 'van der Waals forces'),
            jon: n('jonbindningar', 'ionic bonds')
        },
        delar: {
            varm: { name: n('Värm och kyl', 'Heat and cool'), icon: '🌡️' },
            blanda: { name: n('Blanda och lös', 'Mix and dissolve'), icon: '🧪' }
        },
        // Sök upp ämnet som har ett visst namn i en viss del (t.ex. 'h2o' i Värm och kyl)
        fran(del, id) {
            for (const k in A) if (A[k].in[del] === id) return k;
            return null;
        }
    };
})();
</script>
<script>
// =====================================================================
//  RAMEN "ÄMNENS EGENSKAPER"
//  Varje del körs i en egen iframe (byggs in av bygg.py), så delarnas kod inte krockar.
//  Ramen och delarna pratar med postMessage (se bro.js).
// =====================================================================
const I18N = {
    sv: {
        title: 'Ämnens egenskaper', subtitle: 'Från bindningar mellan partiklarna till ämnets egenskaper',
        lib: '☰ Ämnen', libTitle: 'Ämnesbibliotek',
        rowFormula: 'Formel', rowM: 'Molmassa', rowMp: 'Smältpunkt', rowBp: 'Kokpunkt', rowDens: 'Densitet (20 °C)', rowPol: 'Polaritet',
        gas: 'gas vid 20 °C', decomp: 'sönderfaller', subl: 'sublimerar',
        openIn: 'Öppna i', putA: 'Bägare A', putB: 'Bägare B', addA: 'Tillsätt i A', addB: 'Tillsätt i B',
        pickHint: 'Välj ett ämne i listan för att se dess egenskaper. Prickarna visar i vilka delar ämnet finns.',
        notHere: 'Finns inte i {del}.', noBuild: 'Delarna saknas. Bygg ramen med bygg.py.',
        legend: 'Prickar: Värm och kyl · Blanda och lös'
    },
    en: {
        title: 'Properties of substances', subtitle: 'From the forces between particles to the properties of substances',
        lib: '☰ Substances', libTitle: 'Substance library',
        rowFormula: 'Formula', rowM: 'Molar mass', rowMp: 'Melting point', rowBp: 'Boiling point', rowDens: 'Density (20 °C)', rowPol: 'Polarity',
        gas: 'gas at 20 °C', decomp: 'decomposes', subl: 'sublimes',
        openIn: 'Open in', putA: 'Beaker A', putB: 'Beaker B', addA: 'Add to A', addB: 'Add to B',
        pickHint: 'Choose a substance in the list to see its properties. The dots show which parts the substance appears in.',
        notHere: 'Not available in {del}.', noBuild: 'The parts are missing. Build the frame with bygg.py.',
        legend: 'Dots: Heat and cool · Mix and dissolve'
    }
};
let lang = 'sv';
const tr = (k) => (I18N[lang][k] ?? I18N.sv[k] ?? k);
const L = (o) => (o && typeof o === 'object' ? (o[lang] ?? o.sv) : o);
const fmt = (v, d = 0) => (v < 0 ? '−' : '') + (lang === 'sv' ? Math.abs(v).toFixed(d).replace('.', ',') : Math.abs(v).toFixed(d));

const AM = window.AMNEN;
const DELAR = ['varm', 'blanda'];
const iNagonDel = (k) => DELAR.some(d => AM.lista[k].in[d]);   // ämnen som inte finns i någon del visas inte
const frames = {}, ready = {}, queue = {};
let active = null, current = null, libOpen = true;

// ---------- delarna (iframes) ----------
function frameFor(del) {
    if (frames[del]) return frames[del];
    const tpl = document.getElementById('tpl-' + del);
    if (!tpl) { showMsg(tr('noBuild')); return null; }
    const f = document.createElement('iframe');
    f.title = L(AM.delar[del].name);
    f.setAttribute('allow', 'fullscreen');
    f.srcdoc = tpl.value;
    document.getElementById('stage').appendChild(f);
    frames[del] = f; queue[del] = [];
    return f;
}
function send(del, msg) {
    const m = Object.assign({ to: 'del' }, msg);
    if (!ready[del]) { (queue[del] = queue[del] || []).push(m); return; }
    frames[del].contentWindow.postMessage(m, '*');
}
function showMsg(t) { const el = document.getElementById('msg'); el.textContent = t; el.classList.remove('hidden'); }

function setDel(del, push = true) {
    if (!DELAR.includes(del)) del = 'varm';
    if (active === del) return;
    if (active && frames[active]) { frames[active].classList.add('hidden'); send(active, { type: 'active', on: false }); }
    active = del;
    const f = frameFor(del);
    if (f) { f.classList.remove('hidden'); send(del, { type: 'active', on: true }); }
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.del === del));
    // valt ämne följer med till delen om det finns där
    if (current && AM.lista[current].in[del] && del !== 'blanda') send(del, { type: 'select', id: current });
    if (push) updateUrl();
    renderList(); renderCard();
}

window.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.from !== 'del' || !DELAR.includes(m.del)) return;
    if (m.type === 'ready') {
        ready[m.del] = true;
        frames[m.del].contentWindow.postMessage({ to: 'del', type: 'lang', lang }, '*');
        for (const q of queue[m.del] || []) frames[m.del].contentWindow.postMessage(q, '*');
        queue[m.del] = [];
        if (m.del !== active) frames[m.del].contentWindow.postMessage({ to: 'del', type: 'active', on: false }, '*');
        if (m.id && !current) setCurrent(m.id, false);
    } else if (m.type === 'chose' && m.id && AM.lista[m.id]) {
        setCurrent(m.id, false);
    }
});

// ---------- ämnesbibliotek och ämneskort ----------
function setCurrent(id, toPart) {
    current = id;
    renderList(); renderCard();
    if (toPart && active && AM.lista[id].in[active] && active !== 'blanda') send(active, { type: 'select', id });
    updateUrl();
}
function renderTabs() {
    document.getElementById('tabs').innerHTML = DELAR.map(d =>
        `<button class="tab${d === active ? ' active' : ''}" data-del="${d}" role="tab" onclick="setDel('${d}')">${AM.delar[d].icon} ${L(AM.delar[d].name)}</button>`).join('');
}
function renderList() {
    // Grupperat efter ämnesklass. Bindningstyperna visas inte i listan: eleverna ska se dem i animeringen.
    const groups = AM.familjer.map(g => {
        const ids = Object.keys(AM.lista).filter(k => AM.lista[k].family === g.id && iNagonDel(k));
        if (!ids.length) return '';
        return `<div class="grp"><h4>${L(g.name)}</h4>` + ids.map(k => {
            const a = AM.lista[k], na = active && !a.in[active];
            const dots = DELAR.map(d => `<b class="${a.in[d] ? 'y' : ''}"></b>`).join('');
            return `<button class="item${k === current ? ' sel' : ''}${na ? ' na' : ''}" onclick="setCurrent('${k}', true)">
                <span>${L(a.name)} <small>${L(a.formula)}</small></span><span class="dots" title="${tr('legend')}">${dots}</span></button>`;
        }).join('') + '</div>';
    }).join('');
    document.getElementById('list').innerHTML = `<div class="hint">${tr('legend')}</div>` + groups;
}
function val(a, key) {
    const v = a[key];
    if (key === 'dens') return v == null ? tr('gas') : `${fmt(v, 2)} g/cm³`;
    if (v == null) return tr('decomp');
    return `${fmt(v, Number.isInteger(v) ? 0 : 1)} °C${a.subl ? ` (${tr('subl')})` : ''}`;
}
function renderCard() {
    const el = document.getElementById('card');
    const a = current && AM.lista[current];
    if (!a) { el.innerHTML = `<div class="acard"><div class="hint">${tr('pickHint')}</div></div>`; return; }
    const col = (b) => AM.grupper.find(x => x.id === b).col;
    const badges = a.bonds.map(b => `<span class="badge" style="color:${col(b)};border-color:${col(b)}">${L(AM.typ[b])}</span>`)
        .join(' <span class="hint">+</span> ');
    let acts = '';
    for (const d of DELAR) {
        if (!a.in[d]) continue;
        if (d === 'blanda') {
            const solid = !!a.in.solid;
            acts += `<button class="btn${active === d ? ' here' : ''}" onclick="toBlanda('A')">${AM.delar[d].icon} ${tr(solid ? 'addA' : 'putA')}</button>`;
            acts += `<button class="btn${active === d ? ' here' : ''}" onclick="toBlanda('B')">${AM.delar[d].icon} ${tr(solid ? 'addB' : 'putB')}</button>`;
        } else if (d !== active) {
            acts += `<button class="btn" onclick="setDel('${d}')">${AM.delar[d].icon} ${L(AM.delar[d].name)}</button>`;
        }
    }
    const missing = active && !a.in[active] ? `<div class="hint" style="margin-top:6px">${tr('notHere').replace('{del}', L(AM.delar[active].name))}</div>` : '';
    el.innerHTML = `<div class="acard">
        <h3>${L(a.name)}</h3>
        <div class="f">${L(a.formula)} · ${L(a.pol)}</div>
        <div>${badges}</div>
        <table>
            <tr><td>${tr('rowM')}</td><td>${fmt(a.M, a.M < 200 ? 1 : 0)} g/mol</td></tr>
            <tr><td>${tr('rowMp')}</td><td>${val(a, 'mp')}</td></tr>
            <tr><td>${tr('rowBp')}</td><td>${val(a, 'bp')}</td></tr>
            <tr><td>${tr('rowDens')}</td><td>${val(a, 'dens')}</td></tr>
        </table>
        <div>${L(a.note)}</div>${missing}
        ${acts ? `<div class="acts">${acts}</div>` : ''}
    </div>`;
}
function toBlanda(slot) {
    setDel('blanda');
    send('blanda', { type: 'select', id: current, slot });
}
function toggleLib() {
    libOpen = !libOpen;
    document.getElementById('lib').classList.toggle('hidden', !libOpen);
    document.getElementById('body').classList.toggle('no-lib', !libOpen);
    document.getElementById('btn-lib').classList.toggle('on', libOpen);
}

// ---------- språk och adress ----------
function applyLang(newLang) {
    if (newLang) lang = I18N[newLang] ? newLang : 'sv';
    try { localStorage.setItem('amnens-egenskaper-lang', lang); } catch (e) { /* ignoreras */ }
    document.documentElement.lang = lang;
    document.title = tr('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    for (const d of DELAR) if (frames[d]) send(d, { type: 'lang', lang });
    renderTabs(); renderList(); renderCard();
}
function updateUrl() {
    try {
        const q = new URLSearchParams(location.search);
        q.set('del', active);
        if (current) q.set('amne', current); else q.delete('amne');
        q.delete('a'); q.delete('b');
        history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
    } catch (e) { /* t.ex. inbäddad utan egen adress */ }
}

window.addEventListener('DOMContentLoaded', () => {
    const q = new URLSearchParams(location.search);
    lang = I18N[q.get('lang')] ? q.get('lang') : (() => { try { return localStorage.getItem('amnens-egenskaper-lang') || 'sv'; } catch (e) { return 'sv'; } })();
    if (!I18N[lang]) lang = 'sv';
    document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
    if (window.innerWidth < 900) toggleLib();
    // Direktlänkar: ?del=varm|blanda  &amne=etanol  (Blanda och lös: &a=vatten&b=hexan)
    const amne = q.get('amne'), a = q.get('a'), b = q.get('b');
    if (amne && AM.lista[amne] && iNagonDel(amne)) current = amne;
    applyLang();
    setDel(q.get('del') || 'varm', false);
    if (active === 'blanda') {
        if (a && AM.lista[a] && AM.lista[a].in.blanda) send('blanda', { type: 'select', id: a, slot: 'A' });
        if (b && AM.lista[b] && AM.lista[b].in.blanda) send('blanda', { type: 'select', id: b, slot: 'B' });
        if (!current && (a || b)) current = AM.lista[a] ? a : AM.lista[b] ? b : null;
    }
    renderList(); renderCard();
});
</script>
</body>
