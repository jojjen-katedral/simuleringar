            explanation: () => lang === 'en' ? [
                card('#22d3ee', 'Bent dipole (104.5°)',
                    'Oxygen has two lone pairs and pulls the electrons in the O–H bonds towards itself. Oxygen gets &amp;delta;⁻ and the hydrogen atoms get &amp;delta;⁺.'),
                card('#22d3ee', 'Hydrogen bond',
                    'A hydrogen bond forms between a &lt;strong>hydrogen atom (&amp;delta;⁺) in one molecule&lt;/strong> and a &lt;strong>lone pair on the oxygen in another molecule&lt;/strong>. It is the strongest of the three types of force shown here. That is why water has the highest melting and boiling points, even though its molecule is the lightest.'),
                card('#22d3ee', 'Ice is less dense than water',
                    'In ice, each molecule bonds to just a few neighbours in an open, hexagonal network with empty spaces. Ice therefore has a &lt;strong>lower density&lt;/strong> than liquid water and floats. (The difference is exaggerated in the simulation. In reality it is about 9 %.)')
            ].join('') : [
                card('#22d3ee', 'Vinklad dipol (104,5°)',
                    'Syret har två fria elektronpar och drar åt sig elektronerna i O–H-bindningarna. Syret får &amp;delta;⁻ och väteatomerna &amp;delta;⁺.'),
                card('#22d3ee', 'Vätebindning',
                    'En vätebindning bildas mellan en &lt;strong>väteatom (&amp;delta;⁺) i en molekyl&lt;/strong> och ett &lt;strong>fritt elektronpar på syret i en annan molekyl&lt;/strong>. Den är den starkaste av de tre bindningstyperna här. Därför har vatten högst smält- och kokpunkt, trots att molekylen är lättast.'),
                card('#22d3ee', 'Is är glesare än vatten',
                    'I is binder varje molekyl till några få grannar i ett öppet, sexkantigt nätverk med hålrum. Is har därför &lt;strong>lägre densitet&lt;/strong> än flytande vatten och flyter. (I simuleringen är skillnaden överdriven. I verkligheten är den ca 9 %.)')
            ].join('')
        }
    };

    // ---- Fler ämnen: alkoholer, aceton och alkaner ----
    // Molekylerna byggs av en mall (atomer i molekylens eget koordinatsystem) och skalas så att
    // de ryms i sin kollisionscirkel. Väteatomer på kol ritas inte (som i Lika löser lika).
    const TPL_R = { C: 4.2, O: 4.8, H: 2.8 };
    function mkTpl(atoms, bonds, opt, r) {
        let mx = 0, my = 0;
        for (const a of atoms) { mx += a.x; my += a.y; }
        mx /= atoms.length; my /= atoms.length;
        let R0 = 0;
        for (const a of atoms) R0 = Math.max(R0, Math.hypot(a.x - mx, a.y - my) + TPL_R[a.e]);
        const s = Math.min(1.15, (r - 1) / R0);
        return Object.assign({
            s, bonds,
            atoms: atoms.map(a => ({ x: (a.x - mx) * s, y: (a.y - my) * s, e: a.e, rr: TPL_R[a.e] * Math.max(0.72, s) }))
        }, opt);
    }
    function chainAtoms(n) {
        const atoms = [], bonds = [];
        for (let i = 0; i &lt; n; i++) { atoms.push({ x: i * 6.5, y: i % 2 ? -2.8 : 2.8, e: 'C' }); if (i) bonds.push([i - 1, i]); }
        return { atoms, bonds };
    }
    // fam: 'alc' (alkohol), 'alk' (alkan), 'ket' (aceton)
    function genSub(id, fam, nC, formula, M, mp, bp, Hfus, Hvap) {
        let atoms, bonds, opt = {}, heavy;
        if (fam === 'ket') {
            atoms = [{ x: 0, y: 0, e: 'C' }, { x: 0, y: -7.5, e: 'O' }, { x: -6.2, y: 3.6, e: 'C' }, { x: 6.2, y: 3.6, e: 'C' }];
            bonds = [[0, 2], [0, 3]]; opt = { dbl: [0, 1], donor: 0, base: 1, acc: 1 }; heavy = 4;
        } else {
            ({ atoms, bonds } = chainAtoms(nC));
            heavy = nC;
            if (fam === 'alc') {
                const oy = nC % 2 ? -2.8 : 2.8;
                atoms.push({ x: nC * 6.5, y: oy, e: 'O' }); bonds.push([nC - 1, nC]);
                atoms.push({ x: nC * 6.5 + 4, y: oy + (oy > 0 ? 3.6 : -3.6), e: 'H' }); bonds.push([nC, nC + 1]);
                opt = { donor: nC + 1, base: nC, acc: nC };
                heavy = nC + 1;
            }
        }
        const r = Math.max(13, 11 + heavy);
        const sx = 2 * r + 2;
        return {
            id, formula, M, r, family: fam, nC,
            bond: fam === 'alc' ? 'hb' : fam === 'ket' ? 'dd' : 'vdw',
            // alla bindningstyper som ritas, den starkaste först
            bonds: fam === 'alc' ? ['hb', 'vdw'] : fam === 'ket' ? ['dd', 'vdw'] : ['vdw'],
            lattice: 'hex', sx, sy: Math.round(sx * 0.87),
            mp, bp, Hfus, Hvap,
            tpl: mkTpl(atoms, bonds, opt, r),
            explanation: () => genExplanation(SUBSTANCES[id])
        };
    }
    Object.assign(SUBSTANCES, {
        methanol: genSub('methanol', 'alc', 1, 'CH₃OH', 32.04, -98, 65, 3.2, 35.3),
        ethanol:  genSub('ethanol', 'alc', 2, 'C₂H₅OH', 46.07, -114, 78, 4.9, 38.6),
        propanol: genSub('propanol', 'alc', 3, 'C₃H₇OH', 60.1, -126, 97, 5.4, 41.4),
        butanol:  genSub('butanol', 'alc', 4, 'C₄H₉OH', 74.12, -89, 118, 9.4, 43.3),
        pentanol: genSub('pentanol', 'alc', 5, 'C₅H₁₁OH', 88.15, -78, 138, 9.8, 44.4),
        acetone:  genSub('acetone', 'ket', 3, 'CH₃COCH₃', 58.08, -95, 56, 5.7, 29.1),
        pentane:  genSub('pentane', 'alk', 5, 'C₅H₁₂', 72.15, -130, 36, 8.4, 25.8),
        hexane:   genSub('hexane', 'alk', 6, 'C₆H₁₄', 86.18, -95, 69, 13.1, 28.9),
        heptane:  genSub('heptane', 'alk', 7, 'C₇H₁₆', 100.2, -91, 98, 14.0, 31.8),
        octane:   genSub('octane', 'alk', 8, 'C₈H₁₈', 114.2, -57, 126, 20.7, 34.4)
    });
    // Rullistan grupperas efter ämnesklass, inte bindningstyp: eleverna ska upptäcka bindningarna i animeringen
    const SUBST_GROUPS = [
        ['gOther', ['h2o', 'hcl', 'acetone', 'co2']],
        ['gAlc', ['methanol', 'ethanol', 'propanol', 'butanol', 'pentanol']],
        ['gAlk', ['pentane', 'hexane', 'heptane', 'octane']]
    ];
    const BOND_COL = { hb: '#38bdf8', dd: '#fbbf24', vdw: '#34d399' };
    const bondType = () => cur.tpl ? cur.bond : ({ co2: 'vdw', hcl: 'dd', h2o: 'hb' })[cur.id];

    // Alkan med ungefär samma molmassa, att jämföra alkoholernas kokpunkter med
    const ALC_CMP = {
        methanol: ['etan', 'ethane', 30, -89], ethanol: ['propan', 'propane', 44, -42], propanol: ['butan', 'butane', 58, -0.5],
        butanol: ['pentan', 'pentane', 72, 36], pentanol: ['hexan', 'hexane', 86, 69]
    };
    function genExplanation(s) {
        const en = lang === 'en';
        const Name = tr(s.id + 'Name'), low = Name.toLowerCase();
        const mp = fmtT(s.mp), bp = fmtT(s.bp), Ms = fmt(s.M, 0);
        const c = BOND_COL[s.bond];
        if (s.family === 'alc') {
            const [cs, ce, cM, cbp] = ALC_CMP[s.id];
            return en ? [
                card(c, 'Carbon chain with an OH group',
                    `${Name} has ${s.nC} carbon${s.nC > 1 ? 's' : ''} in the chain and an OH group. Oxygen pulls the electrons in the O–H bond towards itself, so O gets &amp;delta;⁻ and H gets &amp;delta;⁺.`),
                card(c, 'Hydrogen bonds + van der Waals',
                    'The H (&amp;delta;⁺) of an OH group bonds to the oxygen in a neighbouring OH group. The carbon chain adds van der Waals forces, which get stronger the longer the chain. That is why the boiling point rises from methanol to 1-pentanol.'),
                card(c, 'Phase transitions',
                    `Melts at &lt;strong>${mp} °C&lt;/strong> and boils at &lt;strong>${bp} °C&lt;/strong>. Compare with ${ce} (${fmt(cM, 0)} g/mol), which has about the same molar mass (${low}: ${Ms} g/mol) but boils at only ${fmtT(cbp)} °C. The hydrogen bonds must be broken when ${low} boils.`)
            ].join('') : [
                card(c, 'Kolkedja med OH-grupp',
                    `${Name} har ${s.nC} kol i kedjan och en OH-grupp. Syret drar åt sig elektronerna i O–H-bindningen, så O får &amp;delta;⁻ och H får &amp;delta;⁺.`),
                card(c, 'Vätebindningar + van der Waals',
                    'OH-gruppens väte (&amp;delta;⁺) binder till syret i grannmolekylens OH-grupp. Kolkedjan ger dessutom van der Waals-bindningar, som blir starkare ju längre kedjan är. Därför stiger kokpunkten från metanol till 1-pentanol.'),
                card(c, 'Fasövergångar',
                    `Smälter vid &lt;strong>${mp} °C&lt;/strong> och kokar vid &lt;strong>${bp} °C&lt;/strong>. Jämför med ${cs} (${fmt(cM, 0)} g/mol), som har ungefär samma molmassa (${low}: ${Ms} g/mol) men kokar redan vid ${fmtT(cbp)} °C. Vätebindningarna måste brytas när ${low} kokar.`)
            ].join('');
        }
        if (s.family === 'alk') {
            return en ? [
                card(c, 'Non-polar carbon chain',
                    `${Name} is an alkane with ${s.nC} carbons. Carbon and hydrogen have almost the same electronegativity, so the molecule is non-polar. (The hydrogens on the carbons are not shown.)`),
                card(c, 'Van der Waals forces',
                    'The electron clouds fluctuate and form temporary dipoles, which give weak attractions between the molecules. The longer the chain, the larger the contact area and the stronger the forces.'),
                card(c, 'Phase transitions',
                    `Melts at &lt;strong>${mp} °C&lt;/strong> and boils at &lt;strong>${bp} °C&lt;/strong>. The boiling point rises along the series pentane (36 °C) → hexane (69 °C) → heptane (98 °C) → octane (126 °C).`)
            ].join('') : [
                card(c, 'Opolär kolkedja',
                    `${Name} är en alkan med ${s.nC} kol. Kol och väte har nästan samma elektronegativitet, så molekylen är opolär. (Väteatomerna på kolen visas inte.)`),
                card(c, 'Van der Waals-bindningar',
                    'Elektronmolnen fluktuerar och bildar tillfälliga dipoler, som ger svaga bindningar mellan molekylerna. Ju längre kedja, desto större kontaktyta och desto starkare bindningar.'),
                card(c, 'Fasövergångar',
                    `Smälter vid &lt;strong>${mp} °C&lt;/strong> och kokar vid &lt;strong>${bp} °C&lt;/strong>. Kokpunkten stiger i serien pentan (36 °C) → hexan (69 °C) → heptan (98 °C) → oktan (126 °C).`)
            ].join('');
        }
        return en ? [
            card(c, 'Polar C=O group',
                'In acetone, oxygen is double-bonded to a carbon. Oxygen pulls the electrons towards itself: O gets &amp;delta;⁻ and the carbon gets &amp;delta;⁺. The molecule is polar but has no O–H.'),
            card(c, 'Dipole–dipole forces',
                'The positive end (C) of one molecule is attracted to the negative end (O) of a neighbour. Because acetone has no hydrogen bonded to oxygen, acetone molecules cannot form hydrogen bonds with each other.'),
            card(c, 'Phase transitions',
                `Melts at &lt;strong>${mp} °C&lt;/strong> and boils at &lt;strong>${bp} °C&lt;/strong>. Compare with molecules of almost the same molar mass: butane (58 g/mol, van der Waals) boils at −0.5 °C and 1-propanol (60 g/mol, hydrogen bonds) at 97 °C.`)
        ].join('') : [
            card(c, 'Polär C=O-grupp',
                'I aceton sitter syret med en dubbelbindning till ett kol. Syret drar åt sig elektronerna: O får &amp;delta;⁻ och kolet &amp;delta;⁺. Molekylen är polär men saknar O–H.'),
            card(c, 'Dipol–dipolbindningar',
                'Den positiva änden (C) i en molekyl attraheras av den negativa änden (O) i grannen. Eftersom aceton saknar väte bundet till syre kan acetonmolekylerna inte bilda vätebindningar till varandra.'),
            card(c, 'Fasövergångar',
                `Smälter vid &lt;strong>${mp} °C&lt;/strong> och kokar vid &lt;strong>${bp} °C&lt;/strong>. Jämför med molekyler med nästan samma molmassa: butan (58 g/mol, van der Waals) kokar vid −0,5 °C och 1-propanol (60 g/mol, vätebindningar) vid 97 °C.`)
        ].join('');
    }

    // =====================================================================
    //  TILLSTÅND
    // =====================================================================
    // Antal molekyler: 64 på stora skärmar, färre i små kärl (mobil) så att kristallen ryms och gasen inte blir trång
    const N_MAX = 64, N_MIN = 20;
    let N = N_MAX;
    function fitN() {
        const cellA = cur.lattice === 'hex' ? cur.sx * cur.sy : Math.sqrt(3) * cur.b * 1.5 * cur.b / 2;   // yta per gitterplats
        const fit = Math.floor(0.4 * vessel.w * vessel.h / cellA);
        return Math.max(N_MIN, Math.min(N_MAX, fit));
    }
    const LUNIT = 60;          // skala för latent värme: L = LUNIT·√(ΔH)  (komprimerad men rätt ordning)
    const HEAT_RATE = 0.04;    // värmeöverföring per steg per grad skillnad
    const HEAT_MAX = 0.6;      // max värmeflöde per steg (°C-ekvivalenter) vid "Normal"
    const T_MIN = -200, T_MAX = 150;   // termostatens skala (°C)
    const A_COND = 0.6;        // hastighetsskala i flytande fas  (σ = A·√(T/M)). Högre = rörligare vätska
    const LIQ_DAMP = 0.05;     // dämpning i vätskan (lägre = molekylerna glider längre innan de byter riktning)
    const LIQ_ATTR = 0.5;      // andel av dragningen som verkar mellan vätskemolekyler (lägre = de fastnar inte på sin plats)
    const COH = 0.07;          // sammanhållning: molekyler i vätskeytan med få grannar dras tillbaka mot vätskan
    const A_GAS = 0.9;         // hastighetsskala i gasfas
    const GRAVITY = 0.08;
    const ATTR_C = 0.012;      // attraktion ∝ kokpunkt(K)/M
    const ATTR_W = 16;         // attraktionens räckvidd utanför kontakt (px)
    const VIB_AMP_MP = 2.4;    // vibrationsamplitud (px) vid smältpunkten
    const VIB_EXP = 4;         // hur snabbt vibrationerna avtar under smältpunkten: amplitud ∝ (T/Tsmp)^VIB_EXP
                               // (kraftigt förstärkt: nästan stilla långt under smältpunkten, kraftig vibration strax innan)
    const K_SOLID = 0.08;      // fjäderkonstant mot gitterplatsen (lägre = lugnare, mjukare svängning)
    // Rörelsens massa begränsas uppåt, så att tunga molekyler (t.ex. oktan) inte blir orimligt tröga på skärmen
    const kinM = () => Math.min(cur.M, 60);

    let cur = SUBSTANCES.co2;
    let co2Pressure = '1atm';
    let setpoint = -90;
    let H = 0;                 // systemets entalpi (°C-ekvivalenter)
    let heatPower = 1;
    let lastFlow = 0;
    let lastSegment = null;
    const renderOptions = { dir: true, vdw: true, charges: true, points: false };   // dir = vätebindningar / dipol–dipol
    // points: smält- och kokpunkt visas på termostatreglaget och i temperaturkurvan. Dolda från början,
    // så att eleverna kan undersöka dem själva (virtuell labb). ?punkter=1 i adressen visar dem direkt.

    let canvas, ctx, width = 0, height = 0;
    let curveCanvas, cctx, cW = 0, cH = 0;
    const vessel = { x: 0, y: 0, w: 0, h: 0, bottom: 0 };
    let sites = [];            // gitterplatser {x,y,level,angle,nb:[]}
    let occ = [];              // occ[siteIndex] = molekylindex eller -1
    let molecules = [];
    let lockWait = 0;
    let evapWait = 0;
    // Is flyter: för vatten kan hela kristallen förskjutas i höjdled (iceY) och bärs då upp av vätskan under den
    let iceY = 0, iceV = 0, iceBotPrev = Infinity, iceOrder = [], iceRank = [];
    const floats = () => cur.id === 'h2o';
    // Isens läge i gittrets egna koordinater: översta och understa raden, samt en "effektiv" underkant
    // där en halvfull understa rad räknas till en del (så att kristallen lyfts gradvis, inte en hel rad i taget).
    function iceGeometry() {
        const lv = new Map();
        for (const s of sites) { if (!lv.has(s.level)) lv.set(s.level, { y: s.y, n: 0, occ: 0 }); lv.get(s.level).n++; }
        let top = Infinity, low = -Infinity, minL = Infinity;
        for (let i = 0; i &lt; sites.length; i++) {
            if (occ[i] === -1) continue;
            const s = sites[i];
            lv.get(s.level).occ++;
            top = Math.min(top, s.y); low = Math.max(low, s.y);
            minL = Math.min(minL, s.level);
        }
        if (minL === Infinity) return null;
        let lowEff = low;
        const L = lv.get(minL), up = lv.get(minL + 1);
        if (up &amp;&amp; up.occ > 0) lowEff = up.y + (L.y - up.y) * Math.min(1, L.occ / L.n);
        return { top, low, lowEff };
    }   // paus (i steg) innan nästa molekyl får avdunsta under kokpunkten
    let frameCount = 0;
    const history = [];        // {T, sp}
    const mouse = { x: 0, y: 0, down: false, radius: 60 };

    // =====================================================================
    //  TERMODYNAMIK (entalpimodell med platåer)
    // =====================================================================
    function trans() {
        if (cur.id === 'co2') {
            const p = cur.pressures[co2Pressure];
            return p.subl
                ? { subl: true, mp: p.mp, bp: p.mp, L1: LUNIT * Math.sqrt(p.Hsub), L2: 0 }
                : { subl: false, mp: p.mp, bp: p.bp, L1: LUNIT * Math.sqrt(p.Hfus), L2: LUNIT * Math.sqrt(p.Hvap) };
        }
        return { subl: false, mp: cur.mp, bp: cur.bp, L1: LUNIT * Math.sqrt(cur.Hfus), L2: LUNIT * Math.sqrt(cur.Hvap) };
    }

    function bounds(t) {
        const a0 = t.mp + 273.15, a1 = a0 + t.L1;
        if (t.subl) return { a0, a1 };
        const b0 = a1 + (t.bp - t.mp), b1 = b0 + t.L2;
        return { a0, a1, b0, b1 };
    }

    // Entalpi -> temperatur + andelar fast/flytande/gas
    function HtoState(h) {
        const t = trans(), B = bounds(t);
        if (h &lt; B.a0) return { T: h - 273.15, fs: 1, fl: 0, fg: 0, seg: 'solid' };
        if (t.subl) {
            if (h &lt; B.a1) { const x = (h - B.a0) / t.L1; return { T: t.mp, fs: 1 - x, fl: 0, fg: x, seg: 'sublime' }; }
            return { T: t.mp + (h - B.a1), fs: 0, fl: 0, fg: 1, seg: 'gas' };
        }
        if (h &lt; B.a1) { const x = (h - B.a0) / t.L1; return { T: t.mp, fs: 1 - x, fl: x, fg: 0, seg: 'melt' }; }
        if (h &lt; B.b0) return { T: t.mp + (h - B.a1), fs: 0, fl: 1, fg: 0, seg: 'liquid' };
        if (h &lt; B.b1) { const x = (h - B.b0) / t.L2; return { T: t.bp, fs: 0, fl: 1 - x, fg: x, seg: 'boil' }; }
        return { T: t.bp + (h - B.b1), fs: 0, fl: 0, fg: 1, seg: 'gas' };
    }

    function TtoH(T) {
        const t = trans(), B = bounds(t);
        if (T &lt;= t.mp) return T + 273.15;
        if (t.subl) return B.a1 + (T - t.mp);
        if (T &lt;= t.bp) return B.a1 + (T - t.mp);
        return B.b1 + (T - t.bp);
    }

    // Termostatplattan för över värme proportionellt mot temperaturskillnaden
    function heatStep() {
        const st = HtoState(H);
        const diff = setpoint - st.T;
        if (Math.abs(diff) &lt; 0.01) { lastFlow = 0; return; }
        const mag = Math.min(HEAT_MAX * heatPower, Math.max(0.12 * heatPower, HEAT_RATE * Math.abs(diff) * heatPower));
        const flow = Math.sign(diff) * mag;
        let Hn = H + flow;
        const Tn = HtoState(Hn).T;
        if (Math.sign(setpoint - Tn) !== Math.sign(diff) &amp;&amp; Tn !== setpoint) {
            Hn = TtoH(setpoint);  // gå inte förbi termostatens temperatur
        }
        lastFlow = flow;
        H = Hn;
        syncClamp();
    }

    // Entalpin får inte springa ifrån molekylerna: så länge kristallen inte har
    // smält/stelnat färdigt står temperaturen kvar på platån.
    function syncClamp() {
        const t = trans(), B = bounds(t), c = counts();
        if (t.subl) {
            if (c.s > 0) H = Math.min(H, B.a0 + (c.g + 2) / N * t.L1);
            if (c.g > 0) H = Math.max(H, B.a0 + (c.g - 2) / N * t.L1);
            return;
        }
        const nonS = c.l + c.g;
        if (c.s > 0) H = Math.min(H, B.a0 + (nonS + 2) / N * t.L1);
        if (nonS > 0) H = Math.max(H, B.a0 + (nonS - 2) / N * t.L1);
        if (c.l > 0) H = Math.min(H, B.b0 + (c.g + 2) / N * t.L2);
        if (c.g > 5) H = Math.max(H, B.b0 + (c.g - 2) / N * t.L2);
    }

    // =====================================================================
    //  HJÄLPFUNKTIONER
    // =====================================================================
    function gauss() {
        let u = 0, v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    function wrapAngle(a) {
        while (a > Math.PI) a -= 2 * Math.PI;
        while (a &lt; -Math.PI) a += 2 * Math.PI;
        return a;
    }
    const fmt = (v, d = 0) => (v &lt; 0 ? '−' : '') + (lang === 'sv' ? Math.abs(v).toFixed(d).replace('.', ',') : Math.abs(v).toFixed(d));
    const fmtT = (v) => (Number.isInteger(v) ? fmt(v) : fmt(v, 1));

    // =====================================================================
    //  KÄRL OCH GITTER
    // =====================================================================
    function updateVessel() {
        const innerW = Math.max(220, Math.min(420, width - 70));
        vessel.w = innerW;
        vessel.x = Math.round((width - innerW) / 2);
        vessel.y = 34;
        vessel.bottom = height - 34;
        vessel.h = vessel.bottom - vessel.y;
    }

    function buildLattice() {
        sites = [];
        const pad = cur.r + 3;
        const left = vessel.x + pad, right = vessel.x + vessel.w - pad;
        const span = right - left;
        const yOf = (u) => vessel.bottom - pad - u;
        let nbThr;

        if (cur.lattice === 'hex') {
            const { sy } = cur;
            const cols = Math.floor(span / cur.sx) + 1;
            // Raderna sträcks ut så att de når ända fram till kärlets väggar. Annars blir det glipor vid
            // väggen där vätskemolekyler fastnar och inte kan binda in.
            const sx = cols > 1 ? span / (cols - 1) : cur.sx;
            const x0 = left;
            for (let r = 0; sites.length &lt; N; r++) {
                const odd = r % 2 === 1;
                const n = odd ? cols - 1 : cols;
                for (let c = 0; c &lt; n; c++) {
                    let angle;
                    if (cur.id === 'hcl') angle = odd ? Math.PI : 0;           // antiparallella kedjor H···Cl
                    else angle = (c % 2 === 0) ? -0.75 : 0.75;                 // fiskbensmönster
                    sites.push({ x: x0 + c * sx + (odd ? sx / 2 : 0), y: yOf(r * sy), level: r, angle });
                }
            }
            nbThr = 1.15 * Math.max(sx, Math.hypot(sx / 2, sy));
        } else {
            // Bikakegitter (2D-motsvarighet till isens öppna struktur)
            const b = cur.b, w = Math.sqrt(3) * b;
            const cols = Math.floor(span / w) + 1;
            const x0 = left + (span - (cols - 1) * w) / 2;
            for (let j = 0; sites.length &lt; N; j++) {
                const odd = j % 2 === 1;
                const n = odd ? cols - 1 : cols;
                for (let i = 0; i &lt; n; i++) {
                    const x = x0 + i * w + (odd ? w / 2 : 0);
                    // A: båda H pekar snett nedåt mot grannarna under
                    sites.push({ x, y: yOf(1.5 * b * j), level: 2 * j, angle: Math.PI / 2 });
                    // B: ett H pekar rakt nedåt mot A, det andra är fritt
                    sites.push({ x, y: yOf(1.5 * b * j + b), level: 2 * j + 1, angle: (i % 2 === 0) ? 0.663 : 2.478 });
                }
            }
            nbThr = 1.15 * b;
        }

        for (const s of sites) s.nb = [];
        for (let i = 0; i &lt; sites.length; i++) {
            for (let j = i + 1; j &lt; sites.length; j++) {
                if (Math.hypot(sites[i].x - sites[j].x, sites[i].y - sites[j].y) &lt; nbThr) {
                    sites[i].nb.push(j);
                    sites[j].nb.push(i);
                }
            }
        }
        occ = new Array(sites.length).fill(-1);
        // Is fryser i en bestämd ordning uppifrån och ned: översta lagret (ett A- och ett B-skikt) från mitten och utåt,
        // sedan nästa lager under. Då blir isen ett sammanhängande flak utan hål, och vätskan stannar under den.
        const cxL = vessel.x + vessel.w / 2;
        iceOrder = sites.map((st, i) => i).sort((a, b) =>
            Math.floor(sites[b].level / 2) - Math.floor(sites[a].level / 2) ||
            Math.abs(sites[a].x - cxL) - Math.abs(sites[b].x - cxL) ||
            sites[b].level - sites[a].level);
        iceRank = new Array(sites.length);
        iceOrder.forEach((si, r) => { iceRank[si] = r; });
    }

    // =====================================================================
    //  MOLEKYLER
    // =====================================================================
    function sigmaCond(TK) { return A_COND * Math.sqrt(TK / Math.max(30, kinM())); }   // golv 30: små molekyler (vatten) skvätter inte iväg
    function sigmaGas(TK) { return A_GAS * Math.sqrt(TK / kinM()); }

    function makeGasVelocity(m, TK, upward) {
        const s = sigmaGas(TK);
        m.vx = gauss() * s;
        m.vy = upward ? -Math.abs(gauss() * s) - s * 0.5 : gauss() * s;
        m.av = (Math.random() - 0.5) * 0.2;
    }

    // Placera alla molekyler direkt enligt aktuell entalpi (vid start/byte av ämne)
    function placeAll() {
        N = fitN();
        buildLattice();
        const st = HtoState(H);
        const TK = st.T + 273.15;
        const nS = Math.round(st.fs * N);
        const nG = Math.round(st.fg * N);
        const cx = vessel.x + vessel.w / 2;
        const fl = floats();
        // Kristallen byggs nerifrån och upp, utom is som byggs uppifrån och ned (den flyter på vätskan)
        const order = fl ? iceOrder : sites.map((s, i) => i)
            .sort((a, b) => sites[a].level - sites[b].level || Math.abs(sites[a].x - cx) - Math.abs(sites[b].x - cx));

        molecules = [];
        iceY = 0; iceV = 0;
        const d = cur.r * 2 + 1;
        const left = vessel.x + cur.r + 3, right = vessel.x + vessel.w - cur.r - 3;
        const nL = N - nS - nG;
        const stackLiquid = (yStart) => {
            let lx = left, ly = yStart, row = 0;
            for (let i = 0; i &lt; nL; i++) {
                molecules.push({ x: lx, y: ly, vx: 0, vy: 0, angle: Math.random() * 6.28, av: 0, state: 'liquid', site: -1, ramp: 0 });
                lx += d;
                if (lx > right) { row++; lx = left + (row % 2 ? d / 2 : 0); ly -= d * 0.87; }
            }
            return molecules.length ? Math.min(...molecules.map(m => m.y)) : vessel.bottom;
        };
        const placeSolids = () => {
            let topY = vessel.bottom, lowY = -Infinity;
            for (let i = 0; i &lt; nS; i++) { const sy = sites[order[i]].y; topY = Math.min(topY, sy); lowY = Math.max(lowY, sy); }
            return { topY, lowY };
        };
        const addSolids = () => {
            for (let i = 0; i &lt; nS; i++) {
                const si = order[i], s = sites[si];
                occ[si] = molecules.length;
                molecules.push({ x: s.x, y: s.y + iceY, vx: 0, vy: 0, angle: s.angle, av: 0, state: 'solid', site: si, ramp: 1 });
            }
        };
        if (fl &amp;&amp; nS > 0) {
            // Vätskan ligger underst och isen flyter ovanpå
            const { lowY } = placeSolids();
            const liqTop = nL > 0 ? stackLiquid(vessel.bottom - cur.r - 3) : vessel.bottom - cur.r - 3 + d;
            iceY = Math.min(vessel.bottom - cur.r - 3 - lowY, (liqTop - d) - lowY);
            addSolids();
        } else {
            const { topY } = placeSolids();
            addSolids();
            stackLiquid(nS > 0 ? topY - d : vessel.bottom - cur.r - 3);
        }
        // Gas fördelas i hela kärlet
        for (let i = 0; i &lt; nG; i++) {
            const m = {
                x: vessel.x + cur.r + Math.random() * (vessel.w - 2 * cur.r),
                y: vessel.y + cur.r + Math.random() * (vessel.h * 0.6),
                vx: 0, vy: 0, angle: Math.random() * 6.28, av: 0, state: 'gas', site: -1, ramp: 0
            };
            makeGasVelocity(m, TK, false);
            molecules.push(m);
        }
        lockWait = 0;
    }

    function counts() {
        let s = 0, l = 0, g = 0;
        for (const m of molecules) {
            if (m.state === 'solid') s++; else if (m.state === 'liquid') l++; else g++;
        }
        return { s, l, g };
    }

    function solidNeighbours(si) {
        let n = 0;
        for (const k of sites[si].nb) if (occ[k] !== -1) n++;
        return n;
    }

    // Fäst en fri molekyl på en ledig plats som gränsar till kristallen (kärnbildning + tillväxt).
    // Bara en molekyl som redan finns nära platsen får binda in, så att ingen molekyl åker genom kristallen.
    // Finns ingen nära väntar kristallen (temperaturen står kvar på platån under tiden).
    function lockOne(nSolidNow) {
        const cx = vessel.x + vessel.w / 2;
        const fl = floats();
        let cand = [];
        if (nSolidNow === 0) {
            if (fl) {
                // Is: kärnbildning i vätskeytan. Den översta vätskemolekylen nära mitten blir första platsen,
                // och kristallen (översta gitterraden) läggs på den höjden.
                let mi = -1, bs = Infinity;
                molecules.forEach((m, i) => {
                    if (m.state !== 'liquid') return;
                    const sc = m.y + Math.abs(m.x - cx) * 0.5;
                    if (sc &lt; bs) { bs = sc; mi = i; }
                });
                if (mi &lt; 0) return false;
                const m = molecules[mi];
                const best = iceOrder[0];
                iceY = m.y - sites[best].y; iceV = 0;
                m.state = 'solid'; m.site = best; m.ramp = 0; occ[best] = mi;
                lockWait = 0;
                return true;
            }
            // Kärnbildning: lägsta platsen närmast mitten
            let best = -1, bd = Infinity;
            for (let i = 0; i &lt; sites.length; i++) {
                if (sites[i].level !== 0) continue;
                const dd = Math.abs(sites[i].x - cx);
                if (dd &lt; bd) { bd = dd; best = i; }
            }
            if (best >= 0) cand.push({ si: best, nbs: 0 });
        } else if (fl) {
            // Is: nästa lediga platser i frysordningen (alltid i isflakets underkant, där vätskan finns)
            // (alla lediga platser i det lager som fryser just nu, så att närmaste vätskemolekyl kan binda in)
            let layer = null;
            for (let r = 0; r &lt; Math.min(N, iceOrder.length); r++) {
                const si = iceOrder[r];
                if (occ[si] !== -1) continue;
                const L = Math.floor(sites[si].level / 2);
                if (layer === null) layer = L;
                if (L !== layer) break;
                cand.push({ si, nbs: solidNeighbours(si) });
            }
        } else {
            // Is växer bara i zonen ovanför vätskan (där den flytande isen ska ligga), ungefär en rad i taget.
            // När den understa raden fylls lyfts kristallen (se physicsStep) och nästa rad hamnar i zonen.
            const maxY = Infinity;
            // Övriga ämnen växer underifrån: en plats kan bara fyllas när platserna under den är fyllda.
            // Då kan kristallen aldrig växa över en vätskemolekyl och stänga in den.
            const strict = lockWait &lt; 360;
            // Is växer på samma sätt men uppifrån och ned: en plats kan bara fyllas när platserna ovanför är fyllda.
            // De två översta nivåerna (själva ytskiktet) får breda ut sig så länge det finns is alldeles intill.
            let topL = -Infinity;
            if (fl) for (const st of sites) topL = Math.max(topL, st.level);
            const nearIce = (i) => {
                for (let k = 0; k &lt; sites.length; k++) if (occ[k] !== -1 &amp;&amp; Math.hypot(sites[k].x - sites[i].x, sites[k].y - sites[i].y) &lt; 2.1 * cur.b) return true;
                return false;
            };
            for (let i = 0; i &lt; sites.length; i++) {
                if (occ[i] !== -1) continue;
                if (sites[i].y > maxY) continue;
                const nbs = solidNeighbours(i);
                if (fl &amp;&amp; sites[i].level >= topL - 1) { if (nbs > 0 || nearIce(i)) cand.push({ si: i, nbs }); continue; }
                if (strict &amp;&amp; sites[i].nb.some(k => (fl ? sites[k].level > sites[i].level : sites[k].level &lt; sites[i].level) &amp;&amp; occ[k] === -1)) continue;
                if (nbs > 0) cand.push({ si: i, nbs });
            }
        }
        // Is: de sista vätskemolekylerna kan ligga en bit från nästa plats i frysordningen. Då får de i stället
        // binda in på en ledig plats alldeles intill isen där de är, så att ingen molekyl åker genom flaket.
        if (fl &amp;&amp; nSolidNow > 0 &amp;&amp; lockWait > 30) {
            for (let i = 0; i &lt; sites.length; i++) {
                if (occ[i] === -1 &amp;&amp; !cand.some(c => c.si === i)) { const nbs = solidNeighbours(i); if (nbs > 0) cand.push({ si: i, nbs }); }
            }
        }
        if (cand.length === 0) return false;

        // Kort räckvidd. Om ingen molekyl finns nära på en stund (t.ex. instängd vid kärlväggen) växer den långsamt.
        const minD = cur.r * 2;
        const R = Math.min(500, minD + 12 + Math.max(0, lockWait - 45) * 0.4);
        const Rgas = minD + 24;   // en gasmolekyl som passerar nära kristallen fastnar (deposition); gasen rör sig, så räckvidden växer inte
        let bestScore = Infinity, bestM = -1, bestS = -1;
        for (const c of cand) {
            const s = sites[c.si];
            const sy = s.y + iceY;
            if (!fl &amp;&amp; sy > vessel.bottom - cur.r - 1) continue;
            for (let i = 0; i &lt; molecules.length; i++) {
                const m = molecules[i];
                if (m.state === 'solid') continue;
                const dist = Math.hypot(m.x - s.x, m.y - sy);
                if (dist > (m.state === 'gas' ? Rgas : R)) continue;
                const score = dist + (m.state === 'gas' ? 25 : 0) - c.nbs * 6;
                if (score &lt; bestScore) { bestScore = score; bestM = i; bestS = c.si; }
            }
        }
        if (bestM &lt; 0) { lockWait++; return false; }

        const m = molecules[bestM];
        m.state = 'solid';
        m.site = bestS;
        m.ramp = 0;
        occ[bestS] = bestM;
        lockWait = 0;
        return true;
    }

    // Släpp en molekyl från kristallens yta (få grannar, inget ovanpå)
    function releaseOne(toGas, TK) {
        let best = -1, bestScore = Infinity;
        for (let i = 0; i &lt; molecules.length; i++) {
            const m = molecules[i];
            if (m.state !== 'solid') continue;
            const s = sites[m.site];
            // Vanligen smälter kristallen ovanifrån. Is smälter underifrån, där den möter vätskan.
            const fl = floats() &amp;&amp; !toGas;
            let nbs = 0, covered = false;
            for (const k of s.nb) {
                if (occ[k] !== -1) {
                    nbs++;
                    if (fl ? sites[k].level &lt; s.level : sites[k].level > s.level) covered = true;
                }
            }
            // (is smälter i omvänd frysordning: först de sist frusna längst ned i flaket)
            const score = fl ? -iceRank[m.site] : nbs + (covered ? 10 : 0) - s.level * 0.01 + Math.random() * 0.5;
            if (score &lt; bestScore) { bestScore = score; best = i; }
        }
        if (best &lt; 0) return false;
        const m = molecules[best];
        occ[m.site] = -1;
        m.site = -1;
        m.ramp = 0;
        if (toGas) { m.state = 'gas'; makeGasVelocity(m, TK, true); }
        else { m.state = 'liquid'; m.vx *= 0.5; m.vy *= 0.5; }
        return true;
    }

    function evaporateOne(TK) {
        let best = -1, minY = Infinity;
        molecules.forEach((m, i) => { if (m.state === 'liquid' &amp;&amp; m.y &lt; minY) { minY = m.y; best = i; } });
        if (best &lt; 0) return false;
        molecules[best].state = 'gas';
        makeGasVelocity(molecules[best], TK, true);
        return true;
    }

    function condenseOne() {
        let best = -1, maxY = -Infinity;
        molecules.forEach((m, i) => { if (m.state === 'gas' &amp;&amp; m.y > maxY) { maxY = m.y; best = i; } });
        if (best &lt; 0) return false;
        molecules[best].state = 'liquid';
        return true;
    }

    // Justera molekylernas tillstånd mot de termodynamiska andelarna
    function phaseExchange() {
        const t = trans();
        const st = HtoState(H);
        const TK = st.T + 273.15;
        const nS = Math.round(st.fs * N);
        let nG = Math.round(st.fg * N);
        if (st.seg === 'liquid') {
            // Avdunstning: först i den övre halvan av vätskeintervallet lämnar enstaka molekyler vätskan,
            // högst två nära kokpunkten. De kondenserar igen när de träffar vätskan (se physicsStep).
            const x = (st.T - t.mp) / (t.bp - t.mp);
            nG = x &lt; 0.5 ? 0 : x &lt; 0.85 ? 1 : 2;
        }
        if (evapWait > 0) evapWait--;

        for (let k = 0; k &lt; 3; k++) {
            const c = counts();
            if (c.s > nS) { releaseOne(t.subl, TK); continue; }
            if (c.s &lt; nS) { if (lockOne(c.s)) continue; }
            if (!t.subl &amp;&amp; c.g > nG) { if (condenseOne()) continue; }
            if (!t.subl &amp;&amp; c.g &lt; nG &amp;&amp; c.l > 0) {
                // under kokpunkten avdunstar en molekyl i taget, med en paus efter varje kondensation
                if (st.seg !== 'liquid' || evapWait &lt;= 0) {
                    if (evaporateOne(TK)) { if (st.seg === 'liquid') evapWait = 90; continue; }
                }
            }
            if (t.subl &amp;&amp; c.l > 0) {
                // Ingen vätska vid detta tryck: överbliven vätska blir gas eller fryser
                if (nS > c.s) { if (lockOne(c.s)) continue; }
                evaporateOne(TK); continue;
            }
            break;
        }
    }

    // =====================================================================
    //  FYSIKSTEG
    // =====================================================================
    function physicsStep() {
        heatStep();
        phaseExchange();

        const t = trans();
        const st = HtoState(H);
        const TK = st.T + 273.15;
        const sC = sigmaCond(TK), sG = sigmaGas(TK);
        const mpK = t.mp + 273.15;
        // Fast fas: vibrationens amplitud avtar stegvis med temperaturen (förstärkt skala så att
        // skillnaden syns tydligt). Hastighetsbruset väljs så att amplituden blir den önskade.
        const vibF = Math.pow(Math.min(1, TK / mpK), VIB_EXP);
        const sS = VIB_AMP_MP * vibF * Math.sqrt(K_SOLID);
        const attr = ATTR_C * ((t.subl ? t.mp : t.bp) + 273.15) / kinM();
        const minD = cur.r * 2;
        const n = molecules.length;

        for (const m of molecules) { m.lonely = true; m.nb = 0; m.cond = false; m.touchS = false; m.deep = false; }
        const evapPhase = st.seg === 'liquid';
        const floatNow = floats();
        // Parvisa krafter
        for (let i = 0; i &lt; n; i++) {
            const a = molecules[i];
            for (let j = i + 1; j &lt; n; j++) {
                const b = molecules[j];
                if (a.state === 'solid' &amp;&amp; b.state === 'solid') continue;
                let dx = b.x - a.x, dy = b.y - a.y;
                const d2 = dx * dx + dy * dy;
                const maxR = minD + ATTR_W;
                if (d2 > maxR * maxR) continue;
                const d = Math.sqrt(d2) || 0.001;
                const nx = dx / d, ny = dy / d;
                if (a.state !== 'gas' &amp;&amp; b.state !== 'gas') { a.lonely = false; b.lonely = false; a.nb++; b.nb++; }
                // En avdunstad molekyl som träffar vätskan kondenserar igen (under kokpunkten)
                else if (evapPhase &amp;&amp; d &lt; minD + 4) {
                    if (a.state === 'gas' &amp;&amp; b.state === 'liquid') a.cond = true;
                    else if (b.state === 'gas' &amp;&amp; a.state === 'liquid') b.cond = true;
                }

                // Is: vätska som har hamnat inne i iskristallen (t.ex. instängd i ett av hålrummen)
                // glider igenom och sjunker ner under isen i stället för att fastna
                if (floatNow &amp;&amp; d &lt; minD &amp;&amp; iceBotPrev &lt; Infinity &amp;&amp; ((a.state === 'solid' &amp;&amp; b.state === 'liquid' &amp;&amp; b.y &lt; iceBotPrev - cur.r * 0.5) ||
                    (b.state === 'solid' &amp;&amp; a.state === 'liquid' &amp;&amp; a.y &lt; iceBotPrev - cur.r * 0.5))) continue;
                // Vätska som har klämts in mellan molekylerna i kristallen ("jam") glider ut ur den
                // i stället för att fastna: uppåt till kristallens yta (is: nedåt, under isen).
                const ls = a.state === 'liquid' &amp;&amp; b.state === 'solid' ? a : b.state === 'liquid' &amp;&amp; a.state === 'solid' ? b : null;
                if (ls) {
                    if (d &lt; minD) { ls.touchS = true; if (d &lt; minD * 0.72) ls.deep = true; }
                    if (ls.jam) continue;   // varken stöts bort av eller dras till kristallen medan den glider ut
                } else if (a.jam || b.jam) {
                    if (a.state === 'liquid' &amp;&amp; b.state === 'liquid') continue;   // fastklämda molekyler glider fritt förbi annan vätska
                }
                if (d &lt; minD) {
                    const invA = a.state === 'solid' ? 0.1 : 1;
                    const invB = b.state === 'solid' ? 0.1 : 1;
                    const sum = invA + invB;
                    const overlap = (minD - d) * 0.8;
                    a.x -= nx * overlap * invA / sum; a.y -= ny * overlap * invA / sum;
                    b.x += nx * overlap * invB / sum; b.y += ny * overlap * invB / sum;
                    // Vätska som en växande kristall tränger undan skjuts mot kristallens yta (uppåt; is: nedåt)
                    // i stället för åt sidan, så att den inte kläms fast mellan molekylerna i kristallen.
                    if (ls) ls.y += (floatNow ? 1 : -1) * overlap * 0.5;
                    const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                    if (vn &lt; 0) {
                        const e = (a.state === 'gas' || b.state === 'gas') ? 1.0 : 0.2;
                        const J = -(1 + e) * vn / sum;
                        a.vx -= nx * J * invA; a.vy -= ny * J * invA;
                        b.vx += nx * J * invB; b.vy += ny * J * invB;
                    }
                } else if (a.state !== 'gas' &amp;&amp; b.state !== 'gas') {
                    // Attraktion (intermolekylära bindningar) i fast/flytande fas
                    // (svagare mellan två vätskemolekyler, så att de kan glida förbi varandra)
                    const both = a.state === 'liquid' &amp;&amp; b.state === 'liquid';
                    const f = attr * (both ? LIQ_ATTR : 1) * (1 - (d - minD) / ATTR_W);
                    if (a.state === 'liquid') { a.vx += nx * f; a.vy += ny * f; }
                    if (b.state === 'liquid') { b.vx -= nx * f; b.vy -= ny * f; }
                }
            }
        }

        // Is flyter: kristallen sjunker av sin tyngd tills vätskan under den bär upp den.
        // När isen växer nedåt (eller smälter underifrån) puttas hela kristallen upp (eller sjunker).
        let iceBot = Infinity;   // isens underkant (y), om den flyter
        if (floatNow) {
            const ice = iceGeometry();
            if (ice) {
                // Isen vilar på vätskan: isflakets underkant läggs vid vätskeytan (vätskans höjd räknas fram ur
                // antalet vätskemolekyler). Kristallen glider mjukt dit. När isen växer nedåt (nya molekyler binder in
                // underifrån) puttas hela kristallen uppåt, och när den smälter underifrån sjunker den.
                const c = counts();
                const hL = c.l > 0 ? Math.max(2 * cur.r + 2, c.l * (2 * cur.r + 1) ** 2 * 0.87 / (vessel.w - 6)) : 0;
                const floor = vessel.bottom - cur.r - 3 - ice.low;        // kristallen vilar på botten
                const ceil = vessel.y + cur.r + 3 - ice.top;               // och kan inte gå genom locket
                let target = (vessel.bottom - cur.r - 3) - hL + 0.3 * cur.r - ice.lowEff;
                target = Math.max(ceil, Math.min(floor, target));
                iceY += Math.max(-0.6, Math.min(0.6, target - iceY));
                iceY = Math.max(ceil, iceY);
                iceBot = ice.lowEff + iceY;
            }
        } else iceY = 0;
        iceBotPrev = iceBot;

        for (const m of molecules) {
            if (m.state !== 'liquid') { m.jam = false; continue; }
            if (m.deep) m.jam = true; else if (!m.touchS) m.jam = false;
        }

        // Kondensation av gasmolekyler som träffat vätskan
        for (const m of molecules) {
            if (!m.cond) continue;
            m.state = 'liquid'; m.vx *= 0.3; m.vy *= 0.3;
            evapWait = 150 + Math.random() * 250;   // dröjer innan nästa molekyl avdunstar
        }

        // Sammanhållning (ytspänning): en vätskemolekyl med högst en granne dras mot närmaste molekyl
        // i vätskan eller kristallen, så att lösryckta molekyler hittar tillbaka i stället för att fastna ovanför.
        for (const m of molecules) {
            if (m.state !== 'liquid' || m.nb > 1) continue;
            let best = null, bd = Infinity;
            for (const o of molecules) {
                if (o === m || o.state === 'gas') continue;
                const d2 = (o.x - m.x) ** 2 + (o.y - m.y) ** 2;
                if (d2 &lt; bd) { bd = d2; best = o; }
            }
            if (!best) continue;
            const d = Math.sqrt(bd) || 1;
            if (d &lt; minD * 0.9) continue;
            m.vx += (best.x - m.x) / d * COH;
            m.vy += (best.y - m.y) / d * COH + COH * 0.5;
        }

        // Enskilda molekyler
        const pad = cur.r + 2;
        const L = vessel.x + pad, R = vessel.x + vessel.w - pad;
        const T = vessel.y + pad, B = vessel.bottom - pad;

        for (const m of molecules) {
            if (m.state === 'solid') {
                const s = sites[m.site];
                m.ramp = Math.min(1, m.ramp + 1 / 40);
                const k = K_SOLID * m.ramp * m.ramp + 0.004;
                m.vx += (s.x - m.x) * k;
                m.vy += (s.y + iceY - m.y) * k;
                const g = 0.1 + 0.3 * (1 - m.ramp);
                const c = Math.sqrt(1 - (1 - g) * (1 - g));
                m.vx = m.vx * (1 - g) + sS * c * gauss();
                m.vy = m.vy * (1 - g) + sS * c * gauss();
                // Orienteringen glider mot gitterplatsens riktning och vickar mindre ju kallare det är
                m.av += 0.05 * wrapAngle(s.angle - m.angle) + gauss() * 0.03 * vibF;
                m.av *= 0.75;
            } else if (m.state === 'liquid') {
                m.vy += GRAVITY;
                // Vatten är tätare än is: vätska som hamnat i eller ovanpå isen sjunker ner under den
                if (iceBot &lt; Infinity &amp;&amp; m.y &lt; iceBot - cur.r * 0.5) m.vy += 0.35;
                if (m.jam) { m.vy += floatNow &amp;&amp; vessel.bottom - iceBot > 2.5 * cur.r ? 0.3 : -0.32; m.vx *= 0.85; }
                // Ensam vätskemolekyl (t.ex. nyss kondenserad) faller fritt, annars viskös dämpning
                const g = m.lonely ? 0.01 : LIQ_DAMP, c = Math.sqrt(1 - (1 - g) * (1 - g));
                m.vx = m.vx * (1 - g) + sC * c * gauss();
                m.vy = m.vy * (1 - g) + sC * c * gauss();
                m.av = m.av * 0.92 + gauss() * 0.02 * sC;
            }
            // Gasmolekyler påverkas inte av några krafter mellan kollisionerna -> raka banor

            // Mus/touch: knuffa molekylerna
            if (mouse.down) {
                const dx = m.x - mouse.x, dy = m.y - mouse.y;
                const d = Math.hypot(dx, dy);
                if (d &lt; mouse.radius &amp;&amp; d > 0) {
                    const p = (1 - d / mouse.radius) * (m.state === 'solid' ? 0.8 : 1.5);
                    m.vx += dx / d * p;
                    m.vy += dy / d * p;
                }
            }

            const vmax = m.state === 'gas' ? 14 : 5;
            const sp = Math.hypot(m.vx, m.vy);
            if (sp > vmax) { m.vx *= vmax / sp; m.vy *= vmax / sp; }

            m.x += m.vx;
            m.y += m.vy;
            m.angle += m.av;

            const el = m.state === 'gas' ? 1 : 0.4;
            if (m.x &lt; L) { m.x = L; m.vx = Math.abs(m.vx) * el; }
            if (m.x > R) { m.x = R; m.vx = -Math.abs(m.vx) * el; }
            if (m.y &lt; T) { m.y = T; m.vy = Math.abs(m.vy) * el; }
            if (m.y > B) { m.y = B; m.vy = -Math.abs(m.vy) * el; if (m.state !== 'gas') m.vx *= 0.9; }
        }

        // Termostat för gasen: alla gasmolekylers fart skalas med samma faktor mot
        // rätt medelrörelseenergi. Riktningarna ändras inte, så banorna förblir raka.
        let v2 = 0, ng = 0;
        for (const m of molecules) if (m.state === 'gas') { v2 += m.vx * m.vx + m.vy * m.vy; ng++; }
        if (ng > 0 &amp;&amp; v2 > 0) {
            const target = 2 * sG * sG;
            const lam = Math.sqrt(Math.max(0.81, Math.min(1.21, 1 + 0.03 * (target / (v2 / ng) - 1))));
            for (const m of molecules) if (m.state === 'gas') { m.vx *= lam; m.vy *= lam; }
        }
    }

    // =====================================================================
    //  RITNING
    // =====================================================================
    function drawVessel() {
        const { x, y, w, h } = vessel;
        ctx.save();
        ctx.fillStyle = 'rgba(10, 16, 31, 0.75)';
        ctx.fillRect(x, y, w, h);

        // Termostatplatta (färg efter värmeflöde)
        const rel = Math.min(1, Math.abs(lastFlow) / HEAT_MAX);
        let plate = '#1e293b', label = tr('plate'), lc = '#94a3b8';
        if (lastFlow > 0.001) { plate = `rgba(239, 68, 68, ${0.35 + 0.65 * rel})`; label = tr('heating'); lc = '#fff'; }
        else if (lastFlow &lt; -0.001) { plate = `rgba(14, 165, 233, ${0.35 + 0.65 * rel})`; label = tr('cooling'); lc = '#fff'; }
        ctx.fillStyle = plate;
        ctx.beginPath();
        ctx.roundRect(x - 14, vessel.bottom + 6, w + 28, 16, 4);
        ctx.fill();
        ctx.fillStyle = lc;
        ctx.font = 'bold 9px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + w / 2, vessel.bottom + 14.5);

        // Glas
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.5)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + h - 10);
        ctx.arcTo(x, y + h, x + 10, y + h, 10);
        ctx.lineTo(x + w - 10, y + h);
        ctx.arcTo(x + w, y + h, x + w, y + h - 10, 10);
        ctx.lineTo(x + w, y);
        ctx.stroke();

        // Lock
        ctx.fillStyle = 'rgba(51, 65, 85, 0.95)';
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(x - 6, y - 12, w + 12, 12, 4);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '9px sans-serif';
        ctx.fillText(tr('lid'), x + w / 2, y - 6);
        ctx.restore();
    }

    function local(m, lx, ly) {
        const c = Math.cos(m.angle), s = Math.sin(m.angle);
        return { x: m.x + lx * c - ly * s, y: m.y + lx * s + ly * c };
    }
    const H2O_D = 9, H2O_A = 0.91;
    function hydrogens(m) {
        if (cur.tpl) {
            const T = cur.tpl;
            return T.donor === undefined ? [] : [local(m, T.atoms[T.donor].x, T.atoms[T.donor].y)];
        }
        if (cur.id === 'hcl') return [local(m, 9, 0)];
        if (cur.id === 'h2o') return [
            local(m, H2O_D * Math.cos(H2O_A), H2O_D * Math.sin(H2O_A)),
            local(m, H2O_D * Math.cos(-H2O_A), H2O_D * Math.sin(-H2O_A))
        ];
        return [];
    }
    function acceptor(m) {
        if (cur.tpl) {
            const T = cur.tpl;
            return T.acc === undefined ? { x: m.x, y: m.y } : local(m, T.atoms[T.acc].x, T.atoms[T.acc].y);
        }
        if (cur.id === 'hcl') return local(m, -5, 0);
        return { x: m.x, y: m.y };
    }
    // Varifrån bindningens riktning räknas: O i O–H (alkoholer), O i C=O (aceton), annars mitten
    function donorBase(m) {
        if (cur.tpl &amp;&amp; cur.tpl.base !== undefined) return local(m, cur.tpl.atoms[cur.tpl.base].x, cur.tpl.atoms[cur.tpl.base].y);
        return { x: m.x, y: m.y };
    }

    // Alla bindningstyper som ämnet har ritas: van der Waals (grönt) och vätebindningar/dipol–dipol (blått/gult).
    function renderBonds() {
        const BT = cur.bonds;
        ctx.save();
        const n = molecules.length;

        if (BT.includes('vdw') &amp;&amp; renderOptions.vdw) {
            // Riktningslösa van der Waals-bindningar. För kolkedjor dras linjen mellan de närmaste kolatomerna,
            // och den blir tjockare ju längre kedjan är (större kontaktyta = starkare bindning).
            const maxD = cur.r * 2 + 8;
            const Cs = cur.tpl ? molecules.map(m => cur.tpl.atoms.filter(a => a.e === 'C').map(a => local(m, a.x, a.y))) : null;
            const k = Cs ? 1.3 : 1;          // kolkedjornas linjer är korta, så de ritas lite tydligare
            ctx.setLineDash(Cs ? [3, 3] : [2, 4]);
            ctx.lineWidth = cur.nC ? 0.9 + 0.17 * cur.nC : 1.2;
            for (let i = 0; i &lt; n; i++) {
                const a = molecules[i];
                if (a.state === 'gas') continue;
                for (let j = i + 1; j &lt; n; j++) {
                    const b = molecules[j];
                    if (b.state === 'gas') continue;
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (d &lt; maxD) {
                        const solid = a.state === 'solid' &amp;&amp; b.state === 'solid';
                        ctx.strokeStyle = `rgba(52, 211, 153, ${k * (solid ? 0.7 : 0.45) * Math.min(1, 1.4 - d / maxD)})`;
                        let p = a, q = b;
                        if (Cs) {
                            let bd = Infinity;
                            for (const u of Cs[i]) for (const v of Cs[j]) {
                                const dd = (u.x - v.x) ** 2 + (u.y - v.y) ** 2;
                                if (dd &lt; bd) { bd = dd; p = u; q = v; }
                            }
                        }
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
                    }
                }
            }
        }
        if ((BT.includes('hb') || BT.includes('dd')) &amp;&amp; renderOptions.dir) {
            // Riktade bindningar: δ⁺ (H, eller C i C=O) -> δ⁻ (O/Cl) i grannmolekylen
            const maxD = cur.id === 'h2o' ? 25 : cur.id === 'hcl' ? 22 : 24;
            const color = bondType() === 'hb' ? '56, 189, 248' : '251, 191, 36';
            const thr = cur.tpl ? 0.3 : 0.6;
            ctx.setLineDash([3, 3]);
            ctx.lineWidth = 2;
            const acc = molecules.map(acceptor);
            for (let i = 0; i &lt; n; i++) {
                const a = molecules[i];
                if (a.state === 'gas') continue;
                const hs = hydrogens(a);
                const base = donorBase(a);
                for (const h of hs) {
                    const dirx = h.x - base.x, diry = h.y - base.y;
                    const dl = Math.hypot(dirx, diry) || 1;
                    for (let j = 0; j &lt; n; j++) {
                        if (j === i) continue;
                        const b = molecules[j];
                        if (b.state === 'gas') continue;
                        const o = acc[j];
                        const ex = o.x - h.x, ey = o.y - h.y;
                        const d = Math.hypot(ex, ey);
                        if (d > maxD || d &lt; 1) continue;
                        const align = (dirx * ex + diry * ey) / (dl * d);
                        if (align &lt; thr) continue;
                        const solid = a.state === 'solid' &amp;&amp; b.state === 'solid';
                        ctx.strokeStyle = `rgba(${color}, ${(solid ? 1 : 0.75) * Math.min(1, 1.6 - d / maxD)})`;
                        ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(o.x, o.y); ctx.stroke();
                    }
                }
            }
        }
        ctx.restore();
    }

    function chargeLabel(text, x, y, color) {
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    const ATOM_COL = { C: ['#475569', '#94a3b8'], O: ['#ef4444', '#dc2626'], H: ['#f8fafc', '#94a3b8'] };
    function drawTemplate(m) {
        const T = cur.tpl;
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = Math.max(1.4, 2.3 * T.s);
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (const [i, j] of T.bonds) { ctx.moveTo(T.atoms[i].x, T.atoms[i].y); ctx.lineTo(T.atoms[j].x, T.atoms[j].y); }
        ctx.stroke();
        if (T.dbl) {
            // dubbelbindning C=O
            const a = T.atoms[T.dbl[0]], b = T.atoms[T.dbl[1]];
            const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1, ox = -dy / l * 1.6 * T.s, oy = dx / l * 1.6 * T.s;
            ctx.beginPath();
            ctx.moveTo(a.x + ox, a.y + oy); ctx.lineTo(b.x + ox, b.y + oy);
            ctx.moveTo(a.x - ox, a.y - oy); ctx.lineTo(b.x - ox, b.y - oy);
            ctx.stroke();
        }
        for (const a of T.atoms) {
            ctx.beginPath(); ctx.arc(a.x, a.y, a.rr, 0, Math.PI * 2);
            ctx.fillStyle = ATOM_COL[a.e][0]; ctx.fill();
            ctx.strokeStyle = ATOM_COL[a.e][1]; ctx.lineWidth = 1; ctx.stroke();
        }
        if (renderOptions.charges) {
            ctx.rotate(-m.angle);
            const c = Math.cos(m.angle), s = Math.sin(m.angle);
            const rot = (a) => ({ x: a.x * c - a.y * s, y: a.x * s + a.y * c });
            for (const a of T.atoms) {
                if (a.e === 'O') { const p = rot(a); chargeLabel('δ⁻', p.x, p.y, '#fee2e2'); }
                else if (a.e === 'H') { const p = rot(a); chargeLabel('δ⁺', p.x, p.y, '#0369a1'); }
            }
            if (T.dbl) { const p = rot(T.atoms[T.dbl[0]]); chargeLabel('δ⁺', p.x, p.y, '#7dd3fc'); }
        }
    }

    function drawMolecule(m) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.angle);
        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (cur.tpl) {
            drawTemplate(m);
        } else if (cur.id === 'co2') {
            const d = 10;
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-d, -2); ctx.lineTo(d, -2);
            ctx.moveTo(-d, 2); ctx.lineTo(d, 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#334155'; ctx.fill();
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.2; ctx.stroke();
            for (const xp of [-d, d]) {
                ctx.beginPath();
                ctx.arc(xp, 0, 6.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444'; ctx.fill();
                ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 1; ctx.stroke();
            }
            if (renderOptions.charges) {
                ctx.rotate(-m.angle);
                const c = Math.cos(m.angle) * d, s = Math.sin(m.angle) * d;
                chargeLabel('δ⁻', -c, -s, '#fee2e2');
                chargeLabel('δ⁻', c, s, '#fee2e2');
                chargeLabel('δ⁺', 0, 0, '#7dd3fc');
            }
        } else if (cur.id === 'hcl') {
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.stroke();
            ctx.beginPath(); ctx.arc(-5, 0, 9.5, 0, Math.PI * 2);
            ctx.fillStyle = '#16a34a'; ctx.fill();
            ctx.strokeStyle = '#15803d'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.beginPath(); ctx.arc(9, 0, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#f8fafc'; ctx.fill();
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.stroke();
            if (renderOptions.charges) {
                const p1 = { x: -5, y: 0 }, p2 = { x: 9, y: 0 };
                ctx.rotate(-m.angle);
                const c = Math.cos(m.angle), s = Math.sin(m.angle);
                chargeLabel('δ⁻', p1.x * c, p1.x * s, '#dcfce7');
                chargeLabel('δ⁺', p2.x * c, p2.x * s, '#0369a1');
            }
        } else {
            const hx = H2O_D * Math.cos(H2O_A), hy = H2O_D * Math.sin(H2O_A);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(hx, hy);
            ctx.moveTo(0, 0); ctx.lineTo(hx, -hy);
            ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444'; ctx.fill();
            ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 1.2; ctx.stroke();
            for (const yy of [hy, -hy]) {
                ctx.beginPath(); ctx.arc(hx, yy, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff'; ctx.fill();
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.stroke();
            }
            if (renderOptions.charges) {
                ctx.rotate(-m.angle);
                const c = Math.cos(m.angle), s = Math.sin(m.angle);
                chargeLabel('δ⁻', 0, 0, '#fee2e2');
                for (const yy of [hy, -hy]) chargeLabel('δ⁺', hx * c - yy * s, hx * s + yy * c, '#0369a1');
            }
        }
        ctx.restore();
    }

    function drawCurve() {
        if (!cctx || cW === 0) return;
        const pad = { l: 34, r: 6, t: 6, b: 6 };
        const Tmin = T_MIN, Tmax = T_MAX;
        const gw = cW - pad.l - pad.r, gh = cH - pad.t - pad.b;
        const yOf = (T) => pad.t + (1 - (T - Tmin) / (Tmax - Tmin)) * gh;

        cctx.clearRect(0, 0, cW, cH);
        cctx.font = '9px monospace';
        cctx.textAlign = 'right';
        cctx.textBaseline = 'middle';
        for (let T = T_MIN; T &lt;= T_MAX; T += 50) {
            const y = yOf(T);
            cctx.strokeStyle = T === 0 ? 'rgba(148,163,184,0.35)' : 'rgba(148,163,184,0.12)';
            cctx.beginPath(); cctx.moveTo(pad.l, y); cctx.lineTo(cW - pad.r, y); cctx.stroke();
            cctx.fillStyle = '#64748b';
            cctx.fillText(fmt(T), pad.l - 4, y);
        }
        const t = trans();
        const lines = !renderOptions.points ? [] : t.subl ? [[t.mp, '#a78bfa', tr('sublShort')]] : [[t.mp, '#22d3ee', tr('mpShort')], [t.bp, '#fbbf24', tr('bpShort')]];
        cctx.setLineDash([4, 3]);
        cctx.textAlign = 'left';
        for (const [T, col, lab] of lines) {
            const y = yOf(T);
            cctx.strokeStyle = col;
            cctx.globalAlpha = 0.6;
            cctx.beginPath(); cctx.moveTo(pad.l, y); cctx.lineTo(cW - pad.r, y); cctx.stroke();
            cctx.globalAlpha = 1;
            cctx.fillStyle = col;
            cctx.fillText(lab, pad.l + 3, y - 6);
        }
        cctx.setLineDash([]);

        const maxPts = 360;
        const xOf = (i) => pad.l + (i / (maxPts - 1)) * gw;
        const off = maxPts - history.length;
        // termostat
        cctx.strokeStyle = 'rgba(148,163,184,0.45)';
        cctx.lineWidth = 1;
        cctx.setLineDash([2, 3]);
        cctx.beginPath();
        history.forEach((p, i) => { const X = xOf(i + off), Y = yOf(p.sp); i ? cctx.lineTo(X, Y) : cctx.moveTo(X, Y); });
        cctx.stroke();
        cctx.setLineDash([]);
        // ämnets temperatur
        cctx.strokeStyle = '#fb7185';
        cctx.lineWidth = 2;
        cctx.beginPath();
        history.forEach((p, i) => { const X = xOf(i + off), Y = yOf(p.T); i ? cctx.lineTo(X, Y) : cctx.moveTo(X, Y); });
        cctx.stroke();
    }

    function updateMarkers() {
        const t = trans();
        const pct = (T) => ((T - T_MIN) / (T_MAX - T_MIN) * 100).toFixed(2) + '%';
        const tick = (T, label, color, low) =>
            `&lt;div class="marker${low ? ' low' : ''}" style="left:${pct(T)};color:${color}">&lt;i>&lt;/i>${label}&lt;/div>`;
        // ändetiketterna döljs när en smält-/kokpunktsmarkering ligger så nära att texterna skulle krocka
        const show = renderOptions.points;
        const near = (E) => show &amp;&amp; (Math.abs(t.mp - E) &lt; 30 || Math.abs(t.bp - E) &lt; 30);
        let html = (near(T_MIN) ? '' : `&lt;div class="marker end" style="left:0">${fmt(T_MIN)}&lt;/div>`) +
                   (near(T_MAX) ? '' : `&lt;div class="marker end" style="left:100%">+${T_MAX}&lt;/div>`);
        const close = show &amp;&amp; !t.subl &amp;&amp; (t.bp - t.mp) &lt; 40;
        if (!show) {
            // dolda: bara skalans ändar och 0 °C
        } else if (t.subl) {
            html += tick(t.mp, `${tr('subl')} ${fmtT(t.mp)}°`, '#c4b5fd', false);
        } else {
            html += tick(t.mp, `${tr('mp')} ${fmtT(t.mp)}°`, '#67e8f9', false);
            html += tick(t.bp, `${tr('bp')} ${fmtT(t.bp)}°`, '#fcd34d', close);
        }
        if (!show || (Math.abs(t.mp) > 12 &amp;&amp; Math.abs(t.bp) > 12)) html += tick(0, '0°', '#64748b', false);
        const el = document.getElementById('slider-markers');
        el.innerHTML = html;
        el.style.height = close ? '44px' : '30px';
    }
