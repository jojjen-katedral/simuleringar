<!DOCTYPE html>
<html lang="sv">
<!-- BYGGD FIL: ändra inte här. Ändra i källfilerna och kör amnens-egenskaper/bygg.py. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ämnens egenskaper</title>
<style>
    :root { --bg: #0b1120; --panel: #0f172a; --panel-2: #0b1324; --line: #1e293b; --line-2: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b; --sky: #38bdf8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
    button { font: inherit; color: inherit; }
    .hidden { display: none !important; }
    .shell { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    /* ---------- Topprad med flikar ---------- */
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .brand p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .tab { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line-2); background: #1e293b; color: var(--muted); font-size: 13.5px; font-weight: 600; cursor: pointer; }
    .tab:hover { background: #273449; color: var(--text); }
    .tab.active { background: #0369a1; border-color: var(--sky); color: #fff; }
    .top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .btn { padding: 6px 11px; border-radius: 8px; cursor: pointer; background: #1e293b; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 600; }
    .btn:hover { background: #273449; }
    .btn.on { background: #0369a1; border-color: var(--sky); color: #fff; }
    .lang { display: flex; gap: 2px; padding: 2px; background: #1e293b; border: 1px solid var(--line-2); border-radius: 8px; }
    .lang button { padding: 3px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
    .lang button.active { background: #0369a1; color: #fff; }

    /* ---------- Huvudyta: ämnesbibliotek + delen ---------- */
    .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr); }
    .body.no-lib { grid-template-columns: minmax(0, 1fr); }
    .lib { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel-2); padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .grp h4 { color: #94a3b8; margin: 4px 2px 5px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .grp h4 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; font-size: 13px; }
    .item:hover { background: #1e293b; }
    .item.sel { background: #1e293b; border-color: var(--sky); }
    .item.na { opacity: 0.42; }
    .item small { color: var(--dim); font-size: 11px; white-space: nowrap; }
    .item .bd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 2px solid; margin-left: 5px; vertical-align: 1px; }
    .dots { display: flex; gap: 3px; }
    .dots b { width: 6px; height: 6px; border-radius: 50%; background: #334155; }
    .dots b.y { background: #7dd3fc; }

    .acard { background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 12px; font-size: 12.5px; line-height: 1.5; color: #cbd5e1; }
    .acard h3 { margin: 0 0 2px; font-size: 15px; color: #fff; }
    .acard .f { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
    .acard table { width: 100%; border-collapse: collapse; margin: 6px 0; }
    .acard td { padding: 1.5px 0; }
    .acard td:first-child { color: var(--muted); }
    .acard td:last-child { text-align: right; color: var(--text); }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid; }
    .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .acts .btn { font-size: 12px; padding: 5px 9px; }
    .acts .btn.here { border-color: var(--sky); }
    .hint { font-size: 11.5px; color: var(--dim); }

    .stage { position: relative; min-height: 0; }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 20px; text-align: center; }

    @media (max-width: 900px) {
        .body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
        .lib { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
        .body.no-lib { grid-template-rows: minmax(0, 1fr); }
        .stage { min-height: 70vh; }
        .brand p { display: none; }
    }
</style>
</head>
<body>
<div class="shell">
    <header class="top">
        <div class="brand">
            <h1 data-i18n="title">Ämnens egenskaper</h1>
            <p data-i18n="subtitle">Från bindningar mellan partiklarna till ämnets egenskaper</p>
        </div>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div class="top-r">
            <button id="btn-lib" class="btn on" onclick="toggleLib()" data-i18n="lib">☰ Ämnen</button>
            <div class="lang" role="group" aria-label="Språk / Language">
                <button data-lang="sv" class="active">SV</button>
                <button data-lang="en">EN</button>
            </div>
        </div>
    </header>
    <div class="body" id="body">
        <aside class="lib" id="lib">
            <div id="card"></div>
            <div id="list"></div>
        </aside>
        <main class="stage" id="stage">
            <div id="msg" class="msg hidden"></div>
        </main>
    </div>
</div>

<textarea id="tpl-varm" hidden>
&lt;!DOCTYPE html>
&lt;html lang="sv">
&lt;head>
&lt;meta charset="UTF-8">
&lt;meta name="viewport" content="width=device-width, initial-scale=1.0">
&lt;title>Molekylära Fasövergångar &amp; Värmerörelse&lt;/title>
&lt;style>
    :root {
        --bg: #0b1120;
        --panel: #0f172a;
        --panel-2: #0b1324;
        --line: #1e293b;
        --line-2: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --dim: #64748b;
        --sky: #38bdf8;
        --rose: #fb7185;
        --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
    }
    button, select, input { font: inherit; color: inherit; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .hidden { display: none !important; }

    /* ---------- Appens ram: allt viktigt ryms på en skärm ---------- */
    .app {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px 14px;
        max-width: 1600px;
        margin: 0 auto;
    }

    /* ---------- Topprad ---------- */
    .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
    }
    .title h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
    .title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .controls-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

    .subst-select {
        background: #1e293b; border: 1px solid var(--line-2); border-radius: 10px;
        padding: 7px 10px; font-size: 13px; font-weight: 500; color: #fff; min-width: 210px; cursor: pointer;
    }
    .subst-select:hover { background: #273449; }
    .bond-chip { padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; border: 1px solid; white-space: nowrap; }
    .pressure { display: flex; align-items: center; gap: 6px; padding-left: 10px; border-left: 1px solid var(--line-2); font-size: 12px; }
    .pressure select { background: #1e293b; border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
    .lang { display: flex; gap: 2px; padding: 2px; background: #1e293b; border: 1px solid var(--line-2); border-radius: 8px; }
    .lang button { padding: 3px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
    .lang button.active { background: #0369a1; color: #fff; }
    .theory-link { font-size: 12px; color: var(--sky); text-decoration: none; white-space: nowrap; }
    .theory-link:hover { text-decoration: underline; }

    /* ---------- Huvudyta ---------- */
    .main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 10px;
    }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

    .stage { display: flex; flex-direction: column; min-height: 0; padding: 10px; gap: 8px; }
    .stage-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; font-size: 12px; color: var(--muted); }
    .stage-bar strong { color: #7dd3fc; font-weight: 600; }
    .toggles { display: flex; align-items: center; gap: 12px; }
    .toggles label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text); }
    .icon-btn { background: #1e293b; border: 1px solid var(--line-2); border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 14px; }
    .icon-btn:hover { background: #273449; }

    .canvas-wrap {
        position: relative; flex: 1; min-height: 300px;
        background: #050811; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    }
    #simCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: none; }
    .toast {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        width: 90%; max-width: 460px; text-align: center;
        padding: 8px 14px; border-radius: 10px;
        background: rgba(79, 70, 229, 0.95); border: 1px solid rgba(165, 180, 252, 0.5);
        font-size: 12.5px; font-weight: 600; color: #fff;
        opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .status-overlay {
        position: absolute; left: 10px; bottom: 34px;
        pointer-events: none;
    }

    /* ---------- Termostat (direkt under kärlet) ---------- */
    .thermo {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px 18px;
        padding: 8px 4px 0;
        border-top: 1px solid var(--line);
    }
    .slider-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 0; font-size: 12px; }
    .slider-head .val { font-size: 16px; font-weight: 700; color: #fff; }
    .pts-toggle { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text); font-size: 12px; margin: 0 10px 0 auto; }
    input[type=range] {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 12px; margin: 8px 0 2px;
        background: linear-gradient(90deg, #0ea5e9, #64748b 50%, #f43f5e);
        border-radius: 6px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 24px; height: 24px; border-radius: 50%;
        background: #fff; border: 3px solid var(--sky);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.7); cursor: grab;
    }
    input[type=range]::-moz-range-thumb {
        width: 20px; height: 20px; border-radius: 50%;
        background: #fff; border: 3px solid var(--sky); cursor: grab;
    }
    .markers { position: relative; height: 30px; margin: 0 12px; font-size: 11px; }
    .marker { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap; font-weight: 700; }
    .marker i { width: 1px; height: 7px; background: currentColor; }
    .marker.low { top: 14px; }
    .marker.low i { height: 20px; margin-top: -14px; }
    .marker.end { font-weight: 400; color: var(--dim); top: 4px; }

    .btn-groups { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
    .btn {
        padding: 6px 10px; border-radius: 8px; cursor: pointer;
        background: #1e293b; border: 1px solid var(--line-2);
        font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .btn:hover { background: #273449; }
    .btn.cold { background: rgba(8, 51, 68, 0.6); border-color: rgba(14, 116, 144, 0.7); color: #67e8f9; }
    .btn.hot  { background: rgba(76, 5, 25, 0.6); border-color: rgba(190, 18, 60, 0.7); color: #fda4af; }
    .btn.seg { padding: 4px 9px; font-weight: 500; }
    .btn.seg.active { background: #0369a1; border-color: var(--sky); color: #fff; }
    .sep { width: 1px; height: 22px; background: var(--line-2); margin: 0 2px; }

    /* ---------- Verktyg: förstoringsglas, paus, stillbild ---------- */
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .btn.on { background: #0369a1; border-color: var(--sky); color: #fff; }
    .zoomset { display: flex; gap: 4px; align-items: center; }
    a.btn { text-decoration: none; color: inherit; display: inline-flex; align-items: center; }
    .paused-tag {
        position: absolute; left: 10px; top: 10px;
        padding: 4px 9px; border-radius: 6px;
        background: rgba(251, 191, 36, 0.92); color: #1c1917;
        font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
        pointer-events: none;
    }
    .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.35s; }

    .thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .thumb {
        position: relative; padding: 0; aspect-ratio: 1; overflow: hidden; cursor: pointer;
        background: #050811; border: 1px solid var(--line-2); border-radius: 8px;
    }
    .thumb:hover { border-color: var(--sky); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; display: block; }
    .thumb span {
        position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 4px;
        background: rgba(2, 6, 23, 0.82); color: #cbd5e1; font-size: 9.5px; text-align: left;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .viewer {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center; padding: 16px;
        background: rgba(2, 6, 23, 0.88);
    }
    .viewer-box {
        display: flex; flex-direction: column; gap: 10px;
        width: min(1400px, 100%); max-height: 100%;
        padding: 12px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px;
    }
    .viewer-imgs { display: flex; gap: 12px; justify-content: center; min-height: 0; }
    .viewer-imgs figure { margin: 0; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .viewer-imgs img {
        max-width: 100%; max-height: calc(100vh - 150px); object-fit: contain;
        background: #050811; border: 1px solid var(--line); border-radius: 8px;
    }
    .viewer-imgs figcaption { font-size: 12px; color: var(--muted); text-align: center; }
    .viewer-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .viewer-bar select { background: #1e293b; border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
    @media (max-width: 760px) { .viewer-imgs { flex-direction: column; } .viewer-imgs img { max-height: 40vh; } }

    /* ---------- Sidopanel ---------- */
    .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
    .side .card { padding: 12px; }
    .side h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--text); display: flex; justify-content: space-between; align-items: baseline; }
    .side h3 .sub { font-size: 10px; font-weight: 400; color: var(--dim); }
    .note { font-size: 10.5px; color: var(--dim); margin-top: 6px; line-height: 1.4; }

    .temp-big { font-size: 30px; font-weight: 700; color: var(--rose); line-height: 1.05; }
    .temp-big small { font-size: 14px; font-weight: 400; color: var(--dim); margin-left: 4px; }
    .setpoint-line { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .status {
        display: inline-flex; align-items: center; gap: 7px;
        margin-top: 10px; padding: 6px 10px; border-radius: 999px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
        border: 1px solid; line-height: 1.2;
    }
    .status .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
    .status.pulse .dot { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .st-solid  { color: #93c5fd; background: rgba(30, 58, 138, 0.35); border-color: rgba(59, 130, 246, 0.5); }
    .st-melt   { color: #c7d2fe; background: rgba(55, 48, 163, 0.4); border-color: rgba(129, 140, 248, 0.6); }
    .st-liquid { color: #6ee7b7; background: rgba(6, 78, 59, 0.4); border-color: rgba(16, 185, 129, 0.5); }
    .st-boil   { color: #fcd34d; background: rgba(120, 53, 15, 0.4); border-color: rgba(251, 191, 36, 0.6); }
    .st-subl   { color: #ddd6fe; background: rgba(76, 29, 149, 0.4); border-color: rgba(167, 139, 250, 0.6); }
    .st-gas    { color: #fda4af; background: rgba(136, 19, 55, 0.35); border-color: rgba(244, 63, 94, 0.5); }

    .meter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; }
    .meter .track { flex: 1; height: 9px; background: #1e293b; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; }
    .meter .fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #fbbf24, #f43f5e); }

    .curve-wrap { position: relative; height: 150px; }
    .curve-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    .comp { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #1e293b; border: 1px solid var(--line-2); }
    .comp div { height: 100%; transition: width 0.2s; }
    .comp-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11.5px; }

    .legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
    .lg { display: flex; align-items: center; gap: 8px; }
    .sw { width: 13px; height: 13px; border-radius: 50%; flex: none; }
    .sw-line { width: 22px; height: 0; border-top: 2px dashed; flex: none; }

    /* ---------- Teori (under helskärmsytan) ---------- */
    .theory { max-width: 1600px; margin: 0 auto; padding: 4px 14px 24px; }
    .theory .card { padding: 14px; }
    .theory h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); }
    .theory-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .tcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.55; color: #cbd5e1; }
    .tcard h4 { margin: 0 0 4px; font-size: 13px; color: var(--accent, #7dd3fc); }
    .tcard strong { color: #fff; }

    /* ---------- Mindre skärmar ---------- */
    @media (max-width: 1023px) {
        .app { height: auto; }
        .main { grid-template-columns: 1fr; }
        .canvas-wrap { flex: none; height: 56vh; min-height: 340px; }
        .side { overflow: visible; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        .theory-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
        .thermo { grid-template-columns: 1fr; }
        .btn-groups, .btn-row { align-items: stretch; justify-content: flex-start; }
        .title p { display: none; }
        .subst-select { min-width: 0; max-width: 220px; }
    }
    @media (max-height: 760px) and (min-width: 1024px) {
        .title p { display: none; }
        .curve-wrap { height: 120px; }
        .side .note { display: none; }
    }
&lt;/style>
&lt;/head>
&lt;body>

&lt;div class="app">
    &lt;!-- Topprad: titel + ämnesval -->
    &lt;header class="topbar">
        &lt;div class="title">
            &lt;h1 data-i18n="title">Molekylära Fasövergångar &amp; Värmerörelse&lt;/h1>
            &lt;p data-i18n="subtitle">Observera hur partiklarnas rörelseenergi och de intermolekylära bindningarna styr aggregationsformerna.&lt;/p>
        &lt;/div>

            'solid>sublime': 'Sublimation at {T} °C: the molecules leave the crystal directly as gas.',
            'gas>sublime':   'Deposition at {T} °C: gas molecules attach directly to the crystal.',
            'sublime>gas':   'Everything has sublimated. Now the temperature rises again.',
            'sublime>solid': 'All the gas has been deposited. Now the temperature falls again.',
            lgC: 'Carbon (C, δ⁺)', lgO: 'Oxygen (O, δ⁻)', lgVdw: 'van der Waals force',
            lgCl: 'Chlorine (Cl, δ⁻)', lgH: 'Hydrogen (H, δ⁺)', lgDd: 'Dipole–dipole force (H···Cl)', lgHb: 'Hydrogen bond (H···O)',
            lgCchain: 'Carbon (C). Hydrogens on carbon are not shown.', lgOgen: 'Oxygen (O, δ⁻)', lgHoh: 'Hydrogen in O–H (δ⁺)',

            lgVdwChain: 'van der Waals force between the carbon chains (thicker line = longer chain)', vdwToggle: 'van der Waals',
            bond_co2: 'van der Waals forces (dispersion)', bond_hcl: 'dipole–dipole and van der Waals', bond_h2o: 'hydrogen bonds',
            bond_hb: 'hydrogen bonds and van der Waals', bond_dd: 'dipole–dipole and van der Waals', bond_vdw: 'van der Waals forces'
        }
    };

    let lang = 'sv';
    const tr = (key) => (I18N[lang][key] ?? I18N.sv[key] ?? key);

    function applyLang(newLang) {
        if (newLang) lang = I18N[newLang] ? newLang : 'sv';
        try { localStorage.setItem('fasovergangar-lang', lang); } catch (e) { /* ignoreras */ }
        document.documentElement.lang = lang;
        document.title = tr('docTitle');
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = tr(el.dataset.i18nTitle); });
        document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', tr(el.dataset.i18nAria)); });

        refreshSubstanceTexts();
        updateSetpointUI();

        updateUI();

    }

    function initialLang() {
        const q = new URLSearchParams(location.search).get('lang');
        if (q &amp;&amp; I18N[q]) return q;
        try { const sLang = localStorage.getItem('fasovergangar-lang'); if (sLang &amp;&amp; I18N[sLang]) return sLang; } catch (e) { /* ignoreras */ }

    }

    // =====================================================================
    //  ÄMNESDATA
    //  M = molmassa (g/mol), r = kollisionsradie (px)
    //  Entalpier i kJ/mol (smältning, förångning, sublimering)
    // =====================================================================
    const card = (color, title, body) =>
        `&lt;div class="tcard" style="--accent:${color}">&lt;h4>${title}&lt;/h4>${body}&lt;/div>`;

    const SUBSTANCES = {
        co2: {
            id: 'co2', formula: 'CO₂', M: 44, r: 15, bonds: ['vdw'],
            lattice: 'hex', sx: 32, sy: 28,
            pressures: {
                '1atm':  { subl: true,  mp: -78.5, bp: -78.5, Hsub: 25.2 },
                '10atm': { subl: false, mp: -56.4, bp: -40.0, Hfus: 9.0, Hvap: 14.0 }
            },
            explanation: () => lang === 'en' ? [
                card('#34d399', 'Geometry and symmetry',
                    'O=C=O is linear. Each C=O bond is polar (&amp;delta;⁻ on O, &amp;delta;⁺ on C), but because the molecule is symmetrical the dipoles cancel out. The molecule as a whole is therefore &lt;strong>non-polar&lt;/strong>.'),

                    'The electron clouds fluctuate all the time and form temporary dipoles. These give weak attractions between neighbouring molecules. The forces have no direction, so they are drawn as lines between the centres of the molecules.'),
                card('#34d399', 'Sublimation and pressure',
                    co2Pressure === '1atm'
                        ? 'At 1 atm, solid CO₂ (dry ice) &lt;strong>sublimes&lt;/strong> directly to gas at &lt;strong>−78.5 °C&lt;/strong>. Liquid CO₂ only exists above the pressure of the triple point, &lt;strong>5.1 atm&lt;/strong> (−56.6 °C). Choose 10 atm to see the liquid.'
                        : 'At 10 atm there is a liquid phase: CO₂ melts at about &lt;strong>−56 °C&lt;/strong> and boils at about &lt;strong>−40 °C&lt;/strong>. The melting point hardly changes with pressure, but the boiling point rises a lot.')
            ].join('') : [
                card('#34d399', 'Geometri och symmetri',
                    'O=C=O är linjär. Varje C=O-bindning är polär (&amp;delta;⁻ på O, &amp;delta;⁺ på C), men eftersom molekylen är symmetrisk tar dipolerna ut varandra. Molekylen som helhet är därför &lt;strong>opolär&lt;/strong>.'),
                card('#34d399', 'Van der Waals-bindningar',
                    'Elektronmolnen fluktuerar hela tiden och bildar tillfälliga dipoler. De ger svaga attraktioner mellan grannmolekylerna. Bindningarna saknar riktning, så de ritas som streck mellan molekylernas mittpunkter.'),
                card('#34d399', 'Sublimering och tryck',
                    co2Pressure === '1atm'
                        ? 'Vid 1 atm &lt;strong>sublimerar&lt;/strong> fast CO₂ (torris) direkt till gas vid &lt;strong>−78,5 °C&lt;/strong>. Flytande CO₂ finns bara över trippelpunktens tryck, &lt;strong>5,1 atm&lt;/strong> (−56,6 °C). Välj 10 atm för att se vätskan.'
                        : 'Vid 10 atm finns en flytande fas: CO₂ smälter vid ca &lt;strong>−56 °C&lt;/strong> och kokar vid ca &lt;strong>−40 °C&lt;/strong>. Smältpunkten påverkas knappt av trycket, men kokpunkten stiger kraftigt.')
            ].join('')
        },
        hcl: {
            id: 'hcl', formula: 'HCl', M: 36.5, r: 14, bonds: ['dd', 'vdw'],
            lattice: 'hex', sx: 32, sy: 26,
            mp: -114.2, bp: -85.1, Hfus: 2.0, Hvap: 16.2,
            explanation: () => lang === 'en' ? [
                card('#fbbf24', 'Permanent dipole',
                    'Chlorine is more electronegative than hydrogen. The shared electrons are pulled towards chlorine, which gets &amp;delta;⁻, while hydrogen gets &amp;delta;⁺.'),
                card('#fbbf24', 'Dipole–dipole force',
                    'The positive end (H) is attracted to the negative end (Cl) of a neighbouring molecule. In the crystal the molecules therefore line up in chains H···Cl–H···Cl. Van der Waals forces also contribute.'),
                card('#fbbf24', 'Phase transitions',
                    'Melts at &lt;strong>−114.2 °C&lt;/strong> and boils at &lt;strong>−85.1 °C&lt;/strong>. In the liquid, the bonds are constantly broken and formed again.')
            ].join('') : [
                card('#fbbf24', 'Permanent dipol',
                    'Klor är mer elektronegativt än väte. De delade elektronerna förskjuts mot klor, som får &amp;delta;⁻, medan väte får &amp;delta;⁺.'),
                card('#fbbf24', 'Dipol–dipolbindning',
                    'Den positiva änden (H) attraheras av grannens negativa ände (Cl). I kristallen ligger molekylerna därför i kedjor H···Cl–H···Cl. Även van der Waals-bindningar bidrar.'),
                card('#fbbf24', 'Fasövergångar',
                    'Smälter vid &lt;strong>−114,2 °C&lt;/strong> och kokar vid &lt;strong>−85,1 °C&lt;/strong>. I vätskan bryts och bildas bindningarna hela tiden.')

        },
        h2o: {
