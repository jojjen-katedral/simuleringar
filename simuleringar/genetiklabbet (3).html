<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genetiklabbet</title>
<style>
  /* ============================================================
     GENETIKLABBET – korsningar med bananflugor, ärtor, höns och lejongap
     Fristående fil: inga externa filer eller typsnitt laddas.
     Kan styras med adressen: ?lang=en&art=pea   (art = fly, pea, hen, snap)
     ============================================================ */
  :root {
    color-scheme: dark;
    --bg: #080d14;
    --panel: #0e1621;
    --panel-2: #121c29;
    --panel-3: #172334;
    --line: rgba(255, 255, 255, 0.12);
    --text: #f0f4f8;
    --muted: #94a3b8;
    --accent: #00d2ff;
    --gold: #ffc107;
    --green: #00e676;
    --pink: #f472b6;
    --red: #f87171;
    --violet: #c4b5fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
  }
  sup { font-size: 0.68em; line-height: 0; vertical-align: 0.55em; }
  sup sup { font-size: 0.85em; vertical-align: 0.4em; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, .switch input:focus-visible + .track, .chip:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  /* ---------- Sidhuvud ---------- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 8px 16px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .title-group { min-width: 0; }
  .title-group h1 { font-size: 1.1rem; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .title-group p { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
  .badge-pill {
    background: rgba(0, 210, 255, 0.15); color: var(--accent); border: 1px solid rgba(0, 210, 255, 0.35);
    padding: 1px 8px; border-radius: 999px; font-size: 0.68rem; font-weight: 600;
  }
  .settings { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang-switch button { background: transparent; color: var(--muted); border: 0; padding: 4px 10px; font-size: 0.74rem; font-weight: 700; }
  .lang-switch button[aria-pressed="true"] { background: var(--accent); color: #0b111a; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 0.76rem; cursor: pointer; position: relative; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { position: relative; width: 32px; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.18); transition: background .2s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }

  /* ---------- Layout ---------- */
  main { max-width: 1280px; margin: 0 auto; padding: 12px 14px 40px; display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .panel > h2 { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--green); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel > h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); font-size: 0.78rem; }

  .species-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .species-tab {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; text-align: left;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); min-width: 0;
  }
  .species-tab:hover { background: var(--panel-3); }
  .species-tab[aria-pressed="true"] { border-color: var(--accent); background: rgba(0, 210, 255, 0.10); box-shadow: 0 0 0 1px var(--accent) inset; }
  .species-tab .sp-pic { width: 42px; height: 42px; flex: none; }
  .species-tab .sp-name { font-weight: 700; font-size: 0.92rem; }
  .species-tab .sp-latin { font-size: 0.7rem; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Egenskaper ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; flex-direction: column; align-items: flex-start; gap: 3px;
    padding: 7px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); text-align: left;
  }
  .chip:hover:not(:disabled) { background: var(--panel-3); }
  .chip[aria-pressed="true"] { border-color: var(--green); background: rgba(0, 230, 118, 0.10); }
  .chip:disabled { opacity: 0.4; cursor: not-allowed; }
  .chip .chip-name { font-weight: 700; font-size: 0.86rem; }
  .chip .chip-name::before { content: "○ "; color: var(--muted); }
  .chip[aria-pressed="true"] .chip-name::before { content: "● "; color: var(--green); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 0.66rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); color: #cbd5e1; }
  .tag.t-sex { color: #f9a8d4; border-color: rgba(244,114,182,.45); background: rgba(244,114,182,.12); }
  .tag.t-int { color: #fcd34d; border-color: rgba(252,211,77,.45); background: rgba(252,211,77,.10); }
  .tag.t-leth { color: #fca5a5; border-color: rgba(248,113,113,.45); background: rgba(248,113,113,.12); }
  .tag.t-link { color: #93c5fd; border-color: rgba(147,197,253,.45); background: rgba(147,197,253,.10); }
  .tag.t-epi { color: #c4b5fd; border-color: rgba(196,181,253,.45); background: rgba(196,181,253,.10); }
  .tag.t-dom { color: #86efac; border-color: rgba(134,239,172,.4); background: rgba(134,239,172,.08); }

  .trait-info { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 12px; }
  .info-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: #d1d5db; }
  .info-card h3 { font-size: 0.9rem; color: var(--text); margin-bottom: 4px; }
  .info-card .legend { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .info-card .legend b { color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace; display: inline-block; min-width: 44px; }
  .note { margin-top: 10px; font-size: 0.8rem; color: #bfdbfe; background: rgba(59,130,246,.10); border: 1px solid rgba(59,130,246,.3); border-radius: 10px; padding: 8px 12px; }
  .note.warn { color: #fecaca; background: rgba(248,113,113,.10); border-color: rgba(248,113,113,.35); }

  /* ---------- Föräldrar ---------- */
  .parents { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .parent-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pc-title { font-weight: 700; font-size: 0.95rem; }
  .gen-tag { font-size: 0.68rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: rgba(255,193,7,.14); color: var(--gold); border: 1px solid rgba(255,193,7,.4); white-space: nowrap; }
  .pc-body { display: flex; gap: 12px; align-items: center; }
  .pc-pic { width: 112px; height: 112px; flex: none; background: radial-gradient(circle at 50% 45%, #1d2b3f, #0b121c 75%); border-radius: 12px; border: 1px solid var(--line); }
  .pc-pic svg, .big-pic svg { width: 100%; height: 100%; display: block; }
  .pheno-list { list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: 0.84rem; }
  .pheno-list li::before { content: "▸ "; color: var(--green); }
  .geno { margin-top: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1rem; font-weight: 700; color: var(--accent); word-break: break-word; }
  .geno.hiddeng { color: var(--violet); }
  .geno-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; }
  .mini-btn {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); color: #e2e8f0;
    padding: 3px 9px; border-radius: 999px; font-size: 0.74rem;
  }
  .mini-btn:hover { background: rgba(255,255,255,0.16); }
  .mini-btn.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
  .mini-btn.mystery { border-color: rgba(196,181,253,.5); color: var(--violet); }

  .chromos { display: flex; flex-wrap: wrap; gap: 8px; }
  .cpair { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 8px; }
  .cpair-label { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; text-align: center; }
  .homologs { display: flex; gap: 6px; justify-content: center; }
  .homolog {
    min-width: 58px; border-radius: 14px; padding: 6px 4px; display: flex; flex-direction: column; gap: 4px; align-items: center;
    background: linear-gradient(90deg, #3b2f5c, #54428a 50%, #3b2f5c); border: 1px solid rgba(196,181,253,.35);
  }
  .homolog.h1 { background: linear-gradient(90deg, #1f4a52, #2c6d78 50%, #1f4a52); border-color: rgba(103,232,249,.35); }
  .homolog.ychr { justify-content: center; min-height: 40px; background: linear-gradient(90deg, #333a44, #4b5563 50%, #333a44); border-color: rgba(255,255,255,.2); color: #cbd5e1; font-weight: 700; }
  .homolog .ylabel { font-size: 0.85rem; }
  .homolog .ynote { font-size: 0.6rem; color: #cbd5e1; text-align: center; max-width: 70px; }
  .locus { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .locus-name { font-size: 0.6rem; color: rgba(255,255,255,0.6); }
  .locus select, .locus .allele {
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 1px 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 0.8rem; color: #fff; text-align: center;
  }
  .locus select option { background: #0e1621; color: #fff; }
  .chromo-cap { font-size: 0.7rem; color: var(--muted); }

  .cross-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 4px; }
  .cross-x { font-size: 2.2rem; font-weight: 300; color: var(--muted); line-height: 1; }
  .cross-btn {
    background: linear-gradient(135deg, #00d2ff, #00e676); color: #06121a; border: 0; border-radius: 999px;
    font-weight: 800; padding: 10px 20px; font-size: 0.95rem; box-shadow: 0 0 18px rgba(0,210,255,.3); white-space: nowrap;
  }
  .cross-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .n-select { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.72rem; color: var(--muted); }
  .n-select select, .sel { background: var(--panel-3); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; color: var(--text); }
  .self-row { font-size: 0.78rem; display: flex; gap: 6px; align-items: center; color: #d1d5db; }
  .self-card { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 0.85rem; border: 1px dashed var(--line); border-radius: 10px; padding: 16px; }

  .guess { background: rgba(196,181,253,.07); border: 1px solid rgba(196,181,253,.3); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; }
  .guess-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .guess-row .gname { min-width: 90px; color: #ddd6fe; }
  .ok { color: var(--green); font-weight: 700; }
  .bad { color: var(--red); font-weight: 700; }

  /* ---------- Resultat ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
  .tab { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 6px 12px; font-weight: 700; font-size: 0.85rem; }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .count { font-size: 0.7rem; background: rgba(255,255,255,.1); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  .sub-h { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gold); margin: 14px 0 6px; }
  .sub-h:first-child { margin-top: 0; }
  .muted { color: var(--muted); font-size: 0.84rem; }
  .gamete-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .gamete-row .who { font-size: 0.78rem; color: var(--muted); min-width: 110px; }
  .gamete { display: inline-flex; align-items: baseline; gap: 4px; padding: 2px 9px; border-radius: 999px; background: rgba(0,210,255,.10); border: 1px solid rgba(0,210,255,.35); font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 0.85rem; }
  .gamete.f { background: rgba(244,114,182,.10); border-color: rgba(244,114,182,.4); }
  .gamete small { font-family: system-ui, sans-serif; font-weight: 600; color: var(--muted); font-size: 0.68rem; }
  .gamete.rec { border-style: dashed; }

  .punnett-wrap { overflow-x: auto; padding-bottom: 4px; }
  table.punnett { border-collapse: separate; border-spacing: 3px; margin: 0 auto; }
  .punnett th { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.82rem; padding: 4px 6px; border-radius: 8px; white-space: nowrap; }
  .punnett th.col { background: rgba(0,210,255,.12); color: #bae6fd; }
  .punnett th.row { background: rgba(244,114,182,.12); color: #fbcfe8; }
  .punnett th small { display: block; font-family: system-ui, sans-serif; font-size: 0.64rem; color: var(--muted); font-weight: 600; }
  .punnett th.corner { background: transparent; font-family: system-ui, sans-serif; font-size: 0.7rem; color: var(--muted); }
  .punnett td { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; text-align: center; vertical-align: top; min-width: 74px; }
  .punnett td .mini { width: 44px; height: 44px; margin: 0 auto; }
  .punnett td .mini svg { width: 100%; height: 100%; }
  .punnett td .cg { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.76rem; font-weight: 700; color: #e0f2fe; white-space: nowrap; }
  .punnett td .cs { font-size: 0.68rem; color: var(--muted); }
  .punnett td.lethal { background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.4); }
  .punnett td.lethal .mini { opacity: .25; filter: grayscale(1); }
  .punnett.small td { min-width: 56px; }
  .punnett.small td .mini { width: 30px; height: 30px; }
  .punnett.small td .cg { font-size: 0.64rem; }
  .punnett.small th { font-size: 0.68rem; padding: 3px; }

  .tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .data th { text-align: left; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  .data td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
  .data td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .data td.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; color: #e0f2fe; }
  .data .ph-cell { display: flex; align-items: center; gap: 8px; }
  .data .ph-cell .mini { width: 34px; height: 34px; flex: none; }
  .data .ph-cell .mini svg { width: 100%; height: 100%; }
  .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; min-width: 60px; position: relative; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .bar i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--gold); }
  .ratio-box { margin-top: 8px; font-size: 0.9rem; background: rgba(255,193,7,.08); border: 1px solid rgba(255,193,7,.3); border-radius: 10px; padding: 8px 12px; }
  .ratio-box b { color: var(--gold); font-size: 1.05rem; font-family: ui-monospace, Menlo, Consolas, monospace; }

  .off-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .act-btn { background: rgba(0,210,255,.15); border: 1px solid rgba(0,210,255,.45); color: #e0f2fe; font-weight: 600; padding: 5px 12px; border-radius: 999px; font-size: 0.8rem; }
  .act-btn:hover { background: var(--accent); color: #0b111a; }
  .act-btn.alt { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.2); }
  .act-btn.alt:hover { background: rgba(255,255,255,.18); color: var(--text); }
  .brood { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 4px; margin-top: 10px; }
  .kid { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; aspect-ratio: 1; position: relative; }
  .kid:hover { border-color: var(--accent); background: var(--panel-3); }
  .kid svg { width: 100%; height: 100%; display: block; }
  .kid .sx { position: absolute; top: 1px; right: 4px; font-size: 0.66rem; font-weight: 700; }
  .sx.f, .sexf { color: #f9a8d4; }
  .sx.m, .sexm { color: #93c5fd; }
  .chi-box { margin-top: 10px; background: rgba(196,181,253,.07); border: 1px solid rgba(196,181,253,.3); border-radius: 10px; padding: 8px 12px; font-size: 0.84rem; }
  .chi-box b { color: var(--violet); }

  .journal { display: flex; flex-direction: column; gap: 8px; }
  .jentry { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.82rem; }
  .jentry .jhead { font-weight: 700; margin-bottom: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .jentry .jno { color: var(--gold); }
  .jentry .jres { color: #d1d5db; }
  .jentry { display: flex; flex-direction: column; gap: 3px; padding: 10px 14px; }
  .jentry .jhead { font-size: 1rem; margin-bottom: 2px; }
  .jsec { margin-top: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--green); }
  .jrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px; align-items: baseline; }
  .jlab { color: var(--muted); font-weight: 600; }
  .jlist { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2px 14px; color: #d1d5db; }
  @media (max-width: 560px) { .jrow { grid-template-columns: minmax(0, 1fr); gap: 0; } }
  .jentry .mono { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--accent); font-weight: 700; }

  /* ---------- Inspektionsruta ---------- */
  dialog#inspector, dialog#journalDlg {
    margin: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text);
    width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0;
  }
  dialog#journalDlg { width: min(820px, calc(100vw - 24px)); }
  dialog#inspector::backdrop, dialog#journalDlg::backdrop { background: rgba(0,0,0,.6); }
  .insp { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .insp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .insp-head h3 { font-size: 1.05rem; }
  .close-x { background: transparent; border: 0; color: var(--muted); font-size: 1.3rem; line-height: 1; padding: 2px 6px; }
  .big-pic { width: 150px; height: 150px; flex: none; background: radial-gradient(circle at 50% 45%, #1d2b3f, #0b121c 75%); border-radius: 12px; border: 1px solid var(--line); }
  .insp-actions { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- Tydligare layout ---------- */
  .parents.selfing { grid-template-columns: minmax(0, 1fr) auto; }
  .self-sw { margin-left: auto; font-weight: 600; }
  .pc-pic { width: 150px; height: 150px; }
  .pheno-list { gap: 4px; }
  .pheno-list li { font-size: 0.9rem; font-weight: 600; }
  .info-wrap { margin-top: 10px; }
  .info-wrap summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .info-wrap summary:hover { color: var(--text); }

  table.punnett.ex td .mini.empty { display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.15); font-size: 1.6rem; }
  table.punnett.ex.small td { min-width: 84px; }
  .dead { font-size: 0.72rem; color: var(--red); font-weight: 700; }

  table.chi { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
  .chi th { text-align: center; font-size: 0.74rem; color: var(--muted); font-weight: 700; padding: 6px; border-bottom: 1px solid var(--line); }
  .chi td { padding: 6px; border-bottom: 1px solid rgba(255,255,255,.06); text-align: center; }
  .chi td:first-child { text-align: left; }
  .chi tfoot td { border-bottom: 0; font-weight: 700; }
  .formula { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--panel-2); border-radius: 8px; padding: 4px 10px; display: inline-block; color: var(--eq, #fef08a); }
  .crit { border-collapse: collapse; font-size: 0.8rem; }
  .crit td, .crit th { border: 1px solid var(--line); padding: 3px 9px; text-align: center; }
  .crit th { color: var(--muted); font-weight: 600; }
  .concl { display: flex; flex-direction: column; gap: 6px; font-size: 0.86rem; }
  .concl label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .verdict { font-weight: 700; }

  @media (max-width: 1000px) {
    .sp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pp-row { grid-template-columns: minmax(0, 1fr); }
    .x-sep { justify-self: center; }
  }
  @media (max-width: 560px) {
    .step-btn { min-width: 0; padding: 6px 8px; }
    .step-btn .sv { display: none; }
    .step-btn .lbl { display: none; }
    .step-btn.cur .lbl { display: inline; }
    .step-btn.cur { flex: 3 1 0; }
    .sp-img { width: 110px; height: 110px; }
    .pp-pic { width: 110px; height: 110px; }
    .step-h { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<header>
  <div class="title-group">
    <h1><span aria-hidden="true">🧬</span> <span id="appTitle">Genetiklabbet</span> <span class="badge-pill" id="appBadge">Korsningssimulering</span></h1>
    <p id="appSubtitle"></p>
  </div>
  <div class="settings">
    <button type="button" class="mini-btn" data-act="journal" id="journalBtn">📓 Labbjournal</button>
    <div class="lang-switch" role="group" id="langGroup" aria-label="Språk">
      <button type="button" id="langSv" data-lang="sv" aria-pressed="true">SV</button>
      <button type="button" id="langEn" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<nav class="stepper" id="stepper" aria-label="Steg"></nav>
<main class="wrap" id="stage"></main>
<dialog id="inspector"><div class="insp" id="inspBody"></div></dialog>
<dialog id="journalDlg"><div class="insp" id="journalBody"></div></dialog>
<script>

(function () {
  "use strict";

  // ============================================================
  // STANDARDVAL – ändra här om sidan ska starta på engelska eller
  // med en annan art. Kan också styras med adressen: ?lang=en&art=pea
  // ============================================================
  const DEFAULT_LANG = "sv";       // "sv" eller "en"
  const DEFAULT_SPECIES = "pea";   // "fly", "pea", "hen" eller "snap"
  const MAX_TRAITS = 3;

  const $ = (id) => document.getElementById(id);
  function readStored(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignoreras */ } }
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") || readStored("genetik-lang") || DEFAULT_LANG;
  if (lang !== "sv" && lang !== "en") lang = "sv";
  const tt = (o) => (o == null ? "" : typeof o === "string" ? o : (o[lang] != null ? o[lang] : o.sv));
  const S2 = (sv, en) => ({ sv, en });

  let svgCounter = 0;

  // ============================================================
  // ARTER, GENER OCH EGENSKAPER
  // Autosomala gener med dominans: versal = dominant allel, gemen = recessiv.
  // Allelerna står i dominansordning: först dominant (eller vildtyp),
  // sist recessiv. Den sista allelen används för testkorsning.
  // ============================================================
  const SPECIES = {
    // ---------------------------------------------------------- BANANFLUGA
    fly: {
      name: S2("Bananfluga", "Fruit fly"), latin: "Drosophila melanogaster",
      sexSystem: "XY", noMaleRecomb: true, notation: "mendel", selfing: false,
      chrs: {
        X: { sex: true, label: S2("X-kromosomen", "X chromosome") },
        "2": { label: S2("Kromosom 2", "Chromosome 2") },
        "3": { label: S2("Kromosom 3", "Chromosome 3") }
      },
      genes: {
        w:  { chr: "X", pos: 1.5,  alleles: [["w+", "w<sup>+</sup>", S2("röda ögon (vildtyp)", "red eyes (wild type)")], ["w", "w", S2("vita ögon", "white eyes")]] },
        Cy: { chr: "2", pos: 6.1,  lethalHomo: "Cy", def: "cy", alleles: [["Cy", "Cy", S2("uppåtkrökta vingar – dödlig som homozygot", "curled-up wings – lethal when homozygous")], ["cy", "cy", S2("raka vingar (vildtyp)", "straight wings (wild type)")]] },
        b:  { chr: "2", pos: 48.5, alleles: [["B", "B", S2("grå kropp (vildtyp)", "grey body (wild type)")], ["b", "b", S2("svart kropp", "black body")]] },
        vg: { chr: "2", pos: 67.0, alleles: [["Vg", "Vg", S2("normala vingar (vildtyp)", "normal wings (wild type)")], ["vg", "vg", S2("stumpvingar", "vestigial wings")]] },
        e:  { chr: "3", pos: 70.7, alleles: [["E", "E", S2("grå kropp (vildtyp)", "grey body (wild type)")], ["e", "e", S2("mörk, ebenholtsfärgad kropp", "dark, ebony body")]] }
      },
      traits: [
        { id: "eye", genes: ["w"], name: S2("Ögonfärg", "Eye colour"),
          tags: [["sex", S2("Könsbunden (X)", "Sex-linked (X)")], ["", S2("Recessiv", "Recessive")]],
          info: S2("Genen <i>white</i> sitter på X-kromosomen. Hanar (XY) har bara en kopia, så en enda w-allel ger vita ögon. Thomas Hunt Morgan hittade den vitögda hanen 1910 – det första beviset för att gener sitter på kromosomer. Prova vitögd hona × röd hane och sedan tvärtom!",
                   "The <i>white</i> gene sits on the X chromosome. Males (XY) have only one copy, so a single w allele gives white eyes. Thomas Hunt Morgan found the white-eyed male in 1910 – the first evidence that genes sit on chromosomes. Try white-eyed female × red male, and then the reciprocal cross!") },
        { id: "wing", genes: ["vg"], name: S2("Vingform (vestigial)", "Wing shape (vestigial)"),
          tags: [["", S2("Autosomal recessiv", "Autosomal recessive")], ["link", S2("Kromosom 2", "Chromosome 2")]],
          info: S2("Flugor med två vg-alleler får korta, skrynkliga stumpvingar och kan inte flyga. En klassisk monohybrid korsning ger 3 : 1 i F2.",
                   "Flies with two vg alleles get short, crumpled vestigial wings and cannot fly. A classic monohybrid cross gives 3 : 1 in F2.") },
        { id: "body", genes: ["b"], name: S2("Kroppsfärg (black)", "Body colour (black)"),
          tags: [["", S2("Autosomal recessiv", "Autosomal recessive")], ["link", S2("Kopplad till vg", "Linked to vg")]],
          info: S2("b och vg sitter båda på kromosom 2, cirka 18,5 cM (centimorgan) från varandra. Välj båda för att studera <b>koppling och överkorsning</b>: testkorsa en dubbelheterozygot hona och räkna rekombinanterna! Obs! Bananflughanar har ingen överkorsning alls.",
                   "b and vg both sit on chromosome 2, about 18.5 cM (centimorgans) apart. Choose both to study <b>linkage and crossing over</b>: testcross a double heterozygous female and count the recombinants! Note: fruit fly males have no crossing over at all.") },
        { id: "ebony", genes: ["e"], name: S2("Kroppsfärg (ebony)", "Body colour (ebony)"),
          tags: [["", S2("Autosomal recessiv", "Autosomal recessive")], ["", S2("Kromosom 3", "Chromosome 3")]],
          info: S2("Ebony-flugor är nästan svarta. Genen sitter på kromosom 3 och nedärvs därför oberoende av vg – kombinera med vingform för en dihybrid korsning med 9 : 3 : 3 : 1 i F2.",
                   "Ebony flies are almost black. The gene sits on chromosome 3 and is therefore inherited independently of vg – combine with wing shape for a dihybrid cross with 9 : 3 : 3 : 1 in F2.") },
        { id: "curly", genes: ["Cy"], name: S2("Krulliga vingar (Curly)", "Curly wings"),
          tags: [["dom", S2("Dominant", "Dominant")], ["leth", S2("Letal som homozygot", "Lethal when homozygous")]],
          info: S2("Curly är dominant – en enda Cy-allel räcker för uppåtböjda vingar. Men två Cy-alleler är dödligt, så embryot utvecklas aldrig. Därför ger Curly × Curly 2 : 1 i stället för 3 : 1.",
                   "Curly is dominant – a single Cy allele is enough for upturned wings. But two Cy alleles are lethal, so the embryo never develops. That is why Curly × Curly gives 2 : 1 instead of 3 : 1.") }
      ],
      defaultTraits: ["eye"],
      pheno(A) {
        const has = (g, a) => A(g).includes(a);
        const vest = !has("vg", "Vg");
        const vis = {
          eye: has("w", "w+") ? "red" : "white",
          body: !has("e", "E") ? "ebony" : (!has("b", "B") ? "black" : "wild"),
          wings: vest ? "vestigial" : (has("Cy", "Cy") ? "curly" : "normal")
        };
        const parts = {
          eye: vis.eye === "red" ? ["red", S2("röda ögon", "red eyes")] : ["white", S2("vita ögon", "white eyes")],
          wing: vest ? ["vg", S2("stumpvingar", "vestigial wings")] : ["n", S2("normala vingar", "normal wings")],
          body: has("b", "B") ? ["g", S2("grå kropp", "grey body")] : ["b", S2("svart kropp", "black body")],
          ebony: has("e", "E") ? ["g", S2("grå kropp", "grey body")] : ["e", S2("ebenholtsfärgad kropp", "ebony body")],
          curly: vest ? ["x", S2("vingform syns ej (stumpvingar)", "wing curl not visible (vestigial)")] :
                 has("Cy", "Cy") ? ["cy", S2("krulliga vingar", "curly wings")] : ["s", S2("raka vingar", "straight wings")]
        };
        return { vis, parts };
      },
      draw: drawFly
    },

    // ---------------------------------------------------------- ÄRTA
    pea: {
      name: S2("Ärta", "Garden pea"), latin: "Pisum sativum",
      sexSystem: "none", notation: "mendel", selfing: true,
      chrs: {
        cR: { label: S2("Kromosompar med R", "Chromosome pair with R") },
        cY: { label: S2("Kromosompar med Y", "Chromosome pair with Y") },
        cA: { label: S2("Kromosompar med A", "Chromosome pair with A") },
        cV: { label: S2("Kromosompar med V", "Chromosome pair with V") },
        cG: { label: S2("Kromosompar med Gp", "Chromosome pair with Gp") },
        cF: { label: S2("Kromosompar med Fa", "Chromosome pair with Fa") },
        cL: { label: S2("Kromosompar med Le", "Chromosome pair with Le") }
      },
      genes: {
        R:  { chr: "cR", pos: 0, alleles: [["R", "R", S2("runda frön", "round seeds")], ["r", "r", S2("skrynkliga frön", "wrinkled seeds")]] },
        Y:  { chr: "cY", pos: 0, alleles: [["Y", "Y", S2("gula frön", "yellow seeds")], ["y", "y", S2("gröna frön", "green seeds")]] },
        A:  { chr: "cA", pos: 0, alleles: [["A", "A", S2("lila blommor", "purple flowers")], ["a", "a", S2("vita blommor", "white flowers")]] },
        V:  { chr: "cV", pos: 0, alleles: [["V", "V", S2("uppblåsta baljor", "inflated pods")], ["v", "v", S2("insnörda baljor", "constricted pods")]] },
        Gp: { chr: "cG", pos: 0, alleles: [["Gp", "Gp", S2("gröna baljor", "green pods")], ["gp", "gp", S2("gula baljor", "yellow pods")]] },
        Fa: { chr: "cF", pos: 0, alleles: [["Fa", "Fa", S2("blommor längs stjälken", "flowers along the stem")], ["fa", "fa", S2("blommor i toppen", "flowers at the top")]] },
        Le: { chr: "cL", pos: 0, alleles: [["Le", "Le", S2("hög stjälk", "tall stem")], ["le", "le", S2("låg stjälk", "short stem")]] }
      },
      traits: [
        { id: "shape", genes: ["R"], name: S2("Fröform", "Seed shape"), tags: [["", S2("Dominant–recessiv", "Dominant–recessive")]],
          info: S2("Mendels F2: 5 474 runda och 1 850 skrynkliga (2,96 : 1). Skrynkliga frön saknar ett enzym som bygger grenad stärkelse – fröet blir sötare, tar upp mer vatten och skrynklar ihop sig när det torkar.",
                   "Mendel's F2: 5,474 round and 1,850 wrinkled (2.96 : 1). Wrinkled seeds lack an enzyme that builds branched starch – the seed becomes sweeter, takes up more water and shrivels as it dries.") },
        { id: "seedcol", genes: ["Y"], name: S2("Fröfärg", "Seed colour"), tags: [["", S2("Dominant–recessiv", "Dominant–recessive")]],
          info: S2("Mendels F2: 6 022 gula och 2 001 gröna (3,01 : 1). Gröna frön behåller sitt klorofyll eftersom ett enzym som bryter ner klorofyllet inte fungerar.",
                   "Mendel's F2: 6,022 yellow and 2,001 green (3.01 : 1). Green seeds keep their chlorophyll because an enzyme that breaks it down does not work.") },
        { id: "flower", genes: ["A"], name: S2("Blomfärg", "Flower colour"), tags: [["", S2("Dominant–recessiv", "Dominant–recessive")]],
          info: S2("Mendels F2: 705 lila och 224 vita (3,15 : 1). Genen A styr bildningen av antocyaniner – de lila färgämnena. Utan fungerande A blir blomman vit.",
                   "Mendel's F2: 705 purple and 224 white (3.15 : 1). The A gene controls the production of anthocyanins – the purple pigments. Without a working A the flower is white.") },
        { id: "podshape", genes: ["V"], name: S2("Baljform", "Pod shape"), tags: [["", S2("Dominant–recessiv", "Dominant–recessive")]],
          info: S2("Mendels F2: 882 uppblåsta och 299 insnörda (2,95 : 1).", "Mendel's F2: 882 inflated and 299 constricted (2.95 : 1).") },
        { id: "podcol", genes: ["Gp"], name: S2("Baljfärg", "Pod colour"), tags: [["", S2("Dominant–recessiv", "Dominant–recessive")]],
          info: S2("Mendels F2: 428 gröna och 152 gula baljor (2,82 : 1).", "Mendel's F2: 428 green and 152 yellow pods (2.82 : 1).") },
        { id: "pos", genes: ["Fa"], name: S2("Blommornas placering", "Flower position"), tags: [["", S2("Dominant–recessiv", "Dominant–recessive")]],
          info: S2("Mendels F2: 651 med blommor längs stjälken och 207 med blommor samlade i toppen (3,14 : 1).", "Mendel's F2: 651 with flowers along the stem and 207 with flowers clustered at the top (3.14 : 1).") },
        { id: "height", genes: ["Le"], name: S2("Stjälklängd", "Stem length"), tags: [["", S2("Dominant–recessiv", "Dominant–recessive")]],
          info: S2("Mendels F2: 787 höga och 277 låga (2,84 : 1). Le-genen kodar för ett enzym som bildar växthormonet gibberellin – utan det blir stjälken kort.",
                   "Mendel's F2: 787 tall and 277 short (2.84 : 1). The Le gene codes for an enzyme that makes the plant hormone gibberellin – without it the stem stays short.") }
      ],
      defaultTraits: ["shape"],
      pheno(A, sex, sel) {
        const has = (g, a) => A(g).includes(a);
        const vis = {
          seedOnly: !!sel && sel.length > 0 && sel.every(t => t === "shape" || t === "seedcol"),
          shape: has("R", "R") ? "round" : "wrinkled",
          seed: has("Y", "Y") ? "yellow" : "green",
          flower: has("A", "A") ? "purple" : "white",
          pod: has("V", "V") ? "inflated" : "constricted",
          podCol: has("Gp", "Gp") ? "green" : "yellow",
          pos: has("Fa", "Fa") ? "axial" : "terminal",
          height: has("Le", "Le") ? "tall" : "short"
        };
        const parts = {
          shape: vis.shape === "round" ? ["R", S2("runda frön", "round seeds")] : ["r", S2("skrynkliga frön", "wrinkled seeds")],
          seedcol: vis.seed === "yellow" ? ["Y", S2("gula frön", "yellow seeds")] : ["y", S2("gröna frön", "green seeds")],
          flower: vis.flower === "purple" ? ["A", S2("lila blommor", "purple flowers")] : ["a", S2("vita blommor", "white flowers")],
          podshape: vis.pod === "inflated" ? ["V", S2("uppblåsta baljor", "inflated pods")] : ["v", S2("insnörda baljor", "constricted pods")],
          podcol: vis.podCol === "green" ? ["G", S2("gröna baljor", "green pods")] : ["g", S2("gula baljor", "yellow pods")],
          pos: vis.pos === "axial" ? ["F", S2("blommor längs stjälken", "flowers along stem")] : ["f", S2("blommor i toppen", "flowers at top")],
          height: vis.height === "tall" ? ["L", S2("hög", "tall")] : ["l", S2("låg", "short")]
        };
        return { vis, parts };
      },
      draw: drawPea
    },

    // ---------------------------------------------------------- HÖNS
    hen: {
      name: S2("Höns", "Chicken"), latin: "Gallus gallus domesticus",
      sexSystem: "ZW", notation: "mendel", selfing: false,
      chrs: {
        Z: { sex: true, label: S2("Z-kromosomen", "Z chromosome") },
        cR: { label: S2("Kromosompar med R", "Chromosome pair with R") },
        cP: { label: S2("Kromosompar med P", "Chromosome pair with P") },
        cI: { label: S2("Kromosompar med I", "Chromosome pair with I") },
        cC: { label: S2("Kromosompar med C", "Chromosome pair with C") },
        cB: { label: S2("Kromosompar med Bl", "Chromosome pair with Bl") }
      },
      genes: {
        R:  { chr: "cR", pos: 0, def: "r", alleles: [["R", "R", S2("bidrar till rosenkam", "contributes to rose comb")], ["r", "r", S2("–", "–")]] },
        P:  { chr: "cP", pos: 0, def: "p", alleles: [["P", "P", S2("bidrar till ärtkam", "contributes to pea comb")], ["p", "p", S2("–", "–")]] },
        I:  { chr: "cI", pos: 0, def: "i", alleles: [["I", "I", S2("hämmar all färg (dominant vit)", "inhibits all colour (dominant white)")], ["i", "i", S2("ingen hämning", "no inhibition")]] },
        C:  { chr: "cC", pos: 0, alleles: [["C", "C", S2("kan bilda färg", "can make pigment")], ["c", "c", S2("kan inte bilda färg (cc = vit)", "cannot make pigment (cc = white)")]] },
        Bl: { chr: "cB", pos: 0, noDom: true, alleles: [["Bl", "Bl", S2("blå-allel (späder ut svart)", "blue allele (dilutes black)")], ["bl", "bl", S2("svart", "black")]] },
        B:  { chr: "Z", pos: 0, def: "b", alleles: [["B", "B", S2("spräcklig (gökfärgad)", "barred (cuckoo)")], ["b", "b", S2("ej spräcklig", "not barred")]] }
      },
      traits: [
        { id: "comb", genes: ["R", "P"], name: S2("Kamform", "Comb shape"),
          tags: [["epi", S2("Geninteraktion (2 gener)", "Gene interaction (2 genes)")], ["", "9 : 3 : 3 : 1"]],
          info: S2("Bateson och Punnett (1905–08): rosenkam × ärtkam gav valnötskam i F1 – en helt ny form! I F2 blev det 9 valnöt : 3 ros : 3 ärt : 1 enkel. R_pp = rosenkam, rrP_ = ärtkam, R_P_ = valnötskam, rrpp = enkelkam. Här döljer ingen gen den andra – de samverkar och skapar nya former.",
                   "Bateson and Punnett (1905–08): rose comb × pea comb gave walnut comb in F1 – a completely new shape! F2 gave 9 walnut : 3 rose : 3 pea : 1 single. R_pp = rose, rrP_ = pea, R_P_ = walnut, rrpp = single. Here no gene hides the other – they work together and create new shapes.") },
        { id: "white", genes: ["I", "C"], name: S2("Vit fjäderdräkt (epistasi)", "White plumage (epistasis)"),
          tags: [["epi", S2("Dominant epistasi", "Dominant epistasis")], ["", "13 : 3"]],
          info: S2("Två olika vita raser: vit leghorn (IICC) är vit för att I-allelen <b>hämmar</b> pigmentbildningen, vit wyandotte (iicc) för att den <b>saknar</b> pigment. I är epistatisk över C. F1 blir vita (IiCc), men i F2 dyker färgade höns upp: 13 vita : 3 färgade.",
                   "Two different white breeds: White Leghorn (IICC) is white because the I allele <b>inhibits</b> pigment, White Wyandotte (iicc) because it <b>lacks</b> pigment. I is epistatic to C. F1 is white (IiCc), but coloured birds reappear in F2: 13 white : 3 coloured.") },
        { id: "blue", genes: ["Bl"], name: S2("Blå andalusier", "Blue Andalusian"),
          tags: [["int", S2("Intermediär nedärvning", "Incomplete dominance")], ["", "1 : 2 : 1"]],
          info: S2("Bl/Bl ger nästan vit, stänkig fjäderdräkt (splash), Bl/bl blå och bl/bl svart. Heterozygoten har ett eget utseende – därför kan blåa andalusier aldrig bli renrasiga: blå × blå ger alltid 1 svart : 2 blå : 1 splash.",
                   "Bl/Bl gives an almost white, splashed plumage, Bl/bl blue and bl/bl black. The heterozygote looks different from both – which is why Blue Andalusians never breed true: blue × blue always gives 1 black : 2 blue : 1 splash.") },
        { id: "barring", genes: ["B"], name: S2("Gökfärg (spräcklig)", "Barring (cuckoo)"),
          tags: [["sex", S2("Könsbunden (Z)", "Sex-linked (Z)")], ["dom", S2("Dominant", "Dominant")]],
          info: S2("Hos fåglar är det honan som har två olika könskromosomer (ZW) och tuppen som har två lika (ZZ). Korsa en ospräcklig tupp med en spräcklig höna: alla tuppkycklingar blir spräckliga och alla hönkycklingar ospräckliga – så kan man könssortera kycklingar direkt!",
                   "In birds it is the hen that has two different sex chromosomes (ZW) and the rooster two of the same (ZZ). Cross a non-barred rooster with a barred hen: all male chicks are barred and all female chicks non-barred – a way to sex chicks at hatching!") }
      ],
      defaultTraits: ["comb"],
      pheno(A, sex, sel) {
        const has = (g, a) => A(g).includes(a);
        const R = has("R", "R"), P = has("P", "P");
        const comb = R && P ? "walnut" : R ? "rose" : P ? "pea" : "single";
        const white = (sel.includes("white") && (has("I", "I") || !has("C", "C")));
        const nBl = A("Bl").filter(a => a === "Bl").length;
        const base = sel.includes("blue") ? (nBl === 2 ? "splash" : nBl === 1 ? "blue" : "black") : "wild";
        const barred = has("B", "B");
        const vis = { comb, plum: white ? "white" : base, barred: barred && !white };

  function svgWrap(inner) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;

  function drawFly(v, sex) {
    const body = v.body === "ebony" ? "#2b231d" : v.body === "black" ? "#433b36" : "#b9925a";
    const stripe = v.body === "wild" ? "#5b3f22" : "#120f0d";

    const eye = v.eye === "white" ? "#f6f2e9" : "#d3202a";
    const eyeStroke = v.eye === "white" ? "#b9b2a4" : "#7f1016";
    const female = sex !== "M";
    let s = "";
    // ben
    s += `<g stroke="#4a3a2a" stroke-width="1.6" fill="none" stroke-linecap="round">`;
    for (const k of [1, -1]) {
      const x = (d) => 50 + k * d;
      s += `<path d="M${x(6)} 36 L${x(18)} 30 L${x(26)} 22"/><path d="M${x(8)} 41 L${x(22)} 43 L${x(30)} 47"/><path d="M${x(6)} 46 L${x(17)} 56 L${x(22)} 68"/>`;
    }
    s += `</g>`;
    // bakkropp
    if (female) {
      s += `<path d="M39 52 Q38 74 50 88 Q62 74 61 52 Q50 46 39 52Z" fill="${body}"/>`;
      for (const y of [58, 65, 72, 79]) s += `<path d="M${40 + (y - 58) * 0.18} ${y} Q50 ${y + 3} ${60 - (y - 58) * 0.18} ${y}" stroke="${stripe}" stroke-width="3" fill="none"/>`;
    } else {
      s += `<path d="M40 52 Q38 70 50 76 Q62 70 60 52 Q50 46 40 52Z" fill="${body}"/>`;
      for (const y of [58, 64]) s += `<path d="M41 ${y} Q50 ${y + 3} 59 ${y}" stroke="${stripe}" stroke-width="3" fill="none"/>`;
      s += `<path d="M42 67 Q50 72 58 67 Q57 74 50 76 Q43 74 42 67Z" fill="${stripe}"/>`;
    }
    // mellankropp och huvud
    s += `<ellipse cx="50" cy="41" rx="11.5" ry="10.5" fill="${thor}"/>`;
    s += `<ellipse cx="50" cy="24" rx="9" ry="7" fill="${thor}"/>`;
    s += `<ellipse cx="42.6" cy="23" rx="4.6" ry="5.6" fill="${eye}" stroke="${eyeStroke}" stroke-width="0.8"/>`;
    s += `<ellipse cx="57.4" cy="23" rx="4.6" ry="5.6" fill="${eye}" stroke="${eyeStroke}" stroke-width="0.8"/>`;
    s += `<path d="M47 17 L45 12 M53 17 L55 12" stroke="#4a3a2a" stroke-width="1.2"/>`;
    // vingar
    let wing;
    if (v.wings === "vestigial") {
      wing = `<path d="M55 43 Q61 42 63 47 Q60 49 62 52 Q58 54 56 50 Q53 47 55 43Z" fill="rgba(220,232,250,0.6)" stroke="rgba(255,255,255,0.75)" stroke-width="0.8"/>`;
    } else if (v.wings === "curly") {
      wing = `<path d="M54 41 Q70 46 70 64 Q69 72 63 72 Q66 68 63 66 Q58 66 56 58 Q53 50 54 41Z" fill="rgba(220,232,250,0.5)" stroke="rgba(255,255,255,0.8)" stroke-width="0.9"/>` +
             `<path d="M63 72 Q60 74 59 70" stroke="rgba(255,255,255,0.8)" stroke-width="0.9" fill="none"/>`;
    } else {
      wing = `<path d="M54 41 Q72 50 70 78 Q67 90 61 86 Q55 78 54 60 Z" fill="rgba(220,232,250,0.42)" stroke="rgba(255,255,255,0.75)" stroke-width="0.9"/>` +
             `<path d="M56 48 Q64 62 63 82 M55 52 Q60 66 59 80" stroke="rgba(255,255,255,0.35)" stroke-width="0.6" fill="none"/>`;
    }
    s += wing + `<g transform="translate(100 0) scale(-1 1)">${wing}</g>`;
    return svgWrap(s);

  function drawPea(v) {

             `<ellipse cx="38" cy="38" rx="6" ry="4" fill="${sc[2]}" opacity="0.6"/>`;

      return svgWrap(t);
    }
    const top = v.height === "tall" ? 12 : 50;

    for (let y = 86; y > top + 6; y -= (v.height === "tall" ? 15 : 12)) nodes.push(y);

    s += `<path d="M${sx} ${top + 2} q 6 -6 3 -10 q -3 -2 -4 1" stroke="#7fd35a" stroke-width="1" fill="none"/>`;
    const fc = v.flower === "purple" ? ["#a24bc4", "#6b2a8a"] : ["#fbfbf5", "#cfcfc2"];
    const flower = (x, y) =>
      `<g><ellipse cx="${x}" cy="${y - 2.4}" rx="4.6" ry="3.8" fill="${fc[0]}" stroke="${fc[1]}" stroke-width="0.7"/>` +

      nodes.slice(1).forEach((y, i) => { if (i < 3) s += flower(sx + (i % 2 ? -9 : 9), y - 7); });

    const podY = v.height === "tall" ? 58 : 70;

    s += `<g transform="translate(${sx - 30} ${podY}) rotate(12)"><path d="${podPath}" fill="${pc[0]}" stroke="${pc[1]}" stroke-width="0.9"/></g>`;

    s += `<circle cx="76" cy="80" r="15" fill="rgba(255,255,255,0.05)"/>`;

      s += `<circle cx="76" cy="80" r="11" fill="${sc[0]}" stroke="${sc[1]}" stroke-width="1"/><ellipse cx="72" cy="76" rx="3.5" ry="2.4" fill="rgba(255,255,255,0.45)"/>`;
    } else {
      s += `<path d="M66 79 Q65 70 72 70 Q75 67 79 70 Q87 69 86 77 Q89 82 84 86 Q82 91 76 90 Q70 92 68 86 Q63 84 66 79Z" fill="${sc[0]}" stroke="${sc[1]}" stroke-width="1"/>` +
           `<path d="M70 76 Q74 79 71 83 M77 73 Q80 78 77 82 Q81 85 80 88 M83 78 Q80 80 82 84" stroke="${sc[1]}" stroke-width="0.9" fill="none"/>`;
    }
    return svgWrap(s);
  }

  function drawHen(v, sex) {
    const n = ++svgCounter;
    const rooster = sex === "M";
    // färger: [kropp, kropp mörk, hals/sadel, vinge, stjärt]

      <path d="M62 78 L63 92"/><path d="M63 92 L57 94 M63 92 L65 95 M63 92 L68 93"/></g>`;

        <path d="M72 54 C82 40 90 44 88 62" stroke="${tail}" stroke-width="4"/>
        <path d="M70 46 C76 18 96 14 97 38" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/></g>`;

            <path d="M70 48 C76 38 82 34 88 32" stroke="rgba(0,0,0,0.25)" stroke-width="0.8" fill="none"/>`;

    s += `<circle cx="26.5" cy="23.5" r="2.4" fill="#f0a020"/><circle cx="26.3" cy="23.4" r="1.2" fill="#111"/><circle cx="25.8" cy="22.9" r="0.4" fill="#fff"/>`;
    s += `<path d="M21.5 23 Q16 24.5 14.5 27 Q18 26.8 21.8 26.6Z" fill="#e8b33c"/><path d="M21.8 26.6 Q18 27.5 16 28.6 Q19.5 29 22 28.2Z" fill="#c9952a"/>`;

      comb = `<path d="M20 ${by + 1} C20 ${Y(13)} 26 ${Y(12.5)} 31 ${Y(13)} C34 ${Y(13)} 36 ${Y(14.5)} 37 ${Y(16)} L${rooster ? 46 : 43} ${Y(14)} L38 ${by + 2} C31 ${by + 3} 25 ${by + 3} 20 ${by + 1}Z" fill="${cc}" stroke="${cd}" stroke-width="0.6"/>` +
             `<g fill="${cd}">${[[23, 15.5], [26.5, 14.5], [30, 14.5], [33.5, 15.5], [25, 17.5], [28.5, 17], [32, 17.5]].map(([x, y]) => `<circle cx="${x}" cy="${Y(y)}" r="0.9"/>`).join("")}</g>`;

             `<path d="M24 ${Y(16.5)} C27 ${Y(14)} 33 ${Y(14)} 36 ${Y(16.5)} M23.5 ${Y(18.3)} C27 ${Y(16.5)} 33 ${Y(16.5)} 36.5 ${Y(18.3)}" stroke="${cd}" stroke-width="0.8" fill="none"/>`;
    } else {
      comb = `<path d="M22 ${by + 1.5} C20 ${Y(11.5)} 26 ${Y(10.5)} 30 ${Y(11)} C35 ${Y(10.5)} 39 ${Y(12.5)} 37.5 ${by + 1.5}Z" fill="${cc}" stroke="${cd}" stroke-width="0.6"/>` +
             `<g fill="${cd}">${[[25, 14], [29, 13], [33, 13.5], [27, 16.5], [31, 16], [35, 16.5], [29, 18.5]].map(([x, y]) => `<circle cx="${x}" cy="${Y(y)}" r="1.15"/>`).join("")}</g>` +
             `<path d="M24 ${Y(15)} C28 ${Y(17)} 32 ${Y(14)} 36 ${Y(15.5)}" stroke="${cd}" stroke-width="0.7" fill="none"/>`;
    }
    s += comb;
    return svgWrap(s);
  }

  function drawSnap(v) {
    const c = { red: ["#d42a3e", "#8c1325"], pink: ["#f49cbf", "#c25c88"], white: ["#fbf6ee", "#cdc3b4"] }[v.col];
    const leaf = v.leaf === "aurea" ? ["#cfdc4f", "#98a52a"] : ["#3f9a3a", "#25632a"];
    let s = `<path d="M4 95 H96" stroke="#5b4630" stroke-width="2"/>`;
    s += `<path d="M50 95 L50 14" stroke="${leaf[1]}" stroke-width="2.6"/>`;
    for (const [y, d] of [[86, -1], [80, 1], [72, -1], [66, 1]]) {
      s += `<ellipse cx="${50 + d * 11}" cy="${y}" rx="11" ry="3.4" transform="rotate(${d * -28} ${50 + d * 11} ${y})" fill="${leaf[0]}" stroke="${leaf[1]}" stroke-width="0.7"/>`;
    }
    const spots = [[20, 1, 0.7], [30, -1, 0.85], [41, 1, 1], [52, -1, 1.05]];
    for (const [y, d, k] of spots) {
      const x = 50 + d * 3;
      if (v.form === "normal") {
        s += `<g transform="translate(${x} ${y}) scale(${d * k} ${k})">` +
             `<path d="M0 0 C3 -9 13 -11 18 -6 C21 -3 21 3 17 6 C12 9 3 7 0 0Z" fill="${c[0]}" stroke="${c[1]}" stroke-width="0.8"/>` +
             `<path d="M6 3 C9 10 18 11 20 4" fill="${c[0]}" stroke="${c[1]}" stroke-width="0.8"/>` +
             `<ellipse cx="15" cy="2.5" rx="3" ry="1.6" fill="#f6c431"/></g>`;
      } else {
        const cx = x + d * 10 * k;
        let petals = "";
        for (let i = 0; i < 5; i++) {
          const a = (i * 72 - 90) * Math.PI / 180;
          petals += `<circle cx="${(cx + Math.cos(a) * 5 * k).toFixed(1)}" cy="${(y + Math.sin(a) * 5 * k).toFixed(1)}" r="${(4 * k).toFixed(1)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="0.7"/>`;
        }
        s += `<path d="M${x} ${y} L${cx} ${y}" stroke="${leaf[1]}" stroke-width="1.2"/>` + petals + `<circle cx="${cx}" cy="${y}" r="${(2.6 * k).toFixed(1)}" fill="#f6c431"/>`;
      }
    }
    s += `<path d="M50 14 q-2 -4 0 -6 q2 2 0 6" fill="${leaf[0]}"/>`;
    return svgWrap(s);
  }

  // ============================================================
  // TILLSTÅND
  // ============================================================
  const state = {
    sp: DEFAULT_SPECIES,
    traits: [],
    parents: [null, null],
    selfing: false,
    showGeno: true,
    chi: false,
    splitSex: false,
    n: 100,
    tab: "schema",
    offspring: [],
    offCross: null,      // den korsning som avkomman kommer från
    offParents: null,
    pParents: null,      // P-generationen (för återkorsning)
    journal: [],
    crossNo: 0
  };
  let uidCounter = 0;
  const SP = () => SPECIES[state.sp];

  // ============================================================
  // HJÄLPFUNKTIONER FÖR GENER
  // ============================================================
  const geneDef = (g) => SP().genes[g];
  const alleleIds = (g) => geneDef(g).alleles.map(a => a[0]);
  const aIdx = (g, id) => alleleIds(g).indexOf(id);
  const aHTML = (g, id) => { const a = geneDef(g).alleles.find(x => x[0] === id); return a ? a[1] : "?"; };
  const aMeaning = (g, id) => { const a = geneDef(g).alleles.find(x => x[0] === id); return a ? tt(a[2]) : ""; };
  const firstA = (g) => alleleIds(g)[0];
  const lastA = (g) => { const ids = alleleIds(g); return ids[ids.length - 1]; };
  const isSexChr = (chr) => !!SP().chrs[chr].sex;
  const isHetero = (sex) => (SP().sexSystem === "XY" && sex === "M") || (SP().sexSystem === "ZW" && sex === "F");
  const sexed = () => SP().sexSystem !== "none";
  const sexLetters = () => SP().sexSystem === "XY" ? ["X", "Y"] : ["Z", "W"];

  function studyGenes() {
    const sp = SP();
    const set = new Set();
    state.traits.forEach(t => sp.traits.find(x => x.id === t).genes.forEach(g => set.add(g)));
    return Object.keys(sp.genes).filter(g => set.has(g));
  }
  function chrGroups(genes) {
    const sp = SP();
    return Object.keys(sp.chrs)
      .map(chr => ({ chr, genes: genes.filter(g => sp.genes[g].chr === chr).sort((a, b) => sp.genes[a].pos - sp.genes[b].pos) }))
      .filter(x => x.genes.length);
  }
  const sexChrStudied = () => studyGenes().some(g => isSexChr(geneDef(g).chr));

  // ============================================================
  // INDIVIDER
  // ind = { uid, sex: "F"|"M"|null, g: { gen: [allel på homolog 0, allel på homolog 1 | null] }, gen, hidden }
  // ============================================================
  function makeInd(sex, fn, gen) {
    const g = {};
    studyGenes().forEach(gene => {
      if (isSexChr(geneDef(gene).chr) && isHetero(sex)) g[gene] = [fn(gene, 0), null];
      else g[gene] = [fn(gene, 0), fn(gene, 1)];
    });
    return { uid: ++uidCounter, sex, g, gen: gen || "P", hidden: false };
  }
  function cloneInd(ind) {
    const g = {};
    Object.keys(ind.g).forEach(k => g[k] = ind.g[k].slice());
    return { ...ind, g, uid: ++uidCounter, src: ind.src || ind };
  }
  const defA = (gene) => geneDef(gene).def || firstA(gene);
  const getA = (ind) => (gene) => ind.g[gene] ? ind.g[gene].filter(a => a != null) : [defA(gene), defA(gene)];

  function isLethal(ind) {
    return studyGenes().some(gene => {
      const L = geneDef(gene).lethalHomo;
      return L && ind.g[gene] && ind.g[gene].filter(a => a === L).length === 2;
    });
  }
  function phenoOf(ind) {
    const res = SP().pheno(getA(ind), ind.sex, state.traits);
    const parts = state.traits.map(t => ({ trait: t, key: res.parts[t][0], txt: res.parts[t][1] }));
    return { vis: res.vis, parts, key: parts.map(p => p.key).join("|") };
  }
  const drawInd = (ind) => SP().draw(phenoOf(ind).vis, ind.sex === "?" ? "F" : ind.sex);
  const phenoText = (parts) => parts.map(p => tt(p.txt)).join(", ");

  // Genotyp som HTML + en nyckel som är lika för lika genotyper
  function genoInfo(ind) {
    const sp = SP();
    const html = [], keys = [];
    chrGroups(studyGenes()).forEach(grp => {
      const hs = [0, 1].map(h => grp.genes.map(g => ind.g[g] ? ind.g[g][h] : null));
      const isNull = (h) => hs[h].every(a => a == null);
      const rank = (arr) => arr.map((a, i) => a == null ? 9 : aIdx(grp.genes[i], a)).join(",");
      let order = [0, 1];
      if (isNull(0) || (!isNull(1) && rank(hs[1]) < rank(hs[0]))) order = [1, 0];
      const H = order.map(h => hs[h]);
      keys.push(H.map(x => x.join(",")).join("/"));
      const al = (x) => x.map((a, i) => aHTML(grp.genes[i], a));
      if (isSexChr(grp.chr)) {
        const L = sexLetters();
        html.push(H.map(x => x.every(a => a == null) ? L[1] : `${L[0]}<sup>${al(x).join(",")}</sup>`).join(""));
      } else if (sp.notation === "fly") {
        html.push(H.map(x => al(x).join(" ")).join(grp.genes.length > 1 ? " / " : "/"));
      } else {
        html.push(H.map(x => al(x).join("")).join(grp.genes.length > 1 ? "/" : ""));
      }
    });
    return { html: html.join(sp.notation === "fly" ? " ; " : " "), key: keys.join(" | ") };
  }

  // ============================================================
  // GAMETER (med överkorsning mellan kopplade gener)
  // ============================================================
  function gametes(ind) {
    const sp = SP();
    let list = [{ p: 1, g: {}, y: false, rec: false }];
    chrGroups(studyGenes()).forEach(grp => {
      const outs = [];
      const hemi = isSexChr(grp.chr) && isHetero(ind.sex);
      if (hemi) {
        const h = ind.g[grp.genes[0]][0] != null ? 0 : 1;
        const a = {}, n = {};
        grp.genes.forEach(g => { a[g] = ind.g[g][h]; n[g] = null; });
        outs.push({ p: 0.5, a, y: false, rec: false }, { p: 0.5, a: n, y: true, rec: false });
      } else {
        const noRec = sp.noMaleRecomb && ind.sex === "M";
        let paths = [{ p: 0.5, s: [0], rec: false }, { p: 0.5, s: [1], rec: false }];
        for (let i = 1; i < grp.genes.length; i++) {
          const d = Math.abs(geneDef(grp.genes[i]).pos - geneDef(grp.genes[i - 1]).pos);
          const r = noRec ? 0 : Math.min(0.5, d / 100);
          const np = [];
          paths.forEach(pt => {
            const last = pt.s[pt.s.length - 1];
            if (r < 1) np.push({ p: pt.p * (1 - r), s: [...pt.s, last], rec: pt.rec });
            if (r > 0) np.push({ p: pt.p * r, s: [...pt.s, 1 - last], rec: true });
          });
          paths = np;
        }
        const merged = new Map();
        paths.forEach(pt => {
          const a = {};
          grp.genes.forEach((g, i) => a[g] = ind.g[g][pt.s[i]]);
          const k = grp.genes.map(g => a[g]).join(",");
          if (merged.has(k)) { const m = merged.get(k); m.p += pt.p; m.rec = m.rec && pt.rec; }
          else merged.set(k, { p: pt.p, a, y: false, rec: pt.rec });
        });
        const list1 = [...merged.values()];
        // Homozygot för hela kromosomparet: visa ändå båda homologernas gameter
        if (list1.length === 1) list1.push({ ...list1[0], p: list1[0].p / 2 }), list1[0] = { ...list1[0], p: list1[0].p / 2 };
        list1.forEach(o => outs.push(o));
      }
      const nl = [];
      list.forEach(x => outs.forEach(o => nl.push({ p: x.p * o.p, g: { ...x.g, ...o.a }, y: x.y || o.y, rec: x.rec || o.rec })));
      list = nl;
    });
    const genes = studyGenes();
    const key = (gm) => genes.map(g => gm.g[g] == null ? "-" : gm.g[g]).join(",") + (gm.y ? "Y" : "");
    const rank = (gm) => genes.map(g => gm.g[g] == null ? 9 : aIdx(g, gm.g[g])).join("") + (gm.y ? "9" : "0");
    return list.map(gm => ({ ...gm, key: key(gm) })).filter(x => x.p > 1e-12)
      .map((x, i) => ({ x, i })).sort((a, b) => rank(a.x) < rank(b.x) ? -1 : rank(a.x) > rank(b.x) ? 1 : a.i - b.i).map(o => o.x);
  }

  function gameteHTML(gm) {
    const sp = SP();
    return chrGroups(studyGenes()).map(grp => {
      const al = grp.genes.map(g => gm.g[g] == null ? null : aHTML(g, gm.g[g]));
      if (isSexChr(grp.chr)) {
        const L = sexLetters();
        return gm.y ? L[1] : `${L[0]}<sup>${al.join(",")}</sup>`;
      }
      return al.join(sp.notation === "fly" ? " " : "");
    }).join(sp.notation === "fly" ? " ; " : " ");
  }

  function zygote(gA, gB) {
    const g = {};
    studyGenes().forEach(gene => g[gene] = [gA.g[gene], gB.g[gene]]);
    let sex = null;
    if (SP().sexSystem === "XY") sex = sexChrStudied() ? (gB.y ? "M" : "F") : "?";
    if (SP().sexSystem === "ZW") sex = sexChrStudied() ? (gA.y ? "F" : "M") : "?";
    return { sex, g, uid: 0, gen: "", hidden: false };
  }

  // ============================================================
  // KORSNING – exakta sannolikheter
  // ============================================================
  function crossParents() {
    const [a, b] = state.parents;
    return [a, state.selfing && SP().selfing ? a : b];
  }

  function computeCross(pa, pb) {
    const G1 = gametes(pa), G2 = gametes(pb);
    const cells = G1.map(g1 => G2.map(g2 => {
      const z = zygote(g1, g2);
      return { z, p: g1.p * g2.p, lethal: isLethal(z) };
    }));
    let zs = [];
    cells.flat().forEach(c => {
      if (c.lethal) return;
      if (c.z.sex === "?") {
        zs.push({ z: { ...c.z, sex: "F" }, p: c.p / 2 }, { z: { ...c.z, sex: "M" }, p: c.p / 2 });
      } else zs.push({ z: c.z, p: c.p });
    });
    const tot = zs.reduce((s, x) => s + x.p, 0);
    zs.forEach(x => x.p /= tot);
    return { G1, G2, cells, zs, lethalFrac: 1 - tot };
  }

  // Klassindelning av en lista {z,p} eller individer
  function classify(items, kind) {
    const map = new Map();
    items.forEach(it => {
      const ind = it.z || it;
      const p = it.p == null ? 1 : it.p;
      let key, label;
      if (kind === "geno") {
        const gi = genoInfo(ind);
        key = gi.key; label = gi.html;
      } else {
        const ph = phenoOf(ind);
        key = ph.key; label = ph.parts;
      }
      const useSex = sexed() && (state.splitSex || (kind === "geno" && sexChrStudied()));
      if (useSex) key += "#" + ind.sex;
      if (!map.has(key)) map.set(key, { key, label, p: 0, n: 0, sample: ind, sex: useSex ? ind.sex : null, members: [], rank: "~" });
      const m = map.get(key);
      const r = genoRank(ind);
      if (r < m.rank) m.rank = r;
      m.p += p; m.n += 1;
      if (!it.z) m.members.push(ind);
    });
    return [...map.values()];
  }

  // Rangordning: dominanta alleler (första i listan) först
  function genoRank(ind) {
    return studyGenes().map(g => (ind.g[g] || []).filter(a => a != null).map(a => aIdx(g, a)).sort().join("")).join("|");
  }
  function sortClasses(arr) {
    return arr.sort((a, b) => ((a.sex || "") < (b.sex || "") ? -1 : (a.sex || "") > (b.sex || "") ? 1 : 0) || (a.rank < b.rank ? -1 : a.rank > b.rank ? 1 : 0));
  }

  // ============================================================
  // KVOTER OCH STATISTIK
  // ============================================================
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  function ratioInts(ps) {

  const sexSym = (sex) => sex === "F" ? '<span class="sexf">♀</span>' : sex === "M" ? '<span class="sexm">♂</span>' : "";

    return sex === "F" ? T().female : T().male;
  }
  function genLabel(gen) {
    if (gen === "T") return T().tester;
    if (gen && gen[0] === "#") return T().crossLabel(gen.slice(1));

  function plain(html) {
    return html.replace(/<sup>\+<\/sup>/g, "⁺").replace(/<sup>R<\/sup>/g, "ᴿ").replace(/<sup>W<\/sup>/g, "ᵂ")

  }
  const traitDef = (id) => SP().traits.find(t => t.id === id);
  const phLines = (parts) => parts.map(p => tt(p.txt)).join("<br>");
  const phenoListHTML = (parts) => `<ul class="pheno-list">${parts.map(p => `<li>${tt(p.txt)}</li>`).join("")}</ul>`;
  const mini = (ind) => `<div class="mini">${pic(ind)}</div>`;
  const parseNum = (v) => { if (v == null || String(v).trim() === "") return NaN; return parseFloat(String(v).replace(",", ".").replace(/\s/g, "")); };
  const slotSex = (i) => sexed() ? (i === 0 ? "F" : "M") : null;
  const parentTitle = (i) => sexed() ? (i === 0 ? `♀ ${T().mother}` : `♂ ${T().father}`) : `${T().parent} ${i + 1}`;
  const tabBtn = (id) => {
    if (id === "guess" && state.task) id = "answer";
    if (id === "pun" && ratioMode()) return "";
    const lbl = id === "count" ? T().tabCount : id === "pun" ? T().tabPun : id === "guess" ? T().tabGuess : id === "answer" ? "🎯 " + T().answerBtn : T().tabChi;
    return `<button type="button" class="btn small" data-act="analyse" data-tab="${id}">${lbl}</button>`;
  };
  function verdictHTML(wrong, empty, kind) {
    const t = T();
    if (wrong) return `<span class="verdict bad">${t.someWrong(wrong)}${empty ? t.emptyN(empty) : ""}</span>`;
    if (empty) return `<span class="verdict" style="color:var(--gold)">${t.leftN(empty)}</span>`;
    const src = srcParents() || [];
    const hidden = kind !== "count" && src[0] && (src[0].hidden || src[1].hidden);
    let msg, btns = "";
    if (kind === "count") { msg = t.countDone; btns = tabBtn("pun") + tabBtn("chi"); }
    else if (kind === "pun") {
      if (state.predicting) { msg = t.punDonePredict; btns = `<button type="button" class="btn small primary" data-act="cross">${t.crossCompare}</button>`; }
      else if (hidden) { msg = t.punDoneHyp; btns = tabBtn("chi") + tabBtn("guess"); }
      else { msg = t.punDoneKnown; btns = tabBtn("count") + tabBtn("chi"); }
    } else {
      const d = chiData();
      const rej = d.crit != null && d.chi > d.crit;
      msg = !rej ? t.chiDoneKeep : hidden ? t.chiDoneReject : t.chiDoneRejectKnown;
      if (hidden) { msg += " " + (state.task ? t.chiDoneTask : t.chiDoneGuess); btns = tabBtn("guess"); }
    }
    return `<span class="verdict ok">${hidden ? t.allRightHyp : t.allRight}</span><div class="next-hint">💡 ${msg}${btns ? `<div class="toolbar">${btns}</div>` : ""}</div>`;
