  const TAGCOL = ["#38bdf8", "#f472b6", "#a3e635", "#fbbf24", "#c084fc", "#fb923c", "#2dd4bf", "#f87171", "#94a3b8", "#e879f9", "#60a5fa", "#facc15"];

  function presetFn(type) {
    return (g, h) => {
      const f = firstA(g), l = lastA(g), L = geneDef(g).lethalHomo;
      if (type === "dom") return (L === f && h === 1) ? l : f;
      if (type === "rec") return (L === l && h === 1) ? f : l;
      if (type === "het") return h === 0 ? f : l;
      const ids = alleleIds(g);
      return ids[Math.floor(Math.random() * ids.length)];
    };
  }
  function randomInd(sex) {
    let ind;
    for (let i = 0; i < 50; i++) { ind = makeInd(sex, presetFn("rand"), "P"); if (!isLethal(ind)) break; }
    return ind;
  }

  // ---------- Alla möjliga genotyper och fenotyper ----------
  function allGenotypes(sex, withLethal) {
    let combos = [{}];
    studyGenes().forEach(g => {
      const hemi = isSexChr(geneDef(g).chr) && isHetero(sex);
      const ids = alleleIds(g);
      const opts = [];
      if (hemi) ids.forEach(a => opts.push([a, null]));
      else for (let i = 0; i < ids.length; i++) for (let j = i; j < ids.length; j++) opts.push([ids[i], ids[j]]);
      const nc = [];
      combos.forEach(c => opts.forEach(o => nc.push({ ...c, [g]: o.slice() })));
      combos = nc;
    });
    return combos.map(g => ({ uid: 0, sex, g, gen: "P", hidden: false })).filter(ind => withLethal || !isLethal(ind));
  }
  function phenoOptions(sex) {
    const map = new Map();
    allGenotypes(sex, false).forEach(ind => {
      const ph = phenoOf(ind);
      const r = genoRank(ind);
      if (!map.has(ph.key)) map.set(ph.key, { key: ph.key, parts: ph.parts, sample: ind, genos: [], rank: r });
      const m = map.get(ph.key);
      m.genos.push(ind);
      if (r < m.rank) { m.rank = r; m.sample = ind; }
    });
    return [...map.values()].sort((a, b) => a.rank < b.rank ? -1 : 1);
  }
  function randomPhase(ind) {
    chrGroups(studyGenes()).forEach(grp => {
      if (grp.genes.length > 1 && !isSexChr(grp.chr)) grp.genes.forEach(g => { if (Math.random() < 0.5) ind.g[g].reverse(); });
    });
    return ind;
  }
  function indWithPhenotype(sex, key, hidden) {
    const opt = phenoOptions(sex).find(o => o.key === key) || phenoOptions(sex)[0];
    let pool = opt.genos;
    if (state.task && state.task.pure) {
      const homo = pool.filter(c => studyGenes().every(g => c.g[g][1] == null || c.g[g][0] === c.g[g][1]));
      if (homo.length) pool = homo;
    }
    const ind = randomPhase(cloneInd(pool[Math.floor(Math.random() * pool.length)]));
    ind.gen = "P"; ind.hidden = hidden; ind.src = null;
    return ind;
  }
  function samplePhenoInd(sex, key) {
    const opt = phenoOptions(sex).find(o => o.key === key) || phenoOptions(sex)[0];
    const ind = cloneInd(opt.sample); ind.gen = "P"; ind.hidden = false; ind.src = null; return ind;
  }
  const emptyInd = (i) => makeInd(slotSex(i), () => "?", "P");
  const complete = (ind) => !!ind && studyGenes().every(g => ind.g[g] && ind.g[g].every(a => a !== "?"));
  const pic = (ind) => complete(ind) ? drawInd(ind) : svgWrap('<text x="50" y="64" text-anchor="middle" font-size="42" font-weight="700" fill="rgba(255,255,255,0.22)" font-family="system-ui, sans-serif">?</text>');
  function ensureParents() {
    if (state.parents[0] && state.parents[1]) return;
    state.parents = [emptyInd(0), emptyInd(1)];
    state.pmode = ["pheno", "pheno"];
  }
  function findInd(ref) {
    if (ref === "p0") return state.parents[0];
    if (ref === "p1") return state.parents[1];
    if (ref === "h0") return state.hyp[0];
    if (ref === "h1") return state.hyp[1];
    if (ref && ref[0] === "k") return state.offspring.find(k => k.uid === +ref.slice(1));
    return null;
  }

  // ---------- Kromosomeditor ----------
  function traitOfGene(g) { return state.traits.map(traitDef).find(t => t.genes.includes(g)); }
  function chrLabel(grp) {
    const names = [];
    const dup = (t) => state.traits.filter(x => tt(traitDef(x).name) === tt(t.name)).length > 1;
    grp.genes.forEach(g => {
      const t = traitOfGene(g);
      const n = tt(t.name).toLowerCase() + (t.genes.length > 1 || dup(t) ? ` (${g})` : "");
      if (!names.includes(n)) names.push(n);
    });
    let s = T().allelePair(names.join(T().and));
    if (isSexChr(grp.chr)) s += ` – ${T().onChr(sexLetters()[0])}`;
    else if (grp.genes.length > 1) s += ` – ${tt(SP().chrs[grp.chr].label).toLowerCase()}`;
    return s;
  }
  function chromoHTML(ind, ref, editable) {
    return `<div class="chromos">` + chrGroups(studyGenes()).map(grp => {
      const cols = [0, 1].map(h => {
        if (grp.genes.every(g => ind.g[g][h] == null)) {
          return `<div class="homolog ychr"><span class="ylabel">${sexLetters()[1]}</span><span class="ynote">${T().noGene}</span></div>`;
        }
        const loci = grp.genes.map(g => {
          const cur = ind.g[g][h];
          const ctl = editable
            ? `<select data-ref="${ref}" data-gene="${g}" data-h="${h}" aria-label="${g}"><option value="?" ${cur === "?" ? "selected" : ""}>?</option>${alleleIds(g).map(a => `<option value="${a}" ${a === cur ? "selected" : ""}>${plain(aHTML(g, a))}</option>`).join("")}</select>`
            : `<span class="allele">${cur === "?" ? "?" : aHTML(g, cur)}</span>`;
          return `<div class="locus" title="${cur === "?" ? "" : aMeaning(g, cur)}"><span class="locus-name">${g}</span>${ctl}</div>`;
        }).join("");
        return `<div class="homolog h${h}">${loci}</div>`;
      }).join("");
      return `<div class="cpair"><div class="cpair-label">${chrLabel(grp)}</div><div class="homologs">${cols}</div></div>`;
    }).join("") + `</div>`;
  }
  // ============================================================
  // STEGRAD OCH NAVIGERING
  // ============================================================
  function maxReach() {
    if (!state.traits.length) return 2;
    if (!state.offspring.length) return 3;
    return 5;
  }
  function renderStepper() {
    const sub = [tt(SP().name), state.traits.map(t => tt(trName(traitDef(t)))).join(", "), "", state.offspring.length ? `${state.offspring.length} ${T().offspringWord}` : "", ""];
    $("stepper").innerHTML = T().steps.map((name, i) => {
      const s = i + 1;
      const cls = s === state.step ? "cur" : s < state.step || s <= maxReach() && s < 4 ? "done" : "";
      return `<button type="button" class="step-btn ${cls}" data-act="goto" data-s="${s}" ${s > maxReach() || (state.task && s === 2) ? "disabled" : ""}>
        <span class="num">${s}</span><span style="min-width:0"><span class="lbl">${name}</span>${sub[i] && s < state.step ? `<span class="sv">${sub[i]}</span>` : ""}</span></button>`;
    }).join("");
  }
  function navHTML(back, next, nextDisabled) {
    return `<div class="nav-row">${back ? `<button type="button" class="btn" data-act="goto" data-s="${back}">${T().back}</button>` : "<span></span>"}
      ${next ? `<button type="button" class="btn primary" data-act="goto" data-s="${next}" ${nextDisabled ? "disabled" : ""}>${T().next}</button>` : ""}</div>`;
  }

  // ============================================================
  // STEG 1 – ART
  // ============================================================
  function speciesPic(id) {
    const sp = SPECIES[id];
    const A = (g) => { const a = sp.genes[g].def || sp.genes[g].alleles[0][0]; return [a, a]; };
    return sp.draw(sp.pheno(A, "F", []).vis, id === "hen" ? "M" : "F");
  }
  function step1() {
    return `<section class="step-sec"><h2 class="step-h">${T().s1h}</h2><p class="step-p">${T().s1p}</p>
      <div class="sp-grid">${SPECIES_ORDER.map(id => `
        <button type="button" class="sp-card ${state.sp === id && state.traits.length && !state.task ? "on" : ""}" data-act="species" data-sp="${id}">
          <div class="sp-img">${speciesPic(id)}</div>
          <div class="sp-n">${tt(SPECIES[id].name)}</div><div class="sp-l">${SPECIES[id].latin}</div>
          <div class="sp-d">${T().spDesc[id]}</div></button>`).join("")}</div>${tasksSection()}</section>`;
  }

  // ============================================================
  // STEG 2 – EGENSKAPER
  // ============================================================
  function allelePic(t, g, pair) {
    const sp = SP();
    const sex = sp.sexSystem === "none" ? null : sp.sexSystem === "ZW" ? "M" : "F";
    const A = (gene) => gene === g ? pair.slice() : [defA(gene), defA(gene)];
    return sp.draw(sp.pheno(A, sex, [t.id]).vis, sex);
  }
  function step2() {
    const sp = SP();
    const full = state.traits.length >= MAX_TRAITS;
    const cards = sp.traits.map(t => {
      const on = state.traits.includes(t.id);
      const dis = !on && full;
      const legend = t.genes.map(g => {
        const gd = geneDef(g);
        let rows = gd.alleles.map(a => `<span class="lg-row"><i class="lg-pic">${allelePic(t, g, gd.lethalHomo === a[0] ? [a[0], lastA(g)] : [a[0], a[0]])}</i><b>${a[1]}</b> ${tt(a[2])}</span>`).join("");
        if (gd.noDom) rows += `<span class="lg-row"><i class="lg-pic">${allelePic(t, g, [firstA(g), lastA(g)])}</i><b>${aHTML(g, firstA(g))}${aHTML(g, lastA(g))}</b> ${T().heteroWord}</span>`;
        return rows;
      }).join("");
      return `<div class="tr-card ${on ? "on" : ""} ${dis ? "dis" : ""}">
        <button type="button" class="tr-sel" data-act="trait" data-t="${t.id}" ${dis ? "disabled" : ""}>
          <div class="tr-top"><span class="tr-check">${on ? "✔" : ""}</span><span><span class="tr-name">${tt(t.name)}</span><span class="tr-cats">${tt(t.cats)}</span></span></div>
          <div class="tags">${t.tags.map(([c, x]) => `<span class="tag ${c ? "t-" + c : ""}">${tt(x)}</span>`).join("")}</div>
          <div class="tr-sum">${tt(t.sum)}</div>
          <div class="legend">${legend}</div></button>
        <details class="tr-more"><summary>${T().moreInfo}</summary><div class="tr-info">${tt(t.info)}</div></details></div>`;
    }).join("");
    const lines = [];
    chrGroups(studyGenes()).forEach(grp => {
      for (let i = 1; i < grp.genes.length; i++) {
        const a = grp.genes[i - 1], b = grp.genes[i];
        const dd = num(Math.min(Math.abs(geneDef(b).pos - geneDef(a).pos), 50), 1);
        lines.push(T().linkLine(a, b, dd, tt(sp.chrs[grp.chr].label).toLowerCase()) + (sp.noMaleRecomb ? T().linkMale : "."));
      }
    });
    return `<section class="step-sec"><h2 class="step-h">${T().s2h(tt(sp.name).toLowerCase())}</h2>
      <p class="step-p">${T().s2p} <b>${T().selected(state.traits.length)}</b></p>
      <div class="tr-grid">${cards}</div>
      ${lines.length ? `<div class="note"><b>🔗 ${T().linkTitle}:</b> ${lines.join("<br>")}</div>` : ""}
      ${navHTML(1, 3, !state.traits.length)}</section>`;
  }
  // ============================================================
  // STEG 3 – FÖRÄLDRAR
  // ============================================================
  function parentPanel(i) {
    const ind = state.parents[i];
    const mode = state.pmode[i];
    const done = complete(ind);
    const ph = done ? phenoOf(ind) : null;
    const selfSw = (i === 0 && SP().selfing)
      ? `<label class="switch" title="${T().selfNote}"><input type="checkbox" id="selfToggle" ${state.selfing ? "checked" : ""}><span class="track"></span><span>⟲ ${T().self}</span></label>` : "";
    let body;
    if (mode === "pheno") {
      body = `<div class="sub-q">${T().pickPheno}</div><div class="pick-grid">` + phenoOptions(ind.sex).map(o =>
        `<button type="button" class="pick ${ph && o.key === ph.key ? "on" : ""}" data-act="pickpheno" data-i="${i}" data-k="${o.key}">
          <div class="pick-img">${drawInd(o.sample)}</div><div class="pick-n">${phLines(o.parts)}</div></button>`).join("") + `</div>`;
    } else {
      const presets = ["dom", "het", "rec"].map(p => {
        const prev = makeInd(ind.sex, presetFn(p), "P");
        const name = p === "dom" ? T().presetDom : p === "het" ? T().presetHet : T().presetRec;
        return `<button type="button" class="mini-btn mono" data-act="preset" data-p="${p}" data-i="${i}" title="${name} – ${phenoText(phenoOf(prev).parts)}">${genoInfo(prev).html}</button>`;
      }).join("") + `<button type="button" class="mini-btn" data-act="preset" data-p="rand" data-i="${i}">${T().rand}</button>`;
      body = `<div class="presets"><span class="chromo-cap" style="align-self:center">${T().presets}</span>${presets}</div>${chromoHTML(ind, "p" + i, true)}`;
    }
    let info;
    if (!done) info = `<p class="muted">${mode === "pheno" ? T().emptyPheno : T().emptyDesign}</p>`;
    else {
      const geno = ind.hidden
        ? `<div class="geno hiddeng">??? <span class="small">(${T().unknown})</span></div>`
        : `<div class="geno">${genoInfo(ind).html}</div>`;
      info = `${phenoListHTML(ph.parts)}<div class="geno-label">${T().genotype}</div>${geno}
        ${ind.hidden ? `<p class="muted small" style="margin-top:6px">${T().unknownNote}</p>` : ""}`;
    }
    if (lockSlot() === i) {
      return `<div class="pp locked">
        <div class="pp-head"><h3>${parentTitle(i)}</h3><span class="tag t-epi">${T().taskMystery}</span>${selfSw}</div>
        <div class="pp-main"><div class="pp-pic">${pic(ind)}</div><div class="pp-info">${info}</div></div>
        <p class="small muted">🔒 ${T().taskLocked}</p></div>`;
    }
    if (state.task && state.task.noDesign) {
      return `<div class="pp">
        <div class="pp-head"><h3>${parentTitle(i)}</h3>${ind.gen !== "P" ? `<span class="gen-tag">${genLabel(ind.gen)}</span>` : ""}${selfSw}</div>
        <div class="pp-main"><div class="pp-pic">${pic(ind)}</div><div class="pp-info">${info}</div></div>
        ${mode === "pheno" ? body : ""}</div>`;
    }
    return `<div class="pp">
      <div class="pp-head"><h3>${parentTitle(i)}</h3>${ind.gen !== "P" ? `<span class="gen-tag">${genLabel(ind.gen)}</span>` : ""}${selfSw}</div>
      <div class="seg" role="group"><button type="button" data-act="pmode" data-i="${i}" data-m="pheno" aria-pressed="${mode === "pheno"}">${T().modePheno}</button>
        <button type="button" data-act="pmode" data-i="${i}" data-m="design" aria-pressed="${mode === "design"}">${T().modeDesign}</button></div>
      <div class="pp-main"><div class="pp-pic">${pic(ind)}</div><div class="pp-info">${info}</div></div>
      ${body}
      ${done && isLethal(ind) ? `<div class="note warn">☠ ${T().lethalWarn}</div>` : ""}</div>`;
  }
  const nSelectHTML = () => `<label for="nSelect">${T().nLabel}
        <select id="nSelect" class="sel">${[20, 50, 100, 200, 500, 1000].map(n => `<option ${n === state.n ? "selected" : ""}>${n}</option>`).join("")}</select></label>`;
  function parentsReady() {
    const [a, b] = crossParents();
    return complete(a) && complete(b) && !isLethal(a) && !isLethal(b);
  }
  function step3() {
    ensureParents();
    if (state.predicting && parentsReady()) return step3Predict();
    state.predicting = false;
    const self = state.selfing && SP().selfing;
    const ready = parentsReady();
    const panels = self ? parentPanel(0) : parentPanel(0) + `<div class="x-sep">×</div>` + parentPanel(1);
    return `<section class="step-sec"><h2 class="step-h">${T().s3h}</h2><p class="step-p">${T().s3p}</p>
      ${state.banner ? `<div class="note">👉 ${T().readyBanner}</div>` : ""}
      <div class="pp-row ${self ? "self" : ""}">${panels}</div>
      <div class="cross-bar sticky">${ready ? `<span class="cross-q">${T().crossQ}</span>` : `<span class="cross-q muted">${T().chooseBoth}</span>`}
        ${state.task ? "" : `<button type="button" class="btn" data-act="goto" data-s="2">${T().back}</button>`}
        ${nSelectHTML()}
        ${ratioMode() ? "" : `<button type="button" class="btn" data-act="predict" ${ready ? "" : "disabled"}><span class="hide-m">${T().predictBtn}</span><span class="show-m">🔲 ${T().predH}</span></button>`}
        <button type="button" class="btn primary" data-act="cross" ${ready ? "" : "disabled"}>${T().crossDirect}</button>
        ${state.offspring.length ? `<button type="button" class="btn" data-act="goto" data-s="4">${T().next}</button>` : ""}</div></section>`;
  }
  function step3Predict() {
    const t = T();
    const [a, b] = crossParents();
    const self = a === b;
    const p = (x, i) => `<div class="cs-p">${mini(x)}<span><b>${self ? t.parent + " 1" : parentTitle(i)}</b><br>${phenoText(phenoOf(x).parts)}${!x.hidden ? `<br><span class="mono" style="color:var(--accent);font-weight:700">${genoInfo(x).html}</span>` : ""}</span></div>`;
    return `<section class="step-sec"><h2 class="step-h">🔲 ${t.predH}</h2><p class="step-p">${t.predP}</p>
      <div class="cross-sum">${p(a, 0)}<span class="cs-x">${self ? "⟲" : "×"}</span>${self ? "" : p(b, 1)}</div>
      ${hypBox()}${tabPun()}
      <div class="cross-bar sticky"><button type="button" class="btn" data-act="unpredict">${t.changeParents}</button>${nSelectHTML()}
        <button type="button" class="btn primary" data-act="cross">${t.crossCompare}</button></div></section>`;
  }
  // ============================================================
  // STEG 4 – AVKOMMA
  // ============================================================
  function kidButton(k, extraCls, style) {
    return `<button type="button" class="kid ${extraCls || ""}" ${style ? `style="${style}"` : ""} data-act="kid" data-u="${k.uid}" title="${phenoText(phenoOf(k).parts)}">${drawInd(k)}${k.sex === "F" || k.sex === "M" ? `<span class="sx ${k.sex === "F" ? "f" : "m"}">${k.sex === "F" ? "♀" : "♂"}</span>` : ""}${extraCls && extraCls.includes("tagged") ? `<span class="tagdot"></span>` : ""}</button>`;
  }
  function crossSummary() {
    const [pa, pb] = state.offParents;
    const kids = state.offspring;
    const p = (x) => `<div class="cs-p">${mini(x)}<span>${sexSym(x.sex)} ${phenoText(phenoOf(x).parts)}${!x.hidden ? `<br><span class="mono" style="color:var(--accent);font-weight:700">${genoInfo(x).html}</span>` : ""}</span></div>`;
    return `<div class="cross-sum">${p(pa)}<span class="cs-x">${pa === pb ? "⟲" : "×"}</span>${pa === pb ? "" : p(pb)}
      <div class="cs-n">→ <b>${kids.length}</b> ${T().offspringWord} <span class="gen-tag">${genLabel(kids[0].gen)}</span></div></div>`;
  }
  function step4() {
    const kids = state.offspring;
    const show = kids.slice(0, 200);
    const t = T();
    const opt = (o, tab) => `<button type="button" class="opt-card" data-act="analyse" data-tab="${tab}"><span class="opt-ico">${o[0]}</span><span class="opt-t">${o[1]}</span><span class="opt-d">${o[2]}</span></button>`;
    return `<section class="step-sec"><h2 class="step-h">${t.s4h}</h2><p class="step-p">${t.s4p}</p>
      ${crossSummary()}
      <h3 class="step-h" style="font-size:1.1rem">${t.howNext}</h3>
      <div class="opt-grid">${opt(t.optCount, "count")}${ratioMode() ? "" : opt(t.optPun, "pun")}${opt(t.optChi, "chi")}${!state.task && unknownTargets().length ? opt(t.optGuess, "guess") : ""}
        <button type="button" class="opt-card ${state.moreOpen ? "on" : ""}" data-act="moreToggle" aria-expanded="${!!state.moreOpen}"><span class="opt-ico">${t.optMore[0]}</span><span class="opt-t">${t.optMore[1]} ${state.moreOpen ? "▴" : "▾"}</span><span class="opt-d">${t.optMore[2]}</span></button></div>
      ${state.moreOpen ? `<div class="more-panel"><b>${t.howMore}</b>
          <button type="button" class="btn small" data-act="again">${t.again}</button>
          ${lockSlot() >= 0 ? "" : `<button type="button" class="btn small" data-act="siblings">${t.siblings}</button>
          ${SP().selfing ? `<button type="button" class="btn small" data-act="selfRandom">${t.selfRandom}</button>` : ""}`}
          <button type="button" class="btn small" data-act="newcross">${t.newCross}</button></div>` : ""}
      <div class="brood big">${show.map(k => kidButton(k)).join("")}</div>
      ${kids.length > show.length ? `<p class="muted">${t.showing(show.length, kids.length)}</p>` : ""}
      ${navHTML(3, 5)}</section>`;
  }
  // ============================================================
  // STEG 5 – ANALYS
  // ============================================================
  function srcParents() { return state.predicting ? crossParents() : state.offParents; }
  function hypParents() {
    if (!state.hyp[0]) {
      const [pa, pb] = srcParents();
      const mk = (p) => p.hidden ? makeInd(p.sex, () => "?", "P") : p;
      state.hyp[0] = mk(pa);
      state.hyp[1] = pa === pb ? state.hyp[0] : mk(pb);
    }
    return [state.hyp[0], state.hyp[1]];
  }
  function hypBox() {
    const [pa, pb] = srcParents();
    const self = pa === pb;
    const known = !pa.hidden && !pb.hidden;
    const [A, B] = hypParents();
    const who = (i) => self ? `${T().parent} 1` : parentTitle(i);
    const selfNote = self ? `<p class="note">⟲ ${T().selfHyp}</p>` : "";
    if (known) {
      return `<div class="box"><h3>🧬 ${T().hypTitle}</h3>${selfNote}<div class="hyp-row">
        ${[pa, ...(self ? [] : [pb])].map((p, i) => `<div class="hyp-p">${mini(p)}<div><b>${who(i)}</b><br><span class="geno inl">${genoInfo(p).html}</span></div></div>`).join(`<span class="cs-x" style="align-self:center">×</span>`)}</div></div>`;
    }
    const eds = [[pa, A], ...(self ? [] : [[pb, B]])].map(([real, h], i) => !real.hidden
      ? `<div class="hyp-p">${mini(real)}<div><b>${who(i)}</b> <span class="small muted">(${T().knownGeno})</span><br><span class="geno inl">${genoInfo(real).html}</span></div></div>`
      : `<div class="hyp-p" style="flex-direction:column;align-items:flex-start">
        <div style="display:flex;gap:10px;align-items:center">${mini(h)}<div><b>${T().hypFor(who(i).toLowerCase())}</b><br><span class="geno inl">${genoInfo(h).html}</span></div></div>
        ${chromoHTML(h, "h" + i, true)}
        ${complete(h) && isLethal(h) ? `<span class="dead">${T().lethalWarn}</span>` : ""}</div>`).join("");
    const facit = state.showFacit ? `<div class="facit">${T().facitIs} ${[pa, ...(self ? [] : [pb])].map(p => `<span class="mono" style="font-weight:700">${genoInfo(p).html}</span>`).join(" × ")}</div>` : "";
    return `<div class="box"><h3>🧬 ${T().hypTitle}</h3><p class="instr">${T().hypUnknown}</p>${selfNote}<div class="hyp-row">${eds}</div>
      <div class="toolbar"><button type="button" class="btn small" data-act="facit">${state.showFacit ? T().hideFacit : T().facit}</button>${facit}</div></div>`;
  }
  function splitSw() {
    return sexed() ? `<label class="switch"><input type="checkbox" id="splitToggle" ${state.splitSex ? "checked" : ""}><span class="track"></span><span>${T().split}</span></label>` : "";
  }

  // ---------- Räkna ----------
  function countClasses() {
    const exp = classify(state.offCross.zs, "pheno");
    const obs = classify(state.offspring, "pheno");
    obs.forEach(o => { if (!exp.find(e => e.key === o.key)) exp.push(o); });
    exp.forEach(e => { const o = obs.find(x => x.key === e.key); e.n = o ? o.n : 0; e.members = o ? o.members : []; });
    return sortClasses(exp);
  }
  const kidKey = (k) => phenoOf(k).key + (sexed() && state.splitSex ? "#" + k.sex : "");
  function tabCount() {
    const t = T();
    const cls = countClasses();
    const color = {};
    cls.forEach((c, i) => color[c.key] = TAGCOL[i % TAGCOL.length]);
    const kids = state.offspring;
    let show = kids.slice(0, 200);
    if (state.sortBrood) {
      const order = cls.map(c => c.key);
      show = show.slice().sort((a, b) => order.indexOf(kidKey(a)) - order.indexOf(kidKey(b)));
    }
    const tagN = {};
    Object.values(state.tags).forEach(k => tagN[k] = (tagN[k] || 0) + 1);
    let wrong = 0, empty = 0;
    const cards = cls.map(c => {
      const v = state.countIn[c.key];
      let cl = "";
      if (state.countChecked) {
        if (v == null || String(v).trim() === "") empty++;
        else { const ok = parseNum(v) === c.n; cl = ok ? "okf" : "badf"; if (!ok) wrong++; }
      }
      return `<div class="cnt-card ${state.activeTag === c.key ? "on" : ""}" style="--tc:${color[c.key]}">
        <button type="button" class="cnt-pick" data-act="tagsel" data-k="${c.key}">
          <div class="pick-img">${drawInd(c.sample)}</div><div class="pick-n">${c.sex ? sexSym(c.sex) + " " : ""}${phLines(c.label)}</div>
          <span class="cnt-tagged"><i></i>${t.tagged(tagN[c.key] || 0)}</span></button>
        <input type="text" inputmode="numeric" class="num-in ${cl}" data-cnt="${c.key}" value="${v != null ? v : ""}" placeholder="?" aria-label="${phenoText(c.label)}"></div>`;
    }).join("");
    const sum = cls.reduce((s, c) => s + (parseNum(state.countIn[c.key]) || 0), 0);
    const brood = show.map(k => {
      const tag = state.tags[k.uid];
      const bad = state.countChecked && tag && tag !== kidKey(k);
      return kidButton(k, (tag ? "tagged" : "") + (bad ? " wrongtag" : ""), tag ? `--tc:${color[tag]}` : "");
    }).join("");
    if (state.countChecked) state._st.count = { wrong, empty, data: { vals: cls.map(c => ({ parts: c.label.map(x => x.txt), sex: c.sex, v: state.countIn[c.key] || "–" })) } };
    return `<div class="box"><h3>🔢 ${t.tabCount.replace(/^\S+\s/, "")} ${splitSw()}</h3><p class="instr">${t.countInstr}</p>
      ${kids.length > 200 ? `<p class="note">${t.countBig}</p>` : ""}
      <div class="cnt-grid">${cards}</div>
      <div class="toolbar"><button type="button" class="btn small" data-act="sort">${state.sortBrood ? t.unsort : t.sort}</button>
        <button type="button" class="btn small primary" data-act="countCheck">${t.check}</button>
        <button type="button" class="btn small" data-act="countFill">${t.fillAll}</button>
        <button type="button" class="btn small" data-act="countClear">${t.clear}</button>
        <span class="sumline">${t.sum(sum, kids.length)}</span>
        ${state.countChecked ? verdictHTML(wrong, empty, "count") : ""}</div>
      <div class="brood big">${brood}</div></div>`;
  }

  // ---------- Korsningsschema ----------
  const gamKey = (gm) => studyGenes().map(g => gm.g[g] == null ? "-" : gm.g[g]).join(",") + (gm.y ? "Y" : "");
  function gameteOptions() {
    let list = [{ g: {}, y: false }];
    chrGroups(studyGenes()).forEach(grp => {
      let hap = [{}];
      grp.genes.forEach(g => { const nh = []; hap.forEach(h => alleleIds(g).forEach(a => nh.push({ ...h, [g]: a }))); hap = nh; });
      const outs = hap.map(h => ({ a: h, y: false }));
      if (isSexChr(grp.chr)) { const n = {}; grp.genes.forEach(g => n[g] = null); outs.push({ a: n, y: true }); }
      const nl = [];
      list.forEach(x => outs.forEach(o => nl.push({ g: { ...x.g, ...o.a }, y: x.y || o.y })));
      list = nl;
    });
    return list.map(gm => ({ ...gm, key: gamKey(gm), html: gameteHTML(gm) }));
  }
  function genotypeOptions() {
    const sexes = sexed() ? ["F", "M"] : [null];
    const map = new Map();
    sexes.forEach(sx => allGenotypes(sx, true).forEach(ind => {
      const gi = genoInfo(ind);
      if (!map.has(gi.key)) map.set(gi.key, { key: gi.key, html: gi.html, ind, rank: genoRank(ind) + (ind.sex || "") });
    }));
    return [...map.values()].sort((a, b) => a.rank < b.rank ? -1 : 1);
  }
  function punClasses(cross) {
    const save = state.splitSex;
    state.splitSex = sexChrStudied();
    const cls = sortClasses(classify(cross.zs, "pheno"));
    state.splitSex = save;
    return cls;
  }
  function tabPun() {
    const t = T();
    const [A, B] = hypParents();
    if (!complete(A) || !complete(B)) return `<div class="box"><p class="instr">⬆ ${t.fillHypFirst}</p></div>`;
    if (isLethal(A) || isLethal(B)) return `<div class="note warn">☠ ${t.lethalWarn}</div>`;
    const G1 = gametes(A), G2 = gametes(B);
    if (G1.length > 8 || G2.length > 8) return `<div class="box"><p class="instr">${t.punBig(G1.length, G2.length)}</p></div>`;
    let P = state.pun;
    if (!P || P.n1 !== G1.length || P.n2 !== G2.length) {
      P = state.pun = { n1: G1.length, n2: G2.length, g1: Array(G1.length).fill(""), g2: Array(G2.length).fill(""), c: {}, r: {}, checked: false };
    }
    const gopt = gameteOptions();
    const gmap = Object.fromEntries(gopt.map(o => [o.key, o]));
    const genOpt = genotypeOptions();
    const genMap = Object.fromEntries(genOpt.map(o => [o.key, o]));
    const cross = computeCross(A, B);
    const equal = G1.every(g => Math.abs(g.p - G1[0].p) < 1e-9) && G2.every(g => Math.abs(g.p - G2[0].p) < 1e-9);

    // facit för rubrikerna (oberoende av ordning)
    const headOK = (side, vals, G) => {
      const pool = {};
      G.forEach(g => pool[g.key] = (pool[g.key] || 0) + 1);
      return vals.map(v => { if (v && pool[v] > 0) { pool[v]--; return true; } return false; });
    };
    const ok1 = headOK(1, P.g1, G1), ok2 = headOK(2, P.g2, G2);
    const cellTarget = (i, j) => {
      const a = P.g1[i] ? gmap[P.g1[i]] : G1[i], b = P.g2[j] ? gmap[P.g2[j]] : G2[j];
      return genoInfo(zygote(a, b)).key;
    };
    let wrong = 0, empty = 0;
    const gsel = (side, ix, val) => `<select data-pg="${side}" data-ix="${ix}"><option value="">?</option>${gopt.map(o => `<option value="${o.key}" ${o.key === val ? "selected" : ""}>${plain(o.html)}</option>`).join("")}</select>`;
    const small = Math.max(G1.length, G2.length) > 4;
    const corner = sexed() ? `${sexSym("F")} \\ ${sexSym("M")}` : "1 \\ 2";
    let h = `<div class="punnett-wrap"><table class="punnett ex ${small ? "small" : ""}"><tr><th class="corner">${corner}</th>`;
    G2.forEach((g, j) => {
      const c = !P.checked ? "" : !P.g2[j] ? "" : ok2[j] ? "okc" : "badc";
      if (P.checked) { if (!P.g2[j]) empty++; else if (!ok2[j]) wrong++; }
      h += `<th class="col ${c}">${gsel(2, j, P.g2[j])}${!equal ? `<small>${pct(g.p, 1)}</small>` : ""}</th>`;
    });
    h += `</tr>`;
    G1.forEach((g, i) => {
      const c = !P.checked ? "" : !P.g1[i] ? "" : ok1[i] ? "okc" : "badc";
      if (P.checked) { if (!P.g1[i]) empty++; else if (!ok1[i]) wrong++; }
      h += `<tr><th class="row ${c}">${gsel(1, i, P.g1[i])}${!equal ? `<small>${pct(g.p, 1)}</small>` : ""}</th>`;
      G2.forEach((g2, j) => {
        const k = i + "," + j;
        const val = P.c[k] || "";
        const o = genMap[val];
        let cc = "";
        if (P.checked) { if (!val) empty++; else { const okc = val === cellTarget(i, j); cc = okc ? "okc" : "badc"; if (!okc) wrong++; } }
        const pic = !o ? `<div class="mini empty">?</div>` : isLethal(o.ind) ? `<div class="mini empty">†</div>` : `<div class="mini">${drawInd(o.ind)}</div>`;
        h += `<td class="${cc}">${pic}<select data-pc="${k}"><option value="">?</option>${genOpt.map(x => `<option value="${x.key}" ${x.key === val ? "selected" : ""}>${plain(x.html)}</option>`).join("")}</select>
          ${o && isLethal(o.ind) ? `<div class="dead">${t.dies}</div>` : (o && (o.ind.sex === "F" || o.ind.sex === "M") && sexChrStudied() ? `<div class="cs">${sexSym(o.ind.sex)}</div>` : "")}</td>`;
      });
      h += `</tr>`;
    });
    h += `</table></div>`;

    // fenotypkvot
    const cls = punClasses(cross);
    const cells = Math.round(G1.length * G2.length * (1 - cross.lethalFrac));
    const target = (c) => equal ? Math.round(c.p * cells) : c.p * 100;
    const ratio = cls.map(c => {
      const v = P.r[c.key];
      let cl = "";
      if (P.checked && (v == null || String(v).trim() === "")) empty++;
      else if (P.checked) {
        const x = parseNum(v);
        const okr = equal ? x === target(c) : Math.abs(x - target(c)) <= 0.6;
        cl = okr ? "okf" : "badf"; if (!okr) wrong++;
      }
      return `<div class="cnt-card"><div class="pick-img">${drawInd(c.sample)}</div><div class="pick-n">${c.sex ? sexSym(c.sex) + " " : ""}${phLines(c.label)}</div>
        <input type="text" inputmode="decimal" class="num-in ${cl}" data-pr="${c.key}" value="${v != null ? v : ""}" placeholder="?">
        <span class="small muted">${equal ? t.ofCells(cells) : "%"}</span></div>`;
    }).join("");

    if (P.checked) state._st.pun = { wrong, empty, data: { hyp: genoInfo(A).html + (A === B ? " ⟲" : " × " + genoInfo(B).html), unit: equal ? "cells" : "%", vals: cls.map(c => ({ parts: c.label.map(x => x.txt), sex: c.sex, v: P.r[c.key] || "–" })) } };
    return `<div class="box"><h3>🔲 ${t.tabPun.replace(/^\S+\s/, "")}</h3><p class="instr">${t.punInstr}</p>
      ${!equal ? `<p class="note">${t.punUnequal}</p>` : ""}
      ${h}
      <div class="sub-q" style="margin-top:6px">${equal ? t.ratioQ : t.ratioQPct}</div>
      ${cross.lethalFrac > 1e-9 ? `<p class="small muted">${t.lethalCells}</p>` : ""}
      <div class="cnt-grid">${ratio}</div>
      <div class="toolbar"><button type="button" class="btn small primary" data-act="punCheck">${t.check}</button>
        <button type="button" class="btn small" data-act="punFill">${t.fillAll}</button>
        <button type="button" class="btn small" data-act="punClear">${t.clear}</button>
        ${P.checked ? verdictHTML(wrong, empty, "pun") : ""}</div></div>`;
  }
  function punFill() {
    const [A, B] = hypParents();
    const G1 = gametes(A), G2 = gametes(B);
    const cross = computeCross(A, B);
    const equal = G1.every(g => Math.abs(g.p - G1[0].p) < 1e-9) && G2.every(g => Math.abs(g.p - G2[0].p) < 1e-9);
    const P = state.pun = { n1: G1.length, n2: G2.length, g1: G1.map(g => g.key), g2: G2.map(g => g.key), c: {}, r: {}, checked: false };
    G1.forEach((a, i) => G2.forEach((b, j) => P.c[i + "," + j] = genoInfo(zygote(a, b)).key));
    const cells = Math.round(G1.length * G2.length * (1 - cross.lethalFrac));
    punClasses(cross).forEach(c => P.r[c.key] = equal ? String(Math.round(c.p * cells)) : num(c.p * 100, 1));
  }

  // ---------- χ²-test ----------
  const newChiIn = () => ({ O: {}, E: {}, t: {}, R: {}, chi: "", df: "", concl: "" });
  function chiData() {
    const N = state.offspring.length;
    const obs = classify(state.offspring, "pheno");
    let all, needRatio = false;
    if (ratioMode()) {
      const C = state.chiIn || (state.chiIn = newChiIn());
      const R = obs.map(o => parseNum(C.R[o.key]));
      const ok = R.every(x => !isNaN(x) && x > 0);
      needRatio = !ok;
      const sum = ok ? R.reduce((a, b) => a + b, 0) : 1;
      all = obs.map((o, i) => ({ key: o.key, label: o.label, sample: o.sample, sex: o.sex, rank: o.rank, p: ok ? R[i] / sum : 0 }));
    } else {
      const [A, B] = hypParents();
      const hc = computeCross(A, B);
      const exp = classify(hc.zs, "pheno");
      all = exp.map(e => ({ key: e.key, label: e.label, sample: e.sample, sex: e.sex, rank: e.rank, p: e.p }));
      obs.forEach(o => { if (!all.find(a => a.key === o.key)) all.push({ key: o.key, label: o.label, sample: o.sample, sex: o.sex, rank: o.rank, p: 0 }); });
    }
    all.forEach(a => { const o = obs.find(x => x.key === a.key); a.O = o ? o.n : 0; a.E = a.p * N; a.t = a.E > 0 ? Math.pow(a.O - a.E, 2) / a.E : null; });
    sortClasses(all);
    const valid = all.filter(a => a.E > 0);
    const chi = valid.reduce((s, a) => s + a.t, 0);
    const df = valid.length - 1;
    return { rows: all, N, chi, df, crit: CRIT05[df], needRatio, unexpected: needRatio ? [] : all.filter(a => a.E === 0 && a.O > 0) };
  }
  const near = (x, y, abs, rel) => !isNaN(x) && Math.abs(x - y) <= Math.max(abs, Math.abs(y) * rel);
  function tabChi() {
    const t = T();
    const rm = ratioMode();
    const [A, B] = rm ? [null, null] : hypParents();
    if (!rm && (!complete(A) || !complete(B))) return `<div class="box"><p class="instr">⬆ ${t.fillHypFirst}</p></div>`;
    if (!rm && (isLethal(A) || isLethal(B))) return `<div class="note warn">☠ ${t.lethalWarn}</div>`;
    if (!state.chiIn) state.chiIn = newChiIn();
    const d = chiData();
    const C = state.chiIn;
    const chk = state.chiChecked;
    let wrong = 0, empty = 0;
    const cell = (kind, key, val, okFn) => {
      let cl = "";
      if (chk && (val == null || String(val).trim() === "")) empty++;
      else if (chk) { const ok = okFn(parseNum(val)); cl = ok ? "okf" : "badf"; if (!ok) wrong++; }
      return `<input type="text" inputmode="decimal" class="num-in ${cl}" data-chi="${kind}" data-k="${key}" value="${val != null ? val : ""}" placeholder="?">`;
    };
    if (d.unexpected.length) {
      return `<div class="box"><h3>${t.tabChi} ${splitSw()}</h3><div class="note warn">${t.chiUnexpected(d.unexpected.map(u => (u.sex ? sexSym(u.sex) + " " : "") + phenoText(u.label)).join("</b>; <b>"))}</div></div>`;
    }
    const ratioIn = (r) => `<input type="text" inputmode="decimal" class="num-in" data-chi="R" data-k="${r.key}" value="${C.R[r.key] != null ? C.R[r.key] : ""}" placeholder="?">`;
    const rows = d.rows.filter(r => rm || r.E > 0).map(r => `<tr><td><div class="ph-cell">${mini(r.sample)}<span>${r.sex ? sexSym(r.sex) + " " : ""}${phenoText(r.label)}</span></div></td>
      ${rm ? `<td>${ratioIn(r)}</td>` : ""}
      <td>${cell("O", r.key, C.O[r.key], x => x === r.O)}</td>
      <td>${cell("E", r.key, C.E[r.key], x => near(x, r.E, 0.06, 0))}</td>
      <td>${cell("t", r.key, C.t[r.key], x => near(x, r.t, 0.015, 0.03))}</td></tr>`).join("");
    const chiCell = cell("chi", "", C.chi, x => near(x, d.chi, 0.03, 0.03));
    const dfCell = cell("df", "", C.df, x => x === d.df);
    const reject = d.crit != null && d.chi > d.crit;
    let conclCls = "";
    if (chk && !C.concl) empty++;
    else if (chk) { const ok = C.concl === (reject ? "no" : "ok"); conclCls = ok ? "ok" : "bad"; if (!ok) wrong++; }
    const critTable = `<table class="crit"><tr><th>${t.df}</th>${[1, 2, 3, 4, 5, 6, 7].map(n => `<td>${n}</td>`).join("")}</tr><tr><th>χ²</th>${[1, 2, 3, 4, 5, 6, 7].map(n => `<td>${num(CRIT05[n], 2)}</td>`).join("")}</tr></table>`;
    const hypTxt = rm ? d.rows.map(r => C.R[r.key] || "?").join(" : ") : genoInfo(A).html + (A === B ? " ⟲" : " × " + genoInfo(B).html);
    if (chk) state._st.chi = { wrong, empty, data: { hyp: hypTxt, chi: C.chi, df: C.df, concl: C.concl } };
    return `<div class="box"><h3>${t.tabChi} ${splitSw()}</h3>
      <p class="instr">${rm ? t.chiRatioInstr : t.chiInstr}</p>${rm && d.needRatio ? `<p class="note">${t.needRatio}</p>` : ""}
      <div class="toolbar"><span class="formula">χ² = Σ (O − E)² / E</span><span class="sumline">${t.chiN(d.N)}</span></div>
      <table class="chi"><thead><tr><th style="text-align:left">${t.phenotype}</th>${rm ? `<th>${t.ratioCol}</th>` : ""}<th>O</th><th>E</th><th>(O − E)² / E</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="${rm ? 4 : 3}" style="text-align:right">${t.chiSum}</td><td>${chiCell}</td></tr>
      <tr><td colspan="${rm ? 4 : 3}" style="text-align:right">${t.df}</td><td>${dfCell}</td></tr></tfoot></table>
      <div class="sub-q">${t.crit}</div>${critTable}
      <div class="concl"><b>${t.conclQ}</b>
        <label><input type="radio" name="concl" value="ok" ${C.concl === "ok" ? "checked" : ""}> ${t.conclOk}</label>
        <label><input type="radio" name="concl" value="no" ${C.concl === "no" ? "checked" : ""}> ${t.conclNo}</label>
        ${chk && conclCls ? `<span class="${conclCls}">${conclCls === "ok" ? "✔" : "✘"}</span>` : ""}</div>
      <div class="toolbar"><button type="button" class="btn small primary" data-act="chiCheck">${t.check}</button>
        <button type="button" class="btn small" data-act="chiFill">${t.fillAll}</button>
        <button type="button" class="btn small" data-act="chiClear">${t.clear}</button>
        ${chk ? verdictHTML(wrong, empty, "chi") : ""}</div></div>`;
  }
  function chiFill() {
    const keepR = state.chiIn && ratioMode() ? state.chiIn.R : {};
    const C = state.chiIn = newChiIn();
    C.R = keepR;
    const d = chiData();
    if (d.needRatio) { d.rows.forEach(r => C.O[r.key] = String(r.O)); return; }
    d.rows.filter(r => r.E > 0).forEach(r => { C.O[r.key] = String(r.O); C.E[r.key] = num(r.E, 2); C.t[r.key] = num(r.t, 3); });
    C.chi = num(d.chi, 2); C.df = String(d.df);
    C.concl = d.crit != null && d.chi > d.crit ? "no" : "ok";
  }

  // ---------- Bestäm den okända genotypen ----------
  const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
  function unknownTargets() {
    const t = T();
    const out = [];
    if (inTask("pattern") || inTask("linkage")) return out;
    if (inTask("genotype")) {
      const m = state.task.mystery;
      return [{ ind: m, hypIdx: state.offParents ? state.offParents.indexOf(m) : -1, label: T().taskMystery, role: t.thisCross }].map(x => (x.hypIdx < 0 ? (x.hypIdx = null) : 0, x));
    }
    const [pa, pb] = state.offParents || [];
    if (!pa) return out;
    const self = pa === pb;
    [pa, ...(self ? [] : [pb])].forEach((p, i) => { if (p.hidden) out.push({ ind: p, hypIdx: i, label: self ? `${t.parent} 1` : parentTitle(i), role: t.thisCross }); });
    const isP = pa.gen === "P" && pb.gen === "P";
    if (state.pParents && !isP) {
      state.pParents.forEach((p, i) => {
        if (!p.hidden || (i === 1 && state.pSelf)) return;
        const who = sexed() ? (i === 0 ? t.pMother : t.pFather) : (i === 0 ? t.pP1 : t.pP2);
        out.push({ ind: p, hypIdx: null, label: cap(who), role: t.pGen });
      });
    }
    return out;
  }
  function guessOpts(ind, g) {
    const ids = alleleIds(g);
    const hemi = ind.g[g].includes(null);
    const sexG = isSexChr(geneDef(g).chr);
    const L = sexLetters();
    const al = (a) => plain(aHTML(g, a));
    if (hemi) return ids.map(a => [a, `${L[0]}(${al(a)}) ${L[1]}`]);
    const out = [];
    for (let i = 0; i < ids.length; i++) for (let j = i; j < ids.length; j++)
      out.push([ids[i] + "," + ids[j], sexG ? `${L[0]}(${al(ids[i])}) ${L[0]}(${al(ids[j])})` : al(ids[i]) + al(ids[j])]);
    return out;
  }
  const actualKey = (ind, g) => ind.g[g].filter(a => a != null).sort((p, q) => aIdx(g, p) - aIdx(g, q)).join(",");
  const guessText = (ind, vals) => studyGenes().map(g => { const o = guessOpts(ind, g).find(x => x[0] === vals[g]); return o ? o[1] : "?"; }).join(" ");
  function tabGuess() {
    const t = T();
    const list = unknownTargets();
    if (!list.length) return `<div class="box"><p class="instr">${t.guessNone}</p></div>`;
    const linked = chrGroups(studyGenes()).some(g => g.genes.length > 1);
    const cards = list.map(({ ind, label, role, hypIdx }) => {
      const G = state.guess[ind.uid] || (state.guess[ind.uid] = { vals: {}, checked: false, revealed: false });
      let wrong = 0;
      const rows = studyGenes().map(g => {
        const v = G.vals[g] || "";
        const tr = traitOfGene(g);
        let cl = "";
        let note = "";
        if (G.checked && v) {
          const ok = v === actualKey(ind, g); cl = ok ? "okf" : "badf"; if (!ok) wrong++;
          if (ok && G.ev) note = G.ev.det[g] ? `<span class="small ok">✔ ${t.geneSure}</span>`
            : `<span class="small" style="color:var(--gold)">⚠ ${t.geneNotSure(G.ev.alts[g].map(k => (guessOpts(ind, g).find(o => o[0] === k) || [k, k])[1]).join(t.or))}</span>`;
        }
        if (G.checked && !v) wrong++;
        return `<div class="g-row"><span class="gname">${tt(tr.name)}${tr.genes.length > 1 ? ` (${g})` : ""}</span>
          <select class="sel ${cl}" data-guess="${ind.uid}" data-g="${g}"><option value="">?</option>${guessOpts(ind, g).map(o => `<option value="${o[0]}" ${o[0] === v ? "selected" : ""}>${o[1]}</option>`).join("")}</select>${note}</div>`;
      }).join("");
      const solved = G.checked && !wrong;
      const hyp = hypIdx != null ? state.hyp[hypIdx] : null;
      const canHyp = hyp && hyp !== ind && complete(hyp);
      return `<div class="guess-card ${solved ? "solved" : ""}">
        <div class="guess-head">${mini(ind)}<div><b>${label}</b> <span class="small muted">– ${role}</span><br>${phenoText(phenoOf(ind).parts)}</div></div>
        ${rows}
        <div class="toolbar"><button type="button" class="btn small primary" data-act="guessCheck" data-u="${ind.uid}">${t.guessCheck}</button>
          ${canHyp ? `<button type="button" class="btn small" data-act="guessHyp" data-u="${ind.uid}" data-h="${hypIdx}">${t.guessUseHyp}</button>` : ""}
          <button type="button" class="btn small" data-act="guessReveal" data-u="${ind.uid}">${t.guessReveal}</button></div>
        ${G.checked ? guessFeedback(ind, G, solved, wrong, role) : ""}
        ${G.revealed && !solved ? `<div class="facit">${t.facitIs} <span class="mono" style="font-weight:700">${genoInfo(ind).html}</span></div>` : ""}</div>`;
    }).join("");
    return `<div class="box"><h3>${t.tabGuess}</h3><p class="instr">${t.guessInstr}</p>${linked ? `<p class="small muted">${t.guessLinked}</p>` : ""}<div class="guess-grid">${cards}</div></div>`;
  }
  // ---------- Räcker underlaget för att avgöra genotypen? ----------
  // Varje genotyp som stämmer med fenotypen prövas mot alla korsningar där
  // individen själv var förälder. Genotyper som är minst 100 gånger mindre
  // sannolika än den bästa (eller omöjliga) räknas som uteslutna.
  const rootOf = (ind) => ind.src || ind;
  function expandPhases(list) {
    let out = list;
    chrGroups(studyGenes()).filter(g => g.genes.length > 1 && !isSexChr(g.chr)).forEach(grp => {
      const nl = [];
      out.forEach(c => {
        const vars = [c];
        grp.genes.slice(1).forEach(g => {
          vars.slice().forEach(v => { if (v.g[g][0] !== v.g[g][1]) vars.push({ ...v, g: { ...v.g, [g]: v.g[g].slice().reverse() } }); });
        });
        nl.push(...vars);
      });
      out = nl;
    });
    return out;
  }
  function candidatesFor(ind) {
    const key = phenoOf(ind).key;
    return expandPhases(allGenotypes(ind.sex, false).filter(c => phenoOf(c).key === key));
  }
  function crossProbs(m, f) {
    const P = {};
    computeCross(m, f).zs.forEach(x => { const k = phenoOf(x.z).key + (sexed() ? "#" + x.z.sex : ""); P[k] = (P[k] || 0) + x.p; });
    return P;
  }
  function logL(P, counts) {
    let sum = 0;
    for (const k in counts) { const pr = P[k] || 0; if (pr <= 0) return -Infinity; sum += counts[k] * Math.log(pr); }
    return sum;
  }
  function evidenceFor(ind) {
    const root = rootOf(ind);
    const evs = state.evidence.filter(e => e.ra === root || e.rb === root);
    const cands = candidatesFor(ind);
    const partnerCache = new Map();
    const partners = (o) => { if (!o.hidden) return [o]; if (!partnerCache.has(o)) partnerCache.set(o, candidatesFor(o)); return partnerCache.get(o); };
    const scores = cands.map(c => {
      let tot = 0;
      for (const e of evs) {
        const isA = e.ra === root;
        let best = -Infinity;
        if (e.self) best = logL(crossProbs(c, c), e.counts);
        else partners(isA ? e.b : e.a).forEach(o => { const l = logL(isA ? crossProbs(c, o) : crossProbs(o, c), e.counts); if (l > best) best = l; });
        tot += best;
        if (tot === -Infinity) break;
      }
      return tot;
    });
    const max = Math.max(...scores);
    const keep = cands.filter((c, i) => scores[i] > -Infinity && scores[i] >= max - Math.log(100));
    const det = {}, alts = {};
    studyGenes().forEach(g => { const set = [...new Set(keep.map(c => actualKey(c, g)))]; det[g] = set.length <= 1; alts[g] = set; });
    const phenoOnly = studyGenes().every(g => new Set(cands.map(c => actualKey(c, g))).size === 1);
    return { det, alts, phenoOnly, nCross: evs.length, nKids: evs.reduce((sm, e) => sm + e.n, 0) };
  }
  function guessFeedback(ind, G, solved, wrong, role) {
    const t = T();
    const ev = G.ev;
    const base = ev ? `<p class="small muted">${ev.nCross ? t.evidenceLine(ev.nCross, ev.nKids) : t.guessNoCross}</p>` : "";
    if (!solved) return `<span class="verdict bad">${t.guessWrongN(wrong)}</span>${base}`;
    const geno = `<span class="mono" style="font-weight:700">${genoInfo(ind).html}</span>`;
    const sure = ev && studyGenes().every(g => ev.det[g]);
    const taskG = inTask("genotype") && ind === state.task.mystery;
    if (sure) return `<div class="next-hint" style="display:block">${taskG ? `<b>${t.taskSolvedGeno}</b><br>` : ""}${t.guessRight(geno)} ${ev.phenoOnly || !ev.nCross ? t.guessPhenoOnly : t.guessSolid(ev.nCross, ev.nKids)}

    const unsure = studyGenes().filter(g => !ev.det[g]).map(g => ev.alts[g].map(k => (guessOpts(ind, g).find(o => o[0] === k) || [k, k])[1]).join(t.and));

  }
  function findTarget(uid) { return unknownTargets().find(x => x.ind.uid === uid); }
  function logGuess(tg) {
    const G = state.guess[tg.ind.uid];
    const wrong = studyGenes().filter(g => G.vals[g] !== actualKey(tg.ind, g)).length;
    const e = state.curJ != null ? state.journal[state.curJ] : null;

    e.analyses = (e.analyses || []).filter(r => !(r.kind === "guess" && r.label === tg.label));

  const PATTERN_POOL = {
    easy:   [["pea", "shape"], ["pea", "seedcol"], ["pea", "flower"], ["pea", "height"], ["snap", "colour"]],
    medium: [["fly", "eye"], ["snap", "aurea"], ["hen", "blue"], ["fly", "wing"]],
    hard:   [["hen", "comb"], ["hen", "white"], ["hen", "barring"], ["fly", "curly"]]

  const PATTERN_ANSWER = {
    "pea.shape": "domrec", "pea.seedcol": "domrec", "pea.flower": "domrec", "pea.height": "domrec", "snap.colour": "int",
    "fly.eye": "sex", "snap.aurea": "leth", "hen.blue": "int", "fly.wing": "domrec",

  const PATTERN_OPTS = ["domrec", "int", "sex", "leth", "inter", "epi"];
  const inTask = (id) => !!state.task && (!id || state.task.id === id);
  const ratioMode = () => inTask("pattern");
  const lockSlot = () => state.task && state.task.lock != null ? state.task.lock : -1;
  const trName = (t) => inTask("pattern") ? S2("Okänd egenskap", "Unknown trait") : t.name;
  const pick1 = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function startTask(id, level) {
    const t = T();
    let sp, traits, lock = null, mystery = null, extra = {};
    state.task = null;
    if (id === "genotype") {
      if (level === "easy") { sp = "pea"; traits = [pick1(["shape", "seedcol", "flower", "podshape", "height"])]; }
      else if (level === "medium") { sp = "fly"; traits = ["eye", "wing"]; }
      else { sp = "hen"; traits = ["comb", "barring"]; }
    } else if (id === "pattern") {
      [sp, traits] = (() => { const x = pick1(PATTERN_POOL[level]); return [x[0], [x[1]]]; })();
      extra = { noDesign: true, pure: true, answer: PATTERN_ANSWER[sp + "." + traits[0]] };
    } else {
      sp = "fly"; traits = ["body", "wing"];
    }
    state.sp = sp; state.traits = traits;
    state.selfing = false; state.predicting = false; state.banner = false; state.moreOpen = false;
    clearOffspring();
    state.parents = [emptyInd(0), emptyInd(1)];
    state.pmode = ["pheno", "pheno"];
    if (id === "genotype") {
      lock = sp === "hen" ? 1 : 0;
      const sex = slotSex(lock);
      const opt = phenoOptions(sex)[0];
      mystery = randomPhase(cloneInd(pick1(opt.genos)));
      mystery.src = null; mystery.hidden = true; mystery.gen = "P";
    } else if (id === "linkage") {
      lock = 0;
      mystery = makeInd("F", (g, h) => h === 0 ? firstA(g) : lastA(g), "P");
      if (level === "hard" && Math.random() < 0.5) mystery.g.vg.reverse();
      mystery.hidden = level === "hard";
    }
    if (mystery) { state.parents[lock] = mystery; state.pmode[lock] = mystery.hidden ? "pheno" : "design"; }
    state.task = Object.assign({ id, level, lock, mystery, attempts: 0, solved: false, answer: null, startJ: state.journal.length, given: "" }, extra);
    state.splitSex = sexChrStudied();
    state.anaTab = "count";
    goStep(3);
  }
  function endTask() {
    state.task = null;
    state.parents = [null, null]; state.traits = []; clearOffspring();
    goStep(1);
  }

  function linkageData() {
    const k = state.task, root = k.mystery;
    const testers = state.evidence.filter(e => e.ra === root && !e.b.hidden &&
      e.b.g.b.every(a => a === "b") && e.b.g.vg.every(a => a === "vg"));
    const tot = {};
    let n = 0;
    testers.forEach(e => Object.keys(e.counts).forEach(key => { const pk = key.split("#")[0]; tot[pk] = (tot[pk] || 0) + e.counts[key]; n += e.counts[key]; }));
    const vals = Object.values(tot).sort((a, b) => a - b);
    const rec = vals.length >= 4 ? vals[0] + vals[1] : vals.length === 2 ? 0 : (vals[0] || 0);
    return { n, est: n ? rec / n * 100 : null, rec, testers: testers.length, any: supportCrosses(root).length };

  function answerLinkage() {

  function doCross() {
    const [a, b] = crossParents();
    if (!parentsReady()) return;
    const keepPred = state.predicting;
    state.crossNo++;
    const cross = computeCross(a, b);
    const gen = nextGen(a, b);
    state.offspring = breed(cross, state.n, gen, !!(a.hidden || b.hidden));
    state.offCross = cross;
    state.offParents = [a, b];
    if (a.gen === "P" && b.gen === "P") { state.pParents = [cloneInd(a), cloneInd(b)]; state.pSelf = a === b; }
    const snap = (p) => ({ sex: p.sex, gen: p.gen, parts: phenoOf(p).parts.map(x => x.txt), geno: p.hidden ? null : genoInfo(p).html });
    const entry = {
      no: state.crossNo, sp: state.sp, traits: state.traits.map(t => trName(traitDef(t))),
      p: [snap(a), snap(b)], self: a === b, n: state.n, gen,
      counts: sortClasses(classify(state.offspring, "pheno")).map(c => ({ parts: c.label.map(x => x.txt), n: c.n, sex: c.sex })),
      analyses: []
    };
    if (keepPred && state.pendingPred) entry.analyses.push(state.pendingPred);
    state.journal.push(entry);
    const ec = {};
    state.offspring.forEach(k => { const key = phenoOf(k).key + (sexed() ? "#" + k.sex : ""); ec[key] = (ec[key] || 0) + 1; });
    state.evidence.push({ a, b, ra: rootOf(a), rb: rootOf(b), self: a === b, n: state.offspring.length, counts: ec });
    state.curJ = state.journal.length - 1;
    if (keepPred) {
      const hyp = state.hyp, pun = state.pun;
      resetAnalysis();
      state.hyp = hyp; state.pun = pun;
      if (pun) pun.checked = false;
    } else resetAnalysis();
    state.predicting = false; state.pendingPred = null; state.banner = false; state.moreOpen = false;
    goStep(4);

  function analysisLine(r) {

    if (r.kind === "task") return `🎯 <b>${t.answerBtn}</b>: ${r.text} (${r.ok ? t.jOk : "✘"})`;
    if (r.kind === "guess") return `🔍 <b>${t.jGuess}</b> – ${r.label}: <span class="mono">${r.guess}</span> (${r.ok ? t.jOk + ", " + (r.solid ? t.jSolid : t.jNotSolid) : t.jWrong(r.wrong)})${r.ok ? "" : ` · ${t.facitIs} <span class="mono">${r.actual}</span>`}`;
    if (r.kind === "pun") return `🔲 <b>${r.pred ? t.jPred : t.jPun}</b> – ${t.jHyp} <span class="mono">${r.hyp}</span> (${st}): ${vals}`;
    return `χ² <b>${t.jChi}</b> – ${t.jHyp} <span class="mono">${r.hyp}</span> (${st}): χ² = ${r.chi || "–"}, ${t.df.toLowerCase()} = ${r.df || "–"}${r.concl ? " → " + (r.concl === "ok" ? t.jKept : t.jRejected) : ""}`;
  }
  function openJournal() {
    const t = T();
    const pLabel = (p, i, j) => j.self ? `${t.parent} 1 (${t.jSelf})` : p.sex === "F" ? `♀ ${t.mother}` : p.sex === "M" ? `♂ ${t.father}` : `${t.parent} ${i + 1}`;
    const pRow = (p, i, j) => `<div class="jrow"><span class="jlab">${pLabel(p, i, j)}</span><span><span class="gen-tag">${genLabel(p.gen)}</span> ${p.parts.map(x => tt(x)).join(", ")}${p.geno ? ` · <span class="mono">${p.geno}</span>` : ` · <span class="muted">${t.genotype.toLowerCase()} ${t.unknown}</span>`}</span></div>`;
    const list = !state.journal.length ? `<p class="muted">${t.journalEmpty}</p>` : `<div class="journal">` + state.journal.slice().reverse().map(j => `
      <div class="jentry">
        <div class="jhead"><span class="jno">${t.jCross(j.no)}</span><span>· ${tt(SPECIES[j.sp].name)}</span></div>
        <div class="jrow"><span class="jlab">${t.jTraits}</span><span>${j.traits.map(x => tt(x)).join(", ")}</span></div>
        <div class="jsec">${t.jParents}</div>
        ${pRow(j.p[0], 0, j)}${j.self ? "" : pRow(j.p[1], 1, j)}
        <div class="jsec">${t.jOffspring} – ${t.jN(j.n, genLabel(j.gen))}</div>
        <ul class="jlist">${j.counts.map(c => `<li>${c.sex ? (c.sex === "F" ? "♀ " : "♂ ") : ""}${c.parts.map(x => tt(x)).join(", ")}: <b>${c.n}</b></li>`).join("")}</ul>
        ${(j.analyses || []).length ? `<div class="jsec">${t.jAnalyses}</div>${j.analyses.map(r => `<div class="janal">${analysisLine(r)}</div>`).join("")}` : ""}
      </div>`).join("") + `</div>
      <p style="margin-top:10px"><button type="button" class="mini-btn" data-act="clearJournal">${t.clearJournal}</button></p>`;
    $("journalBody").innerHTML = `<div class="insp-head"><h3>${t.journal}</h3><button type="button" class="close-x" data-act="closeJournal" aria-label="${t.close}">✕</button></div>${list}`;
    openDlg("journalDlg");
  }
  function logAnalysis(kind) {
    const st = state._st && state._st[kind];
    if (!st) return;
    const rec = Object.assign({ kind, ok: !st.wrong && !st.empty, wrong: st.wrong, empty: st.empty, auto: !!(state.auto && state.auto[kind]) }, st.data);
    if (kind === "pun" && state.predicting) { rec.pred = true; state.pendingPred = rec; return; }
    const e = state.curJ != null ? state.journal[state.curJ] : null;
    if (!e) return;
    e.analyses = (e.analyses || []).filter(r => r.kind !== kind || r.pred);
    e.analyses.push(rec);
    render();
  }
  // ============================================================
  // HANDLINGAR
  // ============================================================
  function act(name, el) {
    const ind = inspUid != null ? state.offspring.find(k => k.uid === inspUid) : null;
    const pickKid = (list) => list[Math.floor(Math.random() * list.length)];
    switch (name) {
      case "goto": goStep(+el.dataset.s); break;
      case "species": {
        const id = el.dataset.sp;
        if (state.task) { state.task = null; state.traits = []; }
        if (id !== state.sp || !state.traits.length) {
          state.sp = id; state.traits = SPECIES[id].defaultTraits.slice();
          state.selfing = false; state.parents = [null, null]; state.predicting = false; clearOffspring(); state.banner = false;
          state.splitSex = sexChrStudied();
          store("genetik-art", id);
        }
        goStep(2); break;
      }
      case "trait": {
        const id = el.dataset.t, i = state.traits.indexOf(id);
        if (i >= 0) state.traits.splice(i, 1);
        else if (state.traits.length < MAX_TRAITS) state.traits.push(id);
        const order = SP().traits.map(t => t.id);
        state.traits.sort((a, b) => order.indexOf(a) - order.indexOf(b));
        state.parents = [null, null]; state.predicting = false; state.banner = false; clearOffspring();
        state.splitSex = sexChrStudied();
        render(); break;
      }
      case "pmode": {
        const i = +el.dataset.i, m = el.dataset.m;
        state.pmode[i] = m;
        const p = state.parents[i];
        if (m === "design" && p.hidden) state.parents[i] = emptyInd(i);
        state.banner = false;
        render(); break;
      }
      case "pickpheno": {
        const i = +el.dataset.i;
        state.parents[i] = indWithPhenotype(slotSex(i), el.dataset.k, true);
        state.banner = false;
        render(); break;
      }
      case "preset": {
        const i = +el.dataset.i, p = state.parents[i];
        state.parents[i] = el.dataset.p === "rand" ? randomInd(p.sex) : makeInd(p.sex, presetFn(el.dataset.p), "P");
        state.banner = false;
        render(); break;
      }
      case "predict":
        if (!parentsReady()) return;
        state.predicting = true; state.hyp = [null, null]; state.pun = null; state.pendingPred = null; state.auto = {}; state._st = {};
        goStep(3); break;
      case "unpredict": state.predicting = false; goStep(3); break;
      case "cross": doCross(); break;
      case "guessCheck": {
        const tg = findTarget(+el.dataset.u); if (!tg) return;
        state.guess[tg.ind.uid].checked = true; state.guess[tg.ind.uid].ev = evidenceFor(tg.ind);
        if (inTask("genotype")) {
          state.task.attempts++;
          const G = state.guess[tg.ind.uid];
          if (studyGenes().every(g => G.vals[g] === actualKey(tg.ind, g) && G.ev.det[g])) state.task.solved = true;
        }
        logGuess(tg); render(); break;
      }
      case "guessReveal": {
        const tg = findTarget(+el.dataset.u); if (!tg) return;
        state.guess[tg.ind.uid].revealed = !state.guess[tg.ind.uid].revealed; render(); break;
      }
      case "guessHyp": {
        const tg = findTarget(+el.dataset.u), h = state.hyp[+el.dataset.h]; if (!tg || !h) return;
        const G = state.guess[tg.ind.uid];
        studyGenes().forEach(g => G.vals[g] = actualKey(h, g));
        G.checked = false; render(); break;
      }
      case "taskStart": startTask(el.dataset.id, el.dataset.l); break;
      case "taskEnd": endTask(); break;
      case "taskAnswer":
        if (!state.offspring.length) { state.banner = false; alert(T().crossFirst); return; }
        state.anaTab = "answer"; goStep(5); break;
      case "patSubmit": {
        const r = document.querySelector('input[name="patAns"]:checked');
        if (!r) return;
        state.task.given = r.value; state.task.answered = true; state.task.attempts++;
        if (r.value === state.task.answer) state.task.solved = true;
        const e = state.curJ != null ? state.journal[state.curJ] : null;
        if (e) { e.analyses = (e.analyses || []).filter(x => x.kind !== "task"); e.analyses.push({ kind: "task", text: T().patOpt[r.value], ok: r.value === state.task.answer }); }
        render(); break;
      }
      case "linkSubmit": {
        state.task.given = ($("linkIn") || {}).value || ""; state.task.answered = true; state.task.attempts++;
        const d = linkageData(), x = parseNum(state.task.given);
        const ok = d.testers && !isNaN(x) && Math.abs(x - d.est) <= 1.5;
        if (ok) state.task.solved = true;
        const e = state.curJ != null ? state.journal[state.curJ] : null;
        if (e) { e.analyses = (e.analyses || []).filter(y => y.kind !== "task"); e.analyses.push({ kind: "task", text: state.task.given + " cM", ok }); }
        render(); break;
      }
      case "moreToggle": state.moreOpen = !state.moreOpen; render(); break;
      case "newcross": state.predicting = false; state.banner = false; goStep(3); break;
      case "again": {
        const [a, b] = state.offParents;
        state.parents = [a, b]; state.selfing = a === b; state.predicting = false;
        doCross(); break;
      }
      case "siblings": {
        const kids = state.offspring;
        let x, y;
        if (sexed()) {
          const f = kids.filter(k => k.sex === "F"), m = kids.filter(k => k.sex === "M");
          if (!f.length || !m.length) return;
          x = pickKid(f); y = pickKid(m);
        } else {
          if (kids.length < 2) return;
          x = pickKid(kids);
          do { y = pickKid(kids); } while (y === x);
        }
        setParentsGo(x, y, false); break;
      }
      case "selfRandom": setParentsGo(pickKid(state.offspring), null, true); break;
      case "analyse": state.anaTab = el.dataset.tab; if (state.step !== 5) goStep(5); else render(); break;
      case "kid": {
        const uid = +el.dataset.u;
        if (state.step === 5 && state.anaTab === "count" && state.activeTag) {
          const prev = state.tags[uid];
          if (prev === state.activeTag) delete state.tags[uid]; else state.tags[uid] = state.activeTag;
          [prev, state.activeTag].forEach(k => { if (k) state.countIn[k] = String(Object.values(state.tags).filter(x => x === k).length); });
          state.countChecked = false; state.auto.count = false;
          render();
        } else openInspector(uid);
        break;
      }
      case "tagsel": state.activeTag = state.activeTag === el.dataset.k ? null : el.dataset.k; render(); break;
      case "sort": state.sortBrood = !state.sortBrood; render(); break;
      case "countCheck": state.countChecked = true; render(); logAnalysis("count"); break;
      case "countFill": {
        countClasses().forEach(c => state.countIn[c.key] = String(c.n));
        state.tags = {};
        state.offspring.slice(0, 200).forEach(k => state.tags[k.uid] = kidKey(k));
        state.countChecked = true; state.auto.count = true; render(); logAnalysis("count"); break;
      }
      case "countClear": state.tags = {}; state.countIn = {}; state.countChecked = false; state.activeTag = null; state.auto.count = false; render(); break;
      case "punCheck": if (state.pun) state.pun.checked = true; render(); logAnalysis("pun"); break;
      case "punFill": punFill(); state.pun.checked = true; state.auto.pun = true; render(); logAnalysis("pun"); break;
      case "punClear": state.pun = null; state.auto.pun = false; render(); break;
      case "chiCheck": state.chiChecked = true; render(); logAnalysis("chi"); break;
      case "chiFill": chiFill(); state.chiChecked = true; state.auto.chi = true; render(); logAnalysis("chi"); break;
      case "chiClear": state.chiIn = null; state.chiChecked = false; state.auto.chi = false; render(); break;
      case "facit": state.showFacit = !state.showFacit; render(); break;
      case "close": closeDlg("inspector"); break;
      case "use": {
        if (!ind) return;
        const slot = +el.dataset.slot;
        if (slot === lockSlot()) return;
        if (lockSlot() >= 0) {
          state.parents[slot] = cloneInd(ind); state.pmode[slot] = ind.hidden ? "pheno" : "design";
          state.selfing = false; state.predicting = false; state.banner = false;
          closeDlg("inspector"); goStep(3); break;
        }
        state.parents[slot] = cloneInd(ind);
        state.pmode[slot] = ind.hidden ? "pheno" : "design";
        if (!state.parents[1 - slot] || state.selfing) { state.parents[1 - slot] = emptyInd(1 - slot); state.pmode[1 - slot] = "pheno"; }
        state.selfing = false; state.predicting = false; state.banner = false;
        closeDlg("inspector"); goStep(3); break;
      }
      case "testcross": {
        if (!ind) return;
        const tester = makeTester(sexed() ? (ind.sex === "F" ? "M" : "F") : null);
        const [x, y] = orderBySex(ind, tester);
        setParentsGo(x, y, false); break;
      }
      case "backcross": {
        if (!ind || !state.pParents) return;
        const [x, y] = orderBySex(ind, state.pParents[+el.dataset.p]);
        setParentsGo(x, y, false); break;
      }
      case "selfThis": if (ind) setParentsGo(ind, null, true); break;
      case "journal": openJournal(); break;
      case "closeJournal": closeDlg("journalDlg"); break;
      case "clearJournal": state.journal = []; state.curJ = null; openJournal(); render(); break;
    }
  }
  // ============================================================
  // HÄNDELSER
  // ============================================================
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b && !b.disabled) act(b.dataset.act, b);
  });
  ["inspector", "journalDlg"].forEach(id => $(id).addEventListener("click", (e) => { if (e.target === $(id)) closeDlg(id); }));
  $("inspector").addEventListener("close", () => { inspUid = null; });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.matches("select[data-gene]")) {
      const ref = t.dataset.ref;
      const ind = findInd(ref);
      ind.g[t.dataset.gene][+t.dataset.h] = t.value;
      if (ref[0] === "p") { ind.gen = "P"; ind.hidden = false; state.banner = false; }
      if (ref[0] === "h") { if (state.pun) state.pun.checked = false; state.chiChecked = false; }
      render();
    } else if (t.id === "selfToggle") {
      state.selfing = t.checked;
      if (!t.checked && state.parents[1] === state.parents[0]) {
        state.parents[1] = emptyInd(1);
        state.pmode[1] = "pheno";
      }
      render();
    } else if (t.id === "splitToggle") {
      state.splitSex = t.checked; state.countChecked = false; state.chiChecked = false; state.activeTag = null; state.tags = {}; state.countIn = {}; state.chiIn = null;
      render();
    } else if (t.id === "nSelect") {
      state.n = +t.value;
    } else if (t.matches("select[data-pg]")) {
      const P = state.pun;
      (t.dataset.pg === "1" ? P.g1 : P.g2)[+t.dataset.ix] = t.value; state.auto.pun = false;
      P.checked = false; render();
    } else if (t.matches("select[data-pc]")) {
      state.pun.c[t.dataset.pc] = t.value; state.pun.checked = false; state.auto.pun = false; render();
    } else if (t.matches("select[data-guess]")) {
      const G = state.guess[+t.dataset.guess];
      if (G) { G.vals[t.dataset.g] = t.value; G.checked = false; }
      render();
    } else if (t.name === "patAns") {
      state.task.given = t.value;
    } else if (t.name === "concl") {
      state.chiIn.concl = t.value;
    }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.cnt != null) state.auto.count = false;
    if (t.dataset.pr != null) state.auto.pun = false;
    if (t.dataset.chi != null) state.auto.chi = false;
    if (t.dataset.cnt != null) state.countIn[t.dataset.cnt] = t.value;
    else if (t.dataset.pr != null && state.pun) state.pun.r[t.dataset.pr] = t.value;
    else if (t.dataset.chi != null && state.chiIn) {
      const C = state.chiIn, k = t.dataset.chi;
      if (k === "chi" || k === "df") C[k] = t.value; else C[k][t.dataset.k] = t.value;
    }
  });

  [$("langSv"), $("langEn")].forEach(btn => btn.addEventListener("click", () => {
    lang = btn.dataset.lang; store("genetik-lang", lang); applyLanguage();
  }));
  function applyLanguage() {
    const t = T();
    document.documentElement.lang = lang;
    document.title = t.title;
    $("appTitle").textContent = t.title;
    $("appBadge").textContent = t.badge;
    $("appSubtitle").textContent = t.subtitle;
    $("langGroup").setAttribute("aria-label", t.lang);
    $("langSv").setAttribute("aria-pressed", String(lang === "sv"));
    $("langEn").setAttribute("aria-pressed", String(lang === "en"));
    render();
  }

  // ---------- Start ----------
  const startSp = params.get("art");
  if (startSp && SPECIES[startSp]) {
    state.sp = startSp; state.traits = SPECIES[startSp].defaultTraits.slice(); state.step = 2;
  } else {
    state.sp = DEFAULT_SPECIES; state.traits = [];
  }
  state.splitSex = sexChrStudied();
  applyLanguage();
})();
</script>
</body>
</html>
