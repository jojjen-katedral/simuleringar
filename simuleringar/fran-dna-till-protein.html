$('#playBtn').textContent=(!stepping&&(s===3?TX.playing:TL.playing))?'⏸ Paus':((s===3?TX.phase==='done':TL.done)?'▶ Spela igen':'▶ Spela');

}
function updCtl(){

function renderTogs(){

h+=keys.map(k=>`<label class="chip${S.o[k]?' on':''}"><input type="checkbox" data-k="${k}" ${S.o[k]?'checked':''}>${TOGS[k]}</label>`).join('');
$('#togs').innerHTML=h;
$$('#togs input[data-k]').forEach(inp=>inp.onchange=()=>{ const k=inp.dataset.k; S.o[k]=inp.checked; inp.parentElement.classList.toggle('on',inp.checked); onToggle(k); });

}
function onToggle(k){

if(k==='zw'||k==='cond') renderOverlay();

}
function fdGeneral(){ return L()?'The chain moves all the time due to thermal motion. <b>Nonpolar</b> (yellow) R groups avoid water and gather in the middle, while <b>charged and polar</b> R groups prefer to be out towards the water. Hydrogen bonds, ionic bonds and disulfide bridges form between the R groups. <b>Click a bond</b> to get that particular bond explained, or raise the temperature and see what happens.'
:'Kedjan rör sig hela tiden på grund av värmerörelse. <b>Opolära</b> (gula) R-grupper undviker vatten och samlas i mitten, medan <b>laddade och polära</b> R-grupper hellre är ute mot vattnet. Mellan R-grupperna bildas vätebindningar, jonbindningar och disulfidbryggor. <b>Klicka på en bindning</b> för att få just den förklarad, eller höj temperaturen och se vad som händer.'; }
function condHTML(){
const p=M.protein; if(!p.length) return ''; const a=p[0],b=p[1]||'G',lev=S.o.level===1?2:3;
const r1=buildPeptide([a],{level:lev,sides:[1],hlOH:true}), r2=buildPeptide([b],{level:lev,sides:[1],explicitN:true,hlN:true}), di=buildPeptide([a,b],{level:lev,sides:[1,-1]});
const wat=newMol();const o=addNode(wat,0,0,'O'),h1=addNode(wat,-0.8,0.6,'H'),h2=addNode(wat,0.8,0.6,'H');bond(wat,o,h1);bond(wat,o,h2);
return `<div style="margin-top:10px"><b>${L()?'How a peptide bond forms':'Så bildas en peptidbindning'}</b></div>
<div class="scroll"><div class="row" style="flex-wrap:nowrap;gap:6px">${molSVG(r1,28)}<span style="font-size:1.4rem">+</span>${molSVG(r2,28)}</div>
<div class="row" style="flex-wrap:nowrap;gap:6px"><span style="font-size:1.4rem">→</span>${molSVG(di,28)}<span style="font-size:1.4rem">+</span>${molSVG(wat,28)}</div></div>
<div class="small">${L()?'The <b>OH</b> of the carboxyl group and an <b>H</b> from the amino group of the next amino acid (highlighted in yellow) correspond to a water molecule. What remains is a <b>peptide bond</b> (–CO–NH–). Overall it is a <b>condensation</b>; the reverse is called <b>hydrolysis</b>. In the ribosome it happens in several steps – the energy comes from ATP when the tRNA is loaded with its amino acid – but the net reaction is the same.':'Karboxylgruppens <b>OH</b> och ett <b>H</b> från nästa aminosyras aminogrupp (gulmarkerade) motsvarar en vattenmolekyl. Kvar blir en <b>peptidbindning</b> (–CO–NH–). Totalt är det alltså en <b>kondensation</b>; det omvända kallas <b>hydrolys</b>. I ribosomen sker det i flera steg – energin kommer från ATP när tRNA:t laddas med sin aminosyra – men nettoreaktionen är densamma.'}</div>`;
}
function explainText(){ const s=S.step, E=L();
if(s===2) return dnaCaption(); if(s===3) return txCaption(); if(s===4) return mrnaCaption(); if(s===5) return tlCaption();
if(s===6) return protCaption()+'<br>'+(S.o.level===1?(E?'Each bead is an amino acid; the colour shows the properties of the R group.':'Varje kula är en aminosyra; färgen visar R-gruppens egenskaper.'):(E?'The amino acids are joined by <b>peptide bonds</b> (purple). The order is called the <b>primary structure</b> of the protein and is entirely determined by the mRNA.':'Aminosyrorna sitter ihop med <b>peptidbindningar</b> (lila). Ordningen kallas proteinets <b>primärstruktur</b> och bestäms helt av mRNA:t.'))+condHTML();
if(s===7) return FD.sel?fdExplain(FD.sel):fdGeneral();
if(s===8) return E?'Here you see the whole flow of information: <b>DNA → mRNA → protein</b>. The template strand determines the mRNA through base pairing, and each codon in the mRNA determines one amino acid. <b>Click a codon</b> to see which bases and which amino acid belong together.'
:'Här ser du hela informationsflödet: <b>DNA → mRNA → protein</b>. Mallsträngen bestämmer mRNA:t genom basparning, och varje kodon i mRNA:t bestämmer en aminosyra. <b>Klicka på ett kodon</b> för att se vilka baser och vilken aminosyra som hör ihop.';
return ''; }
function dnaCaption(){
if(L()){ let h='DNA consists of two strands held together by <b>base pairs</b>: A pairs with T and G with C. It is the <b>template strand</b> that is read when the gene is copied.';
if(S.o.ends) h+=" The strands are <b>antiparallel</b>: one runs 5'→3', the other 3'→5'.";
if(S.o.hb) h+=' A–T is held together by <b>two</b> hydrogen bonds, G–C by <b>three</b>.';
if(S.o.marks2&&M.start>=0) h+=' Framed: the start signal (TAC in the template strand)'+(M.hasStop?' and the stop signal.':'.');
if(M.hasIntron) h+=' The grey bases are <b>introns</b>.';
return h; }
let h='DNA består av två strängar som hålls ihop av <b>baspar</b>: A parar med T och G med C. Det är <b>mallsträngen</b> som läses av när genen kopieras.';
if(S.o.ends) h+=" Strängarna är <b>antiparallella</b>: den ena går 5'→3', den andra 3'→5'.";
if(S.o.hb) h+=' A–T hålls ihop av <b>två</b> vätebindningar, G–C av <b>tre</b>.';
if(S.o.marks2&&M.start>=0) h+=' Inramat: startsignalen (TAC i mallsträngen)'+(M.hasStop?' och stoppsignalen.':'.');
if(M.hasIntron) h+=' De grå baserna är <b>introner</b>.';
return h;
}
function goStep(n){
if(!unlocked(n)||n===S.step) return;
const from=S.step;
TX.playing=false; TL.playing=false; FD.playing=false; SP.playing=false;
S.step=n; maxReached=Math.max(maxReached,n);
const card=$('main .card'); card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade');
$('#stepLabel').textContent=(L()?'Step ':'Steg ')+n; $('#stepTitle').textContent=STEPINFO[n].t; $('#stepIntro').textContent=STEPINFO[n].i;
$('#p1').classList.toggle('hidden',n!==1); $('#p8').classList.toggle('hidden',n!==8); $('#stageWrap').classList.toggle('hidden',n===1||n===8);
if(n>1&&n<8&&M) startTransition(from,n);
hideCap(); FD.sel=null; if(n===8) renderSummary();
if(n===7) fdTempLabel();
renderOverlay(); renderTogs(); updCtl(); updNav(); updProgress();
const cr=card.getBoundingClientRect(); if(cr.top<0) window.scrollTo(0,Math.max(0,window.scrollY+cr.top-8));
}
function applyLang(){
document.documentElement.lang=S.lang; try{ localStorage.setItem('dnaLang',S.lang); }catch(e){}
$$('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
applyData();
if(L()) trTree(document.body); else untrTree(document.body);
$('#dnaIn').placeholder=L()?'e.g. TACCGAACCTTTCCGATT':'t.ex. TACCGAACCTTTCCGATT';
document.title=L()?'From DNA to Protein':'Från DNA till protein';
$('#capX').setAttribute('aria-label',L()?'Close':'Stäng'); $('#modalX').setAttribute('aria-label',L()?'Close':'Stäng');
const n=S.step; $('#stepLabel').textContent=(L()?'Step ':'Steg ')+n; $('#stepTitle').textContent=STEPINFO[n].t; $('#stepIntro').textContent=STEPINFO[n].i;
onDnaChange(); renderTogs(); updNav(); updProgress(); renderOverlay(); if(S.step===8) renderSummary(); updCodonBox(true); lastStats=''; fdTempLabel(); hideCap();
if(!$('#modal').classList.contains('hidden')) renderModal();
}
$$('#langSeg button').forEach(b=>b.onclick=()=>{ if(S.lang!==b.dataset.lang){ S.lang=b.dataset.lang; applyLang(); } });
$('#nextBtn').onclick=()=>goStep(S.step+1);
$('#explainBtn').onclick=()=>setCap(explainText());
$('#capX').onclick=hideCap;
$('#backBtn').onclick=()=>goStep(S.step-1);
let inT; $('#dnaIn').addEventListener('input',()=>{ clearTimeout(inT); inT=setTimeout(()=>onDnaChange(),180); });
$$('input[name=imode]').forEach(r=>r.onchange=e=>{ S.imode=e.target.value; const v=$('#dnaIn').value.replace(/[^ATCGUatcgu]/g,''); $('#dnaIn').value=comp(v); onDnaChange(); });
const exSel=$('#exSel'); EXAMPLES.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name;exSel.appendChild(o);});
exSel.onchange=()=>{ const e=EXAMPLES.find(x=>x.id===exSel.value); if(!e) return; if(e.intron&&!S.o.introns){ S.o.introns=true; renderTogs(); }
$('#dnaIn').value=S.imode==='template'?comp(e.seq):e.seq; exSel.value=''; onDnaChange(true); };
$('#playBtn').onclick=()=>{
if(S.step===3){ TX.stepTo=null; if(TX.playing) TX.playing=false; else { if(TX.phase==='done'){ txReset(); TX.ever=true; } if(TX.phase==='idle') TX.phase='run'; TX.playing=true; } }
else if(S.step===5&&TL.ev){ TL.step=false; if(TL.playing) TL.playing=false; else { if(TL.k>=TL.ev.length){ const w=TL.done; tlReset(); TL.done=w; } TL.playing=true; } }
updNav(); };
$('#stepBtn').onclick=()=>{
if(S.step===3){ if(TX.phase==='done') return; if(TX.phase==='idle') TX.phase='run'; if(TX.phase==='run'){ TX.stepTo=TX.nb+(TX.cur?2:1); } TX.playing=true; }
else if(S.step===5&&TL.ev){ if(TL.k>=TL.ev.length) return; TL.step=true; TL.playing=true; }
updNav(); };
$('#resetBtn').onclick=()=>{ if(S.step===3){ const w=TX.ever; txReset(); TX.ever=w; } else if(S.step===5){ const w=TL.done; tlReset(); TL.done=w; } updNav(); };
$('#skipBtn').onclick=()=>{ if(S.step===3) txSkip(); else if(S.step===5) tlSkip(); updNav(); };
$('#speed').oninput=e=>S.speed=+e.target.value;
$('#spBtn').onclick=()=>{ SP.playing=true; SP.t=0; };
$('#fdPlay').onclick=()=>{ FD.playing=!FD.playing; updNav(); };
$('#fdReset').onclick=()=>{ FD.playing=false; fdInit(); updNav(); hideCap(); };
$('#fdTemp').oninput=e=>{ FD.temp=+e.target.value; fdTempLabel(); };
$('#modalX').onclick=()=>$('#modal').classList.add('hidden');
$('#modal').onclick=ev=>{ if(ev.target.id==='modal') $('#modal').classList.add('hidden'); };
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') $('#modal').classList.add('hidden'); });
// klick & panorering på scenen
let drag=null;
ST.cv.addEventListener('pointerdown',ev=>{ if((S.step===2&&hasOverflow2())||(S.step===4&&hasOverflow4())){ drag={x:ev.clientX,c:S.step===2?S.cam2:S.cam4,moved:false}; ST.cv.setPointerCapture(ev.pointerId); } });
ST.cv.addEventListener('pointermove',ev=>{ if(drag){ const dx=ev.clientX-drag.x; if(Math.abs(dx)>3) drag.moved=true; if(S.step===2) S.cam2=(drag.c||0)-dx; else S.cam4=(drag.c||0)-dx; } else ST.cv.style.cursor=((S.step===2&&hasOverflow2())||(S.step===4&&hasOverflow4()))?'grab':'default'; });
ST.cv.addEventListener('pointerup',()=>{ drag=null; });
ST.cv.addEventListener('click',ev=>{
if(TRN) return; const r=ST.cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top;
if(S.step===6&&S.o.level===1){ const L=chainLayout(); const q=L.findIndex(p=>Math.hypot(p[0]-x,p[1]-y)<16); if(q>=0) openAA(M.protein[q]); }
if(S.step===7){ const b=FD.b; const q=b.findIndex(p=>Math.hypot(p.x-x,p.y-y)<16); if(q>=0){ openAA(b[q].a); return; }
let best=null,bd=1e9; for(const it of FD.inter){ const d=segDist(x,y,b[it.i].x,b[it.i].y,b[it.j].x,b[it.j].y); const lim=it.t==='hyd'?12:9; if(d<lim&&d<bd){bd=d;best=it;} }
FD.sel=best; if(best) setCap(fdExplain(best)); }
});
let rzT; addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(S.step===8) renderSummary(); },150); });
let lastTs=0, lastPlay='', stageVisible=true, lastStatic=0;
if('IntersectionObserver' in window) new IntersectionObserver(es=>{ stageVisible=es[0].isIntersecting; }).observe($('#stageWrap'));
let lastW=window.innerWidth, lastH=window.innerHeight;
function tick(ts){
const dt=Math.min(0.05,((ts-lastTs)/1000)||0); lastTs=ts;
const resized=window.innerWidth!==lastW||window.innerHeight!==lastH; if(resized){ lastW=window.innerWidth; lastH=window.innerHeight; }
const staticStep=(S.step===2||S.step===6)&&!TRN&&!drag;
if(S.step>1&&S.step<8&&stageVisible&&!document.hidden&&(!staticStep||resized||ts-lastStatic>200)){ drawStage(dt); if(staticStep) lastStatic=ts; }
const ps=[TX.playing,TX.ever,TX.phase,TL.playing,TL.done,TL.k>=(TL.ev?TL.ev.length:0),SP.done].join();
if(ps!==lastPlay){ lastPlay=ps; updNav(); updCtl(); }

}

$('#stepTitle').textContent=STEPINFO[1].t; $('#stepIntro').textContent=STEPINFO[1].i;
$('#dnaIn').value=comp(EXAMPLES[0].seq); onDnaChange(true);
renderTogs(); updCtl(); updNav(); updProgress();
document.documentElement.lang=S.lang;
if(L()) applyLang(); else applyData();
requestAnimationFrame(tick);
</script>
