<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kvävets kretslopp</title>
<style>
  /* ============================================================
     INSTÄLLNINGAR FÖR INBÄDDNING
     Sidan fyller hela sin ram (iframe) och anpassar sig efter
     ramens storlek. Inga externa filer eller typsnitt laddas.
     ============================================================ */
  :root {
    color-scheme: dark;
    --bg: #080d14;
    --panel: #0e1621;
    --panel-2: #121c29;
    --line: rgba(255, 255, 255, 0.12);
    --text: #f0f4f8;
    --muted: #94a3b8;
    --accent: #00d2ff;
    --gold: #ffc107;
    --green: #00e676;
    --eq-bg: #06090e;
    --eq-text: #fef08a;
    --pink: #f472b6;
    --sidebar-w: 340px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 520px;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- Sidhuvud ---------- */
  header {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .title-group { min-width: 0; }
  .title-group h1 {
    font-size: 1.1rem;
    font-weight: 700;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
  }
  .title-group p { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
  .badge-pill {
    background: rgba(0, 210, 255, 0.15);
    color: var(--accent);
    border: 1px solid rgba(0, 210, 255, 0.35);
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 600;
  }

  .settings { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .lang-switch {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .lang-switch button {
    background: transparent;
    color: var(--muted);
    border: 0;
    padding: 4px 10px;
    font: inherit;
    font-size: 0.74rem;
    font-weight: 700;
    cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"] { background: var(--accent); color: #0b111a; }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.76rem;
    color: var(--text);
    cursor: pointer;
  }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track {
    position: relative;
    width: 32px;
    height: 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    transition: background 0.2s;
    flex: none;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }

  button:focus-visible, .switch input:focus-visible + .track {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* ---------- Huvudlayout ---------- */
  .app-main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--sidebar-w);
    grid-template-rows: minmax(0, 1fr);
  }

  .simulation-area {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: #000;
  }

  .canvas-container {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  #cycleCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: manipulation;
  }

  .interaction-banner {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 24px);
    background: rgba(11, 17, 26, 0.94);
    border: 1px solid var(--accent);
    box-shadow: 0 0 18px rgba(0, 210, 255, 0.3);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    text-align: center;
    pointer-events: none;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: blink 1s infinite alternate;
    flex-shrink: 0;
  }
  @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

  .controls {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 10px;
    background: #080d16;
    border-top: 1px solid var(--line);
  }
  .next-options-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }

  .hud-btn, .choice-btn {
    font: inherit;
    font-size: 0.74rem;
    padding: 5px 11px;
    border-radius: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .hud-btn {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #e2e8f0;
  }
  .hud-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .choice-btn {
    background: rgba(0, 210, 255, 0.15);
    border: 1px solid rgba(0, 210, 255, 0.45);
    color: #e0f2fe;
    font-weight: 600;
  }
  .choice-btn:hover { background: var(--accent); color: #0b111a; }

  .speed-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    color: var(--muted);
    padding-left: 6px;
    border-left: 1px solid var(--line);
  }
  .speed-wrap input { width: 60px; accent-color: var(--accent); }

  /* ---------- Sidopanel ---------- */
  .info-panel {
    min-height: 0;
    overflow-y: auto;
    background: var(--panel);
    border-left: 1px solid var(--line);
  }
  .info-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .phase-badge {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
  }
  .phase-title { font-size: 1.2rem; font-weight: 700; line-height: 1.25; margin-top: 2px; text-wrap: balance; }

  .info-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }

  .molecule-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--line);
  }
  .molecule-diagram { width: 70px; height: 70px; flex-shrink: 0; }
  .molecule-details { min-width: 0; }
  .mol-formula { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.15rem; font-weight: 800; color: var(--accent); }
  .mol-name { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .ox-chip {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .pool-desc { font-size: 0.84rem; line-height: 1.5; color: #d1d5db; }

  .section-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .section-title {
    font-size: 0.74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--green);
    margin-bottom: 6px;
  }
  .process-name { font-size: 1.02rem; font-weight: 700; }
  .process-actor { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .redox-chip {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .redox-red  { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.45); }
  .redox-ox   { background: rgba(248, 113, 113, 0.15); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.45); }
  .redox-none { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4); }
  .chem-eq {
    margin-top: 8px;
    background: var(--eq-bg);
    border-left: 3px solid var(--gold);
    padding: 7px 10px;
    border-radius: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    line-height: 1.6;
    color: var(--eq-text);
    white-space: pre-line;
    overflow-x: auto;
  }
  .section-text { font-size: 0.84rem; line-height: 1.5; color: #d1d5db; margin-top: 8px; }
  .muted-note { font-size: 0.84rem; line-height: 1.5; color: var(--muted); }

  .did-you-know-card {
    background: linear-gradient(135deg, rgba(186, 104, 200, 0.15), rgba(11, 17, 26, 0.4));
    border: 1px solid rgba(186, 104, 200, 0.3);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.8rem;
    line-height: 1.45;
    color: #e2e8f0;
  }
  .did-you-know-card strong { display: block; color: var(--pink); margin-bottom: 4px; }

  /* ---------- Mellanstora ramar ---------- */
  @media (max-width: 1000px) {
    :root { --sidebar-w: 290px; }
    .title-group p { display: none; }
  }

  /* ---------- Smala ramar och mobil: panelen hamnar under bilden ---------- */
  @media (max-width: 720px) {
    body { overflow: auto; height: auto; min-height: 100%; }
    .app-main { display: block; }
    .simulation-area { height: 78vh; min-height: 480px; }
    .info-panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-dot { animation: none; }
  }
</style>


<header>
  <div class="title-group">
    <h1><span aria-hidden="true">🌱</span> <span id="appTitle">Kvävets kretslopp</span> <span class="badge-pill" id="appBadge">Klickstyrd simulering</span></h1>
    <p id="appSubtitle"></p>
  </div>
  <div class="settings">
    <div class="lang-switch" role="group" id="langGroup" aria-label="Språk">
      <button type="button" id="langSv" data-lang="sv" aria-pressed="true">SV</button>
      <button type="button" id="langEn" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <label class="switch" for="oxToggle">
      <input type="checkbox" id="oxToggle" checked>
      <span class="track" aria-hidden="true"></span>
      <span id="oxToggleLabel">Visa oxidationstal</span>
    </label>
  </div>
</header>

<main class="app-main">
  <div class="simulation-area">
    <div class="canvas-container" id="canvasWrap">
      <div class="interaction-banner" aria-live="polite">
        <span class="pulse-dot"></span>
        <span id="guideText"></span>
      </div>
      <canvas id="cycleCanvas" aria-label="Bild av kvävets kretslopp"></canvas>
    </div>
    <div class="controls">
      <button type="button" class="hud-btn" id="resetBtn"></button>
      <div class="next-options-bar" id="quickChoicesBar"></div>
      <div class="speed-wrap">
        <label for="speedSlider" id="speedLabel">Fart</label>
        <input type="range" id="speedSlider" min="0.6" max="2.5" step="0.2" value="1.2">
      </div>
    </div>
  </div>

  <aside class="info-panel">
    <div class="info-header">
      <div class="phase-badge" id="sidebarBadge"></div>
      <h2 class="phase-title" id="sidebarTitle"></h2>
    </div>
    <div class="info-body">
      <div class="molecule-card">
        <svg class="molecule-diagram" id="molSvg" width="70" height="70" viewBox="-35 -35 70 70" aria-hidden="true"></svg>
        <div class="molecule-details">
          <div class="mol-formula" id="molFormula"></div>
          <div class="mol-name" id="molName"></div>
          <span class="ox-chip" id="oxChip"></span>
        </div>
      </div>
      <p class="pool-desc" id="poolDesc"></p>

      <div class="section-box">
        <div class="section-title" id="processHeading"></div>
        <div id="processContent"></div>
      </div>

      <div class="did-you-know-card" id="didYouKnowBox"></div>
    </div>
  </aside>
</main>

<script>
(function () {
  "use strict";

  // ============================================================
  // STANDARDVAL – ändra här om du vill att sidan ska starta på
  // engelska eller utan oxidationstal när den bäddas in.
  // Kan också styras med adressen: ?lang=en&ox=0
  // ============================================================
  const DEFAULT_LANG = "sv";     // "sv" eller "en"
  const DEFAULT_SHOW_OX = true;  // true eller false

  const $ = (id) => document.getElementById(id);
  const canvas = $("cycleCanvas");
  const ctx = canvas.getContext("2d");
  const canvasWrap = $("canvasWrap");
  const molSvg = $("molSvg");

  // ---------- Inställningar: adress > sparat val > standard ----------
  function readStored(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function store(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignoreras i inbäddad ram */ }
  }
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") || readStored("kvave-lang") || DEFAULT_LANG;
  if (lang !== "sv" && lang !== "en") lang = "sv";
  let showOx = params.has("ox") ? params.get("ox") !== "0"
             : (readStored("kvave-ox") !== null ? readStored("kvave-ox") === "1" : DEFAULT_SHOW_OX);

  // ---------- Tillstånd ----------
  let currentLocation = "atmosphere";
  let activeTransition = null;
  let lastProcess = null;
  let isTraveling = false;
  let travelProgress = 0;
  let animSpeed = 1.2;
  let lightningActive = 0;
  let hoveredClickable = null;
  let S = 1;                       // skalfaktor för text och figurer i bilden
  const SOIL_Y = 0.45;             // markytan som andel av höjden
  const bgParticles = [];

  // ============================================================
  // TEXTER FÖR GRÄNSSNITTET
  // ============================================================
  const UI = {
    sv: {
      docTitle: "Kvävets kretslopp",
      title: "Kvävets kretslopp",
      badge: "Klickstyrd simulering",
      subtitle: "Cirklarna visar i vilken form kvävet finns – pilarna visar processerna som omvandlar det",
      lang: "Språk",
      oxToggle: "Visa oxidationstal",
      reset: "🔄 Börja om",
      resetTitle: "Börja om med kvävgas i luften",
      speed: "Fart",
      canvasLabel: "Bild av kvävets kretslopp",
      nowAs: "Kvävet finns nu som",
      oxFor: "Oxidationstal för N",
      process: "Process",
      ongoing: "Pågående process",
      latest: "Senaste process",
      by: "Utförs av",
      noProcess: "Ingen process ännu. Välj en pil i bilden eller en knapp nedanför den för att se hur kvävet kan omvandlas.",
      howTitle: "Så läser du bilden",
      how: "Cirklarna visar <em>i vilken form</em> kvävet finns. Pilarna visar <em>processerna</em> som omvandlar kvävet – och vem som utför dem.",
      howOx: " Den lilla brickan på varje cirkel visar kvävets oxidationstal.",
      dyk: "Visste du?",
      banner: (name, f) => `Kvävet finns nu som ${name} (${f}). Välj en process!`,
      redox: { red: "Reduktion", ox: "Oxidation", none: "Ingen ändring" },
      air: "LUFT",
      soil: "MARK (syrerik)",
      anaerobic: "SYREFATTIG MARK",
      pea: "Ärtväxt",
      meadow: "Ängsväxt"
    },
    en: {
      docTitle: "The Nitrogen Cycle",
      title: "The Nitrogen Cycle",
      badge: "Click-driven simulation",
      subtitle: "The circles show the form the nitrogen is in – the arrows show the processes that convert it",
      lang: "Language",
      oxToggle: "Show oxidation numbers",
      reset: "🔄 Start over",
      resetTitle: "Start over with nitrogen gas in the air",
      speed: "Speed",
      canvasLabel: "Picture of the nitrogen cycle",
      nowAs: "Nitrogen is now found as",
      oxFor: "Oxidation number of N",
      process: "Process",
      ongoing: "Ongoing process",
      latest: "Latest process",
      by: "Carried out by",
      noProcess: "No process yet. Choose an arrow in the picture or a button below it to see how the nitrogen can be converted.",
      howTitle: "How to read the picture",
      how: "The circles show <em>which form</em> the nitrogen is in. The arrows show the <em>processes</em> that convert it – and who carries them out.",
      howOx: " The small badge on each circle shows the oxidation number of nitrogen.",
      dyk: "Did you know?",
      banner: (name, f) => `Nitrogen is now found as ${name} (${f}). Choose a process!`,
      redox: { red: "Reduction", ox: "Oxidation", none: "No change" },
      air: "AIR",
      soil: "SOIL (oxygen-rich)",
      anaerobic: "OXYGEN-POOR SOIL",
      pea: "Pea plant",
      meadow: "Meadow plant"
    }
  };
  const T = () => UI[lang];

  // ============================================================
  // KVÄVEFORMER (noderna) – var kvävet FINNS
  // ============================================================
  const POOLS = {
    atmosphere: {
      formula: "N₂", ox: "0", chemType: "N2", color: "#00d2ff", pos: { x: 0.62, y: 0.25 },
      sv: {
        title: "Kvävgas i luften",
        molName: "Kvävgas",
        desc: "Luften består till ca 78 % av kvävgas. Trippelbindningen N≡N är mycket stark (945 kJ/mol), så de flesta organismer kan inte använda kvävet i den här formen. Det måste först <strong>fixeras</strong>, det vill säga omvandlas till en annan kväveförening."
      },
      en: {
        title: "Nitrogen gas in the air",
        molName: "Nitrogen gas",
        desc: "About 78 % of the air is nitrogen gas. The triple bond N≡N is very strong (945 kJ/mol), so most organisms cannot use nitrogen in this form. It must first be <strong>fixed</strong>, that is, converted into another nitrogen compound."
      }
    },
    plant: {
      formula: "R–NH₂", ox: "−III", chemType: "ORGANIC", color: "#76ff03", pos: { x: 0.20, y: 0.30 },
      sv: {
        title: "Organiskt kväve i växter",
        molName: "Aminogrupp i aminosyror och proteiner",
        desc: "I växten sitter kvävet i aminosyror (som aminogrupp, –NH₂), proteiner, DNA, RNA och klorofyll. Hit kommer kväve från flera håll: direkt från rotknölarna hos ärtväxter, och som ammonium eller nitrat ur marken hos alla växter."
      },
      en: {
        title: "Organic nitrogen in plants",
        molName: "Amino group in amino acids and proteins",
        desc: "In the plant, nitrogen is found in amino acids (as an amino group, –NH₂), proteins, DNA, RNA and chlorophyll. Nitrogen arrives here by several routes: directly from the root nodules of pea plants, and as ammonium or nitrate from the soil in all plants."
      }
    },
    animal: {
      formula: "R–NH₂", ox: "−III", chemType: "ORGANIC", color: "#f48fb1", pos: { x: 0.46, y: 0.31 },
      sv: {
        title: "Organiskt kväve i djur",
        molName: "Aminogrupp i djurets proteiner",
        desc: "Djuret bygger in kvävet i sina egna proteiner – muskler, enzymer och blod – och i DNA och RNA. Överskottskväve lämnar kroppen, hos däggdjur främst som urea (urinämne) i urinen."
      },
      en: {
        title: "Organic nitrogen in animals",
        molName: "Amino group in the animal's proteins",
        desc: "The animal builds the nitrogen into its own proteins – muscles, enzymes and blood – and into DNA and RNA. Excess nitrogen leaves the body, in mammals mainly as urea in the urine."
      }
    },
    soilNH4: {
      formula: "NH₄⁺", ox: "−III", chemType: "NH4", color: "#ffb74d", pos: { x: 0.38, y: 0.70 },
      sv: {
        title: "Ammonium i marken",
        molName: "Ammoniumjon",
        desc: "Ammoniumjonen är positivt laddad och fastnar på de negativt laddade lerpartiklarna och humusen i jorden, så den lakas inte ut så lätt. Ammonium kan tas upp av växternas rötter eller oxideras till nitrat av nitrifikationsbakterier."
      },
      en: {
        title: "Ammonium in the soil",
        molName: "Ammonium ion",
        desc: "The ammonium ion is positively charged and sticks to the negatively charged clay particles and humus in the soil, so it is not easily leached out. Ammonium can be taken up by plant roots or oxidised to nitrate by nitrifying bacteria."
      }
    },
    soilNO3: {
      formula: "NO₃⁻", ox: "+V", chemType: "NO3", color: "#ce93d8", pos: { x: 0.76, y: 0.70 },
      sv: {
        title: "Nitrat i marken",
        molName: "Nitratjon",
        desc: "Nitratjonen är negativt laddad och binds inte till markpartiklarna utan följer med markvattnet. Den är lätt för rötterna att ta upp, men kan också lakas ut till sjöar och vattendrag. I syrefattig mark kan bakterier använda nitratet i stället för syre i sin cellandning."
      },
      en: {
        title: "Nitrate in the soil",
        molName: "Nitrate ion",
        desc: "The nitrate ion is negatively charged and is not held by soil particles, so it moves with the soil water. It is easy for roots to take up, but it can also be leached into lakes and streams. In oxygen-poor soil, bacteria can use nitrate instead of oxygen in their cellular respiration."
      }
    }
  };

  // GEOMETRI

  const poolPx = (key, w, h) => ({ x: POOLS[key].pos.x * w, y: POOLS[key].pos.y * h });

  function getPath(proc, w, h) {
    return {
      p0: poolPx(proc.from, w, h),
      cp1: { x: proc.cp1.x * w, y: proc.cp1.y * h },
      cp2: { x: proc.cp2.x * w, y: proc.cp2.y * h },
      p1: poolPx(proc.to, w, h)
    };
  }
  function evaluateBezier(p0, cp1, cp2, p1, t) {
    const u = 1 - t;
    return {
      x: u*u*u * p0.x + 3*u*u*t * cp1.x + 3*u*t*t * cp2.x + t*t*t * p1.x,
      y: u*u*u * p0.y + 3*u*u*t * cp1.y + 3*u*t*t * cp2.y + t*t*t * p1.y
    };
  }
  function pointOn(proc, t, w, h) {
    const p = getPath(proc, w, h);
    return evaluateBezier(p.p0, p.cp1, p.cp2, p.p1, t);
  }
  const font = (px, weight = "bold") => `${weight} ${Math.round(px * S)}px system-ui, sans-serif`;

  // Ritar en figur i skala S runt punkten (x, y)
  function drawAt(fn, x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(S, S);
    fn(0, 0);
    ctx.restore();
  }

  let cssW = 0, cssH = 0;
  function resizeCanvas() {
    const rect = canvasWrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = rect.width;
    cssH = rect.height;
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.7, Math.min(1.15, Math.min(cssW / 900, cssH / 620)));
  }

  function initBgParticles() {
    bgParticles.length = 0;
    for (let i = 0; i < 40; i++) {
      bgParticles.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0006,
        vy: (Math.random() - 0.5) * 0.0005,
        radius: Math.random() * 2 + 1
      });
    }
  }

  function drawScenery(w, h) {
    const soilY = h * SOIL_Y;

    const sky = ctx.createLinearGradient(0, 0, 0, soilY);
    sky.addColorStop(0, "#081526");
    sky.addColorStop(0.6, "#153350");
    sky.addColorStop(1, "#3b678c");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, soilY);

    ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
    ctx.beginPath();
    ctx.arc(w * 0.10, h * 0.10, 50 * S, 0, Math.PI * 2);
    ctx.arc(w * 0.16, h * 0.09, 70 * S, 0, Math.PI * 2);
    ctx.arc(w * 0.23, h * 0.11, 45 * S, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w * 0.78, h * 0.10, 55 * S, 0, Math.PI * 2);
    ctx.arc(w * 0.85, h * 0.09, 75 * S, 0, Math.PI * 2);
    ctx.arc(w * 0.92, h * 0.11, 50 * S, 0, Math.PI * 2);
    ctx.fill();

    const soil = ctx.createLinearGradient(0, soilY, 0, h);
    soil.addColorStop(0, "#3e2716");
    soil.addColorStop(0.25, "#2a180b");
    soil.addColorStop(0.7, "#1a0d05");
    soil.addColorStop(1, "#0d0602");
    ctx.fillStyle = soil;
    ctx.fillRect(0, soilY, w, h - soilY);

    ctx.fillStyle = "#388e3c";
    ctx.fillRect(0, soilY - 4, w, 7);
    ctx.fillStyle = "#4caf50";
    ctx.beginPath();
    for (let x = 4; x < w; x += 10) {
      ctx.moveTo(x, soilY - 3);
      ctx.lineTo(x + 3, soilY - 12 - (x % 4));
      ctx.lineTo(x + 5, soilY - 3);
    }
    ctx.fill();

    ctx.save();
    ctx.font = font(11);
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(186, 230, 253, 0.55)";
    ctx.fillText(T().air, 12, soilY - 18 * S);
    ctx.fillStyle = "rgba(255, 213, 158, 0.5)";
    ctx.fillText(T().soil, 12, soilY + 22 * S);
    ctx.restore();

    drawAt(drawPeaPlant, w * 0.11, soilY);
    drawAt(drawGeneralPlant, w * 0.29, soilY);
    drawAt(drawHerbivore, w * 0.46, soilY - 2);
    drawAt(drawMushrooms, w * 0.36, soilY - 2);

    const byId = (id) => PROCESSES.find(p => p.id === id);
    const fb = pointOn(byId("freeFix"), 0.80, w, h);
    drawAt(drawFreeBacteriaColony, fb.x + 48 * S, fb.y);
    const nf = pointOn(byId("nitrification"), 0.5, w, h);
    drawAt(drawNitrifiersBiofilm, nf.x, nf.y + 38 * S);
    drawDenitrificationZone(w, h);

    if (lightningActive > 0) {
      drawLightning(w, h);
      lightningActive -= 0.04;
    }
  }

    const g = ctx.createRadialGradient(zx, zy, 4, zx, zy, rx);

    g.addColorStop(1, "rgba(7, 20, 34, 0.2)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(zx, zy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(100, 181, 246, 0.45)";
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.translate(zx, zy);
    ctx.scale(S, S);
    [{ x: -40, y: 2, a: 0.2 }, { x: -12, y: 10, a: -0.3 }, { x: 18, y: -2, a: 0.4 }, { x: 44, y: 8, a: -0.2 }].forEach(b => {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.a);
      ctx.fillStyle = "#64b5f6";
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 3.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(144, 202, 249, 0.6)";
      ctx.beginPath();
      ctx.moveTo(-7, 0);

  function drawProcesses(w, h) {
    const now = performance.now();
    PROCESSES.forEach(proc => {
      const isAvailable = !isTraveling && proc.from === currentLocation;
      const isActive = isTraveling && activeTransition && activeTransition.id === proc.id;
      const path = getPath(proc, w, h);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(path.p0.x, path.p0.y);
      ctx.bezierCurveTo(path.cp1.x, path.cp1.y, path.cp2.x, path.cp2.y, path.p1.x, path.p1.y);
      if (isActive) {
        ctx.strokeStyle = "rgba(0, 210, 255, 0.95)";
        ctx.lineWidth = 4.5 * S;
        ctx.setLineDash([8, 6]);
        ctx.lineDashOffset = -now / 20;
      } else if (isAvailable) {
        ctx.strokeStyle = `rgba(0, 210, 255, ${0.5 + 0.4 * Math.sin(now / 220)})`;
        ctx.lineWidth = 3.5 * S;
        ctx.setLineDash([6, 6]);
        ctx.lineDashOffset = -now / 35;
      } else {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.10)";
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 4]);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      if (isAvailable || isActive) {
        const tip = evaluateBezier(path.p0, path.cp1, path.cp2, path.p1, 0.93);
        const back = evaluateBezier(path.p0, path.cp1, path.cp2, path.p1, 0.89);
        ctx.fillStyle = "#00d2ff";
        ctx.translate(tip.x, tip.y);
        ctx.rotate(Math.atan2(tip.y - back.y, tip.x - back.x));
        ctx.scale(S, S);
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(-6, -6);
        ctx.lineTo(-6, 6);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      proc.labelRect = null;
      if (isAvailable || isActive) {
        const mid = evaluateBezier(path.p0, path.cp1, path.cp2, path.p1, proc.labelT);
        const hovered = hoveredClickable && hoveredClickable.type === "process" && hoveredClickable.item.id === proc.id;
        const text = `${proc.icon} ${procText(proc).name}`;
        ctx.save();
        ctx.font = font(12);
        const bw = ctx.measureText(text).width + 20 * S;
        const bh = 24 * S;
        const rx = Math.max(4, Math.min(w - bw - 4, mid.x - bw / 2));
        const ry = mid.y - bh / 2;
        const lit = hovered || isActive;
        ctx.fillStyle = lit ? "#00d2ff" : "rgba(8, 20, 32, 0.95)";
        ctx.strokeStyle = "#00d2ff";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(rx, ry, bw, bh, bh / 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = lit ? "#0b111a" : "#e0f2fe";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, rx + bw / 2, mid.y + 1);
        ctx.restore();
        if (isAvailable) proc.labelRect = { x: rx, y: ry, w: bw, h: bh };
      }
    });
  }

  function drawPools(w, h) {
    const availableDest = new Set(PROCESSES.filter(p => p.from === currentLocation).map(p => p.to));
    const now = performance.now();

    Object.keys(POOLS).forEach(key => {
      const pool = POOLS[key];
      const n = poolPx(key, w, h);
      const isCurrent = currentLocation === key && !isTraveling;
      const isClickable = !isTraveling && availableDest.has(key);
      const hovered = hoveredClickable && hoveredClickable.type === "pool" && hoveredClickable.key === key;
      const R = 25 * S;

      ctx.save();
      if (isClickable) {
        const haloR = R + (7 + 4 * Math.sin(now / 240)) * S;
        ctx.fillStyle = "rgba(0, 210, 255, 0.15)";
        ctx.strokeStyle = "rgba(0, 210, 255, 0.85)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(n.x, n.y, haloR, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(8, 14, 22, 0.92)";
      ctx.strokeStyle = isCurrent ? "#ffea00" : pool.color;
      ctx.lineWidth = (isCurrent || hovered ? 4 : 3) * S;
      ctx.beginPath();
      ctx.arc(n.x, n.y, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = pool.color;
      ctx.font = font(13);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(pool.formula, n.x, n.y + 1);

      if (showOx) {
        const bx = n.x + R * 0.78, by = n.y - R * 0.78;
        ctx.font = font(10);
        const ow = Math.max(22 * S, ctx.measureText(pool.ox).width + 10 * S);
        const oh = 18 * S;
        ctx.fillStyle = "#0b111a";
        ctx.strokeStyle = pool.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(bx - ow / 2, by - oh / 2, ow, oh, oh / 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.fillText(pool.ox, bx, by + 1);
      }

      const label = poolText(key).title;
      ctx.font = font(isCurrent ? 12 : 11);
      const tw = ctx.measureText(label).width;
      const pw = tw + 16 * S, ph = 20 * S;
      const px = Math.max(4, Math.min(w - pw - 4, n.x - pw / 2));
      const py = n.y + R + 6 * S;
      ctx.fillStyle = isClickable ? "rgba(0, 42, 65, 0.95)" : "rgba(11, 17, 26, 0.88)";
      ctx.strokeStyle = isCurrent ? "#ffea00" : (isClickable ? "rgba(0, 210, 255, 0.7)" : "rgba(255, 255, 255, 0.25)");
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(px, py, pw, ph, ph / 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = isCurrent ? "#fde047" : (isClickable ? "#7dd3fc" : "#f0f4f8");
      ctx.fillText(label, px + pw / 2, py + ph / 2 + 0.5);
      ctx.restore();
    });
  }

  // ============================================================
  // MOLEKYLEN SOM FÄRDAS
  // ============================================================
  function drawMolecule(w, h) {
    let pos;
    let pool = POOLS[currentLocation];

    if (isTraveling && activeTransition) {
      pos = pointOn(activeTransition, travelProgress, w, h);
      pool = travelProgress > 0.5 ? POOLS[activeTransition.to] : POOLS[activeTransition.from];

      // Syreatomerna lämnar nitratet vid denitrifikation och vid nitratupptag
      if ((activeTransition.id === "denit" || activeTransition.id === "uptakeNO3") && travelProgress > 0.35 && travelProgress < 0.9) {
        const burst = (travelProgress - 0.35) / 0.55;
        const alpha = Math.max(0, 1 - burst);
        ctx.save();
        for (let i = 0; i < 3; i++) {
          const ang = (i * 2 * Math.PI) / 3 + burst * 3;
          const dist = (14 + burst * 32) * S;
          const ox = pos.x + Math.cos(ang) * dist;
          const oy = pos.y + Math.sin(ang) * dist - burst * 14 * S;
          ctx.fillStyle = `rgba(239, 68, 68, ${alpha})`;
          ctx.beginPath();
          ctx.arc(ox, oy, 5 * S, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.font = font(8);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("O", ox, oy);
        }
        ctx.restore();
      }
    } else {
      pos = poolPx(currentLocation, w, h);
    }

    const now = performance.now();
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.scale(S, S);

    const pulse = Math.sin(now / 140) * 4;
    const glow = ctx.createRadialGradient(0, 0, 7, 0, 0, 24 + pulse);
    glow.addColorStop(0, "rgba(0, 210, 255, 0.95)");
    glow.addColorStop(0.5, "rgba(0, 210, 255, 0.3)");
    glow.addColorStop(1, "rgba(0, 210, 255, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 24 + pulse, 0, Math.PI * 2);
    ctx.fill();

    const nGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
    nGrad.addColorStop(0, "#80d8ff");
    nGrad.addColorStop(0.7, "#0091ea");
    nGrad.addColorStop(1, "#01579b");
    ctx.fillStyle = nGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.8;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("N", 0, 1);

    const time = now / 320;
    if (pool.chemType === "N2") {
      const px = 19 * Math.cos(time), py = 19 * Math.sin(time);
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(px, py);
      ctx.stroke();
      drawSmallAtom(px, py, "#0288d1", "N", 8.5, "#fff");
    } else if (pool.chemType === "NH4") {
      for (let i = 0; i < 4; i++) {
        const ang = time + (i * Math.PI) / 2;
        drawSmallAtom(19 * Math.cos(ang), 19 * Math.sin(ang), "#ffffff", "H", 5.5, "#222");
      }
    } else if (pool.chemType === "NO3") {
      for (let i = 0; i < 3; i++) {
        const ang = time + (i * 2 * Math.PI) / 3;
        drawSmallAtom(20 * Math.cos(ang), 20 * Math.sin(ang), "#ef4444", "O", 7, "#fff");
      }
    } else {
      drawSmallAtom(17 * Math.cos(time), 17 * Math.sin(time), "#ffffff", "H", 5.5, "#222");
      drawSmallAtom(17 * Math.cos(time + Math.PI), 17 * Math.sin(time + Math.PI), "#ffffff", "H", 5.5, "#222");
      drawSmallAtom(20 * Math.cos(time + Math.PI / 2), 20 * Math.sin(time + Math.PI / 2), "#90a4ae", "C", 7.5, "#fff");
    }

    ctx.font = "bold 11px ui-monospace, Menlo, Consolas, monospace";
    const fw = Math.max(52, ctx.measureText(pool.formula).width + 16);
    ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
    ctx.beginPath();
    ctx.roundRect(-fw / 2, -44, fw, 18, 5);
    ctx.fill();
    ctx.strokeStyle = "#00d2ff";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = "#00d2ff";
    ctx.fillText(pool.formula, 0, -35);
    ctx.restore();
  }

  // ============================================================
  // SIDOPANEL, KNAPPAR OCH TEXTER
  // ============================================================
  function lowerFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  function updatePoolInfo() {
    const pool = POOLS[currentLocation];
    const txt = poolText(currentLocation);
    $("sidebarBadge").textContent = T().nowAs;
    $("sidebarTitle").textContent = txt.title;
    $("molFormula").textContent = pool.formula;
    $("molName").textContent = txt.molName;
    const chip = $("oxChip");
    chip.hidden = !showOx;
    chip.textContent = `${T().oxFor}: ${pool.ox}`;
    chip.style.borderColor = pool.color;
    $("poolDesc").innerHTML = txt.desc;
    updateChemicalViewer(pool.chemType);
  }

  function updateProcessInfo() {
    const proc = isTraveling ? activeTransition : lastProcess;
    const heading = $("processHeading");
    const content = $("processContent");
    const dyk = $("didYouKnowBox");

    if (!proc) {
      heading.textContent = "⚗️ " + T().process;
      content.innerHTML = `<p class="muted-note">${T().noProcess}</p>`;
      dyk.innerHTML = `<strong>${T().howTitle}</strong>${T().how}${showOx ? T().howOx : ""}`;
      return;
    }
    const pt = procText(proc);
    heading.textContent = "⚗️ " + (isTraveling ? T().ongoing : T().latest);
    const chip = showOx
      ? `<span class="redox-chip redox-${proc.redox}">${T().redox[proc.redox]}: ${proc.oxChange}</span>`
      : "";
    content.innerHTML = `
      <div class="process-name">${proc.icon} ${pt.name}</div>
      <div class="process-actor">${T().by}: ${pt.actor}</div>
      ${chip}
      <div class="chem-eq">${pt.eq}</div>
      <p class="section-text">${pt.desc}</p>`;
    const trivia = (!showOx && pt.triviaNoOx) ? pt.triviaNoOx : pt.trivia;
    dyk.innerHTML = `<strong>${T().dyk}</strong>${trivia}`;
  }

  function renderQuickChoices() {
    const bar = $("quickChoicesBar");
    bar.innerHTML = "";
    const guide = $("guideText");
    if (isTraveling) {
      const p = activeTransition;
      guide.textContent = `${p.icon} ${procText(p).name}: ${POOLS[p.from].formula} → ${POOLS[p.to].formula}`;
      return;
    }
    guide.textContent = T().banner(lowerFirst(poolText(currentLocation).title), POOLS[currentLocation].formula);
    PROCESSES.filter(p => p.from === currentLocation).forEach(proc => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice-btn";
      btn.textContent = `${proc.icon} ${procText(proc).name} → ${POOLS[proc.to].formula}`;
      btn.addEventListener("click", () => triggerTransition(proc));
      bar.appendChild(btn);
    });
  }

  function applyLanguage() {
    const t = T();
    document.documentElement.lang = lang;
    document.title = t.docTitle;
    $("appTitle").textContent = t.title;
    $("appBadge").textContent = t.badge;
    $("appSubtitle").textContent = t.subtitle;
    $("langGroup").setAttribute("aria-label", t.lang);
    $("langSv").setAttribute("aria-pressed", String(lang === "sv"));
    $("langEn").setAttribute("aria-pressed", String(lang === "en"));
    $("oxToggleLabel").textContent = t.oxToggle;
    $("resetBtn").textContent = t.reset;
    $("resetBtn").title = t.resetTitle;
    $("speedLabel").textContent = t.speed;
    canvas.setAttribute("aria-label", t.canvasLabel);
    refreshTexts();
  }

  function refreshTexts() {
    updatePoolInfo();
    updateProcessInfo();
    renderQuickChoices();
    requestFrame();
  }

  function triggerTransition(proc) {
    if (isTraveling) return;
    if (proc.id === "lightning") lightningActive = 1.0;
    activeTransition = proc;
    isTraveling = true;
    travelProgress = 0;
    hoveredClickable = null;
    canvas.style.cursor = "default";
    updateProcessInfo();
    renderQuickChoices();
    requestFrame();
  }

  function finishTransition() {
    currentLocation = activeTransition.to;
    lastProcess = activeTransition;
    isTraveling = false;
    activeTransition = null;
    refreshTexts();
  }

  function resetToAtmosphere() {
    if (isTraveling) return;
    currentLocation = "atmosphere";
    lastProcess = null;
    refreshTexts();
  }

  // ---------- Händelser ----------
  $("resetBtn").addEventListener("click", resetToAtmosphere);
  $("speedSlider").addEventListener("input", e => { animSpeed = parseFloat(e.target.value); });
  [$("langSv"), $("langEn")].forEach(btn => btn.addEventListener("click", () => {
    lang = btn.dataset.lang;
    store("kvave-lang", lang);
    applyLanguage();
  }));
  const oxToggle = $("oxToggle");
  oxToggle.checked = showOx;
  oxToggle.addEventListener("change", () => {
    showOx = oxToggle.checked;
    store("kvave-ox", showOx ? "1" : "0");
    refreshTexts();
  });

  function getHit(clientX, clientY) {
    if (isTraveling) return null;
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;
    const available = PROCESSES.filter(p => p.from === currentLocation);
    for (const proc of available) {
      const r = proc.labelRect;
      if (r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return { type: "process", item: proc };
    }
    for (const proc of available) {
      const n = poolPx(proc.to, cssW, cssH);
      if (Math.hypot(x - n.x, y - n.y) < 34 * S) return { type: "pool", key: proc.to, item: proc };
    }
    return null;
  }

  canvas.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    hoveredClickable = getHit(e.clientX, e.clientY);
    canvas.style.cursor = hoveredClickable ? "pointer" : "default";
  });
  canvas.addEventListener("pointerleave", () => { hoveredClickable = null; });
  canvas.addEventListener("click", e => {
    const hit = getHit(e.clientX, e.clientY);
    if (hit) triggerTransition(hit.item);
  });

  // ============================================================
  // ANIMATIONSLOOP – pausas när bilden inte syns (sparar batteri
  // och processorkraft när sidan är inbäddad längre ner på en sida)
  // ============================================================
  let visible = true;
  let rafId = null;
  let lastTs = 0;

  function requestFrame() {
    if (rafId === null && visible && !document.hidden) {
      lastTs = 0;
      rafId = requestAnimationFrame(loop);
    }
  }

  function loop(ts) {
    rafId = null;
    if (!visible || document.hidden) return;
    const dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.1) : 0;
    lastTs = ts;

    const w = cssW, h = cssH;
    if (w > 0 && h > 0) {
      ctx.clearRect(0, 0, w, h);
      drawScenery(w, h);
      updateAndDrawParticles(w, h);
      drawProcesses(w, h);
      drawPools(w, h);

      if (isTraveling && activeTransition) {
        travelProgress += (dt / 2.8) * animSpeed;
        if (travelProgress >= 1) finishTransition();
      }
      drawMolecule(w, h);
    }
    rafId = requestAnimationFrame(loop);
  }

  new ResizeObserver(() => { resizeCanvas(); requestFrame(); }).observe(canvasWrap);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(entries => {
      visible = entries[0].isIntersecting;
      if (visible) requestFrame();
    }).observe(canvasWrap);
  }
  document.addEventListener("visibilitychange", requestFrame);

  // ---------- Start ----------
  resizeCanvas();
  initBgParticles();
  applyLanguage();
  requestFrame();
})();
</script>

</body></html>
